<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rescue Run — Skip-Bo Mini Event</title>
<link rel="stylesheet" href="../shared/core.css">
<style>
/* ---------- HUD ---------- */
.hud{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.hud-row{display:flex;align-items:center;gap:8px}
.hud .sb-timer-chip{white-space:nowrap}
.scene-chip{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tools-chip{background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.3);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:4px 11px;white-space:nowrap}
.info-btn{margin-left:auto;width:40px;height:40px;flex:0 0 auto;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-size:17px;font-weight:800;cursor:pointer}
.info-btn:active{transform:scale(.92)}
/* ---------- Stage: cutaway earth ---------- */
.stage-wrap{padding:10px}
.stage{position:relative;overflow:hidden;border-radius:14px;
  background:
    radial-gradient(circle at 22% 12%,rgba(255,235,190,.07),transparent 42%),
    radial-gradient(1.7px 1.7px at 24px 31px,rgba(255,224,160,.14) 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 61px 75px,rgba(0,0,0,.32) 50%,transparent 51%),
    radial-gradient(1.9px 1.9px at 95px 19px,rgba(255,224,160,.1) 50%,transparent 51%),
    linear-gradient(180deg,#4c3421 0%,#3b2817 55%,#2c1d0f 100%);
  background-size:auto,109px 97px,89px 87px,131px 103px,auto;
  box-shadow:inset 0 0 36px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.07)}
.hintline{color:#c9ddf5;font-size:11.5px;text-align:center;margin-top:9px;font-weight:600}
/* ---------- Chambers: carved cells, wood-beam walls ---------- */
.chamber{position:absolute;z-index:1;overflow:hidden;
  border-left:7px solid #7d5531;border-right:7px solid #7d5531;
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 2px,transparent 2px 19px),
    linear-gradient(180deg,#2c4b7a 0%,#1d3560 58%,#152849 100%);
  box-shadow:inset 3px 0 0 rgba(0,0,0,.38),inset -3px 0 0 rgba(0,0,0,.38),
    inset 0 16px 20px -9px rgba(0,0,0,.7),inset 0 -7px 12px -7px rgba(0,0,0,.45)}
.chamber.toprow{border-top:8px solid #7d5531;border-radius:10px 10px 0 0}
.chamber.safe{border-bottom:10px solid #1f7038;border-radius:0 0 12px 12px;
  background:
    radial-gradient(ellipse at 50% 96%,rgba(126,217,120,.35),transparent 68%),
    linear-gradient(180deg,#1d3560 0%,#1c4437 100%)}
.chamber.safe::after{content:'';position:absolute;left:0;right:0;bottom:0;height:11px;
  background:radial-gradient(circle at 7px 1px,#3fc167 6px,transparent 7px);background-size:14px 11px}
/* water: animated liquid fill + rolling wave crest */
.chamber.soaked::before{content:'';position:absolute;left:0;right:0;bottom:0;height:56%;
  background:linear-gradient(180deg,rgba(105,185,255,.55),rgba(38,105,196,.82));
  box-shadow:inset 0 3px 6px rgba(255,255,255,.3)}
.chamber.soaked::after{content:'';position:absolute;left:-26px;right:-26px;bottom:calc(56% - 4px);height:9px;
  background:radial-gradient(circle at 13px 1px,rgba(120,195,255,.6) 9px,transparent 10px);
  background-size:26px 9px;animation:waveMove 1.5s linear infinite}
@keyframes waveMove{to{transform:translateX(26px)}}
.chamber.plugged{filter:brightness(.82) saturate(.7)}
.chamber.plugged::before{content:'';position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 45%,rgba(0,0,0,.4) 46.5%,transparent 49%),
  linear-gradient(63deg,transparent 58%,rgba(0,0,0,.34) 59.5%,transparent 62%),
  rgba(95,95,108,.26)}
.safelab{position:absolute;z-index:2;font-size:9px;letter-spacing:2px;color:#9ff0b4;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.6)}
/* ---------- Pins: metallic gold bars in wall sockets (>=44px targets) ---------- */
.pin{position:absolute;height:46px;z-index:6;background:none;border:none;padding:0;cursor:pointer;
  transition:transform .55s cubic-bezier(.34,1.35,.5,1),opacity .5s}
.pin .slot{position:absolute;left:-3px;top:14px;width:11px;height:20px;border-radius:3px;background:#140e07;box-shadow:inset 0 2px 2px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.14)}
.pin .bar{position:absolute;left:2px;top:17px;height:14px;width:calc(100% - 30px);border-radius:7px;
  background:linear-gradient(180deg,#fff7d2 0%,#ffe082 26%,#FFC72C 52%,#d19614 76%,#996b00 100%);
  box-shadow:0 3px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 2px rgba(0,0,0,.2)}
.pin .knob{position:absolute;right:0;top:8px;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff9dc 0%,#ffe082 32%,#FFC72C 58%,#a97800 100%);
  border:2px solid #8a6200;box-shadow:0 3px 5px rgba(0,0,0,.55),inset 0 -3px 4px rgba(0,0,0,.28)}
.pin .knob::after{content:'';position:absolute;left:5px;top:4px;width:10px;height:6px;border-radius:50%;background:rgba(255,255,255,.9);transform:rotate(-20deg)}
.pin.pulled{transform:translateX(150%) rotate(7deg);opacity:0;pointer-events:none}
.pin.hint,.rope.hint,.fixbtn.hint{animation:hintGlow .7s infinite}
@keyframes hintGlow{0%,100%{filter:none}50%{filter:brightness(1.5) drop-shadow(0 0 10px #57ff8e)}}
/* ---------- Ropes: braided line, knot + dashed cut point ---------- */
.rope{position:absolute;width:46px;z-index:6;background:none;border:none;padding:0;cursor:pointer;transition:transform .5s ease,opacity .45s}
.rope .line{position:absolute;left:50%;top:0;bottom:26px;width:6px;margin-left:-3px;border-radius:3px;
  background:repeating-linear-gradient(160deg,#d9b27a 0 4px,#8a6a3c 4px 8px);
  box-shadow:1px 0 0 rgba(0,0,0,.35),inset -1px 0 0 rgba(255,255,255,.25)}
.rope .line::after{content:'';position:absolute;left:-4px;bottom:5px;width:14px;border-top:2px dashed rgba(255,255,255,.8)}
.rope .knot{position:absolute;left:50%;bottom:23px;width:13px;height:9px;margin-left:-6.5px;border-radius:45%;background:radial-gradient(circle at 40% 35%,#c89b60,#7a5c32);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.rope .scis{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55));animation:snipA 1.7s ease-in-out infinite}
@keyframes snipA{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(-16deg)}}
.rope.cut{opacity:0;transform:translateY(34px) rotate(28deg);pointer-events:none}
/* ---------- Items (outer = transform-positioned, inner .box = fx) ---------- */
.item{position:absolute;left:0;top:0;width:58px;height:58px;z-index:3;
  transition:transform .38s cubic-bezier(.55,.06,.68,.19),opacity .35s;will-change:transform}
.item .box{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}
.item .em{font-size:28px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));line-height:1.05;position:relative;z-index:1}
.item .amt{font-size:10px;font-weight:900;color:#ffe9ad;background:rgba(22,13,4,.75);border:1px solid rgba(255,199,44,.55);border-radius:8px;padding:0 6px;position:relative;z-index:1}
.item.rw .box{border:2px solid #5f3a17;border-radius:10px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.24),transparent 42%),
    repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 12px,rgba(0,0,0,.14) 12px 13.5px),
    linear-gradient(180deg,#c08447 0%,#8a5426 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.32),inset 0 -4px 7px rgba(0,0,0,.32),0 4px 6px rgba(0,0,0,.45)}
.item.rw .box::before{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:5px;margin-top:-3px;border-radius:2px;
  background:linear-gradient(180deg,#f4d071,#a67a1c);box-shadow:0 1px 1px rgba(0,0,0,.35)}
.item.hz-water .em{font-size:40px;animation:wobA 1.3s ease-in-out infinite;transform-origin:50% 85%}
@keyframes wobA{0%,100%{transform:scale(1)}50%{transform:scale(1.14,.88)}}
.item.hz-boulder .em{font-size:42px;filter:drop-shadow(0 6px 5px rgba(0,0,0,.65))}
.item .box.land{animation:landA .42s}
@keyframes landA{0%{transform:scale(1,.68) rotate(2deg)}55%{transform:scale(.9,1.16) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
.item .box.pop{animation:popA .46s forwards}
@keyframes popA{to{transform:scale(1.9) rotate(20deg);opacity:0}}
.item .box.collectfx{animation:collectA .52s forwards}
@keyframes collectA{to{transform:scale(.25) translateY(-34px);opacity:0}}
.splash{position:absolute;z-index:8;font-size:30px;animation:splashA .72s forwards;pointer-events:none}
@keyframes splashA{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.9) translateY(-14px);opacity:0}}
.chute{position:absolute;z-index:2;color:#ffd75e;font-size:22px;font-weight:900;opacity:.9;pointer-events:none;text-shadow:0 2px 3px rgba(0,0,0,.5)}
.netbar{position:absolute;height:13px;z-index:2;border-radius:6px;border:1px solid rgba(255,225,130,.9);
  background:
    repeating-linear-gradient(45deg,rgba(255,224,138,.85) 0 2px,transparent 2px 6px),
    repeating-linear-gradient(-45deg,rgba(255,224,138,.85) 0 2px,transparent 2px 6px),
    rgba(60,40,6,.35);
  box-shadow:0 0 12px rgba(255,199,44,.95);
  animation:netSh 1.2s infinite;pointer-events:none}
@keyframes netSh{0%,100%{opacity:.8}50%{opacity:1}}
/* ---------- Fix buttons (mop / break) ---------- */
.fixbtn{position:absolute;z-index:7;width:102px;min-height:44px;border:none;border-radius:12px;font-family:var(--sb-font);font-weight:800;font-size:12px;padding:9px 4px;background:linear-gradient(180deg,#ef5468,#D7263D);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35),0 5px 10px rgba(0,0,0,.4);cursor:pointer;animation:sbPulse 1.4s infinite}
/* ---------- Fluffy ---------- */
.fluffy{position:absolute;z-index:4;font-size:44px;transform-origin:50% 100%;animation:fIdle 2.8s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.fluffy .shad{position:absolute;left:3px;right:3px;bottom:-4px;height:9px;border-radius:50%;background:rgba(0,0,0,.38)}
@keyframes fIdle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.03,.97)}88%{transform:scale(1)}93%{transform:scale(1.06,.82)}97%{transform:scale(1)}}
.fluffy.worried{animation:fWorry .5s ease-in-out infinite}
@keyframes fWorry{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.fluffy.cheer{animation:fCheer .45s ease infinite}
@keyframes fCheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px) rotate(-6deg)}}
.fluffy .hat{position:absolute;top:-16px;left:11px;font-size:23px;display:none}
.fluffy.hashat .hat{display:block}
.fluffy .cheerfx{position:absolute;top:-22px;right:-18px;font-size:20px;display:none}
.fluffy.cheer .cheerfx{display:block}
/* ---------- Shop offers ---------- */
.offer{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid rgba(27,42,74,.12);border-radius:14px;padding:9px 10px;margin-bottom:8px;text-align:left}
.offer .oi{font-size:26px;flex:0 0 auto}
.offer .ot{flex:1 1 auto;min-width:0}
.offer .ot b{display:block;font-size:13.5px}
.offer .ot span{font-size:10.5px;color:#5a6b8c;line-height:1.25;display:block}
.offer .sb-btn{padding:9px 11px;font-size:13px;flex:0 0 auto;white-space:nowrap}
/* ---------- Victory ---------- */
.victory{text-align:center;padding:28px 10px;color:#fff}
.victory .vtro{font-size:64px;animation:fIdle 2s ease-in-out infinite}
.victory h2{margin:6px 0;color:var(--sb-yellow);text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:1px}
.victory .vf{font-size:14px;font-weight:700;margin-bottom:4px}
.vchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 20px}
</style>
</head>
<body>
<div class="sb-app"><div class="sb-main">
  <div class="hud">
    <div class="hud-row">
      <span class="sb-timer-chip">⏳ <span id="cd">--</span></span>
      <span class="scene-chip" id="sceneChip">Scene 1/3</span>
      <span class="tools-chip" id="toolsChip">🔧 0</span>
      <button class="info-btn" id="infoBtn" aria-label="About this event">ⓘ</button>
    </div>
    <div class="hud-row">
      <button class="sb-btn sb-btn-green sb-btn-sm" id="earnBtn" style="flex:1 1 auto">▶ Play a level&nbsp;<b>+2 🔧</b></button>
      <button class="sb-btn sb-btn-yellow sb-btn-sm" id="shopBtn">🧰 Shop</button>
    </div>
  </div>
  <div class="sb-panel-blue stage-wrap">
    <div class="stage" id="stage"></div>
    <div class="hintline" id="hintline">Tap a gold pin or ✂️ rope (1 🔧 each) · crates fall to Fluffy 🐹 — keep hazards out!</div>
  </div>
</div></div>
<script src="../shared/core.js"></script>
<script>
(function(){
"use strict";
SB.init({title:"Rescue Run", subtitle:"Pull the pins · Save the treasure", resetKey:"rescue-run"});
var S = SB.store("rescue-run", {endTs:0, scene:1, seeded:false, log:[], collected:{}, haul:{}, net:{}, pass:false, done:false});
var D = S.data;

/* ---------- hand-authored scenes (fixed sequence graphs) ---------- */
var SCENES = {
 1:{name:"Free the Coins!", cols:1, rows:4,
    cells:{C0:{c:0,r:0,floor:"A"},C1:{c:0,r:1,floor:"B"},C2:{c:0,r:2,floor:"C"},C3:{c:0,r:3,safe:1}},
    down:{C0:"C1",C1:"C2",C2:"C3"},
    items:[{id:"a",icon:"🪙",cell:"C0",rw:{type:"coins",amount:200}},
           {id:"b",icon:"💰",cell:"C2",rw:{type:"coins",amount:300}}],
    ropes:[], order:["p:C","p:B","p:A"]},
 2:{name:"Dodge the Waterfall!", cols:2, rows:4,
    cells:{L0:{c:0,r:0,floor:"A",divert:{rope:"X",to:"PIT",dir:"l"}},L1:{c:0,r:1,floor:"B"},L2:{c:0,r:2,floor:"C"},L3:{c:0,r:3,safe:1},
           R0:{c:1,r:0,floor:"D"},R1:{c:1,r:1,floor:"E"}},
    down:{L0:"L1",L1:"L2",L2:"L3",R0:"R1",R1:"L2"},
    items:[{id:"w",icon:"💧",cell:"L0",hz:"water"},
           {id:"a",icon:"🪙",cell:"L1",rw:{type:"coins",amount:400}},
           {id:"b",icon:"💰",cell:"R0",rw:{type:"coins",amount:500}},
           {id:"c",icon:"⚡",cell:"R1",rw:{type:"energy",amount:3}}],
    ropes:[{id:"X",cell:"L0",side:"l"}],
    order:["x:X","p:A","p:B","p:D","p:E","p:C"]},
 3:{name:"Save the Wild Card!", cols:2, rows:5,
    cells:{L0:{c:0,r:0,floor:"A",divert:{rope:"X",to:"TRAP",dir:"l"}},L1:{c:0,r:1,floor:"B"},L2:{c:0,r:2,floor:"C"},L3:{c:0,r:3,floor:"D"},L4:{c:0,r:4,safe:1},
           R0:{c:1,r:0,floor:"E",divert:{rope:"Y",to:"PIT",dir:"r"}},R1:{c:1,r:1,floor:"F"},R2:{c:1,r:2,floor:"G"}},
    down:{L0:"L1",L1:"L2",L2:"L3",L3:"L4",R0:"R1",R1:"R2",R2:"L3"},
    items:[{id:"bo",icon:"🪨",cell:"L0",hz:"boulder"},
           {id:"a",icon:"🪙",cell:"L1",rw:{type:"coins",amount:700}},
           {id:"wc",icon:"🃏",cell:"L2",rw:{type:"wild",amount:1}},
           {id:"g",icon:"💎",cell:"L3",rw:{type:"gem",amount:5}},
           {id:"w",icon:"💧",cell:"R0",hz:"water"},
           {id:"b",icon:"💰",cell:"R1",rw:{type:"coins",amount:800}}],
    ropes:[{id:"X",cell:"L0",side:"l"},{id:"Y",cell:"R0",side:"r"}],
    order:["x:X","p:A","x:Y","p:E","p:F","p:G","p:B","p:C","p:D"]}
};
var INTRO = {
 1:["🪙","Pull the gold pins to drop the treasure crates down to Fluffy. Every pin costs 1 Tool 🔧 and pulls are permanent — so think before you pull!"],
 2:["💧","A waterfall looms above the coins! Cut the rope ✂️ FIRST to open the side chute and divert the water — then funnel everything home."],
 3:["🃏","The big one: a boulder AND water guard the Wild Card. Divert both hazards with the ropes, then chain the pins for the grand cascade!"]};

/* ---------- runtime state ---------- */
var stageEl = document.getElementById("stage");
var SC, cells, items, pulled, cut, pinEls, ropeEls, chamberEls, fixEls, fluffyEl;
var busy=false, doneShown=false, colW=150, PADX=10, CH=80, introSeen={}, worryT, rzT;

function cellXY(k){ var cd=cells[k]; return {x:PADX+cd.c*(colW+16), y:6+cd.r*CH}; }
function el(cls){ var d=document.createElement("div"); d.className=cls; stageEl.appendChild(d); return d; }
function netActive(){ return D.pass || !!D.net[D.scene]; }
function updateHUD(){ var t=document.getElementById("toolsChip"); if(t) t.textContent="🔧 "+SB.bal("tool"); }

/* ---------- build / render ---------- */
function buildScene(){
  SC = SCENES[D.scene];
  cells = JSON.parse(JSON.stringify(SC.cells));
  pulled={}; cut={}; pinEls={}; ropeEls={}; chamberEls={}; fixEls={};
  busy=false; doneShown=false; fluffyEl=null;
  stageEl.innerHTML="";
  stageEl.style.height=(SC.rows*CH+12)+"px";
  var W = stageEl.clientWidth || 330;
  colW = Math.min((W-16*(SC.cols-1)-20)/SC.cols, SC.cols===1?216:180);
  PADX = (W-(colW*SC.cols+16*(SC.cols-1)))/2;
  Object.keys(cells).forEach(function(k){
    var cd=cells[k], p=cellXY(k);
    var c=el("chamber"+(cd.safe?" safe":""));
    if(cd.r===0) c.classList.add("toprow");
    c.style.left=p.x+"px"; c.style.top=p.y+"px"; c.style.width=colW+"px"; c.style.height=CH+"px";
    chamberEls[k]=c;
    if(cd.safe){
      var lab=el("safelab"); lab.textContent="SAFE";
      lab.style.left=(p.x+12)+"px"; lab.style.top=(p.y+7)+"px";
      fluffyEl=el("fluffy");
      fluffyEl.innerHTML='<span class="shad"></span>🐹<span class="hat">⛑️</span><span class="cheerfx">🎉</span>';
      fluffyEl.style.left=(p.x+colW/2-23)+"px"; fluffyEl.style.top=(p.y+CH-60)+"px";
      if(D.pass) fluffyEl.classList.add("hashat");
    }
    if(cd.floor){
      var pin=document.createElement("button"); pin.className="pin"; pin.setAttribute("aria-label","Pull pin (1 tool)");
      pin.innerHTML='<span class="slot"></span><span class="bar"></span><span class="knob"></span>';
      pin.style.left=(p.x+4)+"px"; pin.style.top=(p.y+CH-24)+"px"; pin.style.width=(colW-8)+"px";
      pin.onclick=function(){ doPull(cd.floor,false); };
      stageEl.appendChild(pin); pinEls[cd.floor]=pin;
    }
    var dn=SC.down[k];
    if(dn && cells[dn] && cells[dn].c!==cd.c){
      var a=el("chute"); a.textContent = cells[dn].c<cd.c ? "↙" : "↘";
      a.style.left=(cells[dn].c<cd.c ? p.x+6 : p.x+colW-26)+"px"; a.style.top=(p.y+CH-32)+"px";
    }
  });
  (SC.ropes||[]).forEach(function(r){
    var p=cellXY(r.cell);
    var b=document.createElement("button"); b.className="rope"; b.setAttribute("aria-label","Cut rope (1 tool)");
    b.innerHTML='<span class="line"></span><span class="knot"></span><span class="scis">✂️</span>';
    b.style.left=(r.side==="l" ? p.x+4 : p.x+colW-50)+"px";
    b.style.top=(p.y+3)+"px"; b.style.height=(CH-26)+"px";
    b.onclick=function(){ doCut(r.id,false); };
    stageEl.appendChild(b); ropeEls[r.id]=b;
  });
  items = SC.items.filter(function(it){ return !D.collected[it.id]; })
                  .map(function(it){ return JSON.parse(JSON.stringify(it)); });
  items.forEach(function(it){
    var d=document.createElement("div");
    d.className="item"+(it.rw?" rw":(" hz-"+it.hz));
    d.innerHTML='<span class="box"><span class="em">'+it.icon+'</span>'+(it.rw&&it.rw.amount>1?'<span class="amt">×'+it.rw.amount+'</span>':'')+'</span>';
    stageEl.appendChild(d); it.el=d;
  });
  updateItemPositions(false);
  document.getElementById("sceneChip").textContent="Scene "+D.scene+"/3";
  document.getElementById("hintline").style.display="";
  D.log.forEach(function(ev){ var t=ev.split(":");
    if(t[0]==="p") doPull(t[1],true);
    else if(t[0]==="x") doCut(t[1],true);
    else doFix(t[0],t[1],true);
  });
  renderNets(); updateFluffy(); updateHUD();
  if(!D.log.length && !introSeen[D.scene]){ introSeen[D.scene]=1; setTimeout(introModal,350); }
}

function updateItemPositions(anim){
  var byCell={};
  items.forEach(function(it){ if(it.done && !it.plugStay) return; (byCell[it.cell]=byCell[it.cell]||[]).push(it); });
  Object.keys(byCell).forEach(function(k){
    var arr=byCell[k], p=cellXY(k);
    arr.forEach(function(it,i){
      var off=(i-(arr.length-1)/2)*36;
      it.x=p.x+colW/2-29+off; it.y=p.y+CH-64;
      it.el.style.transform="translate("+it.x+"px,"+it.y+"px)";
      if(anim){ var bx=it.el.firstChild; bx.classList.remove("land"); void bx.offsetWidth; setTimeout(function(){ bx.classList.add("land"); },320); }
    });
  });
}

function renderNets(){
  var old=stageEl.querySelectorAll(".netbar"), i;
  for(i=0;i<old.length;i++) old[i].remove();
  if(!netActive()) return;
  items.forEach(function(it){
    if(!it.rw || it.done) return;
    var p=cellXY(it.cell), n=el("netbar");
    n.style.left=(p.x+8)+"px"; n.style.top=(p.y+CH-21)+"px"; n.style.width=(colW-16)+"px";
  });
}

/* ---------- Fluffy moods ---------- */
function updateFluffy(){ if(fluffyEl) fluffyEl.classList.toggle("worried", Object.keys(fixEls).length>0); }
function worry(){ if(!fluffyEl) return; fluffyEl.classList.add("worried"); clearTimeout(worryT); worryT=setTimeout(updateFluffy,2200); }
function cheer(){ if(!fluffyEl) return; fluffyEl.classList.remove("worried"); fluffyEl.classList.add("cheer");
  setTimeout(function(){ if(fluffyEl){ fluffyEl.classList.remove("cheer"); updateFluffy(); } },1300); }

/* ---------- economy ---------- */
function payTool(elm){
  if(!SB.spend("tool",1)){
    if(elm){ elm.classList.add("sb-shake"); setTimeout(function(){ elm.classList.remove("sb-shake"); },450); }
    SB.haptic(40);
    openShop(true);
    return false;
  }
  updateHUD(); return true;
}

/* ---------- actions ---------- */
function doPull(id,silent){
  if(pulled[id]) return;
  if(!silent){ if(busy) return; if(!payTool(pinEls[id])) return; D.log.push("p:"+id); S.save(); SB.haptic(); }
  pulled[id]=1; pinEls[id].classList.add("pulled");
  settle(silent);
}
function doCut(id,silent){
  if(cut[id]) return;
  if(!silent){ if(busy) return; if(!payTool(ropeEls[id])) return; D.log.push("x:"+id); S.save(); SB.haptic(); SB.toast("✂️ Rope cut — side chute open!"); }
  cut[id]=1; ropeEls[id].classList.add("cut");
  var rp=(SC.ropes||[]).filter(function(r){ return r.id===id; })[0];
  if(rp){ var p=cellXY(rp.cell), a=el("chute");
    a.textContent = rp.side==="l" ? "↙" : "↘"; a.style.color="#7CFC9A";
    a.style.left=(rp.side==="l" ? p.x+10 : p.x+colW-30)+"px"; a.style.top=(p.y+CH-36)+"px"; }
  settle(silent);
}
function addFixBtn(cellK,kind,label){
  if(fixEls[cellK]) return;
  var p=cellXY(cellK);
  var b=document.createElement("button"); b.className="fixbtn"; b.textContent=label;
  b.style.left=(p.x+colW/2-51)+"px"; b.style.top=(p.y+6)+"px";
  b.onclick=function(){
    if(busy) return;
    if(!payTool(b)) return;
    D.log.push(kind+":"+cellK); S.save();
    doFix(kind,cellK,false);
  };
  stageEl.appendChild(b); fixEls[cellK]=b;
}
function doFix(kind,cellK,silent){
  var cd=cells[cellK], ch=chamberEls[cellK];
  if(kind==="m"){ cd.soaked=false; ch.classList.remove("soaked"); }
  else{
    cd.plugged=false; ch.classList.remove("plugged");
    var hz=null; items.forEach(function(it){ if(it.plugStay && it.cell===cellK) hz=it; });
    if(hz){ hz.plugStay=false;
      if(silent) hz.el.remove();
      else{ hz.el.firstChild.classList.add("pop"); (function(e){ setTimeout(function(){ e.remove(); },480); })(hz.el); }
    }
  }
  if(fixEls[cellK]){ fixEls[cellK].remove(); delete fixEls[cellK]; }
  if(!silent){ SB.toast(kind==="m" ? "🧽 Drained! Path reopened" : "⛏️ Boulder shattered!"); SB.haptic(25); }
  settle(silent);
}

/* ---------- gravity simulation (slot-based) ---------- */
function stepOnce(silent){
  var moves=[], acted=false;
  items.slice().sort(function(a,b){ return cells[b.cell].r-cells[a.cell].r; }).forEach(function(it){
    if(it.done) return;
    var cd=cells[it.cell];
    if(cd.safe || cd.soaked || cd.plugged) return;
    if(cd.floor && !pulled[cd.floor]){
      if(it.hz && it.moved){ activateHazard(it,silent); acted=true; }
      return;
    }
    var tgt, netSave=false;
    if(cd.divert && (cut[cd.divert.rope] || (it.hz && netActive()))){
      tgt=cd.divert.to;
      if(it.hz && !cut[cd.divert.rope]) netSave=true;
    } else tgt=SC.down[it.cell];
    if(!tgt) return;
    if(tgt==="PIT" || tgt==="TRAP"){
      if(netSave && !silent){ SB.toast("🥅 Safety Net! Hazard auto-deflected"); it.el.firstChild.classList.add("sb-bounce"); }
      pitOut(it,silent); acted=true; return;
    }
    var td=cells[tgt];
    if(td.soaked || td.plugged){ if(it.hz && it.moved){ activateHazard(it,silent); acted=true; } return; }
    if(it.hz && td.safe){ activateHazard(it,silent); acted=true; return; }
    moves.push({it:it,tgt:tgt});
  });
  var arrivals=[];
  moves.forEach(function(m){
    m.it.cell=m.tgt; m.it.moved=true;
    if(m.it.hz && !silent) worry();
    if(cells[m.tgt].safe) arrivals.push(m.it);
  });
  if(moves.length) updateItemPositions(!silent);
  arrivals.forEach(function(it){ collect(it,silent); });
  return moves.length>0 || acted;
}
function settle(silent){
  if(silent){ var g=0; while(stepOnce(true) && g++<60){} finishSettle(true); return; }
  busy=true;
  (function loop(){
    if(stepOnce(false)) setTimeout(loop,350);
    else { busy=false; finishSettle(false); }
  })();
}
function finishSettle(silent){ renderNets(); updateFluffy(); checkComplete(silent); }

/* ---------- hazards: wrong pulls add steps, never destroy rewards ---------- */
function activateHazard(it,silent){
  it.done=true;
  var cd=cells[it.cell], ch=chamberEls[it.cell];
  if(it.hz==="water"){
    cd.soaked=true; ch.classList.add("soaked");
    it.el.remove();
    addFixBtn(it.cell,"m","🧽 Mop up · 1🔧");
    if(!silent) SB.toast("😅 Phew! Chamber soaked — mop it to reopen the path");
  } else {
    cd.plugged=true; ch.classList.add("plugged");
    it.plugStay=true;
    addFixBtn(it.cell,"b","⛏️ Break rock · 1🔧");
    if(!silent) SB.toast("😅 Phew! The boulder plugged the chamber — break it open");
  }
  if(!silent){ SB.haptic(35); worry(); }
}
function pitOut(it,silent){
  it.done=true;
  var dirL = cells[it.cell].divert.dir==="l";
  if(silent){ it.el.remove(); return; }
  var x=it.x||0, y=it.y||0;
  it.el.style.transform="translate("+(x+(dirL?-125:125))+"px,"+(y+58)+"px) rotate("+(dirL?-40:40)+"deg)";
  it.el.style.opacity="0";
  var s=el("splash"); s.textContent = it.hz==="water" ? "💦" : "💨";
  s.style.left=(x+(dirL?-34:64))+"px"; s.style.top=(y+28)+"px";
  setTimeout(function(){ s.remove(); it.el.remove(); },760);
  SB.toast(it.hz==="water" ? "💦 Splash! Water diverted safely" : "💨 Boulder rolled away safely");
  SB.haptic(20);
}

/* ---------- rewards ---------- */
function collect(it,silent){
  it.done=true; D.collected[it.id]=1;
  D.haul[it.rw.type]=(D.haul[it.rw.type]||0)+it.rw.amount; S.save();
  if(silent){ SB.grantRewards([it.rw]); it.el.remove(); return; }
  SB.grantRewards([it.rw], it.el); /* grant immediately — never lose value to a mid-animation reload */
  setTimeout(function(){
    it.el.firstChild.classList.add("collectfx");
    if(fluffyEl){ var f=fluffyEl.getBoundingClientRect(); SB.confetti(f.left+f.width/2, f.top, 36); }
    cheer();
    setTimeout(function(){ it.el.remove(); },520);
  },340);
}
function checkComplete(silent){
  if(doneShown) return;
  var rem = items.filter(function(it){ return it.rw && !it.done; });
  if(rem.length) return;
  doneShown=true;
  setTimeout(function(){ if(D.scene<3) completeModal(); else victory(false); }, silent?150:850);
}
function nextScene(){
  D.scene++; D.log=[]; D.collected={}; S.save();
  buildScene();
}
function completeModal(){
  if(document.getElementById("nx")) return; /* already showing (e.g. rebuild on resize) */
  var sc=SCENES[D.scene];
  var chips=sc.items.filter(function(i){ return i.rw; }).map(function(i){ return SB.rewardChip(i.rw); }).join("");
  SB.confetti();
  var adv=false; function go(){ if(adv) return; adv=true; nextScene(); }
  var m=SB.modal('<div style="font-size:46px">🎉</div><h3 style="margin:4px 0">Scene '+D.scene+' rescued!</h3>'+
    '<p style="font-size:13px;color:#3c4c6e;margin:4px 0 10px">Fluffy got every crate. On to the next contraption!</p>'+
    '<div class="sb-sheet-contents" style="justify-content:center">'+chips+'</div>'+
    '<button class="sb-btn sb-btn-green sb-btn-block" id="nx">Next scene ▶</button>');
  m.el.querySelector("#nx").onclick=function(){ m.close(); go(); };
  m.el.addEventListener("click",function(e){ if(e.target===m.el) go(); });
}
function victory(initial){
  D.done=true; S.save();
  var chips=Object.keys(D.haul).map(function(k){ return SB.rewardChip({type:k,amount:D.haul[k]}); }).join(" ");
  document.getElementById("sceneChip").textContent="Complete ✓";
  document.getElementById("hintline").style.display="none";
  stageEl.style.height="auto";
  stageEl.innerHTML='<div class="victory"><div class="vtro">🏆</div><h2>RESCUE COMPLETE!</h2>'+
    '<div class="vf">🐹'+(D.pass?'⛑️':'')+' Fluffy &amp; the treasure are safe!</div>'+
    '<div class="sb-muted" style="color:#c9ddf5;font-size:12px">Your total haul from all 3 scenes:</div>'+
    '<div class="vchips">'+(chips||'—')+'</div>'+
    '<button class="sb-btn sb-btn-yellow" id="again">↻ Play again</button></div>';
  document.getElementById("again").onclick=function(){
    D.scene=1; D.log=[]; D.collected={}; D.haul={}; D.done=false; D.net={}; S.save();
    introSeen={}; buildScene();
  };
  if(!initial){
    [0,450,950].forEach(function(t){ setTimeout(function(){ SB.confetti(Math.random()*window.innerWidth, window.innerHeight*0.3); },t); });
    SB.toast("🏆 Event complete — legendary rescue!");
  }
}

/* ---------- intro / info ---------- */
function introModal(){
  var sc=SCENES[D.scene], iv=INTRO[D.scene];
  var chips=sc.items.filter(function(i){ return i.rw; }).map(function(i){ return SB.rewardChip(i.rw); }).join("");
  var m=SB.modal('<div style="font-size:42px">'+iv[0]+'</div>'+
    '<h3 style="margin:6px 0 4px">Scene '+D.scene+'/3 — '+sc.name+'</h3>'+
    '<p style="font-size:13.5px;line-height:1.45;color:#3c4c6e;margin:6px 0 10px">'+iv[1]+'</p>'+
    '<div class="sb-sheet-contents" style="justify-content:center">'+chips+'</div>'+
    '<button class="sb-btn sb-btn-green sb-btn-block" id="go">🚀 Start rescue</button>');
  m.el.querySelector("#go").onclick=function(){ m.close(); SB.haptic(); };
}
document.getElementById("infoBtn").onclick=function(){
  var m=SB.modal('<h3 style="margin:0 0 8px">ⓘ Rescue Run</h3>'+
    '<p style="text-align:left;font-size:13.5px;line-height:1.5;color:#3c4c6e;margin:0 0 12px">'+
    'Rescue Run is the viral &ldquo;pull-the-pin&rdquo; ad made <b>honest</b> — an actually playable rescue puzzle inside Skip-Bo, not a bait mechanic. '+
    'Every pin or rope costs 1 Tool 🔧, which players earn free by playing levels or top up with small contextual purchases exactly when they run dry mid-rescue. '+
    'Wrong pulls never destroy rewards — hazards only add recoverable steps — so spending feels safe and IAPs sell confidence (hints, safety nets, chapter pass) rather than damage repair. '+
    'Three escalating scenes and a 48-hour timer drive urgency and repeat sessions.</p>'+
    '<button class="sb-btn sb-btn-blue sb-btn-block" id="ok">Got it</button>');
  m.el.querySelector("#ok").onclick=function(){ m.close(); };
};

/* ---------- hint: state-aware — only ever suggests a genuinely useful action ---------- */
function usefulTargets(){
  var pins={}, ropes={};
  items.forEach(function(it){
    if(it.done) return;
    if(it.rw){ /* every un-pulled floor pin along this reward's path down to the safe zone */
      var k=it.cell, g=0;
      while(k && cells[k] && !cells[k].safe && g++<20){
        if(cells[k].floor && !pulled[cells[k].floor]) pins[cells[k].floor]=1;
        k=SC.down[k];
      }
    } else { /* live hazard: cut its divert rope first; once safe to release, its pin */
      var cd=cells[it.cell];
      if(cd.divert){
        if(!cut[cd.divert.rope] && !netActive()) ropes[cd.divert.rope]=1;
        else if(cd.floor && !pulled[cd.floor]) pins[cd.floor]=1;
      }
    }
  });
  return {pins:pins, ropes:ropes};
}
function showHint(){
  var target=null, fk=Object.keys(fixEls);
  if(fk.length) target=fixEls[fk[0]];
  else{
    var u=usefulTargets();
    for(var i=0;i<SC.order.length;i++){
      var t=SC.order[i].split(":");
      if(t[0]==="p" && !pulled[t[1]] && u.pins[t[1]]){ target=pinEls[t[1]]; break; }
      if(t[0]==="x" && !cut[t[1]] && u.ropes[t[1]]){ target=ropeEls[t[1]]; break; }
    }
  }
  if(!target){ SB.toast("💡 You're already on track!"); return; }
  target.classList.add("hint");
  SB.toast("💡 Follow the green glow!");
  setTimeout(function(){ target.classList.remove("hint"); },5000);
}

/* ---------- contextual shop / fake IAPs ---------- */
function openShop(ctx){
  function row(id,ic,t,s,pr,owned){
    return '<div class="offer"><span class="oi">'+ic+'</span><span class="ot"><b>'+t+'</b><span>'+s+'</span></span>'+
      '<button class="sb-btn sb-btn-'+(owned?'blue':'green')+'" data-buy="'+id+'"'+(owned?' disabled':'')+'>'+(owned?'✓ Owned':pr)+'</button></div>';
  }
  var m=SB.modal('<h3 style="margin:0">'+(ctx?'😱 Out of tools mid-rescue!':'🧰 Rescue Shop')+'</h3>'+
    '<div class="sb-muted" style="font-size:12px;margin:4px 0 12px">'+(ctx?'Fluffy is counting on you — restock and finish the job!':'Stock up for the rescue.')+'</div>'+
    row("kit","🔧","Rescue Toolkit","6 tools — enough to finish the job","$0.99",false)+
    row("hint","💡","Smart Hint + 4 Tools","Next correct move glows green for 5s","$1.99",false)+
    row("net","🥅","Safety Net","This scene: golden net guards every crate — wrong pulls auto-deflect","$2.99",netActive())+
    row("pass","⛑️","Chapter Pass","12 🔧 + Safety Net on ALL scenes + Fluffy hard-hat","$4.99",D.pass)+
    '<button class="sb-sheet-cancel" id="shop-x">Maybe later</button>');
  m.el.querySelector("#shop-x").onclick=function(){ m.close(); };
  var btns=m.el.querySelectorAll("[data-buy]");
  for(var i=0;i<btns.length;i++)(function(b){
    b.onclick=function(){ m.close(); buy(b.getAttribute("data-buy")); };
  })(btns[i]);
}
function buy(id){
  if(id==="kit") SB.buyIAP({label:"Rescue Toolkit", price:"$0.99", sub:"Enough tools to finish the rescue",
    contents:[{type:"tool",amount:6}],
    onSuccess:function(){ updateHUD(); SB.toast("🔧 Toolkit acquired — back to the rescue!"); }});
  if(id==="hint") SB.buyIAP({label:"Smart Hint + 4 Tools", price:"$1.99", sub:"The next correct move glows green for 5 seconds",
    contents:[{type:"tool",amount:4}],
    onSuccess:function(){ updateHUD(); showHint(); }});
  if(id==="net") SB.buyIAP({label:"Safety Net", price:"$2.99", sub:"A golden net guards every reward crate this scene — hazards auto-deflect on wrong pulls",
    contents:[], grant:false,
    onSuccess:function(){ D.net[D.scene]=1; S.save(); renderNets(); SB.toast("🥅 Safety Net deployed under the crates!"); }});
  if(id==="pass") SB.buyIAP({label:"Chapter Pass", price:"$4.99", sub:"12 tools + Safety Net on all remaining scenes + exclusive hard-hat for Fluffy",
    contents:[{type:"tool",amount:12}],
    onSuccess:function(){ D.pass=true; S.save(); renderNets(); updateHUD();
      if(fluffyEl) fluffyEl.classList.add("hashat");
      SB.toast("⛑️ Chapter Pass active — Fluffy feels SAFE!"); }});
}
document.getElementById("shopBtn").onclick=function(){ openShop(false); };

/* ---------- earn loop ---------- */
var earnBtn=document.getElementById("earnBtn");
earnBtn.onclick=function(){
  if(earnBtn.disabled) return;
  earnBtn.disabled=true;
  var old=earnBtn.innerHTML;
  earnBtn.innerHTML="🃏 Playing level…";
  setTimeout(function(){
    SB.grantRewards([{type:"tool",amount:2}], earnBtn);
    earnBtn.innerHTML=old; earnBtn.disabled=false; updateHUD();
  },1300);
};

/* ---------- boot ---------- */
if(!D.endTs){ D.endTs = Date.now()+48*3600*1000; S.save(); }
SB.countdown(document.getElementById("cd"), D.endTs, function(){ SB.toast("⏳ Event ended — demo keeps running!"); });
if(!D.seeded){
  D.seeded=true; S.save();
  setTimeout(function(){ SB.grantRewards([{type:"tool",amount:6}]); updateHUD(); },700);
}
if(D.done) victory(true); else buildScene();
setInterval(updateHUD,1000);
window.addEventListener("resize",function(){
  clearTimeout(rzT);
  rzT=setTimeout(function(){ if(!D.done) buildScene(); },250);
});
})();
</script>
