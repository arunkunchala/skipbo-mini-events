<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Treasure Dig — Skip-Bo Mini Event</title>
<link rel="stylesheet" href="../shared/core.css">
<style>
  /* Toasts ride the shared .sb-toast.top mechanism (SB.toast(msg,{top:true}) /
     grantRewards(...,{toastTop:true})); this var parks them over the top of the pit,
     clear of the banner, progress bar, haul tray and hint strip above and the dig
     CTAs below — a two-line toast at 116px used to bury the progress row. */
  :root { --sb-toast-top: 248px; }
  .sb-subtitle { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- expedition banner ---------- */
  .td-banner {
    position:relative; display:flex; align-items:center; gap:8px;
    background:linear-gradient(180deg,#a5732f 0%,#7a4d1d 55%,#5c3512 100%);
    border:2px solid #3d2a08; border-radius:13px; padding:5px 8px; margin-bottom:8px;
    box-shadow:inset 0 2px 0 rgba(255,224,150,.4), inset 0 -3px 0 rgba(0,0,0,.3), 0 4px 10px rgba(0,0,0,.35);
  }
  .td-banner::before, .td-banner::after {
    content:""; position:absolute; top:5px; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe9ad,#8a6a20); box-shadow:0 1px 1px rgba(0,0,0,.6);
  }
  .td-banner::before { left:5px; } .td-banner::after { right:5px; }
  .td-badge {
    flex:0 0 auto; width:36px; height:36px; border-radius:50%;
    background:radial-gradient(circle at 38% 30%,#fff3c4,#ffd95e 45%,#e0a400 100%);
    border:2px solid #9c6b06; box-shadow:0 2px 4px rgba(0,0,0,.4), inset 0 -2px 0 rgba(0,0,0,.15);
    display:grid; place-items:center; color:#5c3a00; font-weight:900; font-size:9px; line-height:1; text-align:center;
  }
  .td-badge b { font-size:14px; display:block; }
  .td-site { flex:1 1 auto; min-width:0; }
  .td-site .nm {
    color:#fff; font-weight:900; font-size:15px; letter-spacing:.4px; text-shadow:0 2px 0 rgba(0,0,0,.45);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .td-site .sub { font-size:9.5px; font-weight:800; color:#ffd95e; letter-spacing:1px; text-transform:uppercase; text-shadow:0 1px 0 rgba(0,0,0,.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .td-banner .sb-timer-chip { flex:0 0 auto; }
  .td-banner .sb-timer-chip.over { background:rgba(60,70,90,.95); }
  /* 44px tap target, 28px painted disc */
  .td-info {
    width:44px; height:44px; flex:0 0 auto; padding:0; border:none; background:none; cursor:pointer;
    display:grid; place-items:center;
  }
  .td-info span {
    width:28px; height:28px; border-radius:50%; border:1.5px solid rgba(255,224,150,.55);
    background:rgba(0,0,0,.25); color:#ffe9ad; font-weight:900; font-size:14px;
    display:grid; place-items:center;
  }
  .td-info:active span { transform:scale(.9); }

  /* ---------- progress ---------- */
  .td-prog-wrap { margin-bottom:6px; }
  .td-prog-label { display:flex; justify-content:space-between; color:#fff; font-size:12px; font-weight:800; margin-bottom:3px; text-shadow:0 1px 0 rgba(0,0,0,.3); }
  .td-prog { height:12px; border-radius:999px; background:rgba(0,0,0,.35); border:1.5px solid rgba(255,255,255,.25); overflow:hidden; }
  .td-prog-fill {
    height:100%; width:0%; border-radius:999px;
    background:linear-gradient(180deg,#ffe28a,var(--sb-yellow) 55%,var(--sb-yellow-dark));
    box-shadow:0 0 8px rgba(255,199,44,.8); transition:width .5s cubic-bezier(.34,1.56,.64,1);
  }
  /* ---------- haul tray ---------- */
  .td-tray { display:flex; gap:5px; justify-content:center; margin-bottom:6px; }
  .td-slot {
    /* tappable (it explains the treasure and its exact payout) → full 44px target */
    flex:0 1 46px; min-width:34px; min-height:44px; border-radius:11px; padding:3px 0 2px; cursor:pointer; border:2px dashed rgba(255,255,255,.3);
    background:rgba(0,0,0,.3); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
    filter:grayscale(1); opacity:.5; transition:filter .3s, opacity .3s;
  }
  .td-slot .em { font-size:19px; line-height:1.15; }
  .td-slot .rw { font-size:8.5px; font-weight:900; color:#ffd95e; line-height:1.2; white-space:nowrap; text-shadow:0 1px 0 rgba(0,0,0,.5); }
  /* partially uncovered but not yet collected — the near-miss state, visible in the haul */
  .td-slot.partial { filter:grayscale(.35); opacity:.9; border-color:rgba(255,199,44,.65); }
  .td-slot.got {
    filter:none; opacity:1; border:2px solid var(--sb-yellow);
    background:radial-gradient(circle at 35% 30%, #6b4b12, #3d2a08);
    box-shadow:0 0 10px rgba(255,199,44,.6); animation:sbBounce .5s;
  }
  /* ---------- live hint strip (always true against grid state) ---------- */
  .td-hint {
    display:flex; align-items:center; justify-content:center; gap:6px;
    min-height:20px; margin-bottom:6px; padding:2px 8px;
    background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.16); border-radius:999px;
    color:#e8f1ff; font-size:11.5px; font-weight:800; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .td-hint.hot { background:rgba(255,199,44,.2); border-color:rgba(255,199,44,.75); color:#ffe9ad; }

  /* ---------- excavation pit ---------- */
  .td-wrap {
    position:relative; margin:0 auto 8px; max-width:400px; padding:9px; border-radius:18px;
    background:
      repeating-linear-gradient(94deg, rgba(0,0,0,.05) 0 6px, rgba(255,255,255,.04) 6px 12px),
      linear-gradient(180deg, var(--d1) 0%, var(--d2) 22%, var(--d3) 55%, var(--d4) 100%);
    border:2.5px solid #2e1c08;
    box-shadow:
      inset 3px 4px 6px rgba(255,232,180,.35),   /* sun from upper-left */
      inset -3px -4px 8px rgba(0,0,0,.45),
      0 6px 16px rgba(0,0,0,.4);
  }
  .td-wrap::before { /* rope trim */
    content:""; position:absolute; inset:3px; border-radius:14px; pointer-events:none;
    border:2px dashed rgba(255,224,150,.35);
  }
  /* One ground-wide mottle laid over the whole pit. Per-tile texture alone repeats
     56× and reads as manufactured tiling; this soft-light wash of damp patches and
     sun-bleached ground crosses the seams so the field reads as one excavation. */
  .td-wrap::after {
    content:""; position:absolute; inset:9px; border-radius:12px; pointer-events:none;
    z-index:2; mix-blend-mode:soft-light; opacity:.9;
    background:
      radial-gradient(ellipse 42% 26% at 17% 20%, rgba(0,0,0,.6), transparent 72%),
      radial-gradient(ellipse 30% 19% at 73% 36%, rgba(255,244,210,.55), transparent 72%),
      radial-gradient(ellipse 46% 24% at 41% 66%, rgba(0,0,0,.5), transparent 74%),
      radial-gradient(ellipse 26% 17% at 87% 80%, rgba(255,238,195,.45), transparent 72%),
      radial-gradient(ellipse 30% 21% at 7% 85%, rgba(0,0,0,.45), transparent 74%),
      radial-gradient(ellipse 24% 15% at 55% 92%, rgba(255,240,200,.4), transparent 72%);
  }
  .td-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; position:relative; }
  .td-tile {
    position:relative; aspect-ratio:1; border-radius:6px; overflow:hidden; cursor:pointer;
    /* dug hole: dark earth, lit rim on the lower-right (sun from upper-left) */
    background:
      radial-gradient(ellipse at 50% 62%, #170d03 0 38%, #241606 68%, #3a2409 100%);
    box-shadow:
      inset 0 4px 8px rgba(0,0,0,.9),
      inset 3px 0 5px rgba(0,0,0,.55),
      inset -2px -3px 3px rgba(255,214,150,.18);
  }
  /* pebbles + spoil in an empty dug hole */
  .td-tile.rubble::after {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 30% 68%, rgba(168,127,74,.6) 0 9%, transparent 10%),
      radial-gradient(circle at 62% 76%, rgba(133,97,56,.55) 0 7%, transparent 8%),
      radial-gradient(circle at 48% 60%, rgba(92,66,36,.6) 0 6%, transparent 7%),
      radial-gradient(circle at 72% 44%, rgba(150,112,64,.35) 0 4%, transparent 5%),
      radial-gradient(ellipse at 50% 96%, rgba(120,88,48,.5) 0 40%, transparent 60%);
  }
  .td-tile.rubble.wasrock::after {
    background:
      radial-gradient(circle at 32% 70%, rgba(158,158,158,.6) 0 10%, transparent 11%),
      radial-gradient(circle at 60% 76%, rgba(124,124,124,.55) 0 8%, transparent 9%),
      radial-gradient(circle at 46% 58%, rgba(92,92,92,.6) 0 6%, transparent 7%),
      radial-gradient(circle at 74% 40%, rgba(140,140,140,.35) 0 4%, transparent 5%),
      radial-gradient(ellipse at 50% 96%, rgba(110,110,110,.45) 0 40%, transparent 60%);
  }
  /* ---------- dirt cap ----------
     Soil, not planks: a mounded clod lit from the upper-left, scattered grit and
     pebbles, and a fine two-axis granular hatch. (The old single 118° stripe read
     as wood grain once tiled across 56 cells.) */
  .td-dirt {
    position:absolute; inset:0; border-radius:6px; transition:opacity .18s, transform .18s;
    background:
      /* pebbles: an off-centre lit shoulder over a shadowed body, so grit reads as
         rounded stone lit from the upper-left rather than as flat blobs or rivets */
      radial-gradient(circle at 20.2% 24.6%, rgba(255,248,225,.26) 0 1.6%, transparent 2.6%),
      radial-gradient(circle at 22% 27%, rgba(46,28,10,.24) 0 5.6%, transparent 6.6%),
      radial-gradient(circle at 69.4% 58.8%, rgba(255,248,225,.22) 0 1.4%, transparent 2.3%),
      radial-gradient(circle at 71% 61%, rgba(46,28,10,.21) 0 5%, transparent 6%),
      radial-gradient(circle at 81.8% 21.4%, rgba(255,248,225,.20) 0 1%, transparent 1.8%),
      radial-gradient(circle at 83% 23%, rgba(46,28,10,.17) 0 3.7%, transparent 4.5%),
      radial-gradient(circle at 43.5% 77%, rgba(255,248,225,.19) 0 1.2%, transparent 2%),
      radial-gradient(circle at 45% 79%, rgba(46,28,10,.19) 0 4.6%, transparent 5.5%),
      radial-gradient(circle at 56% 14%, rgba(46,28,10,.20) 0 3%, transparent 3.8%),
      radial-gradient(circle at 36% 52%, rgba(255,232,180,.09) 0 8%, transparent 9%),
      repeating-linear-gradient(46deg, rgba(0,0,0,.042) 0 1px, rgba(255,244,214,.042) 1px 2px),
      repeating-linear-gradient(-38deg, rgba(0,0,0,.035) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 33% 27%, var(--d1) 0%, var(--d2) 34%, var(--d3) 68%, var(--d4) 100%);
    box-shadow:inset 1px 1px 2px rgba(255,238,196,.28), inset -1px -2px 4px rgba(0,0,0,.40);
  }
  /* clod variety so the field never reads as a tiled texture */
  .td-tile:nth-child(3n) .td-dirt { filter:brightness(1.06); }
  .td-tile:nth-child(5n) .td-dirt { filter:brightness(.93) saturate(1.05); }
  .td-tile:nth-child(7n) .td-dirt { filter:brightness(1.02) saturate(1.14); background-position:-3px 2px; }
  .td-tile:nth-child(4n+1) .td-dirt { background-position:2px 3px; }
  .td-tile:nth-child(11n) .td-dirt { background-position:1px -3px; filter:brightness(.97); }
  /* four clod cuts (assigned per tile in JS) — scaling/offsetting the whole stack
     moves every pebble, so neighbouring cells never show the same grit twice.
     Done with background-size, not transform, so :active / reveal transforms stay free. */
  .td-tile[data-v="1"] .td-dirt { background-size:122% 118%; background-position:-7px -4px; }
  .td-tile[data-v="2"] .td-dirt { background-size:136% 120%; background-position:-11px 3px; filter:brightness(.95) saturate(1.06); }
  .td-tile[data-v="3"] .td-dirt { background-size:114% 132%; background-position:4px -8px; filter:brightness(1.05) saturate(1.1); }
  .td-tile:active .td-dirt { transform:scale(.95); }
  .td-tile.revealed .td-dirt { opacity:0; transform:scale(1.22); pointer-events:none; }
  .td-tile.cracking .td-dirt { animation:tdCrack .25s ease-in forwards; }
  /* crack lines flash while breaking */
  .td-tile.cracking .td-dirt::after, .td-tile.rockcracked .td-dirt::after {
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(112deg, transparent 42%, rgba(20,10,0,.7) 44.5%, transparent 47%),
      linear-gradient(28deg, transparent 55%, rgba(20,10,0,.6) 57.5%, transparent 60%),
      linear-gradient(160deg, transparent 30%, rgba(20,10,0,.55) 32%, transparent 34.5%);
  }
  @keyframes tdCrack {
    0% { transform:scale(1); filter:brightness(1); }
    30% { transform:scale(.94) rotate(-2deg); filter:brightness(1.3); }
    60% { transform:scale(1.02) rotate(2deg); filter:brightness(.85); }
    100% { transform:scale(1.2); opacity:0; }
  }
  /* cracked boulder (rock after first hit) */
  .td-tile.rockcracked .td-dirt {
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.35) 0 10%, transparent 12%),
      radial-gradient(circle at 66% 70%, rgba(0,0,0,.25) 0 14%, transparent 16%),
      radial-gradient(ellipse at 50% 48%, #b0b0b0 0%, #7d7d7d 55%, #4c4c4c 90%);
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.3), inset -2px -3px 0 rgba(0,0,0,.45);
  }
  .td-tile.rockcracked .td-dirt { transform:none; filter:none; background-position:0 0; }
  /* ---------- buried treasure objects ---------- */
  .td-content {
    position:absolute; inset:0; overflow:hidden;
    opacity:0; transform:scale(.3);
  }
  .td-content .bigart {
    position:absolute; display:grid; place-items:center; line-height:1;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.65)) drop-shadow(0 0 7px rgba(255,215,90,.75));
  }
  .td-content .solo {
    position:absolute; inset:0; display:grid; place-items:center; font-size:24px;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.65)) drop-shadow(0 0 6px rgba(255,215,90,.75));
  }
  .td-tile.revealed .td-content { opacity:1; transform:scale(1); transition:opacity .3s ease .08s, transform .3s cubic-bezier(.34,1.56,.64,1) .08s; }
  .td-tile.revealed.gold {  /* gold light spilling out of the hole */
    background:radial-gradient(circle at 50% 55%, #7a5510 0%, #3a2606 55%, #1c1204 100%);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.7), 0 0 12px rgba(255,199,44,.55);
  }
  .td-tile.revealed.gold .td-content::before {
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 58%, rgba(255,214,90,.5) 0%, transparent 62%);
    animation:tdGoldPulse 1.6s ease-in-out infinite;
  }
  @keyframes tdGoldPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  .td-tile.collected { box-shadow:inset 0 3px 8px rgba(0,0,0,.85); }
  .td-tile.collected .td-content { opacity:.4; filter:grayscale(.55) brightness(.8); }
  .td-tile.collected .td-content::before { display:none; }
  /* glint telegraph on buried neighbours of a partly-uncovered treasure */
  .td-glint {
    position:absolute; inset:0; display:none; place-items:center; pointer-events:none;
    font-size:16px; z-index:3; text-shadow:0 0 8px #ffd95e;
  }
  .td-tile.glinting .td-glint { display:grid; animation:tdGlint 1.3s infinite; }
  .td-tile.glinting .td-dirt { box-shadow:inset 0 0 0 2px rgba(255,220,110,.85), inset 2px 2px 0 rgba(255,236,190,.35), inset -2px -3px 0 rgba(0,0,0,.35); }
  .td-tile.glinting .td-dirt::before {
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(115deg, transparent 30%, rgba(255,236,160,.55) 47%, transparent 62%),
      radial-gradient(circle at 50% 50%, rgba(255,222,110,.42) 0%, transparent 65%);
    animation:tdSheen 1.6s ease-in-out infinite;
  }
  @keyframes tdSheen {
    0%,100% { opacity:.35; background-position:-40px 0, 0 0; }
    50% { opacity:1; background-position:40px 0, 0 0; }
  }
  @keyframes tdGlint {
    0%,100% { opacity:.35; transform:scale(.8) rotate(-8deg); }
    50% { opacity:1; transform:scale(1.15) rotate(8deg); }
  }
  /* scanner overlay */
  .td-scan {
    position:absolute; inset:0; display:none; place-items:center; pointer-events:none;
    font-size:19px; z-index:4; opacity:.6; filter:drop-shadow(0 0 4px #7fd4ff);
  }
  .td-tile.scanned .td-scan { display:grid; animation:tdScanIn .3s; }
  .td-tile.scanned .td-dirt { box-shadow:inset 0 0 0 2px rgba(127,212,255,.85), inset 2px 2px 0 rgba(255,236,190,.35), inset -2px -3px 0 rgba(0,0,0,.35); }
  @keyframes tdScanIn { from { opacity:0; transform:scale(.5); } to { opacity:.6; transform:scale(1); } }
  /* dust puff + dirt shards */
  .td-puff {
    position:absolute; z-index:5; width:26px; height:26px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(214,186,140,.95), rgba(214,186,140,0) 70%);
    animation:tdPuff .5s ease-out forwards;
  }
  @keyframes tdPuff { from { transform:scale(.4); opacity:1; } to { transform:scale(2.4) translateY(-8px); opacity:0; } }
  .td-shard {
    position:absolute; z-index:6; width:7px; height:5px; border-radius:2px; pointer-events:none;
    background:linear-gradient(135deg, var(--d2), var(--d4));
    box-shadow:inset 0 1px 0 rgba(255,236,190,.4);
    animation:tdShard .55s cubic-bezier(.2,.6,.6,1) forwards;
  }
  @keyframes tdShard {
    0% { transform:translate(0,0) rotate(0); opacity:1; }
    100% { transform:translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity:0; }
  }
  /* dynamite row markers + blast — 44px tap target, 34px painted disc */
  .td-rowmark {
    position:absolute; left:-8px; width:44px; height:44px; z-index:10; display:none;
    border:none; background:none; box-shadow:none; padding:0; cursor:pointer;
    place-items:center; transform:translateY(-50%);
  }
  .td-rowmark i {
    width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
    background:var(--sb-red); color:#fff; font-size:17px; font-style:normal;
    box-shadow:0 3px 0 var(--sb-red-dark), var(--sb-shadow);
    animation:sbPulse 1s infinite;
  }
  .td-rowmark:active i { transform:scale(.9); }
  .td-wrap.dynmode .td-rowmark { display:grid; }
  .td-wrap.dynmode .td-grid { outline:3px dashed rgba(215,38,61,.7); outline-offset:3px; border-radius:8px; }
  .td-tile.blast { animation:tdBlast .45s ease-out; }
  @keyframes tdBlast {
    0% { filter:brightness(3); transform:scale(1.15); }
    40% { filter:brightness(1.6) saturate(2); transform:scale(.92); }
    100% { filter:none; transform:scale(1); }
  }
  /* ---------- toolbar ---------- */
  .td-tools { display:flex; gap:8px; margin-bottom:8px; }
  .td-chip {
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px; min-height:44px;
    background:rgba(0,0,0,.35); border:1.5px solid rgba(255,255,255,.3); border-radius:14px;
    color:#fff; font-weight:900; font-size:15px; padding:6px 4px; cursor:pointer; font-family:var(--sb-font);
  }
  .td-chip .big { font-size:19px; }
  .td-chip.shovels { border-color:rgba(255,199,44,.75); color:var(--sb-yellow); flex:1.3; }
  .td-chip.armed { background:rgba(62,142,222,.5); border-color:#7fd4ff; box-shadow:0 0 10px rgba(127,212,255,.7); }
  .td-chip.armed-dyn { background:rgba(215,38,61,.5); border-color:#ff8a99; box-shadow:0 0 10px rgba(215,38,61,.8); }
  .td-chip.zero { opacity:.5; }
  /* ---------- shop sheet offers ---------- */
  .td-offer {
    display:flex; align-items:center; gap:10px; width:100%; min-height:44px;
    background:#fff; border:2px solid rgba(27,42,74,.12); border-radius:14px;
    padding:10px 12px; margin-bottom:8px; cursor:pointer; text-align:left; font-family:var(--sb-font);
  }
  .td-offer:active { transform:scale(.98); }
  .td-offer .ico { font-size:28px; flex:0 0 auto; }
  .td-offer .txt { flex:1 1 auto; min-width:0; }
  .td-offer .txt b { display:block; font-size:15px; color:var(--sb-ink); }
  .td-offer .txt span { font-size:11.5px; color:#5a6b8c; font-weight:600; }
  .td-offer .price {
    flex:0 0 auto; background:linear-gradient(180deg,#3fc167,var(--sb-green) 55%,var(--sb-green-dark));
    color:#fff; font-weight:900; font-size:14px; padding:8px 12px; border-radius:10px;
    box-shadow:0 2px 0 rgba(0,0,0,.25); text-shadow:0 1px 0 rgba(0,0,0,.2);
  }
  /* the free path, shown in the same view as every paid one */
  .td-offer.freepath { background:linear-gradient(160deg,#eafbef,#d6f5e0); border:2.5px dashed var(--sb-green); }
  .td-offer.freepath .price { background:none; color:var(--sb-green-dark); box-shadow:none; text-shadow:none; font-size:13px; }
  .td-shop-note { font-size:11px; color:#5a6b8c; text-align:center; margin:-2px 0 10px; font-weight:600; }
  .td-offer.hero {
    background:linear-gradient(160deg,#fff6d8,#ffe9a8); border:2.5px solid var(--sb-yellow);
    box-shadow:0 0 14px rgba(255,199,44,.6); position:relative; overflow:hidden;
  }
  .td-offer.hero .ico { font-size:38px; animation:sbPulse 1.2s infinite; }
  .td-offer.hero .txt b { color:#8a5a00; }
  .td-offer.hero::before {
    content:"ALMOST YOURS"; position:absolute; top:11px; right:-24px; transform:rotate(35deg);
    background:var(--sb-red); color:#fff; font-size:7.5px; font-weight:900; padding:2px 26px; letter-spacing:.4px;
  }
  .td-collect-fly { position:fixed; z-index:400; font-size:30px; pointer-events:none; transition:all .8s cubic-bezier(.5,-.2,.4,1.1); filter:drop-shadow(0 0 8px #ffd95e); }
  /* ---------- event over ---------- */
  body.td-over .td-wrap { filter:saturate(.55) brightness(.8); }
  body.td-over .td-tile { cursor:default; }
  /* keep ≥44px tap targets on 360px-wide screens */
  @media (max-width:374px) {
    .sb-main { padding-left:8px; padding-right:8px; }
    .td-wrap { padding:6px; }
    .td-wrap::after { inset:6px; }
    .td-grid { gap:3px; }
    .td-chip { font-size:14px; gap:3px; }
    /* keep the site name readable instead of ellipsing it behind the clock */
    .td-banner .sb-timer-chip { font-size:11px; padding:3px 7px; }
  }
  /* tighten vertically on short screens (360×740) */
  @media (max-height:780px) {
    :root { --sb-toast-top: 212px; }
    .sb-main { padding-top:6px; }
    .td-banner { margin-bottom:5px; padding:2px 8px; }
    .td-badge { width:30px; height:30px; font-size:8px; }
    .td-badge b { font-size:12px; }
    .td-prog-wrap { margin-bottom:4px; }
    .td-prog-label { font-size:11px; margin-bottom:2px; }
    .td-prog { height:10px; }
    .td-tray { margin-bottom:4px; }
    .td-slot { padding:1px 0 1px; }
    .td-slot .em { font-size:15px; }
    .td-slot .rw { font-size:8px; }
    .td-hint { margin-bottom:4px; min-height:18px; font-size:11px; }
    .td-wrap { margin-bottom:6px; }
    .td-tools { margin-bottom:5px; }
    #earnBtn { padding:9px 22px; font-size:15px; }
  }
</style>
</head>
<body>
<div class="sb-app">
  <div class="sb-main">
    <div class="td-banner">
      <div class="td-badge" id="siteBadge">SITE<b>1</b></div>
      <div class="td-site" id="siteLabel"><div class="nm">Sandy Flats</div><div class="sub">⛏️ Expedition · Site 1</div></div>
      <span class="sb-timer-chip">⏳ <span id="cd">--</span></span>
      <button class="td-info" id="infoBtn" aria-label="How it works"><span>ⓘ</span></button>
    </div>

    <div class="td-prog-wrap">
      <div class="td-prog-label"><span>Treasures excavated</span><span id="progTxt">0/6</span></div>
      <div class="td-prog"><div class="td-prog-fill" id="progFill"></div></div>
    </div>

    <div class="td-tray" id="tray"></div>

    <div class="td-hint" id="hint">Tap a tile to dig · 1 ⛏️ per tile</div>

    <div class="td-wrap" id="wrap">
      <div class="td-grid" id="grid"></div>
    </div>

    <div class="td-tools">
      <button class="td-chip shovels" id="shovelChip" aria-label="Shovels"><span class="big">⛏️</span><span id="shovelCt">0</span></button>
      <button class="td-chip" id="scanBtn" aria-label="Scanner"><span class="big">🔮</span><span id="scanCt">0</span></button>
      <button class="td-chip" id="dynBtn" aria-label="Dynamite"><span class="big">🧨</span><span id="dynCt">0</span></button>
      <button class="td-chip" id="shopBtn" style="border-color:rgba(63,193,103,.8);color:#8af0a8;"><span class="big">＋</span>Shop</button>
    </div>

    <button class="sb-btn sb-btn-green sb-btn-block" id="earnBtn">🎴 Play a level <span style="font-weight:900;">(+3 ⛏️)</span></button>
  </div>
</div>
<script src="../shared/core.js"></script>
<script>
(function(){
"use strict";
var COLS=7, ROWS=8, N=COLS*ROWS;
var EMO={crown:"👑",chest:"🎁",wild:"🃏",trail:"🪙",gem:"💎"};
var ARTNAME={crown:"Golden Crown",chest:"Treasure Chest",wild:"Wild Card Relic",trail:"Coin Trail",gem:"Gem"};
var SITE_NAMES=["Sandy Flats","Amber Gorge","Gilded Ruins","Crown Caverns","Lost Temple","Sunken Vault"];
var THEMES=[ /* d1 light-lit face, d4 deep shadow — deeper sites read as different earth */
  {d1:"#d3a05e",d2:"#a9743a",d3:"#8a5a28",d4:"#6e451d"},   /* sandy tan */
  {d1:"#cf7f45",d2:"#a35a26",d3:"#7c3f16",d4:"#54280c"},   /* amber / terracotta */
  {d1:"#b3a26b",d2:"#857747",d3:"#5f552f",d4:"#3f3a1e"}    /* gilded khaki ruins */
];
var SCAN_MS=10000;

SB.init({title:"Treasure Dig", subtitle:"Excavation Event · Limited Time", resetKey:"treasure-dig"});

var st=SB.store("treasure-dig",{
  level:1,endTs:0,seeded:false,scanners:1,dyn:0,grid:null,arts:null,
  pending:[],ended:false,scanUntil:0,scanIdx:[],autoShop:false
});
var S=st.data;
if(!S.pending) S.pending=[];
if(!S.scanIdx) S.scanIdx=[];

/* ============================================================
   ATOMIC ECONOMY
   Every state change that owes the player something writes the
   owed rewards into S.pending *in the same synchronous block*
   that mutates the grid, then persists. Animation never carries
   state. flushPending() pays out and is called on load, so a
   reload at any point during an animation settles the debt
   exactly once instead of stranding it.
   ============================================================ */
function queuePay(rewards){
  if(!rewards||!rewards.length) return;
  for(var i=0;i<rewards.length;i++) S.pending.push({type:rewards[i].type,amount:rewards[i].amount});
}
function flushPending(originEl,opts){
  if(!S.pending||!S.pending.length) return false;
  var owed=S.pending;
  S.pending=[]; st.save();                       // clear first: a re-entrant flush can never double-pay
  try { SB.grantRewards(owed, originEl||null, {toastTop:true}); }
  catch(e){ S.pending=owed.concat(S.pending); st.save(); return false; }
  // a settled debt changes the shovel count, so the counters AND the shovel-aware
  // hint both have to re-read the wallet (the hint used to keep saying
  // "out of shovels" through the whole opening toast of a fresh session)
  if(tiles && tiles.length){ refreshTools(); refreshHint(); }
  return true;
}

if(!S.endTs){ S.endTs=Date.now()+48*3600*1000; st.save(); }
if(!S.seeded){
  S.seeded=true; queuePay([{type:"shovel",amount:10}]); st.save();
  setTimeout(function(){ SB.toast("⛺ Welcome to the dig site — 10 shovels and a scanner to start!",{top:true,ms:2600}); },900);
}

// ---------- rewards: single source of truth (display == grant) ----------
function mult(){ return Math.pow(1.5,S.level-1); }
function coinsAmt(base){ return Math.round(base*mult()/10)*10; }
function trailPerTile(){ return coinsAmt(150); }
function rewardsFor(art){
  switch(art.kind){
    case "crown": return [{type:"coins",amount:coinsAmt(3000)},{type:"wild",amount:2},{type:"gem",amount:5}];
    case "chest": return [{type:"coins",amount:coinsAmt(800)},{type:"draw",amount:1}];
    case "wild":  return [{type:"wild",amount:1}];
    case "gem":   return [{type:"gem",amount:Math.max(1,Math.round(mult()))}];
    // paid out per tile as dug — the total below is exactly len × per-tile
    case "trail": return [{type:"coins",amount:trailPerTile()*art.cells.length}];
  }
  return [];
}
// SB.num (exact) — SB.fmt would abbreviate a 15,190-coin crown to "15.2K" and the
// tray/haul numbers must survive a stakeholder adding them up.
function rewardStr(art){
  return rewardsFor(art).map(function(r){ return "+"+SB.num(r.amount)+" "+SB.icon(r.type); }).join(" ");
}

// ---------- level generation ----------
function genLevel(){
  var cells,arts,attempt;
  for(attempt=0;attempt<40;attempt++){
    cells=[]; arts=[];
    for(var i=0;i<N;i++) cells.push({k:"e",a:-1,hits:0,rev:false});
    var wanted=[["crown",3,2],["chest",2,2],["wild",1,2],["trail",1,4],["gem",1,1],["gem",1,1]];
    if(S.level>=2) wanted.push(["gem",1,1]);        // deeper sites are richer
    if(S.level>=3) wanted.push(["trail",1,3]);
    var ok=true;
    for(var w=0;w<wanted.length;w++){ if(!addArt(wanted[w][0],wanted[w][1],wanted[w][2])) { ok=false; break; } }
    if(ok) break;
  }
  var rocks=Math.min(4+((Math.random()*3)|0)+(S.level-1),10), placed=0, guard=0;
  while(placed<rocks && guard++<600){
    var ix=(Math.random()*N)|0;
    if(cells[ix].k==="e"){ cells[ix].k="r"; placed++; }
  }
  S.grid=cells; S.arts=arts;
  S.scanUntil=0; S.scanIdx=[]; S.autoShop=false;
  st.save();

  function tryPlace(w,h){
    for(var t=0;t<500;t++){
      var ww=w,hh=h;
      if(w!==h && Math.random()<0.5){ ww=h; hh=w; }
      var c0=(Math.random()*(COLS-ww+1))|0, r0=(Math.random()*(ROWS-hh+1))|0;
      var idxs=[],good=true;
      for(var r=r0;r<r0+hh&&good;r++)for(var c=c0;c<c0+ww;c++){
        var ix2=r*COLS+c;
        if(cells[ix2].k!=="e"){good=false;break;}
        idxs.push(ix2);
      }
      if(good) return idxs;
    }
    return null;
  }
  function addArt(kind,w,h){
    var idxs=tryPlace(w,h);
    if(!idxs) return false;
    var ai=arts.length;
    arts.push({kind:kind,cells:idxs,got:false});
    idxs.forEach(function(ix){ cells[ix].k="a"; cells[ix].a=ai; });
    return true;
  }
}
if(!S.grid||!S.arts||S.grid.length!==N) genLevel();

// ---------- DOM refs ----------
var gridEl=document.getElementById("grid"), wrapEl=document.getElementById("wrap");
var trayEl=document.getElementById("tray"), progTxt=document.getElementById("progTxt"), progFill=document.getElementById("progFill");
var hintEl=document.getElementById("hint");
var shovelCt=document.getElementById("shovelCt"), scanCt=document.getElementById("scanCt"), dynCt=document.getElementById("dynCt");
var scanBtn=document.getElementById("scanBtn"), dynBtn=document.getElementById("dynBtn"), shovelChip=document.getElementById("shovelChip");
var earnBtn=document.getElementById("earnBtn"), cdEl=document.getElementById("cd");
var tiles=[], scanMode=false, dynMode=false, blasting=false;
var anim={};              // per-tile animation lock (never gates state, only re-taps)
var collecting={};        // art indices mid fly-to-tray (styling only)
var levelModalOpen=false;

function isOver(){ return !!S.ended || Date.now()>=S.endTs; }

// ---------- render ----------
function artBox(art){
  var rs=art.cells.map(function(ix){return (ix/COLS)|0;}), cs=art.cells.map(function(ix){return ix%COLS;});
  var r0=Math.min.apply(null,rs), c0=Math.min.apply(null,cs);
  return {r0:r0,c0:c0,w:Math.max.apply(null,cs)-c0+1,h:Math.max.apply(null,rs)-r0+1};
}
function contentFor(cell){
  if(cell.k==="a") return EMO[S.arts[cell.a].kind];
  if(cell.k==="r") return "🪨";
  return "◦";            // scanned and genuinely empty — a mid-dot was too faint to read
}
function buildGrid(){
  gridEl.innerHTML=""; tiles=[]; anim={}; collecting={};
  wrapEl.querySelectorAll(".td-rowmark").forEach(function(m){m.remove();});
  for(var i=0;i<N;i++){
    var t=document.createElement("div");
    t.className="td-tile";
    t.dataset.i=i;
    // stable per-cell clod cut (row-shifted so the pattern never lines up in bands)
    t.dataset.v=(i*5+((i/COLS)|0)*3)%4;
    var cell=S.grid[i], inner="";
    if(cell.k==="a"){
      var art=S.arts[cell.a];
      inner = (art.cells.length>1 && art.kind!=="trail")
        ? '<span class="bigart">'+EMO[art.kind]+"</span>"
        : '<span class="solo">'+EMO[art.kind]+"</span>";
    }
    t.innerHTML='<div class="td-dirt"></div><div class="td-content">'+inner+'</div><div class="td-glint">✨</div><div class="td-scan"></div>';
    gridEl.appendChild(t); tiles.push(t);
    syncTile(i);
  }
  for(var r=0;r<ROWS;r++){
    (function(row){
      var m=document.createElement("button");
      m.className="td-rowmark"; m.innerHTML="<i>🧨</i>"; m.dataset.row=row;
      m.setAttribute("aria-label","Blast row "+(row+1));
      m.addEventListener("click", function(e){ e.stopPropagation(); blastRow(row); });
      wrapEl.appendChild(m);
    })(r);
  }
  layoutArts();
  restoreScan();
  refreshAll();
}
// position multi-tile treasure sprites so each tile shows its slice of one big object
function layoutArts(){
  if(!tiles.length) return;
  var ts=tiles[0].getBoundingClientRect().width;
  if(!ts) return;
  var GAP=parseFloat(getComputedStyle(gridEl).columnGap)||4;
  S.arts.forEach(function(art){
    if(art.cells.length<2||art.kind==="trail") return;
    var b=artBox(art);
    var W=b.w*ts+(b.w-1)*GAP, H=b.h*ts+(b.h-1)*GAP;
    art.cells.forEach(function(ix){
      var sp=tiles[ix]&&tiles[ix].querySelector(".bigart");
      if(!sp) return;
      var dx=(ix%COLS)-b.c0, dy=((ix/COLS)|0)-b.r0;
      sp.style.left=(-dx*(ts+GAP))+"px";
      sp.style.top=(-dy*(ts+GAP))+"px";
      sp.style.width=W+"px"; sp.style.height=H+"px";
      sp.style.fontSize=(Math.min(W,H)*0.8)+"px";
    });
  });
  var gTop=gridEl.offsetTop;
  wrapEl.querySelectorAll(".td-rowmark").forEach(function(m){
    m.style.top=(gTop + (+m.dataset.row)*(ts+GAP) + ts/2)+"px";
  });
}
window.addEventListener("resize", layoutArts);
if(window.ResizeObserver) new ResizeObserver(layoutArts).observe(gridEl);

function syncTile(i){
  var cell=S.grid[i], t=tiles[i];
  if(!t) return;
  t.classList.toggle("revealed",cell.rev);
  t.classList.toggle("rockcracked",cell.k==="r"&&cell.hits===1&&!cell.rev);
  var gold=cell.rev&&cell.k==="a";
  var done=gold&&S.arts[cell.a].got&&!collecting[cell.a];
  t.classList.toggle("gold",gold&&!done);
  t.classList.toggle("collected",done);
  t.classList.toggle("rubble",cell.rev&&cell.k!=="a");
  t.classList.toggle("wasrock",cell.rev&&cell.k==="r");
}
function refreshGlints(){
  tiles.forEach(function(t){t.classList.remove("glinting");});
  if(isOver()) return;
  S.arts.forEach(function(a){
    if(a.got) return;
    if(!a.cells.some(function(ix){return S.grid[ix].rev;})) return;
    a.cells.forEach(function(ix){
      if(S.grid[ix].rev) return;
      var r=(ix/COLS)|0, c=ix%COLS;
      var adj=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
      var near=adj.some(function(p){
        if(p[0]<0||p[0]>=ROWS||p[1]<0||p[1]>=COLS) return false;
        var j=p[0]*COLS+p[1];
        return S.grid[j].a===S.grid[ix].a && S.grid[j].rev;
      });
      if(near&&tiles[ix]) tiles[ix].classList.add("glinting");
    });
  });
}
function revCount(a){ return a.cells.filter(function(ix){return S.grid[ix].rev;}).length; }
function refreshTray(){
  trayEl.innerHTML="";
  S.arts.forEach(function(a,ai){
    var rev=revCount(a);
    var d=document.createElement("div");
    d.className="td-slot"+(a.got?" got":(rev>0?" partial":""));
    var main=rewardsFor(a)[0];
    d.setAttribute("role","button");
    d.setAttribute("aria-label",ARTNAME[a.kind]);
    d.innerHTML='<span class="em">'+EMO[a.kind]+'</span><span class="rw">'+SB.num(main.amount)+' '+SB.icon(main.type)+'</span>';
    d.addEventListener("click",function(){
      var state=a.got ? "Excavated! " : (rev>0 ? (a.cells.length-rev)+" tile"+((a.cells.length-rev)===1?"":"s")+" still buried · " : "Still fully buried · ");
      SB.toast(EMO[a.kind]+" "+ARTNAME[a.kind]+" — "+state+rewardStr(a)+(a.kind==="trail"?" (paid per tile)":""),{top:true,ms:2400});
    });
    trayEl.appendChild(d);
  });
}
function refreshProgress(){
  var got=S.arts.filter(function(a){return a.got;}).length;
  progTxt.textContent=got+"/"+S.arts.length;
  progFill.style.width=(got/S.arts.length*100)+"%";
}
function refreshTools(){
  shovelCt.textContent=SB.bal("shovel");
  scanCt.textContent=S.scanners; dynCt.textContent=S.dyn;
  shovelChip.classList.toggle("zero",SB.bal("shovel")===0);
  scanBtn.classList.toggle("zero",S.scanners===0);
  dynBtn.classList.toggle("zero",S.dyn===0);
  scanBtn.classList.toggle("armed",scanMode);
  dynBtn.classList.toggle("armed-dyn",dynMode);
  wrapEl.classList.toggle("dynmode",dynMode);
}
function refreshSite(){
  var name=SITE_NAMES[(S.level-1)%SITE_NAMES.length];
  document.getElementById("siteLabel").innerHTML='<div class="nm">'+name+'</div><div class="sub">⛏️ Expedition · Site '+S.level+"</div>";
  document.getElementById("siteBadge").innerHTML="SITE<b>"+S.level+"</b>";
  var th=THEMES[(S.level-1)%THEMES.length];
  wrapEl.style.setProperty("--d1",th.d1); wrapEl.style.setProperty("--d2",th.d2);
  wrapEl.style.setProperty("--d3",th.d3); wrapEl.style.setProperty("--d4",th.d4);
}
// The hint is derived from the live grid every time it renders, so it can never
// claim "2 tiles left" while the grid says otherwise.
function refreshHint(){
  if(isOver()){ hintEl.textContent="Event ended — your haul is banked."; hintEl.classList.remove("hot"); return; }
  var best=null;
  S.arts.forEach(function(a){
    if(a.got) return;
    var rev=revCount(a);
    if(!rev) return;
    var left=a.cells.length-rev;
    if(left<=0) return;
    if(!best||left<best.left) best={left:left,kind:a.kind};
  });
  if(best){
    hintEl.textContent="✨ "+best.left+" tile"+(best.left===1?"":"s")+" left to finish the "+ARTNAME[best.kind]+" "+EMO[best.kind];
    hintEl.classList.add("hot");
    return;
  }
  hintEl.classList.remove("hot");
  hintEl.textContent = SB.bal("shovel")===0
    ? "Out of shovels — win a Skip-Bo level for +3 ⛏️ (free)"
    : "Tap a tile to dig · 1 ⛏️ per tile · ✨ = treasure next door";
}
function refreshAll(){ refreshGlints(); refreshTray(); refreshProgress(); refreshTools(); refreshSite(); refreshHint(); }

// ---------- FX ----------
function puffAt(t){
  var p=document.createElement("div"); p.className="td-puff";
  p.style.left="calc(50% - 13px)"; p.style.top="calc(50% - 13px)";
  t.appendChild(p); setTimeout(function(){p.remove();},520);
}
function shardsAt(t){
  var wr=wrapEl.getBoundingClientRect(), tr=t.getBoundingClientRect();
  var cx=tr.left-wr.left+tr.width/2, cy=tr.top-wr.top+tr.height/2;
  for(var k=0;k<6;k++){
    var s=document.createElement("div"); s.className="td-shard";
    s.style.left=(cx-4)+"px"; s.style.top=(cy-3)+"px";
    var a=Math.random()*Math.PI*2, d=18+Math.random()*26;
    s.style.setProperty("--tx",(Math.cos(a)*d)+"px");
    s.style.setProperty("--ty",(Math.sin(a)*d-14)+"px");
    s.style.setProperty("--rot",((Math.random()*240-120)|0)+"deg");
    wrapEl.appendChild(s);
    setTimeout(function(el){return function(){el.remove();};}(s),580);
  }
}
function goldBurst(t){
  var r=t.getBoundingClientRect();
  SB.confetti(r.left+r.width/2, r.top+r.height/2, 24);
}

/* ============================================================
   STATE MUTATION — synchronous, persisted by the caller
   ============================================================ */
// Reveals one cell and queues everything it owes. Returns a descriptor for the
// animation layer, or null if nothing changed.
function applyReveal(i){
  var cell=S.grid[i];
  if(cell.rev) return null;
  cell.rev=true; cell.hits=2;
  var res={i:i,art:-1,kind:null,completed:false};
  if(cell.k==="a"){
    var art=S.arts[cell.a];
    res.art=cell.a; res.kind=art.kind;
    if(art.kind==="trail") queuePay([{type:"coins",amount:trailPerTile()}]);
    if(!art.got && art.cells.every(function(ix){return S.grid[ix].rev;})){
      art.got=true;
      res.completed=true;
      // trail already paid tile-by-tile; everything else pays once, here
      if(art.kind!=="trail") queuePay(rewardsFor(art));
    }
  }
  return res;
}

/* ============================================================
   ANIMATION — carries no state, safe to lose to a reload
   ============================================================ */
function playReveals(list, baseDelay, payOrigin){
  var maxD=baseDelay;
  (list||[]).filter(Boolean).forEach(function(res,k){
    var d=baseDelay+k*70; maxD=Math.max(maxD,d);
    if(res.completed) collecting[res.art]=true;
    setTimeout(function(){
      var t=tiles[res.i]; if(!t) return;
      syncTile(res.i);
      if(S.grid[res.i].k==="a"){ goldBurst(t); SB.haptic(25); }
      else { puffAt(t); shardsAt(t); }
      refreshGlints(); refreshTray(); refreshHint();
      if(res.completed) flyToTray(res.art,t);
    },d);
  });
  setTimeout(function(){
    flushPending(payOrigin||null);
    refreshAll();
    maybeLevelDone();
  }, maxD+30);
}
function flyToTray(ai,originTile){
  var art=S.arts[ai], slot=trayEl.children[ai];
  var done=function(){
    delete collecting[ai];
    art.cells.forEach(syncTile);
    refreshTray(); refreshProgress(); refreshHint();
    if(art.kind==="crown"){ SB.confetti(); SB.toast("👑 GOLDEN CROWN excavated!",{top:true}); }
    else if(art.kind==="trail") SB.toast("🪙 Coin Trail complete!",{top:true});
  };
  if(!slot||!originTile){ done(); return; }
  var sr=slot.getBoundingClientRect(), or_=originTile.getBoundingClientRect();
  var fly=document.createElement("div");
  fly.className="td-collect-fly"; fly.textContent=EMO[art.kind];
  fly.style.left=(or_.left+or_.width/2-15)+"px"; fly.style.top=(or_.top+or_.height/2-15)+"px";
  document.body.appendChild(fly);
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    fly.style.left=(sr.left+sr.width/2-15)+"px"; fly.style.top=(sr.top+sr.height/2-15)+"px";
    fly.style.transform="scale(.6)";
  });});
  setTimeout(function(){ fly.remove(); done(); },820);
}

// ---------- dig (single delegated listener) ----------
gridEl.addEventListener("click", function(e){
  var t=e.target.closest(".td-tile");
  if(!t) return;
  var i=+t.dataset.i, cell=S.grid[i];
  if(isOver()){ SB.toast("⏳ The expedition has ended.",{top:true}); return; }
  if(dynMode){ SB.toast("Tap a 🧨 marker at the left of a row to blast it",{top:true}); return; }
  if(scanMode){ doScan(i); return; }
  if(cell.rev||anim[i]||blasting) return;
  if(SB.bal("shovel")<=0){
    t.classList.remove("sb-shake"); void t.offsetWidth; t.classList.add("sb-shake");
    shovelChip.classList.remove("sb-shake"); void shovelChip.offsetWidth; shovelChip.classList.add("sb-shake");
    SB.haptic(30); openShop(true); return;
  }

  // ---- atomic: spend + grid mutation + owed rewards, all persisted before any timer ----
  var rock = (cell.k==="r" && cell.hits===0);
  SB.spend("shovel",1);
  var res=null;
  if(rock) cell.hits=1; else res=applyReveal(i);
  st.save();
  // ---- animation only past this point ----
  anim[i]=true;
  SB.haptic();
  refreshTools(); refreshHint();
  t.classList.add("cracking");
  shardsAt(t);
  setTimeout(function(){
    t.classList.remove("cracking");
    delete anim[i];
    if(rock){
      syncTile(i); puffAt(t);
      SB.toast("🪨 Solid rock! One more hit…",{top:true});
      afterDig(); return;
    }
    playReveals([res],0,t);
    afterDig();
  },250);
});

function afterDig(){
  refreshTools(); refreshHint();
  if(SB.bal("shovel")===0 && !S.arts.every(function(a){return a.got;}) && !S.autoShop && !isOver()){
    S.autoShop=true; st.save();   // nag exactly once per empty-belt episode
    setTimeout(function(){ if(SB.bal("shovel")===0&&!isOver()) openShop(true); },700);
  }
}

// ---------- scanner ----------
scanBtn.addEventListener("click",function(){
  if(isOver()){ SB.toast("⏳ The expedition has ended.",{top:true}); return; }
  dynMode=false;
  if(S.scanners<=0){ scanBtn.classList.add("sb-shake"); setTimeout(function(){scanBtn.classList.remove("sb-shake");},450); openShop(false); return; }
  scanMode=!scanMode; refreshTools();
  SB.toast(scanMode?"🔮 Scanner armed — tap any tile to scan a 3×3 area":"Scanner disarmed",{top:true});
});
function scanRegion(i){
  var r0=(i/COLS)|0, c0=i%COLS, out=[];
  for(var r=r0-1;r<=r0+1;r++)for(var c=c0-1;c<=c0+1;c++){
    if(r<0||r>=ROWS||c<0||c>=COLS) continue;      // clamped, never wraps a row
    var ix=r*COLS+c;
    if(!S.grid[ix].rev) out.push(ix);
  }
  return out;
}
function doScan(i){
  var marked=scanRegion(i);
  if(!marked.length){ SB.toast("Nothing buried there — pick a spot with unbroken dirt",{top:true}); return; }
  scanMode=false;
  S.scanners--;
  S.scanIdx=marked; S.scanUntil=Date.now()+SCAN_MS;
  st.save();
  refreshTools(); SB.haptic(20);
  paintScan();
  SB.toast("🔮 Scan active for 10s — "+marked.length+" tile"+(marked.length===1?"":"s")+" x-rayed",{top:true});
}
var scanTimer=null;
function paintScan(){
  clearTimeout(scanTimer);
  tiles.forEach(function(t){ t.classList.remove("scanned"); });
  var left=S.scanUntil-Date.now();
  if(left<=0||!S.scanIdx.length) return;
  S.scanIdx.forEach(function(ix){
    var t=tiles[ix]; if(!t||S.grid[ix].rev) return;
    t.querySelector(".td-scan").textContent=contentFor(S.grid[ix]);
    t.classList.add("scanned");
  });
  scanTimer=setTimeout(function(){
    S.scanIdx=[]; S.scanUntil=0; st.save();
    tiles.forEach(function(t){ t.classList.remove("scanned"); });
  },left);
}
// a scan the player paid for survives a reload for its remaining seconds
function restoreScan(){ paintScan(); }

// ---------- dynamite ----------
dynBtn.addEventListener("click",function(){
  if(isOver()){ SB.toast("⏳ The expedition has ended.",{top:true}); return; }
  scanMode=false;
  if(S.dyn<=0){ dynBtn.classList.add("sb-shake"); setTimeout(function(){dynBtn.classList.remove("sb-shake");},450); openShop(false); return; }
  dynMode=!dynMode; refreshTools();
  SB.toast(dynMode?"🧨 Pick a row marker to blast that row":"Dynamite stowed",{top:true});
});
function blastRow(row){
  if(S.dyn<=0||blasting||isOver()) return;
  var idxs=[],c;
  for(c=0;c<COLS;c++) idxs.push(row*COLS+c);       // exactly one row, edge-clamped by construction
  var live=idxs.filter(function(ix){ return !S.grid[ix].rev; });
  if(!live.length){ SB.toast("That row is already cleared — pick another",{top:true}); return; }

  // ---- atomic: charge + reveal the whole row + owed rewards, persisted now ----
  S.dyn--;
  var results=[];
  live.forEach(function(ix){ var r=applyReveal(ix); if(r) results.push(r); });
  st.save();

  dynMode=false; blasting=true; refreshTools(); SB.haptic(40);
  idxs.forEach(function(ix,k){
    setTimeout(function(){ if(tiles[ix]){ tiles[ix].classList.add("blast"); shardsAt(tiles[ix]); } },k*35);
  });
  var mid=tiles[idxs[3]].getBoundingClientRect();
  SB.confetti(mid.left+mid.width/2, mid.top+mid.height/2, 50);
  setTimeout(function(){
    idxs.forEach(function(ix){ if(tiles[ix]) tiles[ix].classList.remove("blast"); });
    blasting=false;
    playReveals(results,0,tiles[idxs[3]]);
  },480);
}

// ---------- shop ----------
var shopEl=null;
// A purchase takes ~1.2s of sheet animation to complete. Selling inside that window
// of the deadline would hand the player shovels/dynamite for an expedition that is
// already closed, so the till shuts a few seconds early and any open offer is pulled.
var SALE_CUTOFF=4000;
function saleClosed(){ return isOver() || (S.endTs-Date.now())<SALE_CUTOFF; }
setInterval(function(){
  if(!saleClosed()) return;
  if(shopEl){ closeShop(); SB.toast("⏳ The expedition is closing — the shop is shut.",{top:true}); }
  SB.closeSheet();
},1000);
function crownState(){
  var crown=null, ai=-1;
  S.arts.forEach(function(a,i){ if(a.kind==="crown"&&!a.got){ crown=a; ai=i; } });
  if(!crown) return {eligible:false,left:0,ai:-1};
  var rev=revCount(crown), left=crown.cells.length-rev;
  return {
    // sellable only while it can actually deliver: a crown exists, is still buried
    // in part, is ≥60% uncovered, and the event is still running
    eligible: left>0 && (rev/crown.cells.length)>=0.6 && !isOver(),
    left:left, ai:ai, rev:rev
  };
}
function closeShop(){
  if(!shopEl) return;
  var s=shopEl; shopEl=null;
  s.classList.remove("open"); setTimeout(function(){s.remove();},300);
}
var OFFERS={
  crown:{
    label:"👑 Guaranteed Final Dig", price:"$2.99",
    sub:"We excavate the last of the Golden Crown for you — guaranteed.",
    can:function(){ return crownState().eligible; },
    chips:function(){
      var cs=crownState(), art=cs.ai>=0?S.arts[cs.ai]:null;
      var extra=[{type:"shovel",amount:6},{icon:"🔮",label:"Scanner",amount:1}];
      return art ? rewardsFor(art).concat(extra) : extra;
    },
    // The 60% gate decides whether the bundle may be OFFERED. Once bought it must
    // deliver the crown as long as a crown is still buried — paying shovels instead
    // would be taking money for a promise the copy made literally.
    apply:function(){
      var cs=crownState(), art=cs.ai>=0?S.arts[cs.ai]:null;
      queuePay([{type:"shovel",amount:6}]);
      S.scanners++;
      if(!art||art.got){ st.save(); return null; }
      var results=[];
      art.cells.forEach(function(ix){ var r=applyReveal(ix); if(r) results.push(r); });
      st.save();
      return results;
    }
  },
  shovels:{
    label:"⛏️ 12 Shovels", price:"$1.99", sub:"Straight back to the dig",
    can:function(){ return !isOver(); },
    chips:function(){ return [{type:"shovel",amount:12}]; },
    apply:function(){ queuePay([{type:"shovel",amount:12}]); st.save(); return null; }
  },
  scanner:{
    label:"🔮 Scanner", price:"$0.99", sub:"X-ray a 3×3 area of buried tiles for 10 seconds",
    can:function(){ return !isOver(); },
    chips:function(){ return [{icon:"🔮",label:"Scanner",amount:1}]; },
    apply:function(){ S.scanners++; st.save(); scanMode=true; return null; }
  },
  dyn:{
    label:"🧨 Dynamite Pack", price:"$4.99", sub:"Blast whole rows — rock and all",
    can:function(){ return !isOver(); },
    // "Dynamite Stick" not "Dynamite": the shared pluraliser has no irregular entry for
    // the mass noun and would print "3 Dynamites".
    chips:function(){ return [{icon:"🧨",label:"Dynamite Stick",amount:3},{type:"shovel",amount:12}]; },
    apply:function(){ S.dyn+=3; queuePay([{type:"shovel",amount:12}]); st.save(); return null; }
  }
};
function openShop(auto){
  if(shopEl) return;
  if(saleClosed()){ SB.toast(isOver()?"⏳ The expedition has ended — the shop is closed.":"⏳ The expedition is closing — the shop is shut.",{top:true}); return; }
  var cs=crownState();
  var html='<div class="sb-sheet">'
    +'<h3>'+(auto?"Out of shovels!":"Dig Site Shop")+'</h3>'
    +'<div class="sb-sheet-sub">'+(auto?"Your treasures are still down there…":"Stock up and keep digging")+'</div>';
  // the free path always sits in the same view as the paid ones
  html+='<button class="td-offer freepath" data-buy="free"><span class="ico">🎴</span>'
    +'<span class="txt"><b>Win a Skip-Bo level</b><span>+3 ⛏️ every time — no purchase needed</span></span>'
    +'<span class="price">FREE</span></button>'
    +'<div class="td-shop-note">You can always dig for free — the offers below just go faster.</div>';
  if(cs.eligible){
    html+='<button class="td-offer hero" data-buy="crown"><span class="ico">👑</span>'
      +'<span class="txt"><b>'+cs.left+' tile'+(cs.left>1?"s":"")+' from the Golden Crown</b>'
      +'<span>We dig the last '+cs.left+' tile'+(cs.left>1?"s":"")+' for you — Crown guaranteed, plus 6 ⛏️ + 1 🔮</span></span>'
      +'<span class="price">$2.99</span></button>';
  }
  html+='<button class="td-offer" data-buy="shovels"><span class="ico">⛏️</span>'
    +'<span class="txt"><b>12 Shovels</b><span>Keep the dig going</span></span><span class="price">$1.99</span></button>'
    +'<button class="td-offer" data-buy="scanner"><span class="ico">🔮</span>'
    +'<span class="txt"><b>Scanner</b><span>Tap a tile → x-ray a 3×3 area for 10s</span></span><span class="price">$0.99</span></button>'
    +'<button class="td-offer" data-buy="dyn"><span class="ico">🧨</span>'
    +'<span class="txt"><b>Dynamite Pack</b><span>3 dynamite (blast full rows, breaks rock!) + 12 ⛏️</span></span><span class="price">$4.99</span></button>'
    +'<button class="sb-sheet-cancel" id="td-shop-cancel">No thanks</button></div>';
  var bd=document.createElement("div");
  bd.className="sb-sheet-backdrop"; bd.innerHTML=html;
  document.body.appendChild(bd); shopEl=bd;
  requestAnimationFrame(function(){requestAnimationFrame(function(){bd.classList.add("open");});});
  bd.addEventListener("click",function(e){ if(e.target===bd) closeShop(); });
  bd.querySelector("#td-shop-cancel").addEventListener("click",closeShop);
  bd.querySelectorAll(".td-offer").forEach(function(btn){
    btn.addEventListener("click",function(){
      var what=btn.dataset.buy;
      closeShop();
      if(what==="free"){ setTimeout(playLevel,260); return; }
      setTimeout(function(){ launchIAP(what); },260);
    });
  });
}
function launchIAP(what){
  var o=OFFERS[what];
  if(!o) return;
  if(saleClosed()||!o.can()){ SB.toast("That offer is no longer available.",{top:true}); return; }
  SB.buyIAP({
    label:o.label, price:o.price, sub:o.sub,
    contents:o.chips(),
    grant:false,                       // this file pays out atomically via S.pending
    onSuccess:function(){
      // belt-and-braces on the till cutoff: never hand over goods for a closed dig
      if(isOver()){ SB.toast("⏳ The expedition closed before that could be delivered — nothing was charged.",{top:true,ms:2600}); return; }
      var results=o.apply();           // mutates + persists in one synchronous block
      if(results&&results.length) playReveals(results,140,null);
      else flushPending(null);
      refreshAll();
      if(what==="scanner"){ refreshTools(); SB.toast("🔮 Scanner armed — tap any tile!",{top:true}); }
      if(what==="dyn") SB.toast("🧨 +3 Dynamite — tap 🧨 then a row marker",{top:true});
    }
  });
}
document.getElementById("shopBtn").addEventListener("click",function(){ openShop(false); });
shovelChip.addEventListener("click",function(){ if(SB.bal("shovel")===0) openShop(true); });

// ---------- level complete ----------
function maybeLevelDone(){
  if(levelModalOpen||isOver()) return;
  if(!S.arts.length||!S.arts.every(function(a){return a.got;})) return;
  levelModalOpen=true;
  SB.confetti(); SB.haptic(40);
  var emos=S.arts.map(function(a){return EMO[a.kind];}).join(""), count=S.arts.length;
  setTimeout(function(){
    var advanced=false;
    function advance(){
      if(advanced) return; advanced=true;
      levelModalOpen=false;
      S.level++;
      genLevel();                       // persists the fresh grid (and clears stale scans)
      queuePay([{type:"shovel",amount:5}]);
      st.save();
      buildGrid();
      flushPending(null);
      SB.toast("⛺ Site "+S.level+" — "+SITE_NAMES[(S.level-1)%SITE_NAMES.length]+"! Bonus +5 shovels",{top:true,ms:2400});
    }
    // dismissing the modal any way advances the site: leaving the player on a
    // fully-excavated grid with nothing to tap would be a dead end
    var m=SB.modal(
      '<div style="font-size:44px;">🏆</div>'
      +'<h3 style="margin:6px 0 4px;">Site '+S.level+' Cleared!</h3>'
      +'<p class="sb-muted" style="margin:0 0 10px;font-size:13px;">All '+count+' treasures excavated at '+SITE_NAMES[(S.level-1)%SITE_NAMES.length]+'.</p>'
      +'<div style="font-size:26px;letter-spacing:6px;margin-bottom:12px;">'+emos+'</div>'
      +'<p style="font-size:12.5px;color:#5a6b8c;margin:0 0 12px;">Site '+(S.level+1)+' is richer: rewards ×1.5 and more treasure, but rockier ground…</p>'
      +'<button class="sb-btn sb-btn-yellow sb-btn-block" id="digDeeper">⛏️ Dig Deeper → Site '+(S.level+1)+'</button>'
    , advance);
    m.el.querySelector("#digDeeper").addEventListener("click",function(){ m.close(); });
  },900);
}

// ---------- free path ----------
function playLevel(){
  if(earnBtn.disabled) return;
  if(isOver()){ SB.toast("⏳ The expedition has ended.",{top:true}); return; }
  earnBtn.disabled=true;
  var orig=earnBtn.innerHTML;
  earnBtn.innerHTML="🎴 Dealing cards…";
  setTimeout(function(){
    // atomic: the win is banked before any of the celebration runs
    queuePay([{type:"shovel",amount:3}]); st.save();
    earnBtn.innerHTML="✓ Level won!";
    earnBtn.classList.add("sb-bounce");
    flushPending(earnBtn);
    SB.confetti(window.innerWidth/2, window.innerHeight-120, 30);
    S.autoShop=false; st.save();
    refreshTools(); refreshHint();
    setTimeout(function(){
      earnBtn.classList.remove("sb-bounce");
      if(isOver()) return;                 // endEvent owns the button once the clock stops
      earnBtn.innerHTML=orig; earnBtn.disabled=false;
    },900);
  },550);
}
earnBtn.addEventListener("click",playLevel);

// ---------- info ----------
document.getElementById("infoBtn").addEventListener("click",function(){
  var m=SB.modal(
    '<div style="font-size:38px;">⛏️👑</div><h3 style="margin:6px 0 8px;">Treasure Dig</h3>'
    +'<p style="font-size:13.5px;line-height:1.5;text-align:left;color:var(--sb-ink);margin:0 0 10px;">'
    +'Each tap spends a <b>shovel</b> to break dirt and reveal what\'s buried — treasures, coin trails, gems, or stubborn <b>rocks that take two hits</b>. '
    +'Uncover part of a treasure and its buried neighbours <b>sparkle</b>, showing where to dig next. Fully uncover a treasure to collect its reward (tap its haul icon to preview). '
    +'The <b>🔮 Scanner</b> x-rays a 3×3 area; <b>🧨 Dynamite</b> blasts a whole row, rock and all. '
    +'Clear every treasure to descend to a <b>deeper, richer site</b> (rewards ×1.5, more treasure, rockier ground). '
    +'Out of shovels? Win a regular Skip-Bo level for <b>+3 ⛏️</b> — always free — or buy a bundle.</p>'
    +'<p style="font-size:11px;line-height:1.45;text-align:left;color:#5a6b8c;margin:0 0 12px;">Demo note: contextual offers surface exactly when shovels run out, at the moment of highest investment. The "Guaranteed Final Dig" bundle only appears while a Golden Crown is ≥60% uncovered and still finishable — and it excavates the remaining tiles itself, so the promise is literal.</p>'
    +'<button class="sb-btn sb-btn-blue sb-btn-block" id="td-info-ok">Got it</button>'
  );
  m.el.querySelector("#td-info-ok").addEventListener("click",function(){ m.close(); });
});

// ---------- event expiry ----------
function endEvent(){
  // an already-ended event can still owe a debt (a session killed between the
  // queue and the flush, then re-opened after the clock ran out) — settle it
  // before returning, never strand it
  if(S.ended){ flushPending(null); return; }
  S.ended=true; st.save();
  scanMode=false; dynMode=false;
  closeShop(); SB.closeSheet();
  document.body.classList.add("td-over");
  earnBtn.disabled=true; earnBtn.innerHTML="⏳ Expedition closed";
  var chip=cdEl.parentElement; if(chip){ chip.classList.add("over"); chip.classList.remove("urgent"); }
  cdEl.textContent="ENDED";
  refreshAll();
  // settle instead of stranding: anything owed is paid the moment the clock stops
  if(!flushPending(null)) SB.toast("⏳ Event ended — thanks for digging!",{top:true});
}
SB.countdown(cdEl, S.endTs, endEvent);

// ---------- boot ----------
buildGrid();
requestAnimationFrame(layoutArts);
setTimeout(layoutArts,80);
// exactly-once settlement of anything a previous session left un-flushed.
// Unconditional: an expired (or already-flagged-ended) event still has to pay a
// debt it booked before the clock stopped — gating this on !isOver() destroyed it.
flushPending(null);
maybeLevelDone();
})();
</script>
</body>
</html>
