<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Treasure Dig — Skip-Bo Mini Event</title>
<link rel="stylesheet" href="../shared/core.css">
<style>
  /* toasts must never cover the dig CTAs / IAP sheet → show them under the topbar instead */
  .sb-toast { bottom:auto; top:calc(env(safe-area-inset-top,0px) + 64px); transform:translateX(-50%) translateY(-14px); }
  .sb-toast.show { transform:translateX(-50%) translateY(0); }
  .sb-subtitle { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- expedition banner ---------- */
  .td-banner {
    position:relative; display:flex; align-items:center; gap:8px;
    background:linear-gradient(180deg,#a5732f 0%,#7a4d1d 55%,#5c3512 100%);
    border:2px solid #3d2a08; border-radius:13px; padding:7px 10px; margin-bottom:10px;
    box-shadow:inset 0 2px 0 rgba(255,224,150,.4), inset 0 -3px 0 rgba(0,0,0,.3), 0 4px 10px rgba(0,0,0,.35);
  }
  .td-banner::before, .td-banner::after {
    content:""; position:absolute; top:5px; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe9ad,#8a6a20); box-shadow:0 1px 1px rgba(0,0,0,.6);
  }
  .td-banner::before { left:6px; } .td-banner::after { right:6px; }
  .td-badge {
    flex:0 0 auto; width:36px; height:36px; border-radius:50%;
    background:radial-gradient(circle at 38% 30%,#fff3c4,#ffd95e 45%,#e0a400 100%);
    border:2px solid #9c6b06; box-shadow:0 2px 4px rgba(0,0,0,.4), inset 0 -2px 0 rgba(0,0,0,.15);
    display:grid; place-items:center; color:#5c3a00; font-weight:900; font-size:10px; line-height:1; text-align:center;
  }
  .td-badge b { font-size:15px; display:block; }
  .td-site { flex:1 1 auto; min-width:0; }
  .td-site .nm {
    color:#fff; font-weight:900; font-size:15px; letter-spacing:.4px; text-shadow:0 2px 0 rgba(0,0,0,.45);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .td-site .sub { font-size:9.5px; font-weight:800; color:#ffd95e; letter-spacing:1px; text-transform:uppercase; text-shadow:0 1px 0 rgba(0,0,0,.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .td-banner .sb-timer-chip { flex:0 0 auto; }
  .td-info {
    width:28px; height:28px; border-radius:50%; border:1.5px solid rgba(255,224,150,.55);
    background:rgba(0,0,0,.25); color:#ffe9ad; font-weight:900; font-size:14px; cursor:pointer; flex:0 0 auto;
  }
  /* ---------- progress ---------- */
  .td-prog-wrap { margin-bottom:8px; }
  .td-prog-label { display:flex; justify-content:space-between; color:#fff; font-size:12px; font-weight:800; margin-bottom:3px; text-shadow:0 1px 0 rgba(0,0,0,.3); }
  .td-prog { height:13px; border-radius:999px; background:rgba(0,0,0,.35); border:1.5px solid rgba(255,255,255,.25); overflow:hidden; }
  .td-prog-fill {
    height:100%; width:0%; border-radius:999px;
    background:linear-gradient(180deg,#ffe28a,var(--sb-yellow) 55%,var(--sb-yellow-dark));
    box-shadow:0 0 8px rgba(255,199,44,.8); transition:width .5s cubic-bezier(.34,1.56,.64,1);
  }
  /* ---------- finds tray ---------- */
  .td-tray { display:flex; gap:5px; justify-content:center; margin-bottom:8px; }
  .td-slot {
    flex:0 1 46px; min-width:36px; border-radius:11px; padding:3px 0 2px; cursor:pointer; border:2px dashed rgba(255,255,255,.3);
    background:rgba(0,0,0,.3); display:flex; flex-direction:column; align-items:center; gap:0;
    filter:grayscale(1); opacity:.5; transition:filter .3s, opacity .3s;
  }
  .td-slot .em { font-size:20px; line-height:1.15; }
  .td-slot .rw { font-size:8.5px; font-weight:900; color:#ffd95e; line-height:1.2; white-space:nowrap; text-shadow:0 1px 0 rgba(0,0,0,.5); }
  .td-slot.got {
    filter:none; opacity:1; border:2px solid var(--sb-yellow);
    background:radial-gradient(circle at 35% 30%, #6b4b12, #3d2a08);
    box-shadow:0 0 10px rgba(255,199,44,.6); animation:sbBounce .5s;
  }
  /* ---------- excavation pit ---------- */
  .td-wrap {
    position:relative; margin:0 auto 10px; max-width:400px; padding:9px; border-radius:18px;
    background:
      linear-gradient(180deg, var(--d1) 0%, var(--d2) 22%, var(--d3) 55%, var(--d4) 100%);
    border:2.5px solid #2e1c08;
    box-shadow:
      inset 3px 4px 6px rgba(255,232,180,.35),   /* sun from upper-left */
      inset -3px -4px 8px rgba(0,0,0,.45),
      0 6px 16px rgba(0,0,0,.4);
  }
  .td-wrap::before { /* rope trim */
    content:""; position:absolute; inset:3px; border-radius:14px; pointer-events:none;
    border:2px dashed rgba(255,224,150,.35);
  }
  .td-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; position:relative; }
  .td-tile {
    position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; cursor:pointer;
    /* dug hole: dark earth with lit rim (light from upper-left) */
    background:radial-gradient(circle at 45% 55%, #241505 0%, #170d03 75%);
    box-shadow:inset 0 3px 6px rgba(0,0,0,.85), inset 2px 2px 3px rgba(0,0,0,.6), inset -1px -2px 2px rgba(255,210,140,.13);
  }
  /* pebbles in an empty dug hole */
  .td-tile.rubble::after {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 30% 68%, rgba(160,120,70,.55) 0 9%, transparent 10%),
      radial-gradient(circle at 62% 76%, rgba(130,95,55,.5) 0 7%, transparent 8%),
      radial-gradient(circle at 48% 60%, rgba(90,65,35,.6) 0 6%, transparent 7%);
  }
  .td-tile.rubble.wasrock::after {
    background:
      radial-gradient(circle at 32% 70%, rgba(150,150,150,.55) 0 10%, transparent 11%),
      radial-gradient(circle at 60% 76%, rgba(120,120,120,.5) 0 8%, transparent 9%),
      radial-gradient(circle at 46% 58%, rgba(90,90,90,.6) 0 6%, transparent 7%);
  }
  /* ---------- dirt cap ---------- */
  .td-dirt {
    position:absolute; inset:0; border-radius:8px; transition:opacity .18s, transform .18s;
    background:
      radial-gradient(circle at 25% 30%, rgba(0,0,0,.25) 0 8%, transparent 9%),
      radial-gradient(circle at 70% 62%, rgba(0,0,0,.2) 0 7%, transparent 8%),
      radial-gradient(circle at 46% 80%, rgba(255,255,255,.1) 0 6%, transparent 7%),
      radial-gradient(circle at 80% 22%, rgba(255,240,200,.16) 0 5%, transparent 6%),
      linear-gradient(135deg, var(--d1) 0%, var(--d2) 40%, var(--d3) 75%, var(--d4) 100%);
    box-shadow:inset 2px 2px 0 rgba(255,236,190,.35), inset -2px -3px 0 rgba(0,0,0,.35);
  }
  .td-tile:nth-child(3n) .td-dirt { filter:brightness(1.06); }
  .td-tile:nth-child(5n) .td-dirt { filter:brightness(.93); }
  .td-tile:active .td-dirt { transform:scale(.95); }
  .td-tile.revealed .td-dirt { opacity:0; transform:scale(1.22); pointer-events:none; }
  .td-tile.cracking .td-dirt { animation:tdCrack .25s ease-in forwards; }
  /* crack lines flash while breaking */
  .td-tile.cracking .td-dirt::after, .td-tile.rockcracked .td-dirt::after {
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(112deg, transparent 42%, rgba(20,10,0,.7) 44.5%, transparent 47%),
      linear-gradient(28deg, transparent 55%, rgba(20,10,0,.6) 57.5%, transparent 60%),
      linear-gradient(160deg, transparent 30%, rgba(20,10,0,.55) 32%, transparent 34.5%);
  }
  @keyframes tdCrack {
    0% { transform:scale(1); filter:brightness(1); }
    30% { transform:scale(.94) rotate(-2deg); filter:brightness(1.3); }
    60% { transform:scale(1.02) rotate(2deg); filter:brightness(.85); }
    100% { transform:scale(1.2); opacity:0; }
  }
  /* cracked boulder (rock after first hit) */
  .td-tile.rockcracked .td-dirt {
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.35) 0 10%, transparent 12%),
      radial-gradient(ellipse at 50% 48%, #a8a8a8 0%, #787878 55%, #4c4c4c 90%);
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.3), inset -2px -3px 0 rgba(0,0,0,.45);
  }
  /* ---------- buried treasure objects ---------- */
  .td-content {
    position:absolute; inset:0; overflow:hidden;
    opacity:0; transform:scale(.3);
  }
  .td-content .bigart {
    position:absolute; display:grid; place-items:center; line-height:1;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.65)) drop-shadow(0 0 7px rgba(255,215,90,.75));
  }
  .td-content .solo {
    position:absolute; inset:0; display:grid; place-items:center; font-size:24px;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.65)) drop-shadow(0 0 6px rgba(255,215,90,.75));
  }
  .td-tile.revealed .td-content { opacity:1; transform:scale(1); transition:opacity .3s ease .08s, transform .3s cubic-bezier(.34,1.56,.64,1) .08s; }
  .td-tile.revealed.gold {  /* gold light spilling out of the hole */
    background:radial-gradient(circle at 50% 55%, #7a5510 0%, #3a2606 55%, #1c1204 100%);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.7), 0 0 12px rgba(255,199,44,.55);
  }
  .td-tile.revealed.gold .td-content::before {
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 58%, rgba(255,214,90,.5) 0%, transparent 62%);
    animation:tdGoldPulse 1.6s ease-in-out infinite;
  }
  @keyframes tdGoldPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  .td-tile.collected { box-shadow:inset 0 3px 8px rgba(0,0,0,.85); }
  .td-tile.collected .td-content { opacity:.4; filter:grayscale(.55) brightness(.8); }
  .td-tile.collected .td-content::before { display:none; }
  /* glint telegraph on buried neighbors */
  .td-glint {
    position:absolute; inset:0; display:none; place-items:center; pointer-events:none;
    font-size:16px; z-index:3; text-shadow:0 0 8px #ffd95e;
  }
  .td-tile.glinting .td-glint { display:grid; animation:tdGlint 1.3s infinite; }
  .td-tile.glinting .td-dirt { box-shadow:inset 0 0 0 2px rgba(255,220,110,.8), inset 2px 2px 0 rgba(255,236,190,.35), inset -2px -3px 0 rgba(0,0,0,.35); }
  .td-tile.glinting .td-dirt::before {
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 50%, rgba(255,222,110,.4) 0%, transparent 65%);
    animation:tdGoldPulse 1.3s infinite;
  }
  @keyframes tdGlint {
    0%,100% { opacity:.3; transform:scale(.8) rotate(-8deg); }
    50% { opacity:1; transform:scale(1.15) rotate(8deg); }
  }
  /* scanner overlay */
  .td-scan {
    position:absolute; inset:0; display:none; place-items:center; pointer-events:none;
    font-size:19px; z-index:4; opacity:.6; filter:drop-shadow(0 0 4px #7fd4ff);
  }
  .td-tile.scanned .td-scan { display:grid; animation:tdScanIn .3s; }
  .td-tile.scanned .td-dirt { box-shadow:inset 0 0 0 2px rgba(127,212,255,.85), inset 2px 2px 0 rgba(255,236,190,.35), inset -2px -3px 0 rgba(0,0,0,.35); }
  @keyframes tdScanIn { from { opacity:0; transform:scale(.5); } to { opacity:.6; transform:scale(1); } }
  /* dust puff + dirt shards */
  .td-puff {
    position:absolute; z-index:5; width:26px; height:26px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(214,186,140,.95), rgba(214,186,140,0) 70%);
    animation:tdPuff .5s ease-out forwards;
  }
  @keyframes tdPuff { from { transform:scale(.4); opacity:1; } to { transform:scale(2.4) translateY(-8px); opacity:0; } }
  .td-shard {
    position:absolute; z-index:6; width:7px; height:5px; border-radius:2px; pointer-events:none;
    background:linear-gradient(135deg, var(--d2), var(--d4));
    box-shadow:inset 0 1px 0 rgba(255,236,190,.4);
    animation:tdShard .55s cubic-bezier(.2,.6,.6,1) forwards;
  }
  @keyframes tdShard {
    0% { transform:translate(0,0) rotate(0); opacity:1; }
    100% { transform:translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity:0; }
  }
  /* dynamite row markers + blast */
  .td-rowmark {
    position:absolute; left:-4px; width:34px; height:34px; z-index:10; display:none;
    border:none; border-radius:50%; background:var(--sb-red); color:#fff; font-size:17px; cursor:pointer;
    box-shadow:0 3px 0 var(--sb-red-dark), var(--sb-shadow); transform:translateY(-50%);
    animation:sbPulse 1s infinite;
  }
  .td-wrap.dynmode .td-rowmark { display:block; }
  .td-wrap.dynmode .td-grid { outline:3px dashed rgba(215,38,61,.7); outline-offset:3px; border-radius:8px; }
  .td-tile.blast { animation:tdBlast .45s ease-out; }
  @keyframes tdBlast {
    0% { filter:brightness(3); transform:scale(1.15); }
    40% { filter:brightness(1.6) saturate(2); transform:scale(.92); }
    100% { filter:none; transform:scale(1); }
  }
  /* ---------- toolbar ---------- */
  .td-tools { display:flex; gap:8px; margin-bottom:8px; }
  .td-chip {
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
    background:rgba(0,0,0,.35); border:1.5px solid rgba(255,255,255,.3); border-radius:14px;
    color:#fff; font-weight:900; font-size:15px; padding:9px 4px; cursor:pointer; font-family:var(--sb-font);
  }
  .td-chip .big { font-size:19px; }
  .td-chip.shovels { border-color:rgba(255,199,44,.75); color:var(--sb-yellow); flex:1.3; }
  .td-chip.armed { background:rgba(62,142,222,.5); border-color:#7fd4ff; box-shadow:0 0 10px rgba(127,212,255,.7); }
  .td-chip.armed-dyn { background:rgba(215,38,61,.5); border-color:#ff8a99; box-shadow:0 0 10px rgba(215,38,61,.8); }
  .td-chip.zero { opacity:.5; }
  /* ---------- shop sheet offers ---------- */
  .td-offer {
    display:flex; align-items:center; gap:10px; width:100%;
    background:#fff; border:2px solid rgba(27,42,74,.12); border-radius:14px;
    padding:10px 12px; margin-bottom:8px; cursor:pointer; text-align:left; font-family:var(--sb-font);
  }
  .td-offer:active { transform:scale(.98); }
  .td-offer .ico { font-size:28px; flex:0 0 auto; }
  .td-offer .txt { flex:1 1 auto; min-width:0; }
  .td-offer .txt b { display:block; font-size:15px; color:var(--sb-ink); }
  .td-offer .txt span { font-size:11.5px; color:#5a6b8c; font-weight:600; }
  .td-offer .price {
    flex:0 0 auto; background:linear-gradient(180deg,#3fc167,var(--sb-green) 55%,var(--sb-green-dark));
    color:#fff; font-weight:900; font-size:14px; padding:8px 12px; border-radius:10px;
    box-shadow:0 2px 0 rgba(0,0,0,.25); text-shadow:0 1px 0 rgba(0,0,0,.2);
  }
  .td-offer.hero {
    background:linear-gradient(160deg,#fff6d8,#ffe9a8); border:2.5px solid var(--sb-yellow);
    box-shadow:0 0 14px rgba(255,199,44,.6); position:relative; overflow:hidden;
  }
  .td-offer.hero .ico { font-size:38px; animation:sbPulse 1.2s infinite; }
  .td-offer.hero .txt b { color:#8a5a00; }
  .td-offer.hero::before {
    content:"ALMOST YOURS"; position:absolute; top:11px; right:-24px; transform:rotate(35deg);
    background:var(--sb-red); color:#fff; font-size:7.5px; font-weight:900; padding:2px 26px; letter-spacing:.4px;
  }
  .td-collect-fly { position:fixed; z-index:400; font-size:30px; pointer-events:none; transition:all .8s cubic-bezier(.5,-.2,.4,1.1); filter:drop-shadow(0 0 8px #ffd95e); }
  /* keep ≥44px tap targets on 360px-wide screens */
  @media (max-width:374px) {
    .sb-main { padding-left:8px; padding-right:8px; }
    .td-wrap { padding:6px; }
    .td-grid { gap:3px; }
  }
  /* tighten vertically on short screens (360×740) so CTA clears the reset chip */
  @media (max-height:780px) {
    .sb-main { padding-top:6px; }
    .td-banner { margin-bottom:5px; padding:3px 8px; }
    .td-badge { width:30px; height:30px; font-size:8.5px; }
    .td-badge b { font-size:13px; }
    .td-prog-wrap { margin-bottom:4px; }
    .td-prog-label { font-size:11px; margin-bottom:2px; }
    .td-prog { height:10px; }
    .td-tray { margin-bottom:4px; }
    .td-slot { padding:1px 0 1px; }
    .td-slot .em { font-size:15px; }
    .td-slot .rw { font-size:8px; }
    .td-wrap { margin-bottom:6px; }
    .td-tools { margin-bottom:5px; }
    .td-chip { padding:6px 4px; }
    #earnBtn { padding:9px 22px; font-size:15px; }
  }
</style>
</head>
<body>
<div class="sb-app">
  <div class="sb-main">
    <div class="td-banner">
      <div class="td-badge" id="siteBadge">SITE<b>1</b></div>
      <div class="td-site" id="siteLabel"><div class="nm">Sandy Flats</div><div class="sub">⛏️ Expedition · Site 1</div></div>
      <span class="sb-timer-chip">⏳ <span id="cd">--</span></span>
      <button class="td-info" id="infoBtn" aria-label="Info">ⓘ</button>
    </div>

    <div class="td-prog-wrap">
      <div class="td-prog-label"><span>Treasures found</span><span id="progTxt">0/6</span></div>
      <div class="td-prog"><div class="td-prog-fill" id="progFill"></div></div>
    </div>

    <div class="td-tray" id="tray"></div>

    <div class="td-wrap" id="wrap">
      <div class="td-grid" id="grid"></div>
    </div>

    <div class="td-tools">
      <button class="td-chip shovels" id="shovelChip"><span class="big">⛏️</span><span id="shovelCt">0</span></button>
      <button class="td-chip" id="scanBtn"><span class="big">🔮</span><span id="scanCt">0</span></button>
      <button class="td-chip" id="dynBtn"><span class="big">🧨</span><span id="dynCt">0</span></button>
      <button class="td-chip" id="shopBtn" style="border-color:rgba(63,193,103,.8);color:#8af0a8;"><span class="big">＋</span>Shop</button>
    </div>

    <button class="sb-btn sb-btn-green sb-btn-block" id="earnBtn">🎴 Play a level <span style="font-weight:900;">(+3 ⛏️)</span></button>
  </div>
</div>
<script src="../shared/core.js"></script>
<script>
(function(){
"use strict";
var COLS=7, ROWS=9, N=COLS*ROWS, GAP=4;
var EMO={crown:"👑",chest:"🎁",wild:"🃏",trail:"🪙",gem:"💎"};
var SITE_NAMES=["Sandy Flats","Amber Gorge","Gilded Ruins","Crown Caverns","Lost Temple","Sunken Vault"];
var THEMES=[ /* d1 light-lit face, d4 deep shadow — deeper sites read as different earth */
  {d1:"#d3a05e",d2:"#a9743a",d3:"#8a5a28",d4:"#6e451d"},   /* sandy tan */
  {d1:"#cf7f45",d2:"#a35a26",d3:"#7c3f16",d4:"#54280c"},   /* amber / terracotta */
  {d1:"#b3a26b",d2:"#857747",d3:"#5f552f",d4:"#3f3a1e"}    /* gilded khaki ruins */
];

SB.init({title:"Treasure Dig", subtitle:"Excavation Event · Limited Time", resetKey:"treasure-dig"});

var st=SB.store("treasure-dig",{level:1,endTs:0,seeded:false,scanners:1,dyn:0,grid:null,arts:null});
var S=st.data;

if(!S.endTs){ S.endTs=Date.now()+48*3600*1000; st.save(); }
if(!S.seeded){ S.seeded=true; st.save(); SB.grantRewards([{type:"shovel",amount:10}]); SB.toast("⛺ Welcome to the dig site! +10 ⛏️ · +1 🔮 Scanner"); }

// ---------- rewards: single source of truth (display == grant) ----------
function mult(){ return Math.pow(1.5,S.level-1); }
function coinsAmt(base){ return Math.round(base*mult()/10)*10; }
function rewardsFor(art){
  switch(art.kind){
    case "crown": return [{type:"coins",amount:coinsAmt(3000)},{type:"wild",amount:2},{type:"gem",amount:5}];
    case "chest": return [{type:"coins",amount:coinsAmt(800)},{type:"draw",amount:1}];
    case "wild":  return [{type:"wild",amount:1}];
    case "gem":   return [{type:"gem",amount:Math.max(1,Math.round(mult()))}];
    case "trail": return [{type:"coins",amount:coinsAmt(150)*art.cells.length}]; // paid out per tile as dug
  }
  return [];
}
function rewardStr(art){
  return rewardsFor(art).map(function(r){ return "+"+SB.fmt(r.amount)+" "+SB.icon(r.type); }).join(" ");
}

// ---------- level generation ----------
function genLevel(){
  var cells=[],i;
  for(i=0;i<N;i++) cells.push({k:"e",a:-1,hits:0,rev:false});
  var arts=[];
  function tryPlace(w,h){
    for(var t=0;t<400;t++){
      var ww=w,hh=h;
      if(w!==h && Math.random()<0.5){ ww=h; hh=w; }
      var c0=(Math.random()*(COLS-ww+1))|0, r0=(Math.random()*(ROWS-hh+1))|0;
      var idxs=[],ok=true;
      for(var r=r0;r<r0+hh;r++)for(var c=c0;c<c0+ww;c++){
        var ix=r*COLS+c;
        if(cells[ix].k!=="e"){ok=false;break;}
        idxs.push(ix);
      }
      if(ok) return idxs;
    }
    return null;
  }
  function addArt(kind,w,h){
    var idxs=tryPlace(w,h);
    if(!idxs) return;
    var ai=arts.length;
    arts.push({kind:kind,cells:idxs,got:false});
    idxs.forEach(function(ix){ cells[ix].k="a"; cells[ix].a=ai; });
  }
  addArt("crown",3,2);
  addArt("chest",2,2);
  addArt("wild",1,2);
  addArt("trail",1,4);
  addArt("gem",1,1);
  addArt("gem",1,1);
  if(S.level>=2) addArt("gem",1,1);          // deeper sites are richer
  if(S.level>=3) addArt("trail",1,3);
  var rocks=Math.min(4+((Math.random()*3)|0)+(S.level-1),12), placed=0, guard=0;
  while(placed<rocks && guard++<600){
    var ix=(Math.random()*N)|0;
    if(cells[ix].k==="e"){ cells[ix].k="r"; placed++; }
  }
  S.grid=cells; S.arts=arts; st.save();
}
if(!S.grid||!S.arts) genLevel();

// ---------- DOM refs ----------
var gridEl=document.getElementById("grid"), wrapEl=document.getElementById("wrap");
var trayEl=document.getElementById("tray"), progTxt=document.getElementById("progTxt"), progFill=document.getElementById("progFill");
var shovelCt=document.getElementById("shovelCt"), scanCt=document.getElementById("scanCt"), dynCt=document.getElementById("dynCt");
var scanBtn=document.getElementById("scanBtn"), dynBtn=document.getElementById("dynBtn"), shovelChip=document.getElementById("shovelChip");
var tiles=[], scanMode=false, dynMode=false, busy=false;

SB.countdown(document.getElementById("cd"), S.endTs, function(){ SB.toast("Event ended — thanks for digging!"); });

// ---------- render ----------
function artBox(art){
  var rs=art.cells.map(function(ix){return (ix/COLS)|0;}), cs=art.cells.map(function(ix){return ix%COLS;});
  var r0=Math.min.apply(null,rs), c0=Math.min.apply(null,cs);
  return {r0:r0,c0:c0,w:Math.max.apply(null,cs)-c0+1,h:Math.max.apply(null,rs)-r0+1};
}
function contentFor(cell){
  if(cell.k==="a") return EMO[S.arts[cell.a].kind];
  if(cell.k==="r") return "🪨";
  return "·";
}
function buildGrid(){
  gridEl.innerHTML=""; tiles=[];
  wrapEl.querySelectorAll(".td-rowmark").forEach(function(m){m.remove();});
  for(var i=0;i<N;i++){
    var t=document.createElement("div");
    t.className="td-tile";
    t.dataset.i=i;
    var cell=S.grid[i], inner="";
    if(cell.k==="a"){
      var art=S.arts[cell.a];
      inner = (art.cells.length>1 && art.kind!=="trail")
        ? '<span class="bigart">'+EMO[art.kind]+"</span>"
        : '<span class="solo">'+EMO[art.kind]+"</span>";
    }
    t.innerHTML='<div class="td-dirt"></div><div class="td-content">'+inner+'</div><div class="td-glint">✨</div><div class="td-scan"></div>';
    gridEl.appendChild(t); tiles.push(t);
    syncTile(i);
  }
  for(var r=0;r<ROWS;r++){
    (function(row){
      var m=document.createElement("button");
      m.className="td-rowmark"; m.textContent="🧨"; m.dataset.row=row;
      m.addEventListener("click", function(e){ e.stopPropagation(); blastRow(row); });
      wrapEl.appendChild(m);
    })(r);
  }
  layoutArts();
  refreshGlints(); refreshTray(); refreshProgress(); refreshTools(); refreshSite();
}
// position multi-tile treasure sprites so each tile shows its slice of one big object
function layoutArts(){
  if(!tiles.length) return;
  var ts=tiles[0].getBoundingClientRect().width;
  if(!ts) return;
  var GAP=parseFloat(getComputedStyle(gridEl).columnGap)||4;
  S.arts.forEach(function(art){
    if(art.cells.length<2||art.kind==="trail") return;
    var b=artBox(art);
    var W=b.w*ts+(b.w-1)*GAP, H=b.h*ts+(b.h-1)*GAP;
    art.cells.forEach(function(ix){
      var sp=tiles[ix].querySelector(".bigart");
      if(!sp) return;
      var dx=(ix%COLS)-b.c0, dy=((ix/COLS)|0)-b.r0;
      sp.style.left=(-dx*(ts+GAP))+"px";
      sp.style.top=(-dy*(ts+GAP))+"px";
      sp.style.width=W+"px"; sp.style.height=H+"px";
      sp.style.fontSize=(Math.min(W,H)*0.8)+"px";
    });
  });
  var gTop=gridEl.offsetTop;
  wrapEl.querySelectorAll(".td-rowmark").forEach(function(m){
    m.style.top=(gTop + (+m.dataset.row)*(ts+GAP) + ts/2)+"px";
  });
}
window.addEventListener("resize", layoutArts);

function syncTile(i){
  var cell=S.grid[i], t=tiles[i];
  t.classList.toggle("revealed",cell.rev);
  t.classList.toggle("rockcracked",cell.k==="r"&&cell.hits===1&&!cell.rev);
  var gold=cell.rev&&cell.k==="a";
  t.classList.toggle("gold",gold&&!S.arts[cell.a].got);
  t.classList.toggle("collected",gold&&S.arts[cell.a].got);
  t.classList.toggle("rubble",cell.rev&&cell.k!=="a");
  t.classList.toggle("wasrock",cell.rev&&cell.k==="r");
}
function refreshGlints(){
  tiles.forEach(function(t){t.classList.remove("glinting");});
  S.arts.forEach(function(a){
    if(a.got) return;
    var anyRev=a.cells.some(function(ix){return S.grid[ix].rev;});
    if(!anyRev) return;
    a.cells.forEach(function(ix){
      if(S.grid[ix].rev) return;
      var r=(ix/COLS)|0, c=ix%COLS;
      var adj=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
      var near=adj.some(function(p){
        if(p[0]<0||p[0]>=ROWS||p[1]<0||p[1]>=COLS) return false;
        var j=p[0]*COLS+p[1];
        return S.grid[j].a===S.grid[ix].a && S.grid[j].rev;
      });
      if(near) tiles[ix].classList.add("glinting");
    });
  });
}
function refreshTray(){
  trayEl.innerHTML="";
  S.arts.forEach(function(a,ai){
    var d=document.createElement("div");
    d.className="td-slot"+(a.got?" got":"");
    var main=rewardsFor(a)[0];
    d.innerHTML='<span class="em">'+EMO[a.kind]+'</span><span class="rw">'+SB.fmt(main.amount)+' '+SB.icon(main.type)+'</span>';
    d.addEventListener("click",function(){
      SB.toast(EMO[a.kind]+" "+(a.got?"Excavated! ":"")+rewardStr(a)+(a.kind==="trail"?" (paid per tile)":""));
    });
    trayEl.appendChild(d);
  });
}
function refreshProgress(){
  var got=S.arts.filter(function(a){return a.got;}).length;
  progTxt.textContent=got+"/"+S.arts.length;
  progFill.style.width=(got/S.arts.length*100)+"%";
}
function refreshTools(){
  shovelCt.textContent=SB.bal("shovel");
  scanCt.textContent=S.scanners; dynCt.textContent=S.dyn;
  shovelChip.classList.toggle("zero",SB.bal("shovel")===0);
  scanBtn.classList.toggle("zero",S.scanners===0);
  dynBtn.classList.toggle("zero",S.dyn===0);
  scanBtn.classList.toggle("armed",scanMode);
  dynBtn.classList.toggle("armed-dyn",dynMode);
  wrapEl.classList.toggle("dynmode",dynMode);
}
function refreshSite(){
  var name=SITE_NAMES[(S.level-1)%SITE_NAMES.length];
  document.getElementById("siteLabel").innerHTML='<div class="nm">'+name+'</div><div class="sub">⛏️ Expedition · Site '+S.level+"</div>";
  document.getElementById("siteBadge").innerHTML="SITE<b>"+S.level+"</b>";
  var th=THEMES[(S.level-1)%THEMES.length];
  wrapEl.style.setProperty("--d1",th.d1); wrapEl.style.setProperty("--d2",th.d2);
  wrapEl.style.setProperty("--d3",th.d3); wrapEl.style.setProperty("--d4",th.d4);
}

// ---------- FX ----------
function puffAt(t){
  var p=document.createElement("div"); p.className="td-puff";
  p.style.left="calc(50% - 13px)"; p.style.top="calc(50% - 13px)";
  t.appendChild(p); setTimeout(function(){p.remove();},520);
}
function shardsAt(t){
  var wr=wrapEl.getBoundingClientRect(), tr=t.getBoundingClientRect();
  var cx=tr.left-wr.left+tr.width/2, cy=tr.top-wr.top+tr.height/2;
  for(var k=0;k<6;k++){
    var s=document.createElement("div"); s.className="td-shard";
    s.style.left=(cx-4)+"px"; s.style.top=(cy-3)+"px";
    var a=Math.random()*Math.PI*2, d=18+Math.random()*26;
    s.style.setProperty("--tx",(Math.cos(a)*d)+"px");
    s.style.setProperty("--ty",(Math.sin(a)*d-14)+"px");
    s.style.setProperty("--rot",((Math.random()*240-120)|0)+"deg");
    wrapEl.appendChild(s);
    setTimeout(function(el){return function(){el.remove();};}(s),580);
  }
}
function goldBurst(t){
  var r=t.getBoundingClientRect();
  SB.confetti(r.left+r.width/2, r.top+r.height/2, 24);
}

// ---------- dig (single delegated listener) ----------
gridEl.addEventListener("click", function(e){
  var t=e.target.closest(".td-tile");
  if(!t||busy) return;
  var i=+t.dataset.i, cell=S.grid[i];
  if(dynMode){ SB.toast("Tap a 🧨 row marker to blast a row"); return; }
  if(scanMode){ doScan(i); return; }
  if(cell.rev){ return; }
  if(SB.bal("shovel")<=0){
    t.classList.remove("sb-shake"); void t.offsetWidth; t.classList.add("sb-shake");
    shovelChip.classList.remove("sb-shake"); void shovelChip.offsetWidth; shovelChip.classList.add("sb-shake");
    SB.haptic(30); openShop(true); return;
  }
  SB.spend("shovel",1); refreshTools(); SB.haptic();
  busy=true;
  t.classList.add("cracking");
  shardsAt(t);
  setTimeout(function(){
    t.classList.remove("cracking");
    busy=false;
    if(cell.k==="r"&&cell.hits===0){
      cell.hits=1; st.save(); syncTile(i); puffAt(t);
      SB.toast("🪨 Solid rock! One more hit…");
      afterDig(); return;
    }
    revealCell(i,t);
    afterDig();
  },250);
});
function revealCell(i,t){
  var cell=S.grid[i];
  if(cell.rev) return;
  cell.rev=true; cell.hits=2;
  syncTile(i);
  if(cell.k==="a"){
    goldBurst(t); SB.haptic(25);
    var art=S.arts[cell.a];
    if(art.kind==="trail") SB.grantRewards([{type:"coins",amount:coinsAmt(150)}],t);
    refreshGlints();
    if(art.cells.every(function(ix){return S.grid[ix].rev;})) collectArt(cell.a,t);
  } else {
    puffAt(t); shardsAt(t);
  }
  st.save();
}
function collectArt(ai,originTile){
  var art=S.arts[ai];
  art.got=true; st.save();
  art.cells.forEach(syncTile);
  refreshGlints();
  // fly to tray
  var slot=trayEl.children[ai], sr=slot.getBoundingClientRect(), or_=originTile.getBoundingClientRect();
  var fly=document.createElement("div");
  fly.className="td-collect-fly"; fly.textContent=EMO[art.kind];
  fly.style.left=(or_.left+or_.width/2-15)+"px"; fly.style.top=(or_.top+or_.height/2-15)+"px";
  document.body.appendChild(fly);
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    fly.style.left=(sr.left+sr.width/2-15)+"px"; fly.style.top=(sr.top+sr.height/2-15)+"px";
    fly.style.transform="scale(.6)";
  });});
  setTimeout(function(){
    fly.remove(); refreshTray(); refreshProgress();
    if(art.kind==="crown"){ SB.confetti(); SB.toast("👑 GOLDEN CROWN excavated!"); }
    if(art.kind==="trail"){ SB.toast("🪙 Coin Trail complete!"); }
    else SB.grantRewards(rewardsFor(art),originTile);
    checkLevelDone();
  },820);
}
function afterDig(){
  refreshTools();
  if(SB.bal("shovel")===0 && !S.arts.every(function(a){return a.got;})){
    setTimeout(function(){ if(SB.bal("shovel")===0) openShop(true); },700);
  }
}

// ---------- scanner ----------
scanBtn.addEventListener("click",function(){
  dynMode=false;
  if(S.scanners<=0){ scanBtn.classList.add("sb-shake"); setTimeout(function(){scanBtn.classList.remove("sb-shake");},450); openShop(false); return; }
  scanMode=!scanMode; refreshTools();
  SB.toast(scanMode?"🔮 Scanner armed — tap any tile to scan 3×3":"Scanner disarmed");
});
function doScan(i){
  scanMode=false; S.scanners--; st.save(); refreshTools(); SB.haptic(20);
  var r0=(i/COLS)|0, c0=i%COLS, marked=[];
  for(var r=r0-1;r<=r0+1;r++)for(var c=c0-1;c<=c0+1;c++){
    if(r<0||r>=ROWS||c<0||c>=COLS) continue;
    var ix=r*COLS+c, cell=S.grid[ix];
    if(cell.rev) continue;
    tiles[ix].querySelector(".td-scan").textContent=contentFor(cell);
    tiles[ix].classList.add("scanned"); marked.push(ix);
  }
  SB.toast("🔮 Scan active for 10s");
  setTimeout(function(){ marked.forEach(function(ix){ tiles[ix].classList.remove("scanned"); }); },10000);
}

// ---------- dynamite ----------
dynBtn.addEventListener("click",function(){
  scanMode=false;
  if(S.dyn<=0){ dynBtn.classList.add("sb-shake"); setTimeout(function(){dynBtn.classList.remove("sb-shake");},450); openShop(false); return; }
  dynMode=!dynMode; refreshTools();
  SB.toast(dynMode?"🧨 Pick a row to blast!":"Dynamite stowed");
});
function blastRow(row){
  if(S.dyn<=0||busy) return;
  S.dyn--; dynMode=false; busy=true; st.save(); refreshTools(); SB.haptic(40);
  var idxs=[];
  for(var c=0;c<COLS;c++) idxs.push(row*COLS+c);
  idxs.forEach(function(ix,k){
    setTimeout(function(){ tiles[ix].classList.add("blast"); shardsAt(tiles[ix]); },k*35);
  });
  var mid=tiles[idxs[3]].getBoundingClientRect();
  SB.confetti(mid.left+mid.width/2, mid.top+mid.height/2, 50);
  setTimeout(function(){
    idxs.forEach(function(ix){
      tiles[ix].classList.remove("blast");
      revealCell(ix,tiles[ix]);
    });
    busy=false; refreshTools();
  },480);
}

// ---------- shop (contextual out-of-shovels sheet) ----------
var shopEl=null;
function crownState(){
  var crown=null;
  S.arts.forEach(function(a){ if(a.kind==="crown"&&!a.got) crown=a; });
  if(!crown) return {eligible:false};
  var rev=crown.cells.filter(function(ix){return S.grid[ix].rev;}).length;
  return {eligible:(rev/crown.cells.length)>=0.6, rev:rev, left:crown.cells.length-rev};
}
function closeShop(){
  if(!shopEl) return;
  var s=shopEl; shopEl=null;
  s.classList.remove("open"); setTimeout(function(){s.remove();},300);
}
function openShop(auto){
  if(shopEl) return;
  var cs=crownState();
  var html='<div class="sb-sheet">'
    +'<h3>'+(auto?"Out of shovels!":"Dig Site Shop")+'</h3>'
    +'<div class="sb-sheet-sub">'+(auto?"Your treasures are still down there…":"Stock up and keep digging")+'</div>';
  if(cs.eligible){
    html+='<button class="td-offer hero" data-buy="crown"><span class="ico">👑</span>'
      +'<span class="txt"><b>Only '+cs.left+' dig'+(cs.left>1?"s":"")+' from the Crown!</b><span>Finish it now — 6 ⛏️ + 1 🔮 Scanner included</span></span>'
      +'<span class="price">$2.99</span></button>';
  }
  html+='<button class="td-offer" data-buy="shovels"><span class="ico">⛏️</span>'
    +'<span class="txt"><b>12 Shovels</b><span>Keep the dig going</span></span><span class="price">$1.99</span></button>'
    +'<button class="td-offer" data-buy="scanner"><span class="ico">🔮</span>'
    +'<span class="txt"><b>Scanner</b><span>Tap a tile → see a 3×3 area for 10s</span></span><span class="price">$0.99</span></button>'
    +'<button class="td-offer" data-buy="dyn"><span class="ico">🧨</span>'
    +'<span class="txt"><b>Dynamite Pack</b><span>3 dynamite (blast full rows, breaks rock!) + 12 ⛏️</span></span><span class="price">$4.99</span></button>'
    +'<button class="sb-sheet-cancel" id="td-shop-cancel">No thanks</button></div>';
  var bd=document.createElement("div");
  bd.className="sb-sheet-backdrop"; bd.innerHTML=html;
  document.body.appendChild(bd); shopEl=bd;
  requestAnimationFrame(function(){requestAnimationFrame(function(){bd.classList.add("open");});});
  bd.addEventListener("click",function(e){ if(e.target===bd) closeShop(); });
  bd.querySelector("#td-shop-cancel").addEventListener("click",closeShop);
  bd.querySelectorAll(".td-offer").forEach(function(btn){
    btn.addEventListener("click",function(){
      var what=btn.dataset.buy;
      closeShop();
      setTimeout(function(){ launchIAP(what); },250);
    });
  });
}
function launchIAP(what){
  if(what==="crown"){
    SB.buyIAP({label:"👑 Finish the Crown!",price:"$2.99",sub:"The Golden Crown is almost yours — don't stop now!",
      contents:[{type:"shovel",amount:6}],
      onSuccess:function(){ S.scanners++; st.save(); refreshTools(); SB.toast("🔮 +1 Scanner — the crown awaits!"); }});
  } else if(what==="shovels"){
    SB.buyIAP({label:"⛏️ 12 Shovels",price:"$1.99",sub:"Straight back to the dig",
      contents:[{type:"shovel",amount:12}],
      onSuccess:function(){ refreshTools(); }});
  } else if(what==="scanner"){
    SB.buyIAP({label:"🔮 Scanner",price:"$0.99",sub:"Reveal a 3×3 area's secrets for 10 seconds",
      contents:[],
      onSuccess:function(){ S.scanners++; st.save(); scanMode=true; refreshTools(); SB.toast("🔮 Scanner armed — tap any tile!"); }});
  } else if(what==="dyn"){
    SB.buyIAP({label:"🧨 Dynamite Pack",price:"$4.99",sub:"3 dynamite + 12 shovels — clear whole rows",
      contents:[{type:"shovel",amount:12}],
      onSuccess:function(){ S.dyn+=3; st.save(); refreshTools(); SB.toast("🧨 +3 Dynamite!"); }});
  }
}
document.getElementById("shopBtn").addEventListener("click",function(){ openShop(false); });
shovelChip.addEventListener("click",function(){ if(SB.bal("shovel")===0) openShop(true); });

// ---------- level complete ----------
function checkLevelDone(){
  if(!S.arts.every(function(a){return a.got;})) return;
  SB.confetti(); SB.haptic(40);
  var emos=S.arts.map(function(a){return EMO[a.kind];}).join(""), count=S.arts.length;
  setTimeout(function(){
    var m=SB.modal(
      '<div style="font-size:44px;">🏆</div>'
      +'<h3 style="margin:6px 0 4px;">Site '+S.level+' Cleared!</h3>'
      +'<p class="sb-muted" style="margin:0 0 10px;font-size:13px;">All '+count+' treasures excavated at '+SITE_NAMES[(S.level-1)%SITE_NAMES.length]+'.</p>'
      +'<div style="font-size:26px;letter-spacing:6px;margin-bottom:12px;">'+emos+'</div>'
      +'<p style="font-size:12.5px;color:#5a6b8c;margin:0 0 12px;">Site '+(S.level+1)+' is richer: rewards ×1.5 and more treasure, but rockier ground…</p>'
      +'<button class="sb-btn sb-btn-yellow sb-btn-block" id="digDeeper">⛏️ Dig Deeper → Site '+(S.level+1)+'</button>'
    );
    m.el.querySelector("#digDeeper").addEventListener("click",function(){
      m.close();
      S.level++; genLevel(); buildGrid();
      SB.grantRewards([{type:"shovel",amount:5}]);
      SB.toast("⛺ Site "+S.level+" — bonus +5 shovels!");
    });
  },900);
}

// ---------- earn button ----------
var earnBtn=document.getElementById("earnBtn");
earnBtn.addEventListener("click",function(){
  if(earnBtn.disabled) return;
  earnBtn.disabled=true;
  var orig=earnBtn.innerHTML;
  earnBtn.innerHTML="🎴 Dealing cards…";
  setTimeout(function(){
    earnBtn.innerHTML="✓ Level won!";
    earnBtn.classList.add("sb-bounce");
    SB.grantRewards([{type:"shovel",amount:3}],earnBtn);
    SB.confetti(window.innerWidth/2, window.innerHeight-120, 30);
    refreshTools();
    setTimeout(function(){ earnBtn.innerHTML=orig; earnBtn.disabled=false; earnBtn.classList.remove("sb-bounce"); },900);
  },550);
});

// ---------- info ----------
document.getElementById("infoBtn").addEventListener("click",function(){
  SB.modal(
    '<div style="font-size:38px;">⛏️👑</div><h3 style="margin:6px 0 8px;">Treasure Dig</h3>'
    +'<p style="font-size:13.5px;line-height:1.5;text-align:left;color:var(--sb-ink);margin:0 0 10px;">'
    +'Each tap spends a <b>shovel</b> to break dirt and reveal what\'s buried — treasures, coin trails, gems, or stubborn <b>rocks that take two hits</b>. '
    +'Uncover part of a treasure and its buried neighbors <b>sparkle</b>, showing where to dig next. Fully uncover a treasure to collect its reward (tap its tray icon to preview). '
    +'The <b>🔮 Scanner</b> peeks at a 3×3 area; <b>🧨 Dynamite</b> blasts a whole row, rock and all. '
    +'Clear every treasure to descend to a <b>deeper, richer site</b> (rewards ×1.5, more treasure, rockier ground). '
    +'Out of shovels? Buy more, or win a regular Skip-Bo level for <b>+3 ⛏️</b>.</p>'
    +'<p style="font-size:11px;line-height:1.45;text-align:left;color:#5a6b8c;margin:0 0 12px;">Demo note: contextual offers (shovels, scanner, dynamite — plus a "Finish the Crown" bundle once the grand prize is ≥60% uncovered) surface exactly when shovels run out, at the moment of highest investment.</p>'
    +'<button class="sb-btn sb-btn-blue sb-btn-block" onclick="this.closest(\'.sb-modal-backdrop\').remove()">Got it</button>'
  );
});

buildGrid();
})();
</script>
