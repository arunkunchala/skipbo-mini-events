<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Double-or-Nothing Dash</title>
<link rel="stylesheet" href="../shared/core.css">
<style>
/* ---------- layout ---------- */
.sb-main { display:flex; flex-direction:column; }
.dash-top { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.day-chip {
  display:inline-block; white-space:nowrap;
  background:rgba(255,199,44,0.92); color:var(--sb-ink);
  font-weight:900; font-size:11.5px; border-radius:999px; padding:4px 10px;
  box-shadow:var(--sb-shadow);
}
.info-btn {
  margin-left:auto; width:44px; height:44px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.18); color:#fff; font-size:19px; font-weight:900;
  cursor:pointer; display:grid; place-items:center; flex:0 0 auto;
}
.info-btn:active { transform:scale(0.92); }

/* ---------- lava arena ---------- */
.arena {
  position:relative; border-radius:18px; overflow:hidden; margin-bottom:9px;
  flex:1 1 auto; max-height:430px; display:flex; flex-direction:column;
  padding:10px 12px 12px; box-shadow:var(--sb-shadow);
  background:linear-gradient(180deg,#340b06 0%,#5e1108 34%,#9c1f0a 72%,#d43d0a 100%);
  border:2px solid rgba(0,0,0,0.35);
}
.arena::before {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(70px 26px at 18% 92%, rgba(255,170,40,0.55), transparent 70%),
    radial-gradient(90px 30px at 78% 86%, rgba(255,120,20,0.45), transparent 70%),
    radial-gradient(60px 22px at 48% 96%, rgba(255,200,70,0.4), transparent 70%);
  animation:lavaGlow 3.2s ease-in-out infinite alternate;
}
@keyframes lavaGlow { from { opacity:0.5; transform:translateY(0);} to { opacity:1; transform:translateY(-5px);} }
.bubble { position:absolute; bottom:-12px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffd769, #ff7a1a 70%); opacity:0.8; animation:bub 4.4s linear infinite; pointer-events:none; }
@keyframes bub { 0% { transform:translateY(0) scale(1); opacity:0.85; } 100% { transform:translateY(-230px) scale(0.25); opacity:0; } }
.arena.hurt { animation:sbShake 0.5s; }
.hurt-flash {
  position:absolute; inset:0; pointer-events:none; opacity:0; z-index:8;
  background:radial-gradient(120% 90% at 50% 100%, rgba(255,60,30,0.85), rgba(120,0,0,0) 70%);
}
.arena.hurt .hurt-flash { animation:hurtFlash 0.9s ease-out; }
@keyframes hurtFlash { 0% { opacity:0; } 12% { opacity:1; } 100% { opacity:0; } }

.goal-line {
  position:relative; z-index:3; text-align:center; font-size:10.5px; font-weight:900;
  letter-spacing:0.6px; flex:0 0 auto; white-space:nowrap; color:#ffe9a8; text-shadow:0 1px 3px rgba(0,0,0,0.75);
}
.goal-line b { color:#fff; }

/* ---------- chest (8 visual states: 0..7 fill + crack) ---------- */
.chest-wrap { position:relative; z-index:3; flex:1 1 auto; min-height:126px; display:grid; place-items:center; margin:2px 0 0; }
.aura {
  position:absolute; width:180px; height:130px; border-radius:50%;
  background:radial-gradient(ellipse at 50% 55%, rgba(255,226,122,0.85), rgba(255,180,40,0.28) 45%, transparent 72%);
  opacity:0; transition:opacity 0.55s; filter:blur(2px);
}
.rays {
  position:absolute; width:250px; height:250px; opacity:0; transform:scale(0.4);
  background:conic-gradient(from 0deg, rgba(255,240,180,0.85) 0 6deg, transparent 6deg 30deg,
             rgba(255,240,180,0.7) 30deg 36deg, transparent 36deg 60deg,
             rgba(255,240,180,0.85) 60deg 66deg, transparent 66deg 90deg,
             rgba(255,240,180,0.7) 90deg 96deg, transparent 96deg 120deg,
             rgba(255,240,180,0.85) 120deg 126deg, transparent 126deg 150deg,
             rgba(255,240,180,0.7) 150deg 156deg, transparent 156deg 180deg,
             rgba(255,240,180,0.85) 180deg 186deg, transparent 186deg 210deg,
             rgba(255,240,180,0.7) 210deg 216deg, transparent 216deg 240deg,
             rgba(255,240,180,0.85) 240deg 246deg, transparent 246deg 270deg,
             rgba(255,240,180,0.7) 270deg 276deg, transparent 276deg 300deg,
             rgba(255,240,180,0.85) 300deg 306deg, transparent 306deg 330deg,
             rgba(255,240,180,0.7) 330deg 336deg, transparent 336deg 360deg);
  -webkit-mask-image:radial-gradient(circle, #000 12%, transparent 62%);
  mask-image:radial-gradient(circle, #000 12%, transparent 62%);
  pointer-events:none;
}
.chest {
  position:relative; width:138px; height:108px; z-index:4; perspective:420px;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,0.55));
  transform-origin:50% 100%;
  animation:chestBob 2.6s ease-in-out infinite;
}
@keyframes chestBob { 0%,100% { transform:translateY(0);} 50% { transform:translateY(-4px);} }
.chest .base {
  position:absolute; left:7px; bottom:0; width:124px; height:64px; overflow:hidden;
  background:linear-gradient(180deg,#8a4d1c 0%,#6b3a12 55%,#4d2709 100%);
  border:3px solid #331803; border-radius:5px 5px 12px 12px;
  box-shadow:inset 0 -6px 10px rgba(0,0,0,0.45), inset 0 4px 6px rgba(255,190,120,0.18);
}
.chest .gold {
  position:absolute; left:0; right:0; bottom:0; height:0%;
  background:linear-gradient(180deg,#fff3b0 0%,#ffd34d 40%,#e0a400 100%);
  transition:height 0.55s cubic-bezier(0.34,1.4,0.64,1);
  box-shadow:0 0 14px rgba(255,214,80,0.9);
}
.chest .gold::after {
  content:""; position:absolute; left:0; right:0; top:-3px; height:6px;
  background:radial-gradient(closest-side, #fff8d0, transparent 75%);
  animation:sbPulse 1.4s ease-in-out infinite;
}
.chest .strap {
  position:absolute; bottom:0; width:14px; height:64px; z-index:2;
  background:linear-gradient(90deg,#c99a3c,#8a6200 60%,#5c4100);
  border-left:1.5px solid #331803; border-right:1.5px solid #331803;
}
.chest .strap.l { left:25px; } .chest .strap.r { right:25px; }
.chest .lid {
  position:absolute; left:0; top:0; width:138px; height:48px; z-index:3;
  background:linear-gradient(180deg,#b4712f 0%,#96551d 55%,#6b3a12 100%);
  border:3px solid #331803; border-radius:16px 16px 4px 4px;
  transform-origin:50% 100%;
  transform:rotateX(calc(var(--k,0) * 4.4deg)) translateY(calc(var(--k,0) * -0.9px));
  transition:transform 0.55s cubic-bezier(0.34,1.5,0.64,1);
  box-shadow:inset 0 4px 6px rgba(255,200,140,0.22);
}
.chest .lid .band { position:absolute; bottom:0; width:13px; height:100%; background:linear-gradient(90deg,#c99a3c,#8a6200 60%,#5c4100); border-left:1.5px solid #331803; border-right:1.5px solid #331803; }
.chest .lid .band { width:14px; }
.chest .lid .band.l { left:22px; } .chest .lid .band.r { right:22px; }
.chest .seam {
  position:absolute; left:9px; right:9px; top:45px; height:7px; z-index:5; border-radius:4px;
  background:linear-gradient(90deg, transparent, #fff6c4 20%, #ffd34d 50%, #fff6c4 80%, transparent);
  opacity:calc(var(--k,0) / 7 * 0.95); filter:blur(1px);
  transition:opacity 0.5s;
}
.chest .lock {
  position:absolute; left:50%; top:35px; transform:translateX(-50%); z-index:6;
  width:24px; height:26px; background:linear-gradient(180deg,#ffe27a,#e0a400);
  border:2.5px solid #6b4a00; border-radius:6px; font-size:11px; text-align:center; line-height:23px;
  transition:opacity 0.3s, transform 0.4s;
}
.chest .crackmark {
  position:absolute; left:50%; top:8px; transform:translateX(-50%); z-index:6;
  width:70px; height:26px; opacity:0; transition:opacity 0.4s;
  background:
    linear-gradient(72deg, transparent 46%, #fff3b0 47%, #fff3b0 52%, transparent 53%),
    linear-gradient(-58deg, transparent 60%, #ffe27a 61%, #ffe27a 65%, transparent 66%);
  filter:drop-shadow(0 0 4px rgba(255,220,120,0.9));
}
.chest.s5 { animation:chestBob 2.6s ease-in-out infinite, strainA 0.42s ease-in-out infinite; }
.chest.s6 { animation:chestBob 2.6s ease-in-out infinite, strainB 0.24s ease-in-out infinite; }
@keyframes strainA { 0%,100% { transform:translateX(0) rotate(0);} 50% { transform:translateX(1.5px) rotate(0.5deg);} }
@keyframes strainB { 0%,100% { transform:translateX(-2.5px) rotate(-1deg);} 50% { transform:translateX(2.5px) rotate(1deg);} }
.chest.s5 .crackmark { opacity:0.55; }
.chest.s6 .crackmark { opacity:1; animation:sbPulse 0.5s infinite; }
.chest.slam { animation:slamShut 0.5s ease-out; }
@keyframes slamShut { 0% { transform:scale(1.06) translateY(-4px);} 35% { transform:scale(0.9) translateY(4px);} 100% { transform:scale(1) translateY(0);} }
.chest.crack { animation:none; transform:scale(1.06); }
.chest.crack .lid { transform:rotateX(66deg) translateY(-14px); }
.chest.crack .lock { opacity:0; transform:translate(-50%,26px) rotate(40deg); }
.chest.crack .crackmark { opacity:0; }
.chest.crack + .aura, .chest-wrap.won .aura { opacity:1; }
.chest-wrap.won .rays { opacity:0.75; transform:scale(1); animation:spin 9s linear infinite; transition:opacity 0.6s, transform 0.6s; }
@keyframes spin { to { transform:scale(1) rotate(360deg); } }
.coin-pop { position:absolute; z-index:7; font-size:20px; pointer-events:none; animation:coinPop 1.1s ease-out forwards; }
@keyframes coinPop {
  0% { transform:translate(0,0) scale(0.5); opacity:0; }
  20% { opacity:1; }
  100% { transform:translate(var(--dx,0), var(--dy,-70px)) scale(1.15) rotate(220deg); opacity:0; }
}

.prize-row { position:relative; z-index:3; display:flex; gap:6px; justify-content:center; margin:5px 0 0; flex:0 0 auto; }
.prize-chip {
  background:rgba(0,0,0,0.42); border:1.5px solid rgba(255,199,44,0.75); color:#ffe27a;
  border-radius:999px; padding:3px 10px; font-size:12px; font-weight:900;
  text-shadow:0 1px 2px rgba(0,0,0,0.6);
}

/* ---------- plank bridge ---------- */
.planks { position:relative; z-index:3; display:flex; gap:4px; flex:0 0 auto; margin-top:4px; }
.plank {
  flex:1 1 0; min-width:0; height:54px; border-radius:8px; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(180deg,#f4f6fb,#c3cad9); border:2px solid #21304d;
  box-shadow:0 4px 0 rgba(0,0,0,0.45); color:var(--sb-ink);
  transition:transform 0.3s, opacity 0.3s, background 0.3s;
}
.plank .n { font-size:16px; font-weight:900; line-height:1; }
.plank .h { font-size:7.5px; font-weight:900; letter-spacing:0.4px; color:var(--sb-red); margin-top:2px; }
.plank.done { background:linear-gradient(180deg,#fff0ae,#ffc72c); border-color:#7a5800; box-shadow:0 4px 0 rgba(80,52,0,0.6), 0 0 12px rgba(255,199,44,0.65); }
.plank.done .n::after { content:"✓"; display:block; font-size:9px; color:#7a5800; }
.plank.cur { border-color:#fff; animation:curPulse 1.05s ease-in-out infinite; }
@keyframes curPulse {
  0%,100% { box-shadow:0 4px 0 rgba(0,0,0,0.45), 0 0 0 0 rgba(255,255,255,0.9); }
  50% { box-shadow:0 4px 0 rgba(0,0,0,0.45), 0 0 0 7px rgba(255,255,255,0); }
}
.plank.lock {
  background:linear-gradient(180deg,#8992a6,#5a6379); color:rgba(255,255,255,0.8);
  border-color:#1b2438; box-shadow:0 4px 0 rgba(0,0,0,0.5);
}
.plank.lock .h { color:#ffd0d6; }
.plank.hard { background:linear-gradient(180deg,#ffe3e7,#f3b3bc); }
.plank.hard.lock { background:linear-gradient(180deg,#8f7d86,#5f4e57); }
.plank.hard.done { background:linear-gradient(180deg,#fff0ae,#ffc72c); }
.plank.crumble { animation:crumbleFall 0.75s ease-in forwards; }
@keyframes crumbleFall {
  0% { transform:translateY(0) rotate(0); opacity:1; }
  25% { transform:translateY(5px) rotate(-5deg); }
  100% { transform:translateY(90px) rotate(24deg) scale(0.65); opacity:0; }
}
.planks.rebuild .plank { animation:regrow 0.45s backwards; }
@keyframes regrow { from { transform:translateY(26px) scale(0.8); opacity:0; } }
.runner {
  position:absolute; left:50%; top:-30px; transform:translateX(-50%);
  font-size:22px; z-index:6; pointer-events:none;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,0.55));
  animation:hop 1.1s ease-in-out infinite;
}
@keyframes hop { 0%,100% { transform:translateX(-50%) translateY(0);} 50% { transform:translateX(-50%) translateY(-5px);} }
.runner .you {
  position:absolute; left:50%; top:-11px; transform:translateX(-50%);
  font-size:7.5px; font-weight:900; letter-spacing:0.8px; color:#fff;
  background:var(--sb-blue); border-radius:999px; padding:1px 5px; border:1px solid #fff;
}
.runner.fall { animation:runnerFall 0.85s ease-in forwards; }
@keyframes runnerFall { to { transform:translateX(-50%) translateY(120px) rotate(170deg); opacity:0; } }
.lost-stamp {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-11deg) scale(0.4);
  z-index:9; font-size:26px; font-weight:900; letter-spacing:2px; color:#fff;
  background:rgba(215,38,61,0.94); border:3px solid #fff; border-radius:12px;
  padding:6px 14px; opacity:0; pointer-events:none; text-shadow:0 2px 4px rgba(0,0,0,0.5);
  animation:stamp 1.15s ease-out forwards;
}
@keyframes stamp {
  0% { opacity:0; transform:translate(-50%,-50%) rotate(-11deg) scale(1.9); }
  18% { opacity:1; transform:translate(-50%,-50%) rotate(-11deg) scale(1); }
  75% { opacity:1; }
  100% { opacity:0; transform:translate(-50%,-50%) rotate(-11deg) scale(1.05); }
}

/* ---------- streak meter + pips ---------- */
.meter { margin-bottom:9px; padding:8px 11px; border-radius:14px; background:rgba(0,0,0,0.32); border:1.5px solid rgba(255,255,255,0.16); }
.meter-row { display:flex; align-items:center; gap:8px; color:#fff; font-weight:900; font-size:11px; letter-spacing:0.6px; }
.pips { display:flex; gap:5px; margin-left:auto; }
.pip {
  width:15px; height:15px; border-radius:50%; background:rgba(255,255,255,0.14);
  border:2px solid rgba(255,255,255,0.4); transition:all 0.3s;
}
.pip.on {
  background:radial-gradient(circle at 35% 30%, #fff3b0, var(--sb-yellow) 70%);
  border-color:#fff; box-shadow:0 0 9px rgba(255,199,44,0.95);
  transform:scale(1.12);
}
.pip.next { border-color:#fff; animation:sbPulse 1.1s infinite; }
.meter-txt { margin-top:5px; font-size:11px; font-weight:800; color:var(--sb-sky-light); min-height:14px; }
.meter-txt.hot { color:#ffb3bd; animation:sbPulse 0.9s infinite; }
.meter-n { font-size:14px; color:var(--sb-yellow); }

/* ---------- CTA ---------- */
.cta-zone { margin-bottom:8px; }
.cta-zone .sb-btn { min-height:54px; font-size:16px; }
.cta-zone .sb-btn small { font-weight:700; font-size:11px; opacity:0.9; }
.loss-opts { display:flex; flex-direction:column; gap:7px; }
.or-line { text-align:center; color:rgba(255,255,255,0.7); font-size:10.5px; font-weight:900; letter-spacing:1.2px; }
.rule-strip {
  display:block;
  background:rgba(0,0,0,0.3); border:1.5px dashed rgba(255,199,44,0.6);
  border-radius:12px; padding:7px 10px; margin-bottom:9px;
  color:#ffe9a8; font-size:11px; font-weight:800; line-height:1.35; text-align:center;
}
.cool-note { text-align:center; color:var(--sb-sky-light); font-size:11px; font-weight:800; margin-top:6px; }

/* ---------- stats ---------- */
.stats { display:flex; gap:6px; padding:9px 8px; }
.stats div { flex:1; text-align:center; min-width:0; }
.stats b { display:block; font-size:17px; color:var(--sb-blue); }
.stats small { font-size:8.5px; font-weight:800; letter-spacing:0.3px; color:#5a6b8c; }

/* ---------- sheets / modal ---------- */
.sheet-opt { width:100%; margin-bottom:8px; min-height:52px; }
.pity-note { font-size:11px; font-weight:700; color:#5a6b8c; text-align:center; margin-top:2px; line-height:1.4; }
.free-badge { display:inline-block; background:rgba(0,0,0,0.4); color:#fff; border:1px solid rgba(255,255,255,0.5); border-radius:999px; font-size:10px; font-weight:900; padding:2px 8px; letter-spacing:0.5px; }
.prize-card {
  background:linear-gradient(180deg,#2a5cb0,#1D4FA1); color:#fff; border-radius:14px;
  padding:12px; margin:10px 0; border:2px solid var(--sb-yellow);
}
.rules-list { text-align:left; font-size:12.5px; line-height:1.5; color:var(--sb-ink); padding-left:20px; margin:0 0 12px; }
.rules-list li { margin-bottom:6px; }
.demo-line { font-size:11px; color:#5a6b8c; font-weight:700; margin-top:8px; }
</style>
</head>
<body>
<div class="sb-app">
<div class="sb-main">

  <div class="dash-top">
    <span class="sb-timer-chip">⏳ <span id="cd">–</span></span>
    <span class="day-chip">DAY <span id="dayN">1</span> · TRY <span id="tryN">1</span></span>
    <button class="info-btn" id="infoBtn" aria-label="How it works">ⓘ</button>
  </div>

  <div class="arena" id="arena">
    <div class="hurt-flash"></div>
    <div class="goal-line">🌋 DAILY JACKPOT · <b>7 IN A ROW, FIRST TRY</b></div>
    <div class="prize-row">
      <span class="prize-chip">🪙 1,500</span>
      <span class="prize-chip">🃏 2 Wilds</span>
    </div>
    <div class="chest-wrap" id="chestWrap">
      <div class="rays"></div>
      <div class="aura"></div>
      <div class="chest" id="chest">
        <div class="base"><div class="gold" id="gold"></div><div class="strap l"></div><div class="strap r"></div></div>
        <div class="lid"><div class="band l"></div><div class="band r"></div></div>
        <div class="seam"></div>
        <div class="crackmark"></div>
        <div class="lock">🔒</div>
      </div>
    </div>
    <div class="planks" id="planks"></div>
  </div>

  <div class="meter">
    <div class="meter-row">🔥 FIRST-TRY STREAK <span class="meter-n" id="meterN">0/7</span>
      <div class="pips" id="pips"></div>
    </div>
    <div class="meter-txt" id="meterTxt"></div>
  </div>

  <div class="cta-zone" id="cta"></div>
  <div class="rule-strip" id="ruleStrip">⚠ One loss resets the chest to <b>0</b> — replays are always <b>FREE &amp; unlimited</b></div>

  <div class="sb-panel stats">
    <div><b id="stBest">0</b><small>BEST STREAK</small></div>
    <div><b id="stJack">0</b><small>JACKPOTS</small></div>
    <div><b id="stTok">0</b><small>REWINDS</small></div>
    <div><b id="stCoins">0</b><small>COINS TODAY</small></div>
  </div>

</div>
</div>
<script src="../shared/core.js"></script>
<script src="../shared/levelsim.js"></script>
<script>
(function () {
  "use strict";
  SB.init({
    title: "Double-or-Nothing Dash",
    subtitle: "7 levels in a row, first try — crack the jackpot",
    resetKey: "double-or-nothing-dash"
  });

  // ---------- tunables (all shown to the player in the rules modal) ----------
  var GOAL = 7;
  var ODDS = 0.78;          // normal level
  var ODDS_HARD = 0.62;     // hard level (steps 6 & 7)
  var HARD_STEPS = { 6: 1, 7: 1 };
  var COIN_LVL = 25;        // fuel: paid per main-level clear
  var COIN_HARD = 50;       // hard levels pay 2x
  var JACK_COINS = 1500;
  var JACK_WILDS = 2;
  var DAY_MS = 24 * 3600e3;
  var TOKEN_AT = 5;         // free pity Rewind at this streak

  var S = SB.store("double-or-nothing-dash", {
    day: 1, tryN: 1, streak: 0, lostStreak: 0, broken: false, brokeAt: 0,
    breakId: 0, rewoundBreak: -1,
    best: 0, jackpots: 0, token: 0, tokenEarned: false,
    coinsToday: 0, endTs: 0, done: false, pending: null, attempt: null,
    nextLevel: 214
  });
  var st = S.data;

  var bootRollover = false;

  // migrate/repair any older or corrupt payload so the demo can never boot broken
  (function repair() {
    var ints = ["day", "tryN", "streak", "lostStreak", "brokeAt", "breakId", "best",
      "jackpots", "token", "coinsToday", "nextLevel"];
    ints.forEach(function (k) { if (typeof st[k] !== "number" || !isFinite(st[k]) || st[k] < 0) st[k] = 0; });
    if (st.day < 1) st.day = 1;
    if (st.tryN < 1) st.tryN = 1;
    if (st.nextLevel < 1) st.nextLevel = 214;
    if (st.streak > GOAL) st.streak = GOAL;
    if (typeof st.rewoundBreak !== "number") st.rewoundBreak = -1;
    st.broken = !!st.broken; st.done = !!st.done; st.tokenEarned = !!st.tokenEarned;
    if (st.endTs && st.endTs <= Date.now()) bootRollover = true;   // day elapsed while away
    if (!st.endTs || st.endTs <= Date.now()) st.endTs = Date.now() + DAY_MS;
    S.save();
  })();

  var FAST = !!window.__forceInstant;   // __forceInstant: collapses all demo animation delays
  var busy = false;              // a level or a scripted animation is running
  var animating = false;
  var sheetEl = null, sheetActed = false;
  var offerLatch = false;        // guards the Rewind purchase flow
  var cdIv = null;
  var pipsEl = document.getElementById("pips");
  var planksEl = document.getElementById("planks");
  var chestEl = document.getElementById("chest");

  function ms(n) { return FAST ? 0 : n; }
  function isHard(step) { return !!HARD_STEPS[step]; }

  // ---------- static build ----------
  (function build() {
    var h = "";
    for (var i = 1; i <= GOAL; i++) {
      h += '<div class="plank' + (isHard(i) ? " hard" : "") + '" data-i="' + i + '">' +
        '<span class="n">' + i + "</span>" +
        (isHard(i) ? '<span class="h">HARD</span>' : "") + "</div>";
    }
    planksEl.innerHTML = h;
    var p = "";
    for (var j = 1; j <= GOAL; j++) p += '<span class="pip" data-i="' + j + '"></span>';
    pipsEl.innerHTML = p;
    for (var b = 0; b < 5; b++) {
      var bub = document.createElement("div");
      bub.className = "bubble";
      bub.style.left = (9 + b * 20) + "%";
      bub.style.width = bub.style.height = (6 + (b % 3) * 5) + "px";
      bub.style.animationDelay = (b * 0.9) + "s";
      document.getElementById("arena").appendChild(bub);
    }
  })();

  var runnerEl = document.createElement("div");
  runnerEl.className = "runner";
  runnerEl.innerHTML = '<span class="you">YOU</span>🏃';

  // ---------- render ----------
  function render() {
    document.getElementById("dayN").textContent = st.day;
    document.getElementById("tryN").textContent = st.tryN;
    document.getElementById("stBest").textContent = st.best;
    document.getElementById("stJack").textContent = st.jackpots;
    document.getElementById("stTok").textContent = st.token;
    document.getElementById("stCoins").textContent = SB.fmt(st.coinsToday);

    var k = st.done ? GOAL : st.streak;

    // chest: 8 distinct states (0..7) + cracked
    chestEl.style.setProperty("--k", k);
    document.getElementById("gold").style.height = Math.round(k / GOAL * 100) + "%";
    chestEl.classList.remove("s5", "s6", "crack", "slam");
    document.getElementById("chestWrap").classList.toggle("won", !!st.done);
    if (st.done) chestEl.classList.add("crack");
    else if (k === 6) chestEl.classList.add("s6");
    else if (k === 5) chestEl.classList.add("s5");

    // planks
    if (!animating) {
      planksEl.querySelectorAll(".plank").forEach(function (pl) {
        var i = +pl.getAttribute("data-i");
        pl.classList.remove("done", "cur", "lock", "crumble");
        pl.style.removeProperty("animation-delay");
        if (st.done || i <= st.streak) pl.classList.add("done");
        else if (i === st.streak + 1 && !st.broken) pl.classList.add("cur");
        else pl.classList.add("lock");
      });
      var host = st.done
        ? planksEl.querySelector('.plank[data-i="' + GOAL + '"]')
        : planksEl.querySelector('.plank[data-i="' + Math.min(GOAL, st.streak + 1) + '"]');
      runnerEl.classList.remove("fall");
      runnerEl.style.display = st.broken ? "none" : "";
      if (host) host.appendChild(runnerEl);
    }

    // pips + meter
    pipsEl.querySelectorAll(".pip").forEach(function (pp) {
      var i = +pp.getAttribute("data-i");
      pp.classList.toggle("on", st.done || i <= st.streak);
      pp.classList.toggle("next", !st.done && !st.broken && i === st.streak + 1);
    });
    document.getElementById("meterN").textContent = (st.done ? GOAL : st.streak) + "/" + GOAL;

    var txt = document.getElementById("meterTxt");
    txt.classList.remove("hot");
    if (st.done) txt.textContent = "🏆 Jackpot cracked today — the chest refills tomorrow.";
    else if (st.broken) {
      txt.textContent = "💥 Lost at level " + st.brokeAt + " — streak reset to 0" +
        (st.lostStreak > 0 ? " (was " + st.lostStreak + ")." : ".");
      txt.classList.add("hot");
    } else if (st.streak === 0) txt.textContent = "Every level must be cleared on the FIRST try. One loss = back to 0.";
    else if (st.streak < 3) txt.textContent = "Warming up — " + (GOAL - st.streak) + " more first-try clears.";
    else if (st.streak < TOKEN_AT) txt.textContent = "🔥 Heating up! Reach " + TOKEN_AT + " for a FREE Rewind token.";
    else if (st.streak === TOKEN_AT) txt.textContent = "🎫 Free Rewind secured. Two hard levels stand between you and the chest.";
    else { txt.textContent = "⚠ ALL-OR-NOTHING — one loss burns all " + st.streak + "!"; txt.classList.add("hot"); }

    // CTA (skipped mid-animation: the loss sheet arrives when the bridge finishes falling)
    if (animating) return;
    var cta = document.getElementById("cta");
    var strip = document.getElementById("ruleStrip");
    cta.innerHTML = "";
    if (st.pending) {
      cta.innerHTML = '<button class="sb-btn sb-btn-yellow sb-btn-block" id="claimBtn">🎁 Collect your jackpot</button>';
      cta.querySelector("#claimBtn").addEventListener("click", function () { jackpotModal(); });
      strip.innerHTML = "🏆 Jackpot won — tap to collect. Nothing expires.";
    } else if (st.done) {
      cta.innerHTML = '<button class="sb-btn sb-btn-blue sb-btn-block" id="nextDayBtn">🌅 Skip to tomorrow’s chest <small>(demo)</small></button>' +
        '<div class="cool-note" id="coolNote">Cooldown: one jackpot per day · next chest in <span id="cd2">–</span></div>';
      cta.querySelector("#nextDayBtn").addEventListener("click", once(newDay));
      strip.innerHTML = "✅ Day " + st.day + " complete — you kept every coin you earned today.";
    } else if (st.broken) {
      var canRewind = st.lostStreak > 0 && st.rewoundBreak !== st.breakId;
      var h = '<div class="loss-opts">';
      if (canRewind) {
        h += '<button class="sb-btn sb-btn-red sb-btn-block" id="rewindBtn">' +
          (st.token > 0
            ? "⏪ Rewind to " + st.lostStreak + "/7 · FREE token 🎫"
            : "⏪ Rewind to " + st.lostStreak + "/7 · $0.99") + "</button>" +
          '<div class="or-line">— OR —</div>';
      }
      h += '<button class="sb-btn sb-btn-green sb-btn-block" id="freshBtn">▶ Start over from 0 <small>· FREE · unlimited</small></button></div>';
      cta.innerHTML = h;
      if (canRewind) cta.querySelector("#rewindBtn").addEventListener("click", once(rewindFlow));
      cta.querySelector("#freshBtn").addEventListener("click", once(freshRound));
      strip.innerHTML = canRewind
        ? "Rewind is optional. Starting over costs <b>nothing</b> and you can do it as often as you like."
        : "Nothing to rewind at streak 0 — no offer here. Just go again, free.";
    } else {
      var step = st.streak + 1;
      cta.innerHTML = '<button class="sb-btn sb-btn-green sb-btn-block" id="playBtn">▶ Play level ' + step + " of " + GOAL +
        " <small>· Adv " + st.nextLevel + (isHard(step) ? " · 🔥HARD 2×" : "") + "</small></button>";
      cta.querySelector("#playBtn").addEventListener("click", once(attempt));
      strip.innerHTML = "⚠ One loss resets the chest to <b>0</b> — replays are always <b>FREE &amp; unlimited</b>";
    }
  }

  // one-shot click wrapper: a rapid double-tap can never run the handler twice
  function once(fn) {
    var used = false;
    return function (e) {
      if (used) return;
      used = true;
      var b = e && e.currentTarget;
      if (b && b.tagName === "BUTTON") b.disabled = true;
      fn(e);
    };
  }

  // ---------- attempt (pre-rolled + persisted so a reload can neither save nor steal a run) ----------
  function attempt() {
    if (busy || animating || st.broken || st.done || st.pending) return;
    busy = true;
    var step = st.streak + 1;
    var hard = isHard(step);
    var wr = hard ? ODDS_HARD : ODDS;
    if (window.__forceWin === true) wr = 1;
    else if (window.__forceWin === false) wr = 0;
    var won = Math.random() < wr;

    st.attempt = { step: step, hard: hard, won: won, lvl: st.nextLevel };
    S.save();

    var o = {
      title: "Adventure Level " + st.nextLevel,
      hard: hard,
      winRate: won ? 1 : 0
    };
    FAST = !!window.__forceInstant;
    if (FAST) o.instant = true;
    SB.playLevel(o).then(function () {
      busy = false;
      commitAttempt();
    });
  }

  // Single commit point for every attempt outcome. Idempotent: the stored attempt
  // is consumed before any state changes, so it can never be applied twice.
  function commitAttempt() {
    var a = st.attempt;
    if (!a) return;
    st.attempt = null;
    S.save();

    if (a.won) {
      st.streak++;
      st.nextLevel++;
      if (st.streak > st.best) st.best = st.streak;
      var coins = a.hard ? COIN_HARD : COIN_LVL;
      st.coinsToday += coins;
      if (st.streak === TOKEN_AT && !st.tokenEarned) { st.token++; st.tokenEarned = true; }
      S.save();
      SB.grantRewards([{ type: "coins", amount: coins }]);
      if (st.streak === TOKEN_AT && st.token > 0) SB.toast("🎫 Streak " + TOKEN_AT + " — FREE Rewind token earned!", 2400);
      if (st.streak >= GOAL) winJackpot();
      else { render(); SB.haptic(20); }
    } else {
      st.lostStreak = st.streak;
      st.brokeAt = st.streak + 1;
      st.streak = 0;              // the rule, applied literally and immediately
      st.broken = true;
      st.breakId++;
      S.save();
      playLoss(a.step);
    }
  }

  // ---------- loss ----------
  function playLoss(step) {
    animating = true;
    var arena = document.getElementById("arena");
    render();                       // pips, meter and chest fall to 0 together — never out of sync
    arena.classList.add("hurt");
    runnerEl.classList.add("fall");
    chestEl.classList.add("slam");
    SB.haptic(50);

    var fallen = st.lostStreak;
    planksEl.querySelectorAll(".plank").forEach(function (pl) {
      var i = +pl.getAttribute("data-i");
      pl.classList.remove("cur", "lock");
      if (i <= fallen) {
        pl.classList.remove("done");
        if (FAST) { pl.classList.add("crumble"); return; }
        setTimeout(function () { pl.classList.add("crumble"); }, (fallen - i) * 70);
      }
    });
    if (!FAST && fallen > 0) {
      var stamp = document.createElement("div");
      stamp.className = "lost-stamp";
      stamp.textContent = "−" + fallen + " STREAK";
      arena.appendChild(stamp);
      setTimeout(function () { stamp.remove(); }, 1200);
    }
    setTimeout(function () {
      arena.classList.remove("hurt");
      animating = false;
      planksEl.classList.add("rebuild");
      render();
      setTimeout(function () { planksEl.classList.remove("rebuild"); }, ms(500));
      lossSheet();
    }, ms(1100));
  }

  // ---------- loss sheet: paid + free option, always in the same view ----------
  function lossSheet() {
    if (sheetEl) return;
    sheetActed = false;
    var canRewind = st.lostStreak > 0 && st.rewoundBreak !== st.breakId;
    var bd = document.createElement("div");
    bd.className = "sb-sheet-backdrop";
    bd.innerHTML = '<div class="sb-sheet">' +
      "<h3>💥 You fell at level " + st.brokeAt + " of " + GOAL + "</h3>" +
      '<div class="sb-sheet-sub">Your streak is now <b>0/7</b>' +
      (st.lostStreak > 0 ? " — you had " + st.lostStreak + " first-try clears." : ".") +
      " The " + SB.fmt(st.coinsToday) + " 🪙 you earned today is already banked and safe.</div>" +
      (canRewind
        ? '<button class="sb-btn sb-btn-red sheet-opt" id="shRewind">' +
          (st.token > 0
            ? "⏪ Rewind to " + st.lostStreak + "/7 — use FREE token 🎫"
            : "⏪ Rewind to " + st.lostStreak + "/7 <span class=\"sb-price-tag\">$0.99</span>") +
          "</button>" +
          '<div class="or-line" style="color:#5a6b8c">— OR —</div>'
        : "") +
      '<button class="sb-btn sb-btn-green sb-btn-stack sheet-opt" style="margin-top:8px" id="shFresh">' +
      '<span>▶ Start over from 0</span><span class="free-badge">FREE · UNLIMITED · NO CATCH</span></button>' +
      '<div class="pity-note">' +
      (canRewind
        ? (st.tokenEarned
            ? (st.token > 0 ? "Your daily free Rewind token is available 🎫" : "Daily free Rewind token: already used today.")
            : "Reach a streak of " + TOKEN_AT + " to earn a FREE Rewind token (once per day).") +
          "<br>One Rewind per fall. You never have to pay — starting over is free, forever."
        : "There is nothing to restore at streak 0, so we are not offering you anything to buy.") +
      "</div>" +
      '<button class="sb-sheet-cancel" id="shLater">Decide later</button></div>';
    document.body.appendChild(bd);
    sheetEl = bd;
    requestAnimationFrame(function () { requestAnimationFrame(function () { bd.classList.add("open"); }); });
    bd.__close = function () { sheetActed = true; close(); };
    function close() {
      if (!sheetEl) return;
      sheetEl = null;
      bd.classList.remove("open");
      setTimeout(function () { bd.remove(); }, ms(300));
    }
    function act(fn) {
      return function () {
        if (sheetActed) return;
        sheetActed = true;
        close();
        fn();
      };
    }
    bd.addEventListener("click", function (e) { if (e.target === bd) act(function () {})(); });
    bd.querySelector("#shLater").addEventListener("click", act(function () {}));
    bd.querySelector("#shFresh").addEventListener("click", act(freshRound));
    if (canRewind) bd.querySelector("#shRewind").addEventListener("click", act(rewindFlow));
  }

  // ---------- rewind ----------
  function rewindFlow() {
    if (offerLatch) return;
    if (!st.broken || st.lostStreak <= 0) { render(); return; }
    if (st.rewoundBreak === st.breakId) { SB.toast("You already used a Rewind for this fall."); render(); return; }
    offerLatch = true;
    if (st.token > 0) {
      st.token--;
      restoreStreak(true);
      offerLatch = false;
      return;
    }
    SB.buyIAP({
      label: "⏪ Rewind — Double-or-Nothing Dash",
      price: "$0.99",
      sub: "Puts your streak back to " + st.lostStreak + "/7 and lets you retry level " + st.brokeAt +
        ". Free alternative: start over from 0 any time, unlimited — you can still win today’s jackpot that way.",
      contents: [], grant: false,
      onSuccess: function () { restoreStreak(false); offerLatch = false; },
      onCancel: function () { offerLatch = false; render(); }
    });
  }

  function restoreStreak(usedToken) {
    // hard guards: exactly one restore per fall, and only from a real fall
    if (!st.broken || st.lostStreak <= 0) { render(); return; }
    if (st.rewoundBreak === st.breakId) { render(); return; }
    st.rewoundBreak = st.breakId;
    st.streak = st.lostStreak;   // exact prior value, nothing more
    st.broken = false;
    st.brokeAt = 0;
    st.lostStreak = 0;
    S.save();
    render();
    SB.confetti();
    SB.haptic(30);
    SB.toast((usedToken ? "⏪ Free Rewind used — " : "⏪ Rewind — ") +
      "streak restored to " + st.streak + "/7. Level " + (st.streak + 1) + " awaits.", 2400);
  }

  function freshRound() {
    st.tryN++;
    st.streak = 0; st.lostStreak = 0; st.broken = false; st.brokeAt = 0;
    S.save();
    planksEl.classList.add("rebuild");
    render();
    setTimeout(function () { planksEl.classList.remove("rebuild"); }, ms(500));
    SB.toast("Try #" + st.tryN + " — bridge rebuilt, same jackpot. Free as always.", 2000);
  }

  // ---------- jackpot ----------
  function winJackpot() {
    if (st.done || st.pending) return;     // exactly once per completed streak
    if (st.streak < GOAL) return;          // never without a full streak
    st.done = true;
    st.jackpots++;
    st.pending = { coins: JACK_COINS, wild: JACK_WILDS };
    S.save();
    render();
    SB.haptic(60);
    if (!FAST) {
      var wrap = document.getElementById("chestWrap");
      var r = chestEl.getBoundingClientRect();
      SB.confetti(r.left + r.width / 2, r.top + r.height / 2, 130);
      for (var i = 0; i < 9; i++) {
        (function (n) {
          setTimeout(function () {
            var c = document.createElement("div");
            c.className = "coin-pop";
            c.textContent = n % 3 === 0 ? "💎" : "🪙";
            c.style.setProperty("--dx", (n - 4) * 15 + "px");
            c.style.setProperty("--dy", (-60 - Math.random() * 45) + "px");
            wrap.appendChild(c);
            setTimeout(function () { c.remove(); }, 1150);
          }, n * 65);
        })(i);
      }
    }
    setTimeout(jackpotModal, ms(950));
  }

  function jackpotModal() {
    if (!st.pending) return;
    var pend = st.pending;
    var m = SB.modal(
      '<div style="font-size:52px">🏆</div>' +
      "<h2 style='margin:6px 0'>JACKPOT CRACKED!</h2>" +
      '<div class="prize-card">7 levels in a row, <b>first try each</b><br>' +
      '<span style="font-size:12px;opacity:0.85">Day ' + st.day + " · try #" + st.tryN + "</span></div>" +
      '<div style="display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap">' +
      SB.rewardChip({ type: "coins", amount: pend.coins }) + SB.rewardChip({ type: "wild", amount: pend.wild, label: "Wild Cards" }) + "</div>" +
      '<button class="sb-btn sb-btn-yellow sb-btn-block" id="collectBtn">Collect</button>' +
      '<div class="demo-line">One jackpot per day. The chest refills tomorrow.</div>',
      function () { render(); }   // dismissed without collecting → CTA offers Collect again
    );
    m.el.querySelector("#collectBtn").addEventListener("click", function (e) {
      var p = st.pending;
      if (!p) { m.close(true); return; }   // latch: a double-tap finds nothing left to grant
      st.pending = null;
      S.save();
      SB.grantRewards([{ type: "coins", amount: p.coins }, { type: "wild", amount: p.wild }], e.currentTarget);
      SB.confetti();
      m.close(true);
      render();
    });
  }

  // ---------- daily round ----------
  function newDay() {
    if (sheetEl && sheetEl.__close) sheetEl.__close();   // a day flip must not leave a stale offer on screen
    st.day++; st.tryN = 1;
    st.streak = 0; st.lostStreak = 0; st.broken = false; st.brokeAt = 0;
    st.done = false; st.tokenEarned = false; st.coinsToday = 0;
    st.attempt = null;
    st.rewoundBreak = -1; st.breakId = 0;
    st.endTs = Date.now() + DAY_MS;
    S.save();
    startCountdown();
    render();
    SB.toast("🌅 Day " + st.day + " — the chest is locked and full again!", 2200);
  }

  function startCountdown() {
    if (cdIv) clearInterval(cdIv);
    cdIv = SB.countdown(document.getElementById("cd"), st.endTs, function () {
      SB.toast("⏰ Day over — new jackpot chest!");
      newDay();
    });
  }

  // mirror the countdown into the cooldown note when the day is already won
  setInterval(function () {
    var el = document.getElementById("cd2");
    if (el) el.textContent = document.getElementById("cd").textContent;
  }, 1000);

  // ---------- rules ----------
  var infoOpen = false;
  document.getElementById("infoBtn").addEventListener("click", function () {
    if (busy || animating || sheetEl || infoOpen) return;   // never stack a modal under the level/sheet layer
    infoOpen = true;
    var m = SB.modal(
      "<h2 style='margin:0 0 10px'>ⓘ How the Dash works</h2>" +
      '<ul class="rules-list">' +
      "<li>Clear <b>7 adventure levels in a row on the FIRST try</b> to crack today’s chest.</li>" +
      "<li><b>Any loss resets your streak to 0 — immediately.</b> No partial credit.</li>" +
      "<li><b>Starting over is FREE and unlimited</b> all day. You can win the jackpot without ever paying.</li>" +
      "<li><b>Odds:</b> normal levels clear ~<b>" + Math.round(ODDS * 100) + "%</b> of the time, the two 🔥 HARD levels (6 &amp; 7) ~<b>" +
      Math.round(ODDS_HARD * 100) + "%</b>. Demo values, shown for transparency.</li>" +
      "<li><b>Every level you clear pays " + COIN_LVL + " 🪙 — hard levels pay " + COIN_HARD + " 🪙 (2×).</b> Coins you have already earned are never taken back.</li>" +
      "<li><b>Jackpot:</b> " + SB.fmt(JACK_COINS) + " 🪙 + " + JACK_WILDS + " 🃏 Wilds, once per day.</li>" +
      "<li><b>Free pity:</b> reach a streak of " + TOKEN_AT + " and earn <b>1 FREE Rewind token</b> (once per day — unused tokens carry over).</li>" +
      "<li><b>Rewind</b> (free token, or $0.99) restores the exact streak you just lost so you can retry that level. <b>One Rewind per fall</b>, and it is never required.</li>" +
      "</ul>" +
      '<button class="sb-btn sb-btn-blue sb-btn-block" id="okBtn">Got it</button>' +
      '<button class="sb-sheet-cancel" id="skipDayBtn">⏭ Simulate next day (demo)</button>',
      function () { infoOpen = false; }
    );
    m.el.querySelector("#okBtn").addEventListener("click", function () { infoOpen = false; m.close(true); });
    m.el.querySelector("#skipDayBtn").addEventListener("click", function () {
      if (!infoOpen) return;
      infoOpen = false;
      m.close(true);
      newDay();
    });
  });

  // ---------- boot ----------
  startCountdown();
  render();

  if (bootRollover) {
    // the day ended while the player was away: roll into a clean new day, keeping
    // banked coins/stats, dropping any half-finished streak (that is the rule)
    st.attempt = null; st.pending = st.pending || null;
    if (!st.pending) newDay();
    else { SB.toast("Yesterday’s jackpot is still waiting — collect it first.", 2600); }
  }

  // a reload mid-level resolves the already-rolled outcome: no save-scumming, nothing lost
  if (st.attempt) {
    setTimeout(function () {
      SB.toast("Resuming your level result…", 1600);
      commitAttempt();
    }, ms(350));
  } else if (st.pending) {
    setTimeout(jackpotModal, ms(400));
  }

  var rz;
  window.addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () { if (!busy && !animating) render(); }, 150);
  });

  // test/demo hooks
  window.__dash = { st: st, save: function () { S.save(); }, render: render };
})();
</script>
</body>
</html>
