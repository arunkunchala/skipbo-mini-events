<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Wild Card Wager — Skip-Bo Mini Event</title>
<link rel="stylesheet" href="../shared/core.css">
<style>
  /* ---------- hero ---------- */
  .ww-hero { display:flex; align-items:center; gap:7px; margin-bottom:9px; }
  .ww-tixchip {
    display:inline-flex; align-items:center; gap:6px; margin-left:auto;
    background:rgba(0,0,0,.35); border:1.5px solid rgba(255,199,44,.6);
    border-radius:999px; padding:4px 11px 4px 7px; color:var(--sb-yellow);
    font-weight:900; font-size:14px; --notch:#173f78; cursor:pointer; min-height:44px;
  }
  .ww-tixchip .plus {
    display:grid; place-items:center; width:19px; height:19px; border-radius:50%;
    background:var(--sb-yellow); color:#5a3d00; font-size:14px; line-height:1; margin-left:1px;
  }
  .ww-info {
    width:44px; height:44px; flex:0 0 auto;
    border-radius:12px; border:1.5px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.14); color:#fff; font-size:19px; font-weight:900; cursor:pointer;
  }

  /* ---------- ticket stub CSS art ---------- */
  .ww-stub {
    position:relative; display:inline-grid; place-items:center;
    width:38px; height:24px; border-radius:5px;
    background:linear-gradient(135deg,#fff3c9 0%,#FFC72C 42%,#e0a400 100%);
    border:1.5px solid #b8860b; box-shadow:0 2px 3px rgba(0,0,0,.35);
    font-size:9px; font-weight:900; color:#7a5200; letter-spacing:.5px;
    flex:0 0 auto;
  }
  .ww-stub::before, .ww-stub::after {
    content:""; position:absolute; width:8px; height:8px; border-radius:50%;
    background:var(--notch,#1c6b39); top:50%; transform:translateY(-50%);
  }
  .ww-stub::before { left:-5px; }
  .ww-stub::after { right:-5px; }
  .ww-stub i { position:absolute; right:9px; top:2px; bottom:2px; border-left:2px dashed rgba(122,82,0,.45); }
  .ww-stub.big { width:60px; height:38px; font-size:11px; border-radius:7px; border-width:2px; }
  .ww-stub.big::before, .ww-stub.big::after { width:11px; height:11px; }
  .ww-stub.big::before { left:-6px; } .ww-stub.big::after { right:-6px; }
  .ww-stub.big i { right:13px; }
  .ww-stub.mini { width:22px; height:15px; font-size:0; border-width:1px; border-radius:3px; }
  .ww-stub.mini::before, .ww-stub.mini::after { width:5px; height:5px; }
  .ww-stub.mini::before { left:-3px; } .ww-stub.mini::after { right:-3px; }
  .ww-stub.mini i { right:5px; border-left-width:1.5px; }
  .ww-stub.ghost { opacity:.28; filter:grayscale(1); }
  .ww-stub.short { filter:saturate(.35); border-color:var(--sb-red); box-shadow:0 0 0 2px rgba(215,38,61,.4); }

  /* ---------- odds / honesty panel ---------- */
  .ww-odds {
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.08));
    border:1.5px solid rgba(255,199,44,.55); border-radius:14px;
    padding:8px 10px 9px; margin-bottom:9px; color:#fff;
  }
  .ww-odds .hd { font-size:9.5px; font-weight:900; letter-spacing:1px; color:var(--sb-yellow); margin-bottom:5px; }
  .ww-rate { display:flex; align-items:center; gap:7px; margin-top:5px; }
  .ww-rate .nm { font-size:11px; font-weight:800; width:58px; flex:0 0 auto; }
  .ww-rate .bar { flex:1 1 auto; height:11px; border-radius:999px; background:rgba(0,0,0,.35); overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.5); }
  .ww-rate .fill { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#3fc167,#9be8ac); transition:width .5s ease; box-shadow:0 0 8px rgba(155,232,172,.5); }
  .ww-rate.hard .fill { background:linear-gradient(90deg,#ef5468,#ffb3bd); }
  .ww-rate .pc { font-size:12.5px; font-weight:900; width:34px; text-align:right; flex:0 0 auto; }
  .ww-rate .rec { font-size:9.5px; font-weight:700; color:var(--sb-sky-light); width:46px; text-align:right; flex:0 0 auto; }

  /* ---------- the arena table ---------- */
  .ww-rail {
    padding:7px; border-radius:22px;
    background:linear-gradient(160deg,#a06a34 0%,#6b3f1d 45%,#40240f 100%);
    box-shadow:var(--sb-shadow), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .ww-felt {
    position:relative; height:206px; border-radius:16px; overflow:hidden;
    background:radial-gradient(115% 115% at 50% 12%, #43bd72 0%, #2E9E4F 34%, #1c6b39 72%, #14522b 100%);
    box-shadow:inset 0 0 30px rgba(0,0,0,.5);
    --notch:#1c6b39;
  }
  .ww-felt::after {
    content:""; position:absolute; inset:6px; border-radius:12px;
    border:1.5px dashed rgba(255,255,255,.18); pointer-events:none;
  }

  /* dealer card fan */
  .ww-fan { position:absolute; top:0; left:50%; transform:translateX(-50%); height:48px; width:170px; }
  .ww-fan .sb-card {
    position:absolute; left:50%; top:3px; width:30px; height:40px; font-size:15px;
    transform-origin:50% 135%; margin-left:-15px;
    box-shadow:0 3px 5px rgba(0,0,0,.35);
  }
  .ww-dealer {
    position:absolute; top:48px; left:50%; transform:translateX(-50%);
    font-size:8.5px; font-weight:900; letter-spacing:1.5px; color:rgba(255,255,255,.62);
    text-shadow:0 1px 2px rgba(0,0,0,.5);
  }

  /* your stack (left) */
  .ww-stack { position:absolute; left:9px; bottom:10px; width:74px; text-align:center; }
  .ww-stack .lbl { font-size:8.5px; font-weight:900; letter-spacing:1px; color:rgba(255,255,255,.72); margin-bottom:3px; }
  .ww-stack .pile { position:relative; height:62px; }
  .ww-stack .pile .ww-stub { position:absolute; left:50%; margin-left:-19px; }
  .ww-stack .cnt { font-size:14px; font-weight:900; color:var(--sb-yellow); text-shadow:0 2px 0 rgba(0,0,0,.4); margin-top:2px; }

  /* pot */
  .ww-pot {
    position:absolute; left:50%; top:62px; transform:translateX(-50%);
    width:126px; min-height:84px; border-radius:50%/40%;
    background:radial-gradient(80% 80% at 50% 30%, rgba(0,0,0,.28), rgba(0,0,0,.5));
    border:2.5px dashed rgba(255,199,44,.75);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6px 4px; box-shadow:inset 0 0 18px rgba(0,0,0,.5);
  }
  .ww-pot.lit { border-color:#FFC72C; box-shadow:inset 0 0 18px rgba(0,0,0,.5), 0 0 22px rgba(255,199,44,.5); }
  .ww-pot .plbl { font-size:8.5px; font-weight:900; letter-spacing:1.5px; color:var(--sb-yellow); }
  .ww-pot .pstubs { display:flex; gap:2px; justify-content:center; min-height:16px; margin:3px 0 2px; }
  .ww-pot .pamt { font-size:17px; font-weight:900; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.45); line-height:1; }
  .ww-pot .psub { font-size:9px; font-weight:800; color:var(--sb-sky-light); text-align:center; margin-top:2px; line-height:1.2; }

  /* multiplier ladder */
  .ww-mlad { position:absolute; right:9px; top:52px; width:74px; }
  .ww-mlad .lbl { font-size:8px; font-weight:900; letter-spacing:1px; color:rgba(255,255,255,.72); text-align:center; margin-bottom:3px; }
  .ww-mrung {
    display:flex; align-items:center; justify-content:space-between; gap:2px;
    background:rgba(0,0,0,.34); border:1.5px solid rgba(255,255,255,.18);
    border-radius:8px; padding:3px 5px; margin-bottom:4px;
    font-size:10px; font-weight:900; color:rgba(255,255,255,.62);
    transition:all .22s ease;
  }
  .ww-mrung .mx { font-size:11.5px; }
  .ww-mrung.on {
    background:linear-gradient(180deg,#ffd95e,#e0a400); color:#5a3d00;
    border-color:#fff3c9; box-shadow:0 0 12px rgba(255,199,44,.75);
    transform:scale(1.05);
  }
  .ww-mrung.top.on { background:linear-gradient(180deg,#ff9f5e,#D7263D); color:#fff; border-color:#ffd0a8; }

  /* ---------- wager controls ---------- */
  .ww-ctl { margin-top:10px; background:var(--sb-cream); border-radius:16px; padding:10px 12px 11px; box-shadow:var(--sb-shadow); --notch:#FDF6E3; }
  .ww-ctl .hd { font-size:10px; font-weight:900; letter-spacing:1.2px; color:#5a6b8c; text-align:center; }
  .ww-step { display:flex; align-items:center; gap:10px; margin:7px 0 8px; }
  .ww-step button {
    width:52px; height:52px; flex:0 0 auto; border:none; border-radius:14px; cursor:pointer;
    font-size:27px; font-weight:900; color:#fff; font-family:var(--sb-font); line-height:1;
    background:linear-gradient(180deg,#5ba0e8,#1D4FA1); box-shadow:0 3px 0 rgba(0,0,0,.3);
  }
  .ww-step button:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.3); }
  .ww-step button:disabled { filter:grayscale(.85); opacity:.45; }
  .ww-step .slot {
    flex:1 1 auto; display:flex; align-items:center; justify-content:center; gap:9px;
    height:52px; border-radius:12px; background:rgba(27,42,74,.07);
    border:2px dashed rgba(27,42,74,.2);
  }
  .ww-payout { border-radius:12px; background:#eef4ff; border:1.5px solid rgba(29,79,161,.25); padding:7px 9px; }
  .ww-prow { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--sb-ink); }
  .ww-prow + .ww-prow { margin-top:3px; }
  .ww-prow .tag { font-size:9.5px; font-weight:900; letter-spacing:.5px; border-radius:5px; padding:2px 5px; color:#fff; flex:0 0 auto; }
  .ww-prow .tag.w { background:var(--sb-green); }
  .ww-prow .tag.l { background:var(--sb-red); }
  .ww-ev { margin-top:5px; font-size:10.5px; font-weight:700; color:#5a6b8c; line-height:1.35; }
  .ww-ev b { color:var(--sb-blue); }

  /* mode toggle */
  .ww-modes { display:flex; gap:8px; margin-top:9px; }
  .ww-mode {
    flex:1 1 0; min-height:48px; border-radius:13px; cursor:pointer;
    border:2px solid rgba(255,255,255,.28); background:rgba(255,255,255,.12);
    color:#fff; font-family:var(--sb-font); font-weight:900; font-size:13px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .ww-mode small { font-size:9.5px; font-weight:800; opacity:.82; }
  .ww-mode.on { background:linear-gradient(180deg,#5ba0e8,#1D4FA1); border-color:var(--sb-yellow); box-shadow:0 0 0 2px rgba(255,199,44,.4); }
  .ww-mode.hard.on { background:linear-gradient(180deg,#ef5468,#a31527); }

  .ww-play { margin-top:9px; flex-direction:column; gap:1px; min-height:60px; }
  .ww-play small { font-size:10.5px; font-weight:800; opacity:.9; text-shadow:none; }

  /* ---------- free path ---------- */
  .ww-free {
    margin-top:9px; display:flex; align-items:center; gap:9px;
    background:rgba(46,158,79,.22); border:1.5px dashed rgba(155,232,172,.75);
    border-radius:13px; padding:8px 10px;
  }
  .ww-free .txt { flex:1 1 auto; color:#fff; font-size:10.5px; font-weight:700; line-height:1.4; }
  .ww-free .txt b { color:#9be8ac; }
  .ww-free .sb-btn { flex:0 0 auto; }

  /* ---------- boost / insurance card ---------- */
  .ww-boost {
    margin-top:9px; display:flex; align-items:center; gap:9px; position:relative;
    background:linear-gradient(160deg,#2a5cb0,#14396f); border:2px solid rgba(255,199,44,.55);
    border-radius:14px; padding:9px 11px; box-shadow:var(--sb-shadow);
  }
  .ww-boost .seal {
    width:38px; height:38px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(180deg,#ffd95e,#e0a400); font-size:20px;
    box-shadow:0 0 0 3px rgba(255,199,44,.25);
  }
  .ww-boost .txt { flex:1 1 auto; color:#fff; font-size:10.5px; font-weight:700; line-height:1.4; }
  .ww-boost .txt b { color:var(--sb-yellow); font-size:12px; }
  .ww-boost.owned { border-color:#9be8ac; background:linear-gradient(160deg,#20713d,#14512b); }

  /* ---------- points track ---------- */
  .ww-track { margin-top:11px; background:var(--sb-cream); border-radius:16px; padding:10px 11px 11px; box-shadow:var(--sb-shadow); }
  .ww-track .hd { display:flex; align-items:baseline; gap:6px; font-size:11px; font-weight:900; color:var(--sb-ink); }
  .ww-track .hd .pts { margin-left:auto; color:var(--sb-blue); font-size:13px; }
  .ww-line { position:relative; height:6px; border-radius:999px; background:rgba(27,42,74,.15); margin:28px 17px 20px; }
  .ww-line .fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:linear-gradient(90deg,var(--sb-sky),var(--sb-yellow)); transition:width .6s cubic-bezier(.34,1.2,.5,1); }
  .ww-node {
    position:absolute; top:50%; transform:translate(-50%,-50%); width:30px; height:30px;
    border-radius:50%; background:#fff; border:2.5px solid rgba(27,42,74,.3);
    display:grid; place-items:center; font-size:14px; box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  .ww-node .cap { position:absolute; top:-17px; left:50%; transform:translateX(-50%); font-size:8.5px; font-weight:900; color:#5a6b8c; white-space:nowrap; }
  .ww-node.done { border-color:var(--sb-green); background:#e7f6e9; }
  .ww-node.ready { border-color:var(--sb-yellow); animation:sbPulse 1s infinite; box-shadow:0 0 12px rgba(255,199,44,.9); }
  .ww-claim { margin-top:8px; min-height:46px; }
  .ww-track .foot { font-size:10px; font-weight:700; color:#5a6b8c; text-align:center; margin-top:6px; line-height:1.35; }

  /* ---------- stats ---------- */
  .ww-stats { margin-top:11px; display:flex; justify-content:space-around; gap:5px; color:var(--sb-sky-light); font-size:10px; font-weight:800; text-align:center; }
  .ww-stats b { display:block; color:#fff; font-size:14px; }

  /* ---------- flying stubs ---------- */
  .ww-fly { position:fixed; z-index:230; pointer-events:none; --notch:transparent; }
  .ww-fly.anim { transition:left .6s cubic-bezier(.4,0,.5,1), top .6s cubic-bezier(.4,0,.5,1), transform .6s ease, opacity .6s ease; }
  .ww-rain { position:fixed; z-index:229; pointer-events:none; --notch:transparent; transition:top .55s cubic-bezier(.5,0,.8,1), opacity .3s ease .35s, transform .55s linear; }

  /* local patch: core.css puts the IAP sheet (z200) BEHIND .sb-modal-backdrop (z220),
     so an offer opened from the loss modal is unreachable. Lift it above the modal. */
  .sb-sheet-backdrop { z-index:280; }

  /* ---------- modals ---------- */
  .ww-rules { text-align:left; font-size:13px; line-height:1.55; color:var(--sb-ink); }
  .ww-rules li { margin-bottom:7px; }
  .ww-lossbox { --notch:#FDF6E3; }
  .ww-nearmiss {
    display:flex; align-items:center; justify-content:center; gap:8px; margin:8px 0 4px;
    background:rgba(215,38,61,.1); border:1.5px solid rgba(215,38,61,.35); border-radius:12px; padding:8px;
  }
  .ww-nearmiss .sb-card { width:26px; height:35px; font-size:6px; letter-spacing:0; flex:0 0 auto; }
  .ww-freebox {
    margin-top:10px; background:#e7f6e9; border:1.5px solid var(--sb-green);
    border-radius:12px; padding:9px 10px; font-size:11.5px; font-weight:700; color:var(--sb-green-dark); text-align:left;
  }
  .ww-freebox .rowb { display:flex; align-items:center; gap:8px; margin-top:7px; }
  .ww-freebox .rowb .sb-btn { flex:0 0 auto; }
  .ww-offer {
    display:flex; align-items:center; gap:9px; text-align:left; margin-top:8px;
    background:linear-gradient(160deg,#2a5cb0,#14396f); border:2px solid rgba(255,199,44,.5);
    border-radius:13px; padding:9px 10px; color:#fff; font-size:10.5px; font-weight:700; line-height:1.4;
  }
  .ww-offer b { color:var(--sb-yellow); font-size:12px; }
  .ww-offer .sb-btn { flex:0 0 auto; margin-left:auto; }
  .ww-winamt { font-size:34px; font-weight:900; color:var(--sb-green); text-shadow:0 2px 0 rgba(0,0,0,.15); margin:4px 0; }

  @media (max-width:374px) {
    .ww-felt { height:196px; }
    .ww-mlad { width:66px; }
    .ww-stack { width:66px; }
    .ww-pot { width:112px; }
    .ww-step button { width:46px; height:46px; font-size:24px; }
    .ww-stub.big { width:52px; height:34px; font-size:9px; }
  }
</style>
</head>
<body>
<div class="sb-app">
<div class="sb-main">

  <div class="ww-hero">
    <span class="sb-timer-chip">⏳ <span id="ww-timer"></span></span>
    <span class="ww-tixchip" id="ww-tixchip" role="button"><span class="ww-stub mini"><i></i></span><b id="ww-tixnum">5</b><span class="plus">+</span></span>
    <button class="ww-info" id="ww-info" aria-label="Rules">ⓘ</button>
  </div>

  <div class="ww-odds">
    <div class="hd">📊 YOUR CLEAR RATE = THE REAL ODDS HERE</div>
    <div class="ww-rate" id="ww-rate-c">
      <span class="nm">🃏 Classic</span>
      <span class="bar"><span class="fill" id="ww-fill-c"></span></span>
      <span class="pc" id="ww-pc-c">78%</span>
      <span class="rec" id="ww-rec-c">14/18</span>
    </div>
    <div class="ww-rate hard" id="ww-rate-h">
      <span class="nm">🔥 Hard</span>
      <span class="bar"><span class="fill" id="ww-fill-h"></span></span>
      <span class="pc" id="ww-pc-h">55%</span>
      <span class="rec" id="ww-rec-h">6/11</span>
    </div>
  </div>

  <div class="ww-rail">
    <div class="ww-felt" id="ww-felt">
      <div class="ww-fan" id="ww-fan"></div>
      <div class="ww-dealer">DEALER · SKIP·BO ARENA</div>

      <div class="ww-stack">
        <div class="lbl">YOUR TICKETS</div>
        <div class="pile" id="ww-pile"></div>
        <div class="cnt" id="ww-stackcnt">🎟️ 5</div>
      </div>

      <div class="ww-pot" id="ww-pot">
        <div class="plbl">THE POT</div>
        <div class="pstubs" id="ww-potstubs"></div>
        <div class="pamt" id="ww-potamt">🎟️ 2</div>
        <div class="psub" id="ww-potsub">if you clear the level</div>
      </div>

      <div class="ww-mlad" id="ww-mlad">
        <div class="lbl">PAYOUT LADDER</div>
      </div>
    </div>
  </div>

  <div class="ww-ctl">
    <div class="hd">SET YOUR WAGER</div>
    <div class="ww-step">
      <button id="ww-minus" aria-label="Wager less">−</button>
      <div class="slot" id="ww-slot"></div>
      <button id="ww-plus" aria-label="Wager more">+</button>
    </div>
    <div class="ww-payout">
      <div class="ww-prow"><span class="tag w">WIN</span><span id="ww-win-txt"></span></div>
      <div class="ww-prow"><span class="tag l">LOSE</span><span id="ww-lose-txt"></span></div>
      <div class="ww-ev" id="ww-ev"></div>
    </div>
  </div>

  <div class="ww-modes">
    <button class="ww-mode on" id="ww-mode-c">🃏 Classic level<small id="ww-mode-c-sub">you clear 78%</small></button>
    <button class="ww-mode hard" id="ww-mode-h">🔥 Hard level<small id="ww-mode-h-sub">you clear 55% · bigger ×</small></button>
  </div>

  <button class="sb-btn sb-btn-green sb-btn-block ww-play" id="ww-play">
    <span id="ww-play-main">▶ Play level · wager 1 🎟️</span>
    <small id="ww-play-sub"></small>
  </button>

  <div class="ww-free" id="ww-free">
    <div class="txt" id="ww-free-txt"></div>
    <button class="sb-btn sb-btn-green sb-btn-sm" id="ww-freeplay">▶ Free play</button>
  </div>

  <div class="ww-boost" id="ww-boost">
    <div class="seal">🛡️</div>
    <div class="txt" id="ww-boost-txt"></div>
    <button class="sb-btn sb-btn-yellow sb-btn-sm" id="ww-boost-buy">$2.99</button>
  </div>

  <div class="ww-track">
    <div class="hd"><span>🏅 EVENT POINTS</span><span class="pts" id="ww-pts">0 pts</span></div>
    <div class="ww-line" id="ww-line"><div class="fill" id="ww-linefill"></div></div>
    <button class="sb-btn sb-btn-yellow sb-btn-block ww-claim" id="ww-claim" style="display:none">🎁 Claim milestone</button>
    <div class="foot" id="ww-track-foot"></div>
  </div>

  <div class="ww-stats">
    <div>Wagers won<b id="ww-st-won">0</b></div>
    <div>Wagers lost<b id="ww-st-lost">0</b></div>
    <div>Biggest payout<b id="ww-st-big">—</b></div>
    <div>Streak<b id="ww-st-streak">0</b></div>
  </div>

</div>
</div>
<script src="../shared/core.js"></script>
<script src="../shared/levelsim.js"></script>
<script>
(function () {
  "use strict";
  SB.init({ title: "Wild Card Wager", subtitle: "Wager tickets on your own skill · 2 days", resetKey: "wild-card-wager" });

  // ---------- constants ----------
  var CAP = 5;                    // free regen ceiling
  var REGEN_MS = 40 * 1000;       // demo-compressed from 30 min
  var MULT = { 0: { 1: 2, 2: 2.5, 3: 3 }, 1: { 1: 2.5, 2: 3.25, 3: 4 } };
  var PTS = { 0: 10, 1: 22 };     // points per ticket wagered
  var MILES = [
    { p: 40,  rw: [{ type: "coins", amount: 300 }] },
    { p: 100, rw: [{ type: "wild", amount: 1 }] },
    { p: 190, rw: [{ type: "gem", amount: 15 }] },
    { p: 320, rw: [{ type: "coins", amount: 900 }, { type: "wild", amount: 1 }] },
    { p: 500, rw: [{ type: "chest", amount: 1 }, { type: "coins", amount: 2500 }] }
  ];
  var TOP_P = MILES[MILES.length - 1].p;

  // ---------- state ----------
  var S = SB.store("wild-card-wager", {
    tickets: 5, wager: 1, hard: false, points: 0, claimed: 0,
    boost: false, regenTs: 0,
    cw: 14, cp: 18, hw: 6, hp: 11,          // seeded clear-rate record (78% / 55%)
    won: 0, lost: 0, big: 0, streak: 0, best: 0,
    endTs: Date.now() + 48 * 3600 * 1000
  });
  var st = S.data, busy = false;

  // ---------- helpers ----------
  function mult(w, hard) { return MULT[hard ? 1 : 0][Math.min(3, Math.max(1, w))]; }
  function payout(w, hard) { return Math.round(w * mult(w, hard)); }
  function points(w, hard) { return w * PTS[hard ? 1 : 0]; }
  function rate(hard) {
    var w = hard ? st.hw : st.cw, p = hard ? st.hp : st.cp;
    return { w: w, p: p, pct: p ? Math.round((w / p) * 100) : 0 };
  }
  function stub(cls) { return '<span class="ww-stub ' + (cls || "") + '"><i></i>' + (cls === "big" ? "WAGER" : "") + "</span>"; }
  function inWords(n) { return ["never", "1 time", "2 times", "3 times", "4 times"][n] || n + " times"; }

  // deterministic demo hook
  function simOpts(hard) {
    var o = { hard: hard, title: "Adventure Level " + (307 + st.cp + st.hp) };
    if (window.__forceWin === true) o.winRate = 1;
    else if (window.__forceWin === false) o.winRate = 0;
    else o.winRate = hard ? 0.55 : 0.78;
    if (window.__forceInstant) o.instant = true;
    return o;
  }

  // ---------- ticket regen ----------
  function regenTick() {
    var changed = false;
    if (st.tickets >= CAP) { if (st.regenTs) { st.regenTs = 0; changed = true; } }
    else {
      if (!st.regenTs) { st.regenTs = Date.now() + REGEN_MS; changed = true; }
      while (st.tickets < CAP && Date.now() >= st.regenTs) {
        st.tickets++; st.regenTs = Date.now() + REGEN_MS; changed = true;
        SB.toast("🎟️ +1 free ticket — regenerated!");
      }
      if (st.tickets >= CAP) st.regenTs = 0;
    }
    if (changed) { S.save(); render(); }
    updateRegenLabels();
  }
  function regenSecs() {
    if (st.tickets >= CAP || !st.regenTs) return null;
    return Math.max(0, Math.ceil((st.regenTs - Date.now()) / 1000));
  }
  function regenText() {
    var s = regenSecs();
    if (s == null) return "Free regen tops you up to <b>" + CAP + " 🎟️</b> — you hold <b>" + st.tickets + "</b>, so it restarts the moment you drop below " + CAP + ".";
    return "Next free ticket in <b>" + s + "s</b> · 1 every 30 min, up to " + CAP + " (you hold " + st.tickets + ").";
  }
  function updateRegenLabels() {
    var els = document.querySelectorAll("[data-regen]");
    for (var i = 0; i < els.length; i++) els[i].innerHTML = regenText();
  }

  // ---------- static art ----------
  (function buildFan() {
    var fan = document.getElementById("ww-fan");
    var cards = [["red", "4"], ["blue", "5"], ["wild", "SKIP·BO"], ["green", "6"], ["red", "7"]];
    cards.forEach(function (c, i) {
      var el = document.createElement("span");
      el.className = "sb-card " + c[0];
      el.textContent = c[1];
      if (c[0] === "wild") el.style.fontSize = "7px";
      el.style.transform = "rotate(" + ((i - 2) * 23) + "deg)";
      el.style.zIndex = String(10 - Math.abs(i - 2));
      fan.appendChild(el);
    });
  })();

  (function buildLadder() {
    var lad = document.getElementById("ww-mlad");
    for (var w = 3; w >= 1; w--) {
      var d = document.createElement("div");
      d.className = "ww-mrung" + (w === 3 ? " top" : "");
      d.id = "ww-mrung-" + w;
      lad.appendChild(d);
    }
  })();

  (function buildNodes() {
    var line = document.getElementById("ww-line");
    MILES.forEach(function (m, i) {
      var n = document.createElement("div");
      n.className = "ww-node"; n.id = "ww-node-" + i;
      n.style.left = ((m.p / TOP_P) * 100) + "%";
      n.innerHTML = '<span class="cap">' + m.p + "</span>" + SB.icon(m.rw[0].type);
      line.appendChild(n);
    });
  })();

  // ---------- render ----------
  function render() {
    if (st.wager > 3) st.wager = 3;
    if (st.wager < 1) st.wager = 1;

    var hard = !!st.hard, w = st.wager, m = mult(w, hard), pay = payout(w, hard), pts = points(w, hard);
    var r = rate(hard), rc = rate(false), rh = rate(true);

    // odds panel
    document.getElementById("ww-fill-c").style.width = rc.pct + "%";
    document.getElementById("ww-fill-h").style.width = rh.pct + "%";
    document.getElementById("ww-pc-c").textContent = rc.pct + "%";
    document.getElementById("ww-pc-h").textContent = rh.pct + "%";
    document.getElementById("ww-rec-c").textContent = rc.w + "/" + rc.p;
    document.getElementById("ww-rec-h").textContent = rh.w + "/" + rh.p;
    document.getElementById("ww-mode-c-sub").textContent = "you clear " + rc.pct + "%";
    document.getElementById("ww-mode-h-sub").textContent = "you clear " + rh.pct + "% · bigger ×";

    // tickets
    document.getElementById("ww-tixnum").textContent = st.tickets;
    document.getElementById("ww-stackcnt").textContent = "🎟️ " + st.tickets;
    var pile = document.getElementById("ww-pile"), ph = "";
    var shown = Math.min(5, st.tickets);
    for (var i = 0; i < 5; i++) {
      var on = i < shown;
      ph += '<span class="ww-stub' + (on ? "" : " ghost") + '" style="top:' + (i * 9) + "px;transform:rotate(" + ((i % 2 ? 1 : -1) * 3) + 'deg)"><i></i></span>';
    }
    pile.innerHTML = ph;

    // pot
    var potStubs = "";
    for (var j = 0; j < w; j++) potStubs += stub("mini");
    document.getElementById("ww-potstubs").innerHTML = potStubs;
    document.getElementById("ww-potamt").textContent = "🎟️ " + pay;
    document.getElementById("ww-potsub").innerHTML = "if you clear it<br>+" + pts + " pts";
    document.getElementById("ww-pot").classList.toggle("lit", w >= 2);

    // ladder
    for (var k = 1; k <= 3; k++) {
      var el = document.getElementById("ww-mrung-" + k);
      el.classList.toggle("on", k <= w);
      el.innerHTML = '<span>' + k + "🎟️</span><span class='mx'>×" + MULT[hard ? 1 : 0][k] + "</span>";
    }

    // stepper slot
    var slot = "";
    for (var q = 0; q < 3; q++) {
      var cls = q < w ? (q < st.tickets ? "" : " short") : " ghost";
      slot += '<span class="ww-stub big' + cls + '"><i></i>WAGER</span>';
    }
    document.getElementById("ww-slot").innerHTML = slot;
    document.getElementById("ww-minus").disabled = busy || w <= 1;
    document.getElementById("ww-plus").disabled = busy || w >= 3;

    // payout readout
    document.getElementById("ww-win-txt").innerHTML =
      "🎟️ <b>" + pay + " back</b> (×" + m + ") &nbsp;+&nbsp; 🏅 <b>" + pts + " pts</b>";
    document.getElementById("ww-lose-txt").innerHTML = st.boost
      ? "🎟️ " + (w - Math.floor(w / 2)) + " gone · <b>" + Math.floor(w / 2) + " refunded</b> by 🛡️ Boost"
      : "🎟️ <b>" + w + " gone</b> · 0 points";
    var winsIn5 = Math.round(r.pct / 20);
    document.getElementById("ww-ev").innerHTML =
      "Based on your real record (<b>" + r.w + "/" + r.p + "</b> " + (hard ? "hard" : "classic") +
      " levels cleared), you win this wager about <b>" + inWords(winsIn5) + " in 5</b>. " +
      "Average return: <b>" + (r.pct / 100 * pay).toFixed(1) + " 🎟️</b> per " + w + " wagered.";

    // modes
    document.getElementById("ww-mode-c").classList.toggle("on", !hard);
    document.getElementById("ww-mode-h").classList.toggle("on", hard);

    // play button
    var play = document.getElementById("ww-play");
    var enough = st.tickets >= w;
    play.disabled = busy || !enough;
    var need = w - st.tickets;
    document.getElementById("ww-play-main").textContent = enough
      ? "▶ Play level · wager " + w + " 🎟️"
      : "🎟️ Need " + need + " more ticket" + (need > 1 ? "s" : "");
    document.getElementById("ww-play-sub").textContent = enough
      ? "clear it → 🎟️ " + pay + " + " + pts + " pts · " + r.pct + "% of your " + (hard ? "hard " : "") + "levels clear"
      : "lower your wager, or take the free path below — no purchase needed";

    // free path
    document.getElementById("ww-free-txt").innerHTML =
      "<b>🆓 FREE PATH — always open</b><br>" +
      '<span data-regen>' + regenText() + "</span><br>" +
      "Or play a level with <b>no wager</b>: win it and earn <b>+1 🎟️</b> (nothing at risk).";

    // boost card
    var bx = document.getElementById("ww-boost");
    bx.classList.toggle("owned", st.boost);
    document.getElementById("ww-boost-txt").innerHTML = st.boost
      ? "<b>🛡️ Confidence Boost — ACTIVE</b><br>Every losing wager refunds 50% of your stake for the rest of the event. It does <b>not</b> change your odds."
      : "<b>🛡️ Confidence Boost</b> — insurance, not luck.<br>Refunds <b>50% of your stake on every loss</b> for the whole event. Your clear rate is unchanged.";
    document.getElementById("ww-boost-buy").style.display = st.boost ? "none" : "";

    // points track
    document.getElementById("ww-pts").textContent = st.points + " pts";
    document.getElementById("ww-linefill").style.width = Math.min(100, (st.points / TOP_P) * 100) + "%";
    var ready = -1;
    MILES.forEach(function (mi, i) {
      var n = document.getElementById("ww-node-" + i);
      var done = i < st.claimed;
      var can = !done && st.points >= mi.p && i === st.claimed;
      n.classList.toggle("done", done);
      n.classList.toggle("ready", can);
      if (can) ready = i;
    });
    var cb = document.getElementById("ww-claim");
    cb.style.display = ready >= 0 ? "" : "none";
    if (ready >= 0) cb.innerHTML = "🎁 Claim milestone " + (ready + 1) + " — " + MILES[ready].rw.map(function (x) { return SB.icon(x.type) + " " + SB.fmt(x.amount); }).join(" + ");
    var nextM = MILES[st.claimed];
    document.getElementById("ww-track-foot").innerHTML = nextM
      ? "Next: <b>" + nextM.p + " pts</b> → " + nextM.rw.map(function (x) { return SB.icon(x.type) + SB.fmt(x.amount); }).join(" + ") +
        " · <b>" + Math.max(0, nextM.p - st.points) + "</b> to go. Milestones are permanent — even a losing run keeps every one you reach."
      : "🏆 All 5 milestones claimed — every wagered win still pays tickets and points.";

    // stats
    document.getElementById("ww-st-won").textContent = st.won;
    document.getElementById("ww-st-lost").textContent = st.lost;
    document.getElementById("ww-st-big").textContent = st.big ? "🎟️ " + st.big : "—";
    document.getElementById("ww-st-streak").textContent = st.streak + (st.best > st.streak ? " (best " + st.best + ")" : "");
    document.getElementById("ww-freeplay").disabled = busy;
    document.getElementById("ww-mode-c").disabled = busy;
    document.getElementById("ww-mode-h").disabled = busy;
  }

  // ---------- flying ticket FX ----------
  function rectOf(id) {
    var e = document.getElementById(id);
    return e ? e.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
  }
  function flyStub(fromR, toR, delay, cls) {
    var el = document.createElement("span");
    el.className = "ww-stub " + (cls || "") + " ww-fly";
    el.innerHTML = "<i></i>";
    el.style.left = (fromR.left + fromR.width / 2 - 19 + (Math.random() * 20 - 10)) + "px";
    el.style.top = (fromR.top + fromR.height / 2 - 12) + "px";
    document.body.appendChild(el);
    setTimeout(function () {
      el.classList.add("anim");
      el.style.left = (toR.left + toR.width / 2 - 19 + (Math.random() * 30 - 15)) + "px";
      el.style.top = (toR.top + toR.height / 2 - 12 + (Math.random() * 20 - 10)) + "px";
      el.style.transform = "rotate(" + (Math.random() * 60 - 30) + "deg) scale(.85)";
      setTimeout(function () { el.style.opacity = "0"; el.remove(); }, 620);
    }, delay + 20);
  }
  function rainIntoPot(n, done) {
    var pot = rectOf("ww-pot");
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          var el = document.createElement("span");
          el.className = "ww-stub ww-rain";
          el.innerHTML = "<i></i>";
          el.style.left = (pot.left + pot.width / 2 - 19 + (Math.random() * 90 - 45)) + "px";
          el.style.top = "-40px";
          document.body.appendChild(el);
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              el.style.top = (pot.top + pot.height / 2 - 12) + "px";
              el.style.transform = "rotate(" + (Math.random() * 90 - 45) + "deg)";
              el.style.opacity = "0";
            });
          });
          setTimeout(function () { el.remove(); }, 950);
        }, i * 55);
      })(i);
    }
    setTimeout(done, n * 55 + 500);
  }
  function payoutToPlayer(n) {
    var pot = rectOf("ww-pot"), chip = rectOf("ww-tixchip");
    for (var i = 0; i < Math.min(n, 12); i++) flyStub(pot, chip, i * 60);
    SB.haptic(30);
  }

  // ---------- play ----------
  function recordResult(hard, won) {
    if (hard) { st.hp++; if (won) st.hw++; }
    else { st.cp++; if (won) st.cw++; }
  }

  function wagerPlay() {
    if (busy) return;
    var w = st.wager, hard = !!st.hard;
    if (st.tickets < w) return;
    busy = true;
    st.tickets -= w;
    S.save(); render();
    // stake flies into the pot
    flyStub(rectOf("ww-pile"), rectOf("ww-pot"), 0, "");
    if (w > 1) flyStub(rectOf("ww-pile"), rectOf("ww-pot"), 110, "");
    if (w > 2) flyStub(rectOf("ww-pile"), rectOf("ww-pot"), 220, "");
    SB.haptic(15);

    setTimeout(function () {
      SB.playLevel(simOpts(hard)).then(function (res) {
        recordResult(hard, res.won);
        if (res.won) onWin(w, hard);
        else onLoss(w, hard, res);
      });
    }, 640);
  }

  function onWin(w, hard) {
    var pay = payout(w, hard), pts = points(w, hard);
    st.tickets += pay;
    st.points += pts;
    st.won++; st.streak++;
    if (st.streak > st.best) st.best = st.streak;
    if (pay > st.big) st.big = pay;
    S.save();
    SB.haptic(25);
    rainIntoPot(Math.min(pay, 9), function () {
      payoutToPlayer(pay);
      render();
      SB.confetti(window.innerWidth / 2, window.innerHeight * 0.42, 70);
      var m = SB.modal(
        '<h3 style="margin:0">💰 WAGER WON!</h3>' +
        '<div class="sb-muted" style="font-size:12.5px;font-weight:700">' + w + " 🎟️ at ×" + mult(w, hard) + (hard ? " (hard level)" : "") + "</div>" +
        '<div class="ww-winamt">🎟️ +' + pay + "</div>" +
        '<div class="sb-row" style="justify-content:center;flex-wrap:wrap;gap:6px">' +
        SB.rewardChip({ type: "star", amount: pts }).replace("Stars", "Event Points") +
        (st.streak > 1 ? '<span class="sb-reward"><span class="ico">🔥</span>' + st.streak + " win streak</span>" : "") +
        "</div>" +
        '<div class="sb-muted" style="font-size:11.5px;font-weight:700;margin-top:9px">Your clear record is now <b>' +
        (hard ? st.hw + "/" + st.hp + " hard" : st.cw + "/" + st.cp + " classic") + "</b> — the arena odds updated with it.</div>" +
        '<button class="sb-btn sb-btn-green sb-btn-block" id="ww-win-ok" style="margin-top:12px">Wager again</button>',
        function () { busy = false; render(); checkMilestone(); }
      );
      m.el.querySelector("#ww-win-ok").addEventListener("click", function () { m.close(); });
    });
  }

  function onLoss(w, hard, res) {
    var refund = st.boost ? Math.floor(w / 2) : 0;
    if (refund) st.tickets += refund;
    st.lost++; st.streak = 0;
    if (!st.regenTs && st.tickets < CAP) st.regenTs = Date.now() + REGEN_MS;
    S.save(); render();
    SB.haptic(35);
    var cl = res.cardsLeft || 1;
    var cards = "";
    for (var i = 0; i < cl; i++) cards += '<span class="sb-card wild">SKIP·BO</span>';

    var m = SB.modal(
      '<div class="ww-lossbox">' +
      '<h3 style="margin:0">😤 So close!</h3>' +
      '<div class="ww-nearmiss">' + cards +
      '<div style="font-size:12.5px;font-weight:800;text-align:left">You were <b>' + cl + " card" + (cl > 1 ? "s" : "") + "</b><br>away from clearing it.</div></div>" +
      '<div class="sb-muted" style="font-size:12.5px;font-weight:700">' +
      (refund
        ? "🛡️ Confidence Boost refunded <b>" + refund + " 🎟️</b> of your " + w + "-ticket stake."
        : "Your " + w + " 🎟️ stake stays in the house pot.") +
      " Your record: <b>" + (hard ? st.hw + "/" + st.hp + " hard" : st.cw + "/" + st.cp + " classic") + "</b> (" + rate(hard).pct + "%).</div>" +

      '<div class="ww-freebox">' +
      "🆓 <b>Free ways to keep going — no purchase needed:</b><br>" +
      '<span data-regen>' + regenText() + "</span>" +
      '<div class="rowb"><span style="flex:1 1 auto">Or play a level with <b>no wager</b> — win it and take <b>+1 🎟️</b>.</span>' +
      '<button class="sb-btn sb-btn-green sb-btn-sm" id="ww-loss-free">▶ Free play</button></div>' +
      "</div>" +

      (st.boost ? "" :
        '<div class="ww-offer"><div><b>🛡️ Confidence Boost — $2.99</b><br>50% of every future losing stake comes back. Would have returned <b>' +
        Math.floor(w / 2) + " 🎟️</b> just now. Odds unchanged.</div>" +
        '<button class="sb-btn sb-btn-yellow sb-btn-sm" id="ww-loss-boost">Get it</button></div>') +

      '<div class="ww-offer"><div><b>🎟️ Ticket Pack — $0.99</b><br>10 wager tickets, instantly. The free regen above keeps running either way.</div>' +
      '<button class="sb-btn sb-btn-blue sb-btn-sm" id="ww-loss-pack">Buy</button></div>' +

      '<button class="sb-sheet-cancel" id="ww-loss-close">Keep playing free</button>' +
      "</div>",
      function () { busy = false; render(); }
    );
    m.el.querySelector("#ww-loss-close").addEventListener("click", function () { m.close(); });
    m.el.querySelector("#ww-loss-free").addEventListener("click", function () {
      m.close(true); busy = false; render(); freePlay();
    });
    m.el.querySelector("#ww-loss-pack").addEventListener("click", function () { buyPack(function () { m.close(true); busy = false; render(); }); });
    var bb = m.el.querySelector("#ww-loss-boost");
    if (bb) bb.addEventListener("click", function () { buyBoost(function () { m.close(true); busy = false; render(); }); });
  }

  // ---------- free, no-wager play ----------
  function freePlay() {
    if (busy) return;
    busy = true; render();
    SB.playLevel(simOpts(false)).then(function (res) {
      recordResult(false, res.won);
      if (res.won) {
        st.tickets++;
        S.save(); render();
        flyStub(rectOf("ww-pot"), rectOf("ww-tixchip"), 0);
        SB.toast("🎟️ +1 ticket earned — nothing was at risk.");
        SB.confetti(window.innerWidth / 2, window.innerHeight * 0.4, 40);
      } else {
        S.save(); render();
        SB.toast("No ticket this time — but you risked nothing. Try again free.");
      }
      busy = false; render();
    });
  }

  // ---------- milestones ----------
  function checkMilestone() {
    if (st.claimed < MILES.length && st.points >= MILES[st.claimed].p) {
      SB.toast("🏅 Milestone " + (st.claimed + 1) + " unlocked — claim it below!");
      var n = document.getElementById("ww-node-" + st.claimed);
      if (n) n.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
  document.getElementById("ww-claim").addEventListener("click", function (e) {
    var i = st.claimed;
    if (i >= MILES.length || st.points < MILES[i].p) return;
    st.claimed++;
    S.save();
    SB.grantRewards(MILES[i].rw, e.currentTarget);
    SB.confetti();
    render();
  });

  // ---------- IAPs ----------
  function buyBoost(after) {
    SB.buyIAP({
      label: "🛡️ Confidence Boost", price: "$2.99",
      sub: "Event-long insurance: 50% of every losing stake refunded. Does not change your clear rate.",
      contents: [], grant: false,
      onSuccess: function () {
        st.boost = true; S.save(); render();
        SB.toast("🛡️ Confidence Boost active — half of every losing stake comes back.");
        SB.confetti();
        if (after) after();
      }
    });
  }
  function buyPack(after) {
    SB.buyIAP({
      label: "🎟️ Ticket Pack", price: "$0.99",
      sub: "10 wager tickets. Free regen (1 per 30 min) keeps running either way.",
      contents: [{ type: "token", amount: 10 }], grant: false,
      onSuccess: function () {
        st.tickets += 10; S.save(); render();
        flyStub(rectOf("ww-pot"), rectOf("ww-tixchip"), 0);
        SB.toast("🎟️ +10 wager tickets!");
        if (after) after();
      }
    });
  }
  function buyBigPack(after) {
    SB.buyIAP({
      label: "🎟️ High Roller Pack", price: "$4.99",
      sub: "30 wager tickets + Confidence Boost for the whole event.",
      contents: [{ type: "token", amount: 30 }], grant: false,
      onSuccess: function () {
        st.tickets += 30; st.boost = true; S.save(); render();
        SB.toast("🎟️ +30 tickets · 🛡️ Confidence Boost active!");
        SB.confetti();
        if (after) after();
      }
    });
  }
  document.getElementById("ww-boost-buy").addEventListener("click", function () { buyBoost(); });
  document.getElementById("ww-tixchip").addEventListener("click", function () { storeSheet(); });

  function storeSheet() {
    var m = SB.modal(
      '<h3 style="margin:0 0 2px">🎟️ Wager Shop</h3>' +
      '<div class="sb-muted" style="font-size:12px;font-weight:700">Everything here is optional. The free path below never closes.</div>' +
      '<div class="ww-offer"><div><b>🛡️ Confidence Boost — $2.99</b><br>50% of every losing stake refunded, all event. Odds unchanged.</div>' +
      '<button class="sb-btn sb-btn-yellow sb-btn-sm" id="ww-sh-boost">' + (st.boost ? "Owned" : "$2.99") + "</button></div>" +
      '<div class="ww-offer"><div><b>🎟️ Ticket Pack — $0.99</b><br>10 wager tickets.</div>' +
      '<button class="sb-btn sb-btn-blue sb-btn-sm" id="ww-sh-pack">$0.99</button></div>' +
      '<div class="ww-offer"><div><b>👑 High Roller — $4.99</b><br>30 tickets <i>and</i> the Confidence Boost. Best value.</div>' +
      '<button class="sb-btn sb-btn-green sb-btn-sm" id="ww-sh-big">$4.99</button></div>' +
      '<div class="ww-freebox">🆓 <b>Free path:</b> <span data-regen>' + regenText() + "</span><br>Plus <b>+1 🎟️</b> for every no-wager level you clear — unlimited.</div>" +
      '<button class="sb-sheet-cancel" id="ww-sh-close">Close</button>'
    );
    m.el.querySelector("#ww-sh-close").addEventListener("click", function () { m.close(); });
    var b = m.el.querySelector("#ww-sh-boost");
    b.disabled = st.boost;
    b.addEventListener("click", function () { buyBoost(function () { m.close(true); }); });
    m.el.querySelector("#ww-sh-pack").addEventListener("click", function () { buyPack(function () { m.close(true); }); });
    m.el.querySelector("#ww-sh-big").addEventListener("click", function () { buyBigPack(function () { m.close(true); }); });
  }

  // ---------- controls ----------
  document.getElementById("ww-minus").addEventListener("click", function () { st.wager = Math.max(1, st.wager - 1); S.save(); SB.haptic(8); render(); });
  document.getElementById("ww-plus").addEventListener("click", function () {
    if (st.wager >= 3) { SB.toast("3 tickets is the maximum wager."); return; }
    st.wager++; S.save(); SB.haptic(8); render();
    if (st.wager > st.tickets) SB.toast("You hold " + st.tickets + " 🎟️ — earn more free below, no purchase needed.");
  });
  document.getElementById("ww-mode-c").addEventListener("click", function () { st.hard = false; S.save(); render(); });
  document.getElementById("ww-mode-h").addEventListener("click", function () { st.hard = true; S.save(); render(); });
  document.getElementById("ww-play").addEventListener("click", wagerPlay);
  document.getElementById("ww-freeplay").addEventListener("click", freePlay);

  // ---------- rules ----------
  document.getElementById("ww-info").addEventListener("click", function () {
    SB.modal(
      '<h3 style="margin:0 0 8px">📜 Wild Card Wager</h3>' +
      '<ul class="ww-rules">' +
      "<li>🎮 <b>Every wager is settled by a real Adventure level.</b> Level completion is the only fuel — nothing here resolves on a hidden roll.</li>" +
      "<li>🎟️ You hold <b>Wager Tickets</b>. Before a level, stake <b>1–3</b> of them on yourself.</li>" +
      "<li>📊 <b>Visible odds:</b> the arena shows <i>your own</i> clear rate, counted live from the levels you actually play (classic and hard tracked separately). That percentage <b>is</b> the wager's odds — there is no house edge on top.</li>" +
      "<li>📈 <b>Payout ladder:</b> classic ×2 / ×2.5 / ×3 for 1 / 2 / 3 tickets. Hard levels pay ×2.5 / ×3.25 / <b>×4</b> — at a lower clear rate that we show you before you commit.</li>" +
      "<li>💥 Lose and the stake goes to the pot. Wins pay tickets <b>and</b> event points.</li>" +
      "<li>🏅 <b>Event points</b> fill a 5-stop milestone track. Milestones are permanent — an unlucky player still walks away with coins, wilds, gems and a chest.</li>" +
      "<li>🆓 <b>Free path, always visible:</b> 1 free ticket every 30 min (up to " + CAP + "), and <b>+1 ticket for any no-wager level you clear</b> — unlimited.</li>" +
      "<li>🛡️ <b>Confidence Boost ($2.99)</b> is insurance, not luck: it refunds 50% of losing stakes. It <b>never</b> changes your clear rate. Ticket packs only refill the stake you'd otherwise wait for.</li>" +
      "<li>⏳ Runs <b>2 days, twice a month</b> (timer compressed for this demo).</li>" +
      "</ul>" +
      '<div style="text-align:left;font-size:11.5px;line-height:1.5;color:#5a6b8c;font-weight:700;border-top:1px solid rgba(27,42,74,.15);padding-top:8px">' +
      "<b>Why it works (design note):</b> engagement — the wager turns an ordinary level into a self-set stakes decision, and the ticket meter creates a return loop every 30 min. " +
      "Monetization — the loss moment is the only sell, and it is honest: insurance and refills, never odds. " +
      "The milestone track guarantees a payoff for unlucky players, which is what keeps a wager event from feeling punitive.</div>" +
      '<button class="sb-btn sb-btn-blue sb-btn-block" style="margin-top:12px" onclick="this.closest(\'.sb-modal-backdrop\').remove()">Got it!</button>'
    );
  });

  // ---------- boot ----------
  if (!st.regenTs && st.tickets < CAP) st.regenTs = Date.now() + REGEN_MS;
  S.save();
  SB.countdown(document.getElementById("ww-timer"), st.endTs, function () { SB.toast("⏳ Event ended — thanks for playing!"); });
  setInterval(regenTick, 1000);
  regenTick();
  render();
  window.__ww = {
    state: st, save: S.save, render: render,
    payout: payout, mult: mult, points: points, rate: rate,
    shop: storeSheet
  };
})();
</script>
</body>
</html>
