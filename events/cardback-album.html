<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Card-Back Collection Album — Skip-Bo Event</title>
<link rel="stylesheet" href="../shared/core.css">
<style>
/* ---------- layout ---------- */
.sb-main { padding-bottom: calc(env(safe-area-inset-bottom,0px) + 150px); }
.sb-demo-reset { bottom: calc(env(safe-area-inset-bottom,0px) + 96px); }
.hdr-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.pr-badge { display:inline-flex; align-items:center; gap:4px; background:linear-gradient(180deg,#ffd95e,#e0a400); color:var(--sb-ink); font-weight:900; font-size:12px; border-radius:999px; padding:4px 11px; box-shadow:var(--sb-shadow); white-space:nowrap; }
.info-btn { margin-left:auto; width:44px; height:44px; border-radius:50%; border:none; background:rgba(255,255,255,.18); color:#fff; font-size:19px; font-weight:900; cursor:pointer; }
.sb-timer-chip { min-height:30px; cursor:pointer; }

/* ---------- card-back art (the stars of the show) ---------- */
.cba { position:relative; width:100%; aspect-ratio:2/2.8; border-radius:10px; border:2.5px solid rgba(255,255,255,.9); box-shadow:0 3px 8px rgba(0,0,0,.3), inset 0 0 0 2px rgba(0,0,0,.14); overflow:hidden; }
.cba::before { position:absolute; inset:0; display:grid; place-items:center; font-weight:900; }
.cba.emb::before { width:44%; aspect-ratio:1; inset:auto; left:28%; top:34%; background:rgba(255,255,255,.94); border-radius:50%; border:2px solid rgba(0,0,0,.12); font-size:clamp(13px,4.5vw,20px); }
/* commons */
.a1 { background:repeating-linear-gradient(45deg,#1D4FA1 0 8px,#3E8EDE 8px 16px); }
.a1::before { content:"SB"; color:#1D4FA1; border-color:#FFC72C !important; }
.a2 { background:repeating-conic-gradient(from 8deg at 50% 44%,#FFC72C 0 15deg,#ff9a2c 15deg 30deg); }
.a2::before { content:"☀"; color:#D7263D; }
.a3 { background:linear-gradient(135deg,#2E9E4F 25%,#1f7038 25% 50%,#2E9E4F 50% 75%,#1f7038 75%); background-size:22px 22px; }
.a3::before { content:"♦"; color:#1f7038; }
.a4 { background-color:#D7263D; background-image:radial-gradient(#fff 15%,transparent 16%),radial-gradient(#FFC72C 15%,transparent 16%); background-size:18px 18px; background-position:0 0,9px 9px; }
.a4::before { content:"♥"; color:#D7263D; }
/* rares */
.a5 { background:#5b2a86; background-image:repeating-linear-gradient(45deg,rgba(255,215,0,.4) 0 2px,transparent 2px 11px),repeating-linear-gradient(-45deg,rgba(255,215,0,.4) 0 2px,transparent 2px 11px); }
.a5::before { content:"👑"; }
.a6 { background:#0b7fa8; background-image:repeating-radial-gradient(circle at 50% 135%,rgba(255,255,255,.28) 0 3px,transparent 3px 14px),radial-gradient(circle at 50% -20%,#9be8ff 0 30%,transparent 46%); }
.a6::before { content:"🌊"; }
.a7 { background-color:#141230; background-image:radial-gradient(ellipse at 50% 120%,rgba(255,0,200,.55),transparent 62%),linear-gradient(rgba(0,255,240,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,200,.32) 1px,transparent 1px); background-size:auto,11px 11px,11px 11px; }
.a7::before { content:"SB"; color:#7dfcff; font-size:clamp(15px,5vw,24px); letter-spacing:1px; text-shadow:0 0 6px #00fff0,0 0 16px #ff00c8,0 0 30px #ff00c8; }
/* epics */
.a8 { background:conic-gradient(from 210deg,#8a5a00,#f6d365,#b8860b,#fff2b0,#d4af37,#8a5a00); }
.a8 { background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 3px,transparent 3px 9px),conic-gradient(from 210deg,#8a5a00,#f6d365,#b8860b,#fff2b0,#d4af37,#8a5a00); }
.a8::before { content:"❖"; color:#8a5a00; }
.a9 { background-color:#0b0b2a; background-image:radial-gradient(circle at 32% 28%,rgba(140,90,255,.95),transparent 46%),radial-gradient(circle at 70% 68%,rgba(62,142,222,.85),transparent 42%),radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.5px); background-size:auto,auto,13px 13px; }
.a9::before { content:"✦"; color:#fff; font-size:clamp(18px,6vw,30px); text-shadow:0 0 10px #b18cff,0 0 24px #6f4bff; }
/* master (prestige exclusive) + default */
.aM { background:linear-gradient(120deg,#ffd700,#ff8c00,#d7263d,#7e57ff,#3E8EDE,#ffd700); background-size:380% 380%; animation:mShift 5s linear infinite; }
.aM::before { content:"🏆"; }
@keyframes mShift { 0%{background-position:0% 40%;} 50%{background-position:100% 60%;} 100%{background-position:0% 40%;} }
.a0 { background:#1D4FA1; background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.10) 0 6px,transparent 6px 12px),linear-gradient(160deg,#2a5cb0,#14396f); }
.a0::before { content:"SB"; color:#1D4FA1; border-color:rgba(255,199,44,.9) !important; }
/* foil shimmer on epics/master */
.foil::after { content:""; position:absolute; inset:-40%; background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%); animation:foilSweep 2.6s ease-in-out infinite; pointer-events:none; }
@keyframes foilSweep { 0%,55%{transform:translateX(-70%);} 90%,100%{transform:translateX(70%);} }
/* empty slot = embossed outline */
.ghost { background:rgba(27,42,74,.12); border:2.5px dashed rgba(27,42,74,.35); box-shadow:inset 0 2px 6px rgba(0,0,0,.18); }
.ghost::before { content:"?"; inset:0; color:rgba(27,42,74,.35); font-size:26px; }

/* ---------- album grid ---------- */
.album { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.slot { border:none; background:rgba(255,255,255,.92); border-radius:13px; padding:7px 6px 6px; cursor:pointer; box-shadow:var(--sb-shadow); font-family:var(--sb-font); min-height:44px; position:relative; }
.slot:active { transform:scale(.95); }
.slot .nm { font-size:10px; font-weight:800; color:var(--sb-ink); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.slot .rr { font-size:9px; font-weight:900; letter-spacing:.5px; }
.rr.c{color:#7a89a8;} .rr.r{color:var(--sb-sky);} .rr.e{color:var(--sb-yellow-dark);}
.slot.on { background:linear-gradient(180deg,#eafff0,#c9f3d2); outline:2.5px solid var(--sb-green); outline-offset:-2px; }
.slot .eq { display:block; margin-top:2px; color:var(--sb-green-dark); font-size:9px; font-weight:900; letter-spacing:.5px; }
body.p2 .slot { outline:2px solid var(--sb-yellow); outline-offset:-2px; }

/* ---------- fan preview ---------- */
.fanwrap { display:flex; align-items:center; gap:12px; }
.fan { position:relative; width:96px; height:86px; flex:0 0 auto; }
.fan .cba { position:absolute; width:52px; left:22px; top:4px; transform-origin:50% 95%; }
.fan .f1{ transform:rotate(-16deg) translateX(-9px);} .fan .f2{ transform:rotate(0deg) translateY(-4px); z-index:2;} .fan .f3{ transform:rotate(16deg) translateX(9px);}
.fanmeta { color:#fff; min-width:0; }
.fanmeta b { font-size:14px; } .fanmeta small { display:block; font-size:11px; color:var(--sb-sky-light); font-weight:700; }
.mchip { display:inline-flex; align-items:center; gap:4px; margin-top:5px; background:rgba(255,215,0,.2); border:1.5px solid var(--sb-yellow); color:var(--sb-yellow); font-size:11px; font-weight:900; border-radius:999px; padding:3px 9px; cursor:pointer; min-height:26px; }

/* ---------- token meter ---------- */
.meter { background:rgba(255,255,255,.92); border-radius:13px; padding:10px 12px; box-shadow:var(--sb-shadow); margin-top:10px; }
.meter .bar { height:14px; border-radius:999px; background:#dfe6f2; overflow:hidden; margin:6px 0 4px; }
.meter .fill { height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--sb-sky),var(--sb-blue)); transition:width .5s cubic-bezier(.34,1.56,.64,1); }
.meter .cap { font-size:11px; font-weight:700; color:#5a6b8c; }

/* ---------- packs ---------- */
.packs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.pack { border-radius:15px; padding:11px 10px 12px; color:#fff; text-align:center; box-shadow:var(--sb-shadow); position:relative; overflow:hidden; }
.pack.std { background:linear-gradient(180deg,#2a5cb0,#14396f); border:2px solid rgba(255,255,255,.25); }
.pack.prm { background:linear-gradient(180deg,#7a1b8c,#3d0b52); border:2px solid rgba(255,199,44,.6); }
.pack h4 { margin:0; font-size:13px; } .pack .pk { font-size:26px; }
.pips { display:flex; justify-content:center; gap:5px; margin:6px 0; }
.pip { width:13px; height:13px; border-radius:50%; background:rgba(255,255,255,.22); border:1.5px solid rgba(255,255,255,.4); }
.pip.on { background:var(--sb-yellow); border-color:#fff; box-shadow:0 0 6px rgba(255,199,44,.9); }
.odds { font-size:9.5px; font-weight:700; color:rgba(255,255,255,.85); line-height:1.45; margin-bottom:7px; }
.pack .sb-btn { width:100%; font-size:13px; padding:10px 6px; min-height:44px; }
.meter .sb-btn-sm { min-height:44px; }
.pack.ready { animation:readyGlow 1.5s ease-in-out infinite; }
@keyframes readyGlow { 0%,100%{box-shadow:0 0 0 0 rgba(255,199,44,.55), var(--sb-shadow);} 50%{box-shadow:0 0 0 7px rgba(255,199,44,0), 0 0 18px 3px rgba(255,199,44,.85), var(--sb-shadow);} }
.bank { position:absolute; top:6px; right:6px; background:var(--sb-red); font-size:9px; font-weight:900; border-radius:999px; padding:2px 6px; }

/* ---------- set rewards ---------- */
.sets { display:flex; gap:7px; margin-top:10px; }
.setchip { flex:1; background:rgba(255,255,255,.92); border-radius:11px; padding:7px 6px; text-align:center; font-size:10px; font-weight:800; color:var(--sb-ink); box-shadow:var(--sb-shadow); }
.setchip small { display:block; color:#5a6b8c; font-weight:700; font-size:9px; margin-top:2px; }
.setchip.done { background:linear-gradient(180deg,#e9ffe9,#c9f3d2); outline:2px solid var(--sb-green); }

/* ---------- offers ---------- */
.offers { margin-top:12px; }
.offer { background:linear-gradient(120deg,#7a1b2c,#4a0f1b); border:2px solid var(--sb-yellow); border-radius:15px; padding:12px; color:#fff; margin-bottom:9px; box-shadow:var(--sb-shadow); }
.offer h4 { margin:0 0 3px; font-size:14px; color:var(--sb-yellow); }
.offer p { margin:0 0 8px; font-size:11.5px; line-height:1.45; }
.offer .free { font-size:10.5px; color:#ffd9a0; font-weight:700; margin-top:6px; }
.offer .sb-btn-sm { min-height:44px; font-size:14px; padding:10px 18px; }
.fday { background:var(--sb-red); color:#fff; font-weight:900; font-size:12px; text-align:center; border-radius:10px; padding:7px; margin-bottom:9px; animation:sbPulse 1.2s infinite; }

/* ---------- stats + play bar ---------- */
.stats { margin-top:14px; text-align:center; color:var(--sb-sky-light); font-size:11.5px; font-weight:700; }
.playbar { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px; z-index:120; display:flex; gap:9px; padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px); background:linear-gradient(180deg,rgba(20,57,111,0) 0%,rgba(13,32,64,.96) 32%); }
.playbar .sb-btn { flex:1; flex-direction:column; gap:1px; padding:9px 6px; }
.playbar .sb-btn small { font-size:10px; font-weight:800; opacity:.9; }

/* ---------- reveal modal ---------- */
.rvrow { display:flex; justify-content:center; gap:16px; margin:12px 0 4px; }
.rvc { width:104px; perspective:600px; cursor:pointer; }
.rvin { position:relative; width:100%; aspect-ratio:2/2.8; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.34,1.3,.64,1); }
.rvc.flip .rvin { transform:rotateY(180deg); }
.rvf, .rvb { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:10px; }
.rvb { transform:rotateY(180deg); }
.rvc .cba { height:100%; }
.rvc.flip.gc .rvin { box-shadow:0 0 16px rgba(160,175,200,.9); border-radius:10px; }
.rvc.flip.gr .rvin { box-shadow:0 0 20px rgba(62,142,222,1); border-radius:10px; }
.rvc.flip.ge .rvin { box-shadow:0 0 26px rgba(255,199,44,1); border-radius:10px; }
.rvlab { margin-top:7px; font-size:11px; font-weight:900; min-height:28px; opacity:0; transition:opacity .3s .25s; }
.rvc.flip + .rvlab, .rvlab.show { opacity:1; }
.rvlab .new { color:var(--sb-green); } .rvlab .dup { color:#8a5a00; }
.bigcba { width:130px; margin:10px auto; }
.pickgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0; }
.pickgrid .slot { box-shadow:0 2px 6px rgba(0,0,0,.2); background:#fff; }
.ceremony h2 { margin:4px 0 8px; color:var(--sb-ink); }
.chestrow { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:10px 0 14px; }
</style>
</head>
<body>
<div class="sb-app">
<div class="sb-main">

  <div class="hdr-row">
    <span class="sb-timer-chip" id="chip" title="tap to fast-forward (demo)">⏳ <span id="cd">—</span></span>
    <span class="pr-badge" id="prb">🏅 Prestige I</span>
    <button class="info-btn" id="infoBtn" aria-label="Event info">ⓘ</button>
  </div>

  <div class="sb-panel-blue fanwrap">
    <div class="fan" id="fan"></div>
    <div class="fanmeta">
      <b id="eqName">Standard Back</b>
      <small>Equipped card back — shown in every match</small>
      <span class="mchip" id="mchip" style="display:none">🏆 Equip Master back</span>
    </div>
  </div>

  <div style="height:12px"></div>
  <div class="album" id="album"></div>

  <div class="meter" id="meter">
    <b style="font-size:13px" id="tkLab">🎟️ Wild Tokens — 0/8</b>
    <div class="bar"><div class="fill" id="tkFill"></div></div>
    <div class="cap">Duplicates are never wasted: each converts to +1 🎟️. <b>Any missing card guaranteed at 8 tokens.</b></div>
    <button class="sb-btn sb-btn-yellow sb-btn-sm sb-btn-block" id="claimBtn" style="margin-top:8px">🎟️ Claim any missing card — 8 tokens</button>
  </div>

  <div class="sets" id="sets"></div>

  <div class="packs">
    <div class="pack std" id="packS">
      <span class="bank" id="bankS" style="display:none"></span>
      <div class="pk">🎴</div><h4>Standard Pack</h4>
      <div class="pips" id="pipS"></div>
      <div class="odds" id="oddsS"></div>
      <button class="sb-btn sb-btn-blue" id="openS">Open pack</button>
    </div>
    <div class="pack prm" id="packP">
      <span class="bank" id="bankP" style="display:none"></span>
      <div class="pk">✨</div><h4>Premium Pack</h4>
      <div class="pips" id="pipP"></div>
      <div class="odds" id="oddsP"></div>
      <button class="sb-btn sb-btn-yellow" id="openP">Open pack</button>
    </div>
  </div>

  <div class="offers" id="offers"></div>
  <div class="stats" id="stats"></div>
</div>
</div>

<div class="playbar">
  <button class="sb-btn sb-btn-green" id="playBtn">▶ Play level<small>win = +1 pack point</small></button>
  <button class="sb-btn sb-btn-red" id="hardBtn">🔥 Hard level<small>win = +1 premium point</small></button>
</div>

<script src="../shared/core.js"></script>
<script src="../shared/levelsim.js"></script>
<script>
(function () {
"use strict";
SB.init({ title: "Card-Back Collection Album", subtitle: "Season 1 · Collect all 9 card backs", resetKey: "cardback-album" });

// ---------- data ----------
var CARDS = [
  { i:"stripe", n:"Classic Stripe", r:"c", a:"a1" },
  { i:"sun",    n:"Sunburst",       r:"c", a:"a2" },
  { i:"deco",   n:"Mint Deco",      r:"c", a:"a3" },
  { i:"candy",  n:"Candy Pop",      r:"c", a:"a4" },
  { i:"crown",  n:"Royal Damask",   r:"r", a:"a5" },
  { i:"tide",   n:"Tide Crest",     r:"r", a:"a6" },
  { i:"neon",   n:"Neon Nights",    r:"r", a:"a7", glow:1 },
  { i:"gold",   n:"Gold Filigree",  r:"e", a:"a8" },
  { i:"nebula", n:"Nebula Royale",  r:"e", a:"a9", glow:1 }
];
var RN = { c:"COMMON ★", r:"RARE ★★", e:"EPIC ★★★" };
var SEASON_MS = 6 * 60 * 1000;          // 6 real min stands in for 72h (demo-compressed)
var VIRT = 72 * 3600 * 1000 / SEASON_MS; // real→virtual factor (×720)
var FINAL_MS = SEASON_MS / 3;            // last "24h"

var S = SB.store("cardback-album", {
  prestige: 1, owned: {}, packPts: 0, premPts: 0, tokens: 0,
  packs: 0, equipped: null, master: false,
  sets: { c:false, r:false, e:false }, endTs: 0, fdShown: false, lvl: 214
});
var st = S.data;
if (!st.endTs || st.endTs < Date.now() - 864e5) { st.endTs = Date.now() + SEASON_MS; S.save(); }

function mult() { return 1 + 0.5 * (st.prestige - 1); }
function odds(prem) {
  var p2 = st.prestige > 1;
  if (prem) return p2 ? { c:.50, r:.38, e:.12 } : { c:.40, r:.40, e:.20 };
  return p2 ? { c:.78, r:.19, e:.03 } : { c:.70, r:.25, e:.05 };
}
function byRar(r) { return CARDS.filter(function (c) { return c.r === r; }); }
function missing() { return CARDS.filter(function (c) { return !st.owned[c.i]; }); }
function newPct(prem) {
  var o = odds(prem), p = 0;
  ["c","r","e"].forEach(function (r) {
    var g = byRar(r), miss = g.filter(function (c) { return !st.owned[c.i]; }).length;
    p += o[r] * miss / g.length;
  });
  return Math.round(p * 100);
}
function rollCard(prem) {
  var o = odds(prem), x = Math.random();
  var r = x < o.c ? "c" : (x < o.c + o.r ? "r" : "e");
  var g = byRar(r), card = g[(Math.random() * g.length) | 0];
  return { card: card, isNew: !st.owned[card.i] };
}
function findCard(id) { return CARDS.filter(function (c) { return c.i === id; })[0]; }
function art(c, cls) {
  var foil = (c.r === "e" || c.a === "aM") ? " foil" : "";
  return '<div class="cba ' + (c.glow ? "" : "emb ") + c.a + foil + " " + (cls || "") + '"></div>';
}

// ---------- renders ----------
function $(s) { return document.querySelector(s); }
function renderAlbum() {
  $("#album").innerHTML = CARDS.map(function (c) {
    var own = !!st.owned[c.i];
    var eq = st.equipped === c.i;
    return '<button class="slot' + (eq ? " on" : "") + '" data-id="' + c.i + '">' +
      (own ? art(c) : '<div class="cba ghost"></div>') +
      '<div class="nm">' + (own ? c.n : "???") + "</div>" +
      (eq ? '<span class="eq">✓ EQUIPPED</span>' : '<div class="rr ' + c.r + '">' + RN[c.r] + "</div>") +
      "</button>";
  }).join("");
}
function renderFan() {
  var c = st.equipped === "master" ? { a:"aM", n:"Season 1 Master", r:"e" } : (st.equipped ? findCard(st.equipped) : { a:"a0", n:"Standard Back", r:"c" });
  $("#fan").innerHTML = ["f1","f2","f3"].map(function (f) { return art(c, f); }).join("");
  $("#eqName").textContent = c.n;
  $("#mchip").style.display = st.master && st.equipped !== "master" ? "" : "none";
}
function renderMeter() {
  var claims = Math.floor(st.tokens / 8);
  $("#tkLab").innerHTML = claims
    ? "🎟️ Wild Tokens — " + st.tokens + " · <span style='color:#2E9E4F'>" + claims + " claim" + (claims > 1 ? "s" : "") + " ready!</span>"
    : "🎟️ Wild Tokens — " + st.tokens + "/8";
  $("#tkFill").style.width = (st.tokens % 8 === 0 && claims ? 100 : (st.tokens % 8) / 8 * 100) + "%";
  $("#claimBtn").disabled = !(claims && missing().length);
}
function renderSets() {
  var defs = [
    { r:"c", lab:"All Commons", rw: SB.fmt(Math.round(300 * mult())) + " 🪙" },
    { r:"r", lab:"All Rares", rw: SB.fmt(Math.round(500 * mult())) + " 🪙 + 1 🃏" },
    { r:"e", lab:"All Epics", rw: SB.fmt(Math.round(800 * mult())) + " 🪙 + 1 💎" }
  ];
  $("#sets").innerHTML = defs.map(function (d) {
    var g = byRar(d.r), have = g.filter(function (c) { return st.owned[c.i]; }).length;
    return '<div class="setchip' + (st.sets[d.r] ? " done" : "") + '">' + d.lab + " " + have + "/" + g.length +
      "<small>" + (st.sets[d.r] ? "✓ claimed" : "reward: " + d.rw) + "</small></div>";
  }).join("");
}
function pips(n, of) {
  var h = "";
  for (var i = 0; i < of; i++) h += '<span class="pip' + (i < Math.min(n, of) ? " on" : "") + '"></span>';
  return h;
}
function renderPacks() {
  var oS = odds(false), oP = odds(true);
  $("#pipS").innerHTML = pips(st.packPts, 3);
  $("#pipP").innerHTML = pips(st.premPts, 2);
  $("#oddsS").innerHTML = "2 cards · New card: <b>" + newPct(false) + "%</b><br>Common " + Math.round(oS.c*100) + "% · Rare " + Math.round(oS.r*100) + "% · Epic " + Math.round(oS.e*100) + "%";
  $("#oddsP").innerHTML = "2 cards · New card: <b>" + newPct(true) + "%</b><br>Common " + Math.round(oP.c*100) + "% · Rare " + Math.round(oP.r*100) + "% · <b>Epic " + Math.round(oP.e*100) + "%</b>";
  var rS = st.packPts >= 3, rP = st.premPts >= 2;
  $("#openS").disabled = !rS; $("#openP").disabled = !rP;
  $("#openS").textContent = rS ? "Open pack!" : "Win " + (3 - st.packPts) + " more level" + (3 - st.packPts > 1 ? "s" : "");
  $("#openP").textContent = rP ? "Open pack!" : "Win " + (2 - st.premPts) + " more hard";
  $("#packS").classList.toggle("ready", rS); $("#packP").classList.toggle("ready", rP);
  var bS = Math.floor(st.packPts / 3), bP = Math.floor(st.premPts / 2);
  $("#bankS").style.display = bS > 1 ? "" : "none"; $("#bankS").textContent = "×" + bS + " ready";
  $("#bankP").style.display = bP > 1 ? "" : "none"; $("#bankP").textContent = "×" + bP + " ready";
}
function renderStats() {
  $("#stats").innerHTML = "🎴 Packs opened: <b>" + st.packs + "</b> · 🏅 Prestige <b>" + roman(st.prestige) + "</b> · 🃏 Collected: <b>" + (9 - missing().length) + "/9</b>";
  $("#prb").textContent = "🏅 Prestige " + roman(st.prestige);
  document.body.classList.toggle("p2", st.prestige > 1);
}
function roman(n) { return ["I","II","III","IV","V","VI","VII","VIII","IX","X"][n - 1] || n; }
function isFinal() { return st.endTs - Date.now() < FINAL_MS; }
function renderOffers() {
  var el = $("#offers");
  if (!isFinal()) { el.innerHTML = ""; return; }
  var miss = missing().slice(0, 2);
  var h = '<div class="fday">⏰ FINAL 24 HOURS — last chance offers!</div>';
  if (miss.length) {
    h += '<div class="offer"><h4>🎯 Complete-Your-Set Pack — $1.99</h4><p>Contains <b>' +
      miss.map(function (c) { return c.n; }).join(" + ") + "</b> — " + miss.length + " of your missing card" + (miss.length > 1 ? "s" : "") + ", guaranteed.</p>" +
      '<button class="sb-btn sb-btn-yellow sb-btn-sm" id="buyTarget">Get it — $1.99</button>' +
      '<div class="free">Free path: keep winning levels — packs stay earnable until the season ends, and 8 🎟️ tokens claim any card.</div></div>';
  }
  h += '<div class="offer"><h4>✨ Premium Pack Bundle — $0.99</h4><p>2 Premium Packs instantly (Epic ' + Math.round(odds(true).e * 100) + "% each card, odds above).</p>" +
    '<button class="sb-btn sb-btn-yellow sb-btn-sm" id="buyPrem">Buy — $0.99</button>' +
    '<div class="free">Free path: the same 2 packs = 4 hard-level wins.</div></div>';
  h += '<div class="offer"><h4>🎟️ Wild Token Bundle — $2.99</h4><p>+8 Wild Tokens = claim <b>any</b> missing card immediately.</p>' +
    '<button class="sb-btn sb-btn-yellow sb-btn-sm" id="buyTok">Buy — $2.99</button>' +
    '<div class="free">Free path: every duplicate card = +1 token, no purchase needed.</div></div>';
  el.innerHTML = h;
  if ($("#buyTarget")) $("#buyTarget").addEventListener("click", function () {
    SB.buyIAP({ label: "Complete-Your-Set Pack", price: "$1.99", grant: false,
      sub: "Guaranteed: " + miss.map(function (c) { return c.n; }).join(" + "),
      onSuccess: function () {
        miss.forEach(function (c) { st.owned[c.i] = true; });
        S.save(); renderAll(); SB.confetti(); SB.toast("🎉 " + miss.map(function (c) { return c.n; }).join(" + ") + " added to your album!");
        setTimeout(checkCompletions, 700);
      } });
  });
  $("#buyPrem").addEventListener("click", function () {
    SB.buyIAP({ label: "Premium Pack Bundle", price: "$0.99", grant: false, sub: "2 Premium Packs, ready to open",
      onSuccess: function () { st.premPts += 4; S.save(); renderAll(); SB.toast("✨ 2 Premium Packs ready — open them!"); } });
  });
  $("#buyTok").addEventListener("click", function () {
    SB.buyIAP({ label: "Wild Token Bundle", price: "$2.99", grant: false, sub: "+8 🎟️ = one guaranteed card of your choice",
      onSuccess: function () { st.tokens += 8; S.save(); renderAll(); SB.toast("🎟️ +8 Wild Tokens — claim any card!"); } });
  });
}
function renderAll() { renderAlbum(); renderFan(); renderMeter(); renderSets(); renderPacks(); renderStats(); renderOffers(); }

// ---------- fly helper ----------
function flyTo(icon, fx, fy, toEl) {
  var r = toEl.getBoundingClientRect(), el = document.createElement("div");
  el.className = "sb-fly"; el.textContent = icon;
  el.style.left = fx + "px"; el.style.top = fy + "px";
  document.body.appendChild(el);
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    el.style.left = (r.left + r.width / 2) + "px"; el.style.top = (r.top + r.height / 2) + "px";
    el.style.transform = "scale(.5)";
  }); });
  setTimeout(function () { el.remove(); }, 750);
}

// ---------- fuel: play levels ----------
function play(hard) {
  var wr; if (window.__forceWin === true) wr = 1; else if (window.__forceWin === false) wr = 0;
  var btn = hard ? $("#hardBtn") : $("#playBtn");
  btn.disabled = true; $("#playBtn").disabled = true; $("#hardBtn").disabled = true;
  SB.playLevel({ hard: hard, winRate: wr, instant: !!window.__instant, title: "Adventure Level " + st.lvl })
  .then(function (res) {
    $("#playBtn").disabled = false; $("#hardBtn").disabled = false;
    st.lvl++;
    if (res.won) {
      if (hard) { st.premPts++; SB.toast("🔥 +1 Premium pack point!"); }
      else { st.packPts++; SB.toast("🎴 +1 Pack point!"); }
      var r = btn.getBoundingClientRect();
      flyTo(hard ? "✨" : "🎴", r.left + r.width / 2, r.top, hard ? $("#packP") : $("#packS"));
    } else SB.toast("So close! No pack point — try again.");
    S.save(); renderAll();
  });
}
$("#playBtn").addEventListener("click", function () { play(false); });
$("#hardBtn").addEventListener("click", function () { play(true); });

// ---------- pack opening ----------
function openPack(prem) {
  var cost = prem ? 2 : 1e9;
  if (prem) { if (st.premPts < 2) return; st.premPts -= 2; }
  else { if (st.packPts < 3) return; st.packPts -= 3; }
  st.packs++;
  var results = [];
  for (var k = 0; k < 2; k++) {
    var res = rollCard(prem);
    if (res.isNew) st.owned[res.card.i] = true; else st.tokens++;
    results.push(res);
  }
  S.save(); renderPacks();
  showReveal(results, prem);
}
function showReveal(results, prem) {
  var html = '<h3 style="margin:0">' + (prem ? "✨ Premium Pack" : "🎴 Standard Pack") + "</h3>" +
    '<div class="sb-muted" style="font-size:11px">Tap cards to reveal</div><div class="rvrow">' +
    results.map(function (res, i) {
      var c = res.card;
      return '<div><div class="rvc g' + c.r + '" data-i="' + i + '"><div class="rvin">' +
        '<div class="rvf"><div class="cba emb a0" style="height:100%"></div></div>' +
        '<div class="rvb">' + art(c) + "</div></div></div>" +
        '<div class="rvlab" id="rvl' + i + '"><b>' + c.n + "</b><br>" +
        (res.isNew ? '<span class="new">NEW! ' + RN[c.r] + "</span>" : '<span class="dup">Duplicate → +1 🎟️</span>') + "</div></div>";
    }).join("") + "</div>" +
    '<button class="sb-btn sb-btn-green sb-btn-block" id="rvDone" disabled>Done</button>';
  var m = SB.modal(html, afterReveal);
  var flipped = 0;
  function flip(el) {
    if (el.classList.contains("flip")) return;
    el.classList.add("flip"); SB.haptic(12);
    document.getElementById("rvl" + el.dataset.i).classList.add("show");
    var r = results[+el.dataset.i];
    if (r.card.r === "e" && r.isNew) { var b = el.getBoundingClientRect(); SB.confetti(b.left + b.width / 2, b.top, 40); }
    if (++flipped === results.length) m.el.querySelector("#rvDone").disabled = false;
  }
  var cards = m.el.querySelectorAll(".rvc");
  cards.forEach(function (el) { el.addEventListener("click", function () { flip(el); }); });
  setTimeout(function () { flip(cards[0]); }, 700);
  setTimeout(function () { flip(cards[1]); }, 1300);
  m.el.querySelector("#rvDone").addEventListener("click", function () { m.close(); });
  function afterReveal() {
    results.forEach(function (res, i) {
      if (!res.isNew) setTimeout(function () {
        flyTo("🎟️", window.innerWidth / 2 + (i ? 60 : -60), window.innerHeight / 2, $("#meter"));
      }, i * 160);
    });
    setTimeout(function () { renderAll(); checkCompletions(); }, 550);
  }
}
$("#openS").addEventListener("click", function () { openPack(false); });
$("#openP").addEventListener("click", function () { openPack(true); });

// ---------- completions: sets → album → prestige ----------
function checkCompletions() {
  var queue = [];
  [{ r:"c", coins:300, extra:null }, { r:"r", coins:500, extra:{ type:"wild", amount:1 } }, { r:"e", coins:800, extra:{ type:"gem", amount:1 } }].forEach(function (d) {
    if (st.sets[d.r]) return;
    if (byRar(d.r).every(function (c) { return st.owned[c.i]; })) {
      st.sets[d.r] = true;
      var rw = [{ type:"coins", amount: Math.round(d.coins * mult()) }];
      if (d.extra) rw.push(d.extra);
      queue.push({ lab: RN[d.r].split(" ")[0] + " set complete!", rw: rw });
    }
  });
  S.save();
  function next() {
    var q = queue.shift();
    if (!q) { if (missing().length === 0) ceremony(); else renderAll(); return; }
    SB.grantRewards(q.rw);
    var m = SB.modal('<h3>🏆 ' + q.lab + "</h3><div class='chestrow'>" + q.rw.map(SB.rewardChip).join("") + "</div>" +
      '<button class="sb-btn sb-btn-green sb-btn-block" id="setOk">Nice!</button>', next);
    m.el.querySelector("#setOk").addEventListener("click", function () { m.close(); });
    SB.confetti();
  }
  next();
}
function ceremony() {
  var coins = Math.round(2000 * mult());
  var rw = [{ type:"coins", amount: coins }, { type:"wild", amount: 3 }];
  var html = '<div class="ceremony"><div style="font-size:44px">🎁</div><h2>ALBUM COMPLETE!</h2>' +
    '<p class="sb-muted" style="font-size:13px;margin:0 0 6px">Grand Chest — Prestige ' + roman(st.prestige) + '</p>' +
    '<div class="chestrow">' + rw.map(SB.rewardChip).join("") +
    '<span class="sb-reward"><span class="ico">🏆</span>Season 1 Master back</span></div>' +
    '<div class="bigcba">' + art({ a:"aM", r:"e" }) + '</div>' +
    '<p style="font-size:12px;color:#5a6b8c;margin:6px 0 12px">The exclusive animated <b>Season 1 Master</b> card back is yours forever.</p>' +
    '<button class="sb-btn sb-btn-yellow sb-btn-block" id="prOk">Claim & enter Prestige ' + roman(st.prestige + 1) + "</button></div>";
  var m = SB.modal(html, doPrestige);
  m.el.querySelector("#prOk").addEventListener("click", function () { m.close(); });
  SB.confetti(); setTimeout(SB.confetti, 600);
  function doPrestige() {
    SB.grantRewards(rw);
    st.master = true; st.prestige++;
    st.owned = {}; st.sets = { c:false, r:false, e:false };
    if (st.equipped && st.equipped !== "master") st.equipped = st.equipped; // cosmetics stay equipped
    S.save(); renderAll();
    var m2 = SB.modal('<h3>✨ PRESTIGE ' + roman(st.prestige) + " UNLOCKED</h3>" +
      '<p style="font-size:13px;line-height:1.5">Your album resets with a <b>gold-trim theme</b>.<br>All set & chest rewards <b>+' + Math.round((mult() - 1) * 100) + "%</b> — but card odds are rarer. Collect them all again!</p>" +
      '<button class="sb-btn sb-btn-green sb-btn-block" id="p2Ok">Let\'s go!</button>');
    m2.el.querySelector("#p2Ok").addEventListener("click", function () { m2.close(); });
    SB.confetti(window.innerWidth / 2, 160, 90);
  }
}

// ---------- pity claim + slot details ----------
$("#claimBtn").addEventListener("click", function () {
  var miss = missing();
  if (st.tokens < 8 || !miss.length) return;
  var m = SB.modal('<h3>🎟️ Claim any card — 8 tokens</h3><div class="pickgrid">' +
    miss.map(function (c) {
      return '<button class="slot" data-pick="' + c.i + '">' + art(c) + '<div class="nm">' + c.n + '</div><div class="rr ' + c.r + '">' + RN[c.r] + "</div></button>";
    }).join("") + '</div><button class="sb-sheet-cancel" id="pkCancel">Cancel</button>');
  m.el.querySelector("#pkCancel").addEventListener("click", function () { m.close(); });
  m.el.querySelectorAll("[data-pick]").forEach(function (b) {
    b.addEventListener("click", function () {
      st.tokens -= 8; st.owned[b.dataset.pick] = true; S.save();
      m.close(true); SB.confetti(); SB.haptic(30);
      SB.toast("🎉 " + findCard(b.dataset.pick).n + " added to your album!");
      renderAll(); setTimeout(checkCompletions, 500);
    });
  });
});
$("#album").addEventListener("click", function (e) {
  var slot = e.target.closest(".slot"); if (!slot) return;
  var c = findCard(slot.dataset.id), own = !!st.owned[c.i];
  var html = '<div class="bigcba">' + (own ? art(c) : '<div class="cba ghost"></div>') + "</div>" +
    "<h3 style='margin:4px 0'>" + (own ? c.n : "???") + '</h3><div class="rr ' + c.r + '" style="font-size:12px">' + RN[c.r] + "</div>";
  if (own) {
    html += st.equipped === c.i
      ? '<p style="font-size:13px;color:#2E9E4F;font-weight:800">✓ Equipped</p>'
      : '<button class="sb-btn sb-btn-green sb-btn-block" style="margin-top:10px" id="eqBtn">Equip this back</button>';
  } else {
    html += '<p style="font-size:12.5px;line-height:1.5;color:#5a6b8c;margin:10px 0 4px">Win levels to earn packs (new-card odds shown on each pack), or claim it directly with <b>8 🎟️ Wild Tokens</b>.' +
      (isFinal() ? "<br><b style='color:#D7263D'>Final 24h:</b> it's in the Complete-Your-Set pack below!" : "") + "</p>";
  }
  var m = SB.modal(html);
  var eb = m.el.querySelector("#eqBtn");
  if (eb) eb.addEventListener("click", function () {
    st.equipped = c.i; S.save(); m.close(); renderAll(); SB.haptic(20); SB.toast("Equipped: " + c.n);
  });
});
$("#mchip").addEventListener("click", function () {
  st.equipped = "master"; S.save(); renderAll(); SB.toast("Equipped: Season 1 Master 🏆");
});

// ---------- countdown (72h compressed to 6 min; tap = skip to final day) ----------
var tickIv, wasFinal = isFinal();
function tick() {
  var left = Math.max(0, st.endTs - Date.now());
  var v = left * VIRT, h = Math.floor(v / 36e5), mn = Math.floor(v % 36e5 / 6e4);
  $("#cd").textContent = h + "h " + String(mn).padStart(2, "0") + "m";
  $("#chip").classList.toggle("urgent", isFinal());
  if (isFinal() && !wasFinal) { wasFinal = true; renderOffers(); if (!st.fdShown) { st.fdShown = true; S.save(); SB.toast("⏰ FINAL DAY — targeted offers unlocked!"); } }
  if (left <= 0) {
    clearInterval(tickIv);
    var m = SB.modal("<h3>🏁 Season complete!</h3><p style='font-size:13px'>Your card backs are yours forever. A new season begins now.</p>" +
      '<button class="sb-btn sb-btn-blue sb-btn-block" id="nsOk">Start next season</button>', reset);
    m.el.querySelector("#nsOk").addEventListener("click", function () { m.close(); });
    function reset() { st.endTs = Date.now() + SEASON_MS; st.fdShown = false; wasFinal = false; S.save(); renderOffers(); startTick(); }
  }
}
function startTick() { clearInterval(tickIv); tickIv = setInterval(tick, 1000); tick(); }
$("#chip").addEventListener("click", function () {
  if (isFinal()) return;
  st.endTs = Date.now() + FINAL_MS - 1500; S.save();
  SB.toast("⏩ Demo: skipped to the final day");
  tick();
});
startTick();

// ---------- info ----------
$("#infoBtn").addEventListener("click", function () {
  var m = SB.modal('<h3>ⓘ Card-Back Collection Album</h3>' +
    '<div style="text-align:left;font-size:12.5px;line-height:1.65">' +
    "<b>Earn packs by playing levels</b><br>▶ Level win = +1 pack point (3 = Standard Pack).<br>🔥 Hard win = +1 premium point (2 = Premium Pack, better odds — shown on the pack).<br><br>" +
    "<b>Honest odds</b> — rarity odds and your live new-card % are printed on every pack.<br><br>" +
    "<b>Duplicates never wasted</b> — each dupe = +1 🎟️. 8 tokens = claim <b>any</b> missing card, guaranteed.<br><br>" +
    "<b>Set bonuses</b> — completing all commons / rares / epics pays instantly.<br><br>" +
    "<b>Prestige</b> — finish all 9 for the Grand Chest + the animated Master back, then the album resets to the next Prestige: gold theme, rewards +50%, rarer odds. Endless.<br><br>" +
    "<i>Demo timers: the 72h season runs in 6 minutes; tap the ⏳ chip to jump to the final-24h offers.</i></div>" +
    '<button class="sb-btn sb-btn-blue sb-btn-block" style="margin-top:12px" id="infOk">Got it</button>');
  m.el.querySelector("#infOk").addEventListener("click", function () { m.close(); });
});

renderAll();
// test hooks
window.__alb = { st: st, save: S.save, rollCard: rollCard, odds: odds, newPct: newPct, openPack: openPack, checkCompletions: checkCompletions, renderAll: renderAll };
})();
</script>
