<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Card-Back Album — Skip-Bo Event</title>
<link rel="stylesheet" href="../shared/core.css">
<style>
/* ---------- layout ----------
   Height budget: the album grid + token meter + BOTH pack CTAs must sit above the
   fixed play bar on a 360x740 screen. --cbh derives the card-back height from the
   viewport so the three rows always fit; everything else is fixed-height chrome. */
:root { --cbh: clamp(54px, calc((100dvh - 551px) / 3), 116px); --cbw: calc(var(--cbh) * 0.7143); }
.sb-main { padding: 10px 14px calc(env(safe-area-inset-bottom,0px) + 88px); }
.hdr-row { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
.pr-badge { display:inline-flex; align-items:center; gap:4px; background:linear-gradient(180deg,#ffd95e,#e0a400); color:var(--sb-ink); font-weight:900; font-size:12px; border-radius:999px; padding:0 11px; min-height:32px; box-shadow:var(--sb-shadow); white-space:nowrap; }
.info-btn { margin-left:auto; width:44px; height:44px; border-radius:50%; border:none; background:rgba(255,255,255,.18); color:#fff; font-size:19px; font-weight:900; cursor:pointer; }
.sb-timer-chip { min-height:44px; cursor:pointer; padding:3px 11px; }
.eqbtn { flex:0 0 auto; width:44px; height:44px; border-radius:12px; border:1.5px solid rgba(255,199,44,.55); background:rgba(0,0,0,.28); padding:0; display:grid; place-items:center; cursor:pointer; }
.eqbtn:active { transform:scale(.93); }
.eqbtn .cba { height:32px; width:23px; border-width:1.5px; border-radius:4px; box-shadow:none; }
.eqbtn .cba.emb::before { font-size:7px; border-width:1px; }

/* ---------- card-back art (the stars of the show) ---------- */
.cba { position:relative; width:100%; aspect-ratio:2/2.8; border-radius:10px; border:2.5px solid rgba(255,255,255,.92); box-shadow:0 3px 8px rgba(0,0,0,.32), inset 0 0 0 2px rgba(0,0,0,.14); overflow:hidden; }
.cba::before { position:absolute; inset:0; display:grid; place-items:center; font-weight:900; line-height:1; }
.cba.emb::before { width:46%; aspect-ratio:1; inset:auto; left:27%; top:33%; background:rgba(255,255,255,.94); border-radius:50%; border:2px solid rgba(0,0,0,.12); font-size:calc(var(--cbh) * 0.20); box-shadow:0 1px 3px rgba(0,0,0,.3); }
/* commons */
.a1 { background:repeating-linear-gradient(45deg,#1D4FA1 0 8px,#3E8EDE 8px 16px); }
.a1::before { content:"SB"; color:#1D4FA1; border-color:#FFC72C !important; }
.a2 { background:repeating-conic-gradient(from 8deg at 50% 44%,#FFC72C 0 15deg,#ff9a2c 15deg 30deg); }
.a2::before { content:"☀"; color:#D7263D; }
.a3 { background:linear-gradient(135deg,#2E9E4F 25%,#1f7038 25% 50%,#2E9E4F 50% 75%,#1f7038 75%); background-size:22px 22px; }
.a3::before { content:"♦"; color:#1f7038; }
.a4 { background-color:#D7263D; background-image:radial-gradient(#fff 15%,transparent 16%),radial-gradient(#FFC72C 15%,transparent 16%); background-size:18px 18px; background-position:0 0,9px 9px; }
.a4::before { content:"♥"; color:#D7263D; }
/* rares */
.a5 { background:#5b2a86; background-image:repeating-linear-gradient(45deg,rgba(255,215,0,.4) 0 2px,transparent 2px 11px),repeating-linear-gradient(-45deg,rgba(255,215,0,.4) 0 2px,transparent 2px 11px); }
.a5::before { content:"👑"; }
.a6 { background:#0b7fa8; background-image:repeating-radial-gradient(circle at 50% 135%,rgba(255,255,255,.28) 0 3px,transparent 3px 14px),radial-gradient(circle at 50% -20%,#9be8ff 0 30%,transparent 46%); }
.a6::before { content:"🌊"; }
.a7 { background-color:#141230; background-image:radial-gradient(ellipse at 50% 120%,rgba(255,0,200,.55),transparent 62%),linear-gradient(rgba(0,255,240,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,200,.32) 1px,transparent 1px); background-size:auto,11px 11px,11px 11px; }
.a7::before { content:"SB"; color:#7dfcff; font-size:calc(var(--cbh) * 0.26); letter-spacing:1px; text-shadow:0 0 6px #00fff0,0 0 16px #ff00c8,0 0 30px #ff00c8; }
/* epics */
.a8 { background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 3px,transparent 3px 9px),conic-gradient(from 210deg,#8a5a00,#f6d365,#b8860b,#fff2b0,#d4af37,#8a5a00); }
.a8::before { content:"❖"; color:#8a5a00; }
.a9 { background-color:#0b0b2a; background-image:radial-gradient(circle at 32% 28%,rgba(140,90,255,.95),transparent 46%),radial-gradient(circle at 70% 68%,rgba(62,142,222,.85),transparent 42%),radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.5px); background-size:auto,auto,13px 13px; }
.a9::before { content:"✦"; color:#fff; font-size:calc(var(--cbh) * 0.3); text-shadow:0 0 10px #b18cff,0 0 24px #6f4bff; }
/* master (prestige exclusive) + default */
.aM { background:linear-gradient(120deg,#ffd700,#ff8c00,#d7263d,#7e57ff,#3E8EDE,#ffd700); background-size:380% 380%; animation:mShift 5s linear infinite; }
.aM::before { content:"🏆"; }
@keyframes mShift { 0%{background-position:0% 40%;} 50%{background-position:100% 60%;} 100%{background-position:0% 40%;} }
.a0 { background:#1D4FA1; background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.10) 0 6px,transparent 6px 12px),linear-gradient(160deg,#2a5cb0,#14396f); }
.a0::before { content:"SB"; color:#1D4FA1; border-color:rgba(255,199,44,.9) !important; }
/* foil shimmer on epics/master */
.foil::after { content:""; position:absolute; inset:-40%; background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%); animation:foilSweep 2.6s ease-in-out infinite; pointer-events:none; }
@keyframes foilSweep { 0%,55%{transform:translateX(-70%);} 90%,100%{transform:translateX(70%);} }
/* empty slot = embossed, rarity-framed silhouette of the real art (teaser, not a grey box) */
.lockw { position:relative; border-radius:11px; box-shadow:inset 0 3px 8px rgba(0,0,0,.3); }
.album .lockw { width:var(--cbw); margin:0 auto; }
.lockw .cba { filter:grayscale(.88) brightness(.46) contrast(.95); border-color:rgba(255,255,255,.35); }
.lockw .cba.emb::before { opacity:.3; }
.lockw::after { content:""; position:absolute; inset:0; border-radius:10px; border:2.5px dashed rgba(255,255,255,.5); box-shadow:inset 0 0 12px rgba(0,0,0,.55); pointer-events:none; }
.lockw.r::after { border-color:rgba(120,190,255,.85); }
.lockw.e::after { border-color:rgba(255,199,44,.9); }
.lockq { position:absolute; inset:0; display:grid; place-items:center; font-size:calc(var(--cbh) * 0.36); font-weight:900; color:rgba(255,255,255,.8); text-shadow:0 2px 7px rgba(0,0,0,.9); pointer-events:none; }
.bigcba .lockq { font-size:44px; }

/* ---------- album grid ---------- */
.album { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; border-radius:14px; }
.slot { border:none; background:rgba(255,255,255,.93); border-radius:13px; padding:6px 5px 5px; cursor:pointer; box-shadow:var(--sb-shadow); font-family:var(--sb-font); min-height:44px; position:relative; display:block; width:100%; }
.slot:active { transform:scale(.95); }
.album .cba { height:var(--cbh); width:var(--cbw); margin:0 auto; }
.slot .nm { max-width:100%; display:flex; justify-content:center; align-items:baseline; gap:3px; font-size:10px; font-weight:800; color:var(--sb-ink); margin-top:3px; line-height:1.25; }
.slot .nmt { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.slot .nm .rr { flex:0 0 auto; font-size:9px; }
.slot .eq { display:block; margin-top:2px; color:var(--sb-green-dark); font-size:9px; font-weight:900; letter-spacing:.4px; }
.pickgrid .nm { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rr { font-weight:900; letter-spacing:.4px; }
.rr.c{color:#7a89a8;} .rr.r{color:#2f7fd0;} .rr.e{color:#b07d00;}
.pickgrid .rr, .sb-modal > .rr { font-size:9px; }
.slot.on { background:linear-gradient(180deg,#eafff0,#c9f3d2); outline:2.5px solid var(--sb-green); outline-offset:-2px; }
.slot .nm.eqn { color:var(--sb-green-dark); }
.slot .unl { position:absolute; top:3px; right:4px; font-size:10px; color:var(--sb-yellow-dark); text-shadow:0 1px 0 #fff; }
/* prestige restyle — outline/offset only, costs no layout height */
body.pr2 .album { outline:2px solid rgba(255,199,44,.55); outline-offset:5px; }
body.pr2 .slot:not(.on) { outline:2px solid rgba(224,164,0,.85); outline-offset:-2px; background:linear-gradient(180deg,#fffaec,#ffeec2); }

/* ---------- token meter ---------- */
.meter { background:rgba(255,255,255,.93); border-radius:13px; padding:8px 12px 9px; box-shadow:var(--sb-shadow); margin-top:8px; }
.meter .bar { height:12px; border-radius:999px; background:#dfe6f2; overflow:hidden; margin:5px 0 3px; box-shadow:inset 0 1px 3px rgba(0,0,0,.2); }
.meter .fill { height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--sb-sky),var(--sb-blue)); transition:width .5s cubic-bezier(.34,1.56,.64,1); }
.meter .cap { font-size:10px; font-weight:700; color:#5a6b8c; line-height:1.35; }
.mrow { display:flex; align-items:center; gap:8px; }
.mrow b { flex:1 1 auto; font-size:13px; min-width:0; }
.mrow .sb-btn-sm { flex:0 0 auto; white-space:nowrap; }

/* ---------- packs ---------- */
.loop { margin-top:8px; text-align:center; font-size:10px; font-weight:800; color:var(--sb-sky-light); line-height:1.3; }
.loop b { color:#fff; }
.packs { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin-top:8px; }
.pack { border-radius:15px; padding:8px 8px 9px; color:#fff; text-align:center; box-shadow:var(--sb-shadow); position:relative; overflow:hidden; }
.pack.std { background:linear-gradient(180deg,#2a5cb0,#14396f); border:2px solid rgba(255,255,255,.25); }
.pack.prm { background:linear-gradient(180deg,#7a1b8c,#3d0b52); border:2px solid rgba(255,199,44,.6); }
.pack h4 { margin:0; font-size:12.5px; }
.pips { display:flex; justify-content:center; gap:5px; margin:4px 0 3px; }
.pip { width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.2); border:1.5px solid rgba(255,255,255,.4); }
.pip.on { background:var(--sb-yellow); border-color:#fff; box-shadow:0 0 6px rgba(255,199,44,.9); }
.odds { font-size:9.5px; font-weight:700; color:rgba(255,255,255,.88); line-height:1.4; margin-bottom:5px; }
.pack .sb-btn { width:100%; font-size:12.5px; padding:9px 4px; min-height:44px; }
.pack.ready { animation:readyGlow 1.5s ease-in-out infinite; }
@keyframes readyGlow { 0%,100%{box-shadow:0 0 0 0 rgba(255,199,44,.55), var(--sb-shadow);} 50%{box-shadow:0 0 0 7px rgba(255,199,44,0), 0 0 18px 3px rgba(255,199,44,.85), var(--sb-shadow);} }
.bank { position:absolute; top:5px; right:5px; background:var(--sb-red); font-size:9px; font-weight:900; border-radius:999px; padding:2px 6px; }

/* ---------- equipped panel ---------- */
.fanwrap { display:flex; align-items:center; gap:12px; margin-top:11px; padding:11px 12px; }
.fan { position:relative; width:92px; height:82px; flex:0 0 auto; }
.fan .cba { position:absolute; width:50px; left:21px; top:3px; transform-origin:50% 95%; }
.fan .cba.emb::before { font-size:11px; }
.fan .f1{ transform:rotate(-16deg) translateX(-9px);} .fan .f2{ transform:rotate(0deg) translateY(-4px); z-index:2;} .fan .f3{ transform:rotate(16deg) translateX(9px);}
.fanmeta { color:#fff; min-width:0; flex:1 1 auto; }
.fanmeta b { font-size:14px; } .fanmeta small { display:block; font-size:11px; color:var(--sb-sky-light); font-weight:700; margin-bottom:6px; }

/* ---------- set rewards ---------- */
.sets { display:flex; gap:7px; margin-top:10px; }
.setchip { flex:1; background:rgba(255,255,255,.93); border-radius:11px; padding:7px 6px; text-align:center; font-size:10px; font-weight:800; color:var(--sb-ink); box-shadow:var(--sb-shadow); }
.setchip small { display:block; color:#5a6b8c; font-weight:700; font-size:9px; margin-top:2px; }
.setchip.done { background:linear-gradient(180deg,#e9ffe9,#c9f3d2); outline:2px solid var(--sb-green); }

/* ---------- offers ---------- */
.offers { margin-top:12px; }
.offer { background:linear-gradient(120deg,#7a1b2c,#4a0f1b); border:2px solid var(--sb-yellow); border-radius:15px; padding:12px; color:#fff; margin-bottom:9px; box-shadow:var(--sb-shadow); }
.offer h4 { margin:0 0 3px; font-size:14px; color:var(--sb-yellow); }
.offer p { margin:0 0 8px; font-size:11.5px; line-height:1.45; }
.offer .free { font-size:10.5px; color:#ffd9a0; font-weight:700; margin-top:6px; line-height:1.4; }
.offer .sb-btn-sm { min-height:44px; font-size:14px; padding:10px 18px; }
.fday { background:var(--sb-red); color:#fff; font-weight:900; font-size:12px; text-align:center; border-radius:10px; padding:7px; margin-bottom:9px; animation:sbPulse 1.2s infinite; }

/* ---------- stats + play bar ---------- */
.stats { margin-top:12px; text-align:center; color:var(--sb-sky-light); font-size:11.5px; font-weight:700; }
.playbar { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px; z-index:120; display:flex; gap:9px; padding:9px 12px calc(env(safe-area-inset-bottom,0px) + 11px); background:linear-gradient(180deg,rgba(20,57,111,0) 0%,rgba(13,32,64,.96) 32%); }
.playbar .sb-btn { flex:1; flex-direction:column; gap:1px; padding:8px 6px; font-size:15px; min-height:44px; }
.playbar .sb-btn small { font-size:10px; font-weight:800; opacity:.9; }

/* ---------- reveal modal ---------- */
.rvrow { display:flex; justify-content:center; gap:16px; margin:12px 0 10px; }
.rvc { width:104px; perspective:600px; cursor:pointer; }
.rvin { position:relative; width:100%; aspect-ratio:2/2.8; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.34,1.3,.64,1); }
.rvc.flip .rvin { transform:rotateY(180deg); }
.rvf, .rvb { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:10px; }
.rvb { transform:rotateY(180deg); }
.rvc .cba { height:100%; width:100%; }
.rvc .cba.emb::before { font-size:21px; }
.rvc.flip.gc .rvin { box-shadow:0 0 16px rgba(160,175,200,.9); border-radius:10px; }
.rvc.flip.gr .rvin { box-shadow:0 0 22px rgba(62,142,222,1); border-radius:10px; }
.rvc.flip.ge .rvin { box-shadow:0 0 28px rgba(255,199,44,1); border-radius:10px; }
.rvlab { margin-top:7px; font-size:11px; font-weight:900; min-height:30px; opacity:0; transition:opacity .3s .25s; }
.rvlab.show { opacity:1; }
.rvlab .new { color:var(--sb-green); } .rvlab .dup { color:#8a5a00; }
.bigcba { width:132px; margin:10px auto; }
.bigcba .cba.emb::before { font-size:27px; }
.pickgrid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:10px 0; max-height:52dvh; overflow-y:auto; }
.pickgrid .slot { box-shadow:0 2px 6px rgba(0,0,0,.2); background:#fff; outline:none; }
.pickgrid .slot.on { background:linear-gradient(180deg,#eafff0,#c9f3d2); outline:2.5px solid var(--sb-green); outline-offset:-2px; }
body.pr2 .pickgrid .slot:not(.on) { outline:none; }
.pickgrid .cba { height:74px; width:53px; margin:0 auto; }
.pickgrid .cba.emb::before { font-size:15px; }
.ceremony h2 { margin:4px 0 8px; color:var(--sb-ink); }
.chestrow { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:10px 0 14px; }
.otab { width:100%; border-collapse:collapse; font-size:11px; margin:4px 0 2px; }
.otab th, .otab td { padding:3px 4px; text-align:center; border-bottom:1px solid rgba(27,42,74,.12); }
.otab th { font-size:10px; color:#5a6b8c; }
.otab tr.cur { background:rgba(255,199,44,.28); font-weight:900; }
</style>
</head>
<body>
<div class="sb-app">
<div class="sb-main">

  <div class="hdr-row">
    <span class="sb-timer-chip" id="chip" title="tap to fast-forward (demo)">⏳ <span id="cd">—</span></span>
    <span class="pr-badge" id="prb">🏅 Prestige I</span>
    <button class="eqbtn" id="wardBtn" aria-label="Wardrobe — change equipped card back"><span id="eqMini"></span></button>
    <button class="info-btn" id="infoBtn" aria-label="Event info">ⓘ</button>
  </div>

  <div class="album" id="album"></div>

  <div class="meter" id="meter"></div>

  <div class="loop">▶ Levels → packs → all 9 → 🏅 <b>Prestige ∞</b> · +50%, no slump</div>

  <div class="packs">
    <div class="pack std" id="packS">
      <span class="bank" id="bankS" style="display:none"></span>
      <h4>🎴 Standard Pack</h4>
      <div class="pips" id="pipS"></div>
      <div class="odds" id="oddsS"></div>
      <button class="sb-btn sb-btn-blue" id="openS">Open pack</button>
    </div>
    <div class="pack prm" id="packP">
      <span class="bank" id="bankP" style="display:none"></span>
      <h4>✨ Premium Pack</h4>
      <div class="pips" id="pipP"></div>
      <div class="odds" id="oddsP"></div>
      <button class="sb-btn sb-btn-yellow" id="openP">Open pack</button>
    </div>
  </div>

  <div class="sb-panel-blue fanwrap">
    <div class="fan" id="fan"></div>
    <div class="fanmeta">
      <b id="eqName">Standard Back</b>
      <small>Equipped card back — shown in every match</small>
      <button class="sb-btn sb-btn-blue sb-btn-sm" id="wardBtn2">🎽 Wardrobe</button>
    </div>
  </div>

  <div class="sets" id="sets"></div>
  <div class="offers" id="offers"></div>
  <div class="stats" id="stats"></div>
</div>
</div>

<div class="playbar">
  <button class="sb-btn sb-btn-green" id="playBtn">▶ Play level<small>clear = +1 pack point</small></button>
  <button class="sb-btn sb-btn-red" id="hardBtn">🔥 Hard level<small>clear = +1 premium point</small></button>
</div>

<script src="../shared/core.js"></script>
<script src="../shared/levelsim.js"></script>
<script>
(function () {
"use strict";
SB.init({
  title: "Card-Back Album",
  subtitle: "Collect 9 · Prestige ∞",
  resetKey: "cardback-album"
});

// ---------- data ----------
var CARDS = [
  { i:"stripe", n:"Classic Stripe", r:"c", a:"a1" },
  { i:"sun",    n:"Sunburst",       r:"c", a:"a2" },
  { i:"deco",   n:"Mint Deco",      r:"c", a:"a3" },
  { i:"candy",  n:"Candy Pop",      r:"c", a:"a4" },
  { i:"crown",  n:"Royal Damask",   r:"r", a:"a5" },
  { i:"tide",   n:"Tide Crest",     r:"r", a:"a6" },
  { i:"neon",   n:"Neon Nights",    r:"r", a:"a7", glow:1 },
  { i:"gold",   n:"Gold Filigree",  r:"e", a:"a8" },
  { i:"nebula", n:"Nebula Royale",  r:"e", a:"a9", glow:1 }
];
var RN = { c:"COMMON ★", r:"RARE ★★", e:"EPIC ★★★" };
var STARS = { c:"★", r:"★★", e:"★★★" };
var PACK_SIZE = 2;        // cards per pack — published on both packs
var PITY = 8;             // wild tokens for a guaranteed pick — published everywhere
var STD_COST = 3;         // pack points per standard pack
var PRM_COST = 2;         // premium points per premium pack

// Published odds table. rendered odds are derived from THIS object, so the printed
// table can never drift from the roller. Every entry is an exact 1/100 multiple so
// Math.round(p*100) is lossless. Tier caps at III (stated in the info sheet).
var ODDS = [
  { std:{ c:.70, r:.25, e:.05 }, prm:{ c:.40, r:.40, e:.20 } },  // Prestige I
  { std:{ c:.78, r:.19, e:.03 }, prm:{ c:.50, r:.38, e:.12 } },  // Prestige II
  { std:{ c:.84, r:.14, e:.02 }, prm:{ c:.58, r:.34, e:.08 } }   // Prestige III+
];

var SEASON_MS = 6 * 60 * 1000;           // 6 real min stands in for 72h (demo-compressed)
var VIRT = 72 * 3600 * 1000 / SEASON_MS; // real→virtual factor (x720)
var FINAL_MS = SEASON_MS / 3;            // last "24h"

var S = SB.store("cardback-album", {
  prestige: 1, owned: {}, unlocked: {}, packPts: 0, premPts: 0, tokens: 0,
  packs: 0, equipped: null, master: false, chests: 0,
  sets: { c:false, r:false, e:false }, endTs: 0, fdShown: false, lvl: 214
});
var st = S.data;
if (!st.unlocked) st.unlocked = {};
// unlocked = permanent cosmetic wardrobe; owned = THIS prestige's album progress.
Object.keys(st.owned || {}).forEach(function (k) { st.unlocked[k] = true; });
if (st.master) st.unlocked.master = true;
if (!st.endTs || st.endTs < Date.now() - 864e5) { st.endTs = Date.now() + SEASON_MS; }
S.save();

function tierIdx() { return Math.min(st.prestige, ODDS.length) - 1; }
function mult() { return Math.pow(1.5, st.prestige - 1); }   // +50% every prestige
function multPct() { return Math.round((mult() - 1) * 100); }
function odds(prem) { var t = ODDS[tierIdx()]; return prem ? t.prm : t.std; }
function byRar(r) { return CARDS.filter(function (c) { return c.r === r; }); }
function missing() { return CARDS.filter(function (c) { return !st.owned[c.i]; }); }
// exact new-card probability for the NEXT card drawn, at the live collection state
function newP(prem) {
  var o = odds(prem), p = 0;
  ["c","r","e"].forEach(function (r) {
    var g = byRar(r), miss = g.filter(function (c) { return !st.owned[c.i]; }).length;
    p += o[r] * miss / g.length;
  });
  return p;
}
// shown to 0.1% so the printed figure can never overstate the true chance by a
// rounding step (rarity odds are whole %, but 1/3-size rarity groups are not).
function newPct(prem) { return String(Math.round(newP(prem) * 1000) / 10).replace(/\.0$/, ""); }
function rollCard(prem) {
  var o = odds(prem), x = Math.random();
  var r = x < o.c ? "c" : (x < o.c + o.r ? "r" : "e");
  var g = byRar(r), card = g[(Math.random() * g.length) | 0];
  return { card: card, isNew: !st.owned[card.i] };
}
function findCard(id) { return CARDS.filter(function (c) { return c.i === id; })[0]; }
function art(c, cls) {
  var foil = (c.r === "e" || c.a === "aM") ? " foil" : "";
  return '<div class="cba ' + (c.glow ? "" : "emb ") + c.a + foil + " " + (cls || "") + '"></div>';
}
// locked slot: the real art, darkened behind a rarity-coloured embossed frame
function artLocked(c) {
  return '<div class="lockw ' + c.r + '">' + art(c) + '<span class="lockq">?</span></div>';
}
function MASTER() { return { i:"master", a:"aM", n:"Season 1 Master", r:"e" }; }
function DEFAULT_BACK() { return { i:null, a:"a0", n:"Standard Back", r:"c" }; }
function equippedCard() {
  if (st.equipped === "master") return MASTER();
  return st.equipped ? (findCard(st.equipped) || DEFAULT_BACK()) : DEFAULT_BACK();
}

function renderMeter() {

var SETDEFS = [
  { r:"c", lab:"All Commons", coins:300, extra:null },
  { r:"r", lab:"All Rares",   coins:500, extra:{ type:"wild", amount:1 } },

function setRewards(d) {

function renderSets() {

function pips(n, of) {

function oddsLine(prem) {

    "% · Rare " + Math.round(o.r * 100) + "% · " + (prem ? "<b>Epic " + Math.round(o.e * 100) + "%</b>" : "Epic " + Math.round(o.e * 100) + "%");
}

function renderAll() { renderAlbum(); renderFan(); renderMeter(); renderSets(); renderPacks(); renderStats(); renderOffers(); }

// ---------- fly helper ----------
function flyTo(icon, fx, fy, toEl) {
  if (!toEl) return;
  var r = toEl.getBoundingClientRect(), el = document.createElement("div");
  el.className = "sb-fly"; el.textContent = icon;
  el.style.left = fx + "px"; el.style.top = fy + "px";
  document.body.appendChild(el);
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    el.style.left = (r.left + r.width / 2) + "px"; el.style.top = (r.top + r.height / 2) + "px";
    el.style.transform = "scale(.5)";
  }); });
  setTimeout(function () { el.remove(); }, 750);
}

// ---------- fuel: play levels ----------
// window.__forceWin / __forceInstant are honoured inside levelsim for every event.
var playing = false;
function play(hard) {
  if (playing) return Promise.resolve(null);
  playing = true;
  var btn = hard ? $("#hardBtn") : $("#playBtn");
  $("#playBtn").disabled = true; $("#hardBtn").disabled = true;
  return SB.playLevel({
    hard: hard,
    title: "Adventure Level " + st.lvl,
    rewardTag: hard ? "🔥 HARD · CLEAR = +1 ✨ PREMIUM POINT" : "CLEAR = +1 🎴 PACK POINT"
  }).then(function (res) {
    playing = false;
    $("#playBtn").disabled = false; $("#hardBtn").disabled = false;
    st.lvl++;
    if (res.won) {
      if (hard) { st.premPts++; SB.toast("🔥 +1 Premium pack point!", { top:true }); }
      else { st.packPts++; SB.toast("🎴 +1 Pack point!", { top:true }); }
      var r = btn.getBoundingClientRect();
      flyTo(hard ? "✨" : "🎴", r.left + r.width / 2, r.top, hard ? $("#packP") : $("#packS"));
    } else SB.toast("So close! No pack point — try again.", { top:true });
    S.save(); renderAll();
    return res;
  });
}
$("#playBtn").addEventListener("click", function () { play(false); });
$("#hardBtn").addEventListener("click", function () { play(true); });

// ---------- pack opening ----------
// State mutation is atomic and persisted BEFORE any reveal UI exists, so a reload
// mid-reveal (or a dismissed reveal) can never lose a card or a token.
var busy = false;
function drawPack(prem) {
  if (prem) { if (st.premPts < PRM_COST) return null; st.premPts -= PRM_COST; }
  else { if (st.packPts < STD_COST) return null; st.packPts -= STD_COST; }
  st.packs++;
  var results = [];
  for (var k = 0; k < PACK_SIZE; k++) {
    var res = rollCard(prem);
    if (res.isNew) { st.owned[res.card.i] = true; st.unlocked[res.card.i] = true; }
    else st.tokens++;
    results.push(res);
  }
  S.save();
  return results;
}
function openPack(prem) {
  if (busy) return;
  var results = drawPack(prem);
  if (!results) return;
  busy = true;
  renderPacks();
  showReveal(results, prem);
}
function showReveal(results, prem) {
  var html = '<h3 style="margin:0">' + (prem ? "✨ Premium Pack" : "🎴 Standard Pack") + "</h3>" +
    '<div class="sb-muted" style="font-size:11px">Tap to reveal — every card is already banked</div><div class="rvrow">' +
    results.map(function (res, i) {
      var c = res.card;
      return '<div><div class="rvc g' + c.r + '" data-i="' + i + '"><div class="rvin">' +
        '<div class="rvf"><div class="cba emb a0" style="height:100%"></div></div>' +
        '<div class="rvb">' + art(c) + "</div></div></div>" +
        '<div class="rvlab" data-lab="' + i + '"><b>' + c.n + "</b><br>" +
        (res.isNew ? '<span class="new">NEW! ' + RN[c.r] + "</span>" : '<span class="dup">Duplicate → +1 🎟️</span>') + "</div></div>";
    }).join("") + "</div>" +
    '<button class="sb-btn sb-btn-green sb-btn-block" id="rvDone">Done</button>';
  var timers = [];
  var m = SB.modal(html, afterReveal);
  var flipped = 0;
  function flip(el) {
    if (m.closed || !el || el.classList.contains("flip")) return;
    el.classList.add("flip"); SB.haptic(12);
    var lab = m.el.querySelector('[data-lab="' + el.dataset.i + '"]');
    if (lab) lab.classList.add("show");
    var r = results[+el.dataset.i];
    if (r && r.card.r === "e" && r.isNew) { var b = el.getBoundingClientRect(); SB.confetti(b.left + b.width / 2, b.top, 40); }
    flipped++;
  }
  var cards = m.el.querySelectorAll(".rvc");
  cards.forEach(function (el) { el.addEventListener("click", function () { flip(el); }); });
  timers.push(setTimeout(function () { flip(cards[0]); }, 650));
  timers.push(setTimeout(function () { flip(cards[1]); }, 1250));
  m.el.querySelector("#rvDone").addEventListener("click", function () { m.close(); });
  function afterReveal() {
    timers.forEach(clearTimeout);
    busy = false;
    results.forEach(function (res, i) {
      if (!res.isNew) setTimeout(function () {
        flyTo("🎟️", window.innerWidth / 2 + (i ? 60 : -60), window.innerHeight / 2, $("#meter"));
      }, i * 160);
    });
    renderAll();
    setTimeout(checkCompletions, 520);
  }
}
$("#openS").addEventListener("click", function () { openPack(false); });
$("#openP").addEventListener("click", function () { openPack(true); });

// ---------- completions: sets → album → prestige ----------
var ceremonyOpen = false;
function mergeRw(list) {
  var order = [], byType = {};
  list.forEach(function (r) {
    if (byType[r.type]) byType[r.type].amount += r.amount;
    else { byType[r.type] = { type:r.type, amount:r.amount }; order.push(r.type); }
  });
  return order.map(function (t) { return byType[t]; });
}
function checkCompletions() {
  var queue = [], payout = [];
  SETDEFS.forEach(function (d) {
    if (st.sets[d.r]) return;
    if (byRar(d.r).every(function (c) { return st.owned[c.i]; })) {
      st.sets[d.r] = true;
      var rw = setRewards(d);
      payout = payout.concat(rw);
      queue.push({ lab: RN[d.r].split(" ")[0] + " set complete!", rw: rw });
    }
  });
  S.save();
  // Pay every completed set NOW, in one atomic grant. The modals below are pure
  // presentation: a reload part-way through the chain can no longer strand a
  // reward that the saved st.sets flags already mark as claimed.
  if (payout.length) SB.grantRewards(mergeRw(payout), null, { toastTop: true });
  function next() {
    var q = queue.shift();
    if (!q) { if (missing().length === 0) ceremony(); else renderAll(); return; }
    var m = SB.modal('<h3>🏆 ' + q.lab + "</h3><div class='chestrow'>" + q.rw.map(SB.rewardChip).join("") + "</div>" +
      '<p class="sb-muted" style="font-size:11.5px;margin:0 0 10px">Set bonuses pay again at every Prestige — and they grow +50% each time.</p>' +
      '<button class="sb-btn sb-btn-green sb-btn-block" id="setOk">Nice!</button>', next);
    m.el.querySelector("#setOk").addEventListener("click", function () { m.close(); });
    SB.confetti();
  }
  next();
}
function ceremony() {
  if (ceremonyOpen) return;
  ceremonyOpen = true;
  var rw = [{ type:"coins", amount: Math.round(2000 * mult()) }, { type:"wild", amount: 3 }];
  var nextMult = Math.pow(1.5, st.prestige);
  var html = '<div class="ceremony"><div style="font-size:44px">🎁</div><h2>ALBUM COMPLETE!</h2>' +
    '<p class="sb-muted" style="font-size:13px;margin:0 0 6px">Grand Chest — Prestige ' + roman(st.prestige) + '</p>' +
    '<div class="chestrow">' + rw.map(SB.rewardChip).join("") +
    '<span class="sb-reward"><span class="ico">🏆</span>Season 1 Master back</span></div>' +
    '<div class="bigcba">' + art(MASTER()) + '</div>' +
    '<p style="font-size:12px;color:#5a6b8c;margin:6px 0 12px">The exclusive animated <b>Season 1 Master</b> back is yours forever. ' +
    'Your album now resets to <b>Prestige ' + roman(st.prestige + 1) + '</b> — rewards <b>+50%</b> (×' + trimX(nextMult) + ' of base), odds harden.</p>' +
    '<button class="sb-btn sb-btn-yellow sb-btn-block" id="prOk">Claim & enter Prestige ' + roman(st.prestige + 1) + "</button></div>";
  var m = SB.modal(html, doPrestige);
  m.el.querySelector("#prOk").addEventListener("click", function () { m.close(); });
  SB.confetti(); setTimeout(SB.confetti, 600);
  function doPrestige() {
    SB.grantRewards(rw, null, { toastTop: true });
    st.chests++;
    st.master = true; st.unlocked.master = true;
    st.prestige++;
    st.owned = {}; st.sets = { c:false, r:false, e:false };
    // cosmetics are permanent: st.unlocked and st.equipped survive the reset.
    S.save(); renderAll();
    ceremonyOpen = false;
    var tierTxt = st.prestige >= ODDS.length
      ? "Odds are now at their hardest tier (Prestige " + roman(ODDS.length) + "+) and stop changing."
      : "Card odds harden — the full table is in the ⓘ sheet.";
    var m2 = SB.modal('<h3>✨ PRESTIGE ' + roman(st.prestige) + " UNLOCKED</h3>" +
      '<div class="bigcba">' + art(MASTER()) + "</div>" +
      '<p style="font-size:13px;line-height:1.55">Album reset with a <b>gold-trim theme</b> — no completion slump, the collection loop just starts again.<br>' +
      "All set &amp; Grand Chest rewards <b>+50%</b> (now ×" + trimX(mult()) + " of base). " + tierTxt + "</p>" +
      '<button class="sb-btn sb-btn-green sb-btn-block" id="p2Ok">Let\'s go!</button>');
    m2.el.querySelector("#p2Ok").addEventListener("click", function () { m2.close(); });
    SB.confetti(window.innerWidth / 2, 160, 90);
  }
}
function trimX(n) { return String(Math.round(n * 100) / 100); }

  var c = findCard(slot.dataset.id), own = !!st.owned[c.i], unl = !!st.unlocked[c.i];
  var html = '<div class="bigcba">' + ((own || unl) ? art(c) : artLocked(c)) + "</div>" +
    "<h3 style='margin:4px 0'>" + ((own || unl) ? c.n : "???") + '</h3><div class="rr ' + c.r + '" style="font-size:12px">' + RN[c.r] + "</div>";
  if (!own && unl) html += '<p style="font-size:11.5px;color:#8a5a00;font-weight:800;margin:8px 0 0">★ Unlocked in an earlier Prestige — still equippable, but collect it again to fill this album.</p>';
  if (own || unl) {
    html += st.equipped === c.i
      ? '<p style="font-size:13px;color:#2E9E4F;font-weight:800;margin-top:10px">✓ Equipped</p>'
      : '<button class="sb-btn sb-btn-green sb-btn-block" style="margin-top:10px" id="eqB">Equip this back</button>';
  }
  if (!own) {
    html += '<p style="font-size:12.5px;line-height:1.5;color:#5a6b8c;margin:10px 0 4px">Win levels to earn packs (live new-card odds are printed on each pack), or claim it outright with <b>' + PITY + ' 🎟️ Wild Tokens</b> — you have ' + st.tokens + '.' +
      (isFinal() ? "<br><b style='color:#D7263D'>Final 24h:</b> check the targeted offers below." : "") + "</p>";
  }
  var m = SB.modal(html);
  var eb = m.el.querySelector("#eqB");
  if (eb) eb.addEventListener("click", function () {
    st.equipped = c.i; S.save(); m.close(); renderAll(); SB.haptic(20); SB.toast("Equipped: " + c.n, { top:true });
  });
});

// ---------- wardrobe ----------
function wardrobe() {
  var list = [DEFAULT_BACK()].concat(
    CARDS.filter(function (c) { return st.unlocked[c.i]; })
  );
  if (st.unlocked.master) list.push(MASTER());
  var m = SB.modal('<h3>🎽 Wardrobe</h3>' +
    '<p class="sb-muted" style="font-size:11.5px;margin:2px 0 0">Every back you have ever unlocked stays yours — across seasons and Prestiges.</p>' +
    '<div class="pickgrid">' + list.map(function (c) {
      var on = (st.equipped || null) === (c.i || null);
      return '<button class="slot' + (on ? " on" : "") + '" data-eq="' + (c.i == null ? "" : c.i) + '">' + art(c) +
        '<div class="nm">' + c.n + "</div>" + (on ? '<span class="eq">✓ EQUIPPED</span>' : '<div class="rr ' + c.r + '">' + RN[c.r] + "</div>") + "</button>";
    }).join("") + '</div><button class="sb-sheet-cancel" id="wdClose">Close</button>');
  m.el.querySelector("#wdClose").addEventListener("click", function () { m.close(); });
  m.el.querySelectorAll("[data-eq]").forEach(function (b) {
    b.addEventListener("click", function () {
      st.equipped = b.dataset.eq || null; S.save(); m.close(); renderAll(); SB.haptic(20);
      SB.toast("Equipped: " + equippedCard().n, { top:true });
    });
  });
}
$("#wardBtn").addEventListener("click", wardrobe);
$("#wardBtn2").addEventListener("click", wardrobe);

// ---------- countdown (72h compressed to 6 min; tap = skip to final day) ----------
var tickIv, wasFinal = isFinal(), endShown = false;
function seasonRollover() {
  st.endTs = Date.now() + SEASON_MS; st.fdShown = false; wasFinal = false; endShown = false;
  S.save(); renderAll(); startTick();
}
function tick() {
  var left = Math.max(0, st.endTs - Date.now());
  var v = left * VIRT, h = Math.floor(v / 36e5), mn = Math.floor(v % 36e5 / 6e4);
  $("#cd").textContent = h + "h " + String(mn).padStart(2, "0") + "m";
  $("#chip").classList.toggle("urgent", isFinal());
  if (isFinal() && !wasFinal) {
    wasFinal = true; renderOffers();
    if (!st.fdShown) { st.fdShown = true; S.save(); SB.toast("⏰ FINAL DAY — targeted offers unlocked!", { top:true }); }
  }
  if (left <= 0 && !endShown) {
    endShown = true;
    clearInterval(tickIv);
    var m = SB.modal("<h3>🏁 Season complete!</h3><p style='font-size:13px;line-height:1.5'>Your card backs, Wild Tokens and Prestige <b>" + roman(st.prestige) +
      "</b> all carry over — nothing is taken away. A new season starts now.</p>" +
      '<button class="sb-btn sb-btn-blue sb-btn-block" id="nsOk">Start next season</button>', seasonRollover);
    m.el.querySelector("#nsOk").addEventListener("click", function () { m.close(); });
  }
}
function startTick() { clearInterval(tickIv); tickIv = setInterval(tick, 1000); tick(); }
$("#chip").addEventListener("click", function () {
  if (isFinal()) return;
  st.endTs = Date.now() + FINAL_MS - 1500; S.save();
  SB.toast("⏩ Demo: skipped to the final day", { top:true });
  tick();
});
startTick();

// ---------- info ----------
$("#infoBtn").addEventListener("click", function () {
  var rows = ODDS.map(function (t, i) {
    var lab = "Prestige " + roman(i + 1) + (i === ODDS.length - 1 ? "+" : "");
    return '<tr class="' + (i === tierIdx() ? "cur" : "") + '"><td>' + lab + "</td>" +
      "<td>" + Math.round(t.std.c * 100) + " / " + Math.round(t.std.r * 100) + " / " + Math.round(t.std.e * 100) + "</td>" +
      "<td>" + Math.round(t.prm.c * 100) + " / " + Math.round(t.prm.r * 100) + " / " + Math.round(t.prm.e * 100) + "</td></tr>";
  }).join("");
  var m = SB.modal('<h3>ⓘ Card-Back Album</h3>' +
    '<div style="text-align:left;font-size:12.5px;line-height:1.6">' +
    "<b>Earn packs by playing levels</b><br>▶ Level clear = +1 pack point (" + STD_COST + " = Standard Pack).<br>🔥 Hard clear = +1 premium point (" + PRM_COST + " = Premium Pack).<br>Every pack contains exactly " + PACK_SIZE + " cards.<br><br>" +
    "<b>Published odds — code and table are the same numbers</b>" +
    '<table class="otab"><tr><th></th><th>Standard<br>C / R / E</th><th>Premium<br>C / R / E</th></tr>' + rows + "</table>" +
    "<div style='font-size:11px;color:#5a6b8c'>Within a rarity every card is equally likely. Your live new-card % is printed on each pack.</div><br>" +
    "<b>Duplicates are never wasted</b> — each dupe = +1 🎟️. <b>" + PITY + " 🎟️ = claim ANY missing card</b>, guaranteed. Tokens never expire and never reset.<br><br>" +
    "<b>Set bonuses</b> — completing all commons / rares / epics pays instantly, every Prestige.<br><br>" +
    "<b>Prestige (endless)</b> — finish all 9 for the Grand Chest + the animated Master back, then the album resets: gold theme, rewards <b>+50% each Prestige</b>, odds harden to Prestige " + roman(ODDS.length) + "+ and then hold. Backs you have unlocked stay equippable forever.<br><br>" +
    "<i>Demo timers: the 72h season runs in 6 minutes; tap the ⏳ chip to jump to the final-24h offers.</i></div>" +
    '<button class="sb-btn sb-btn-blue sb-btn-block" style="margin-top:12px" id="infOk">Got it</button>');
  m.el.querySelector("#infOk").addEventListener("click", function () { m.close(); });
});

renderAll();
// Reconcile on load: a reload during a reveal / set modal / prestige ceremony must
// still hand out everything the banked state has already earned.
setTimeout(checkCompletions, 250);

// test hooks
window.__alb = {
  st: st, save: function () { S.save(); }, rollCard: rollCard, odds: odds, newPct: newPct,
  drawPack: drawPack, openPack: openPack, newP: newP, checkCompletions: checkCompletions, renderAll: renderAll,
  missing: missing, mult: mult, tierIdx: tierIdx, play: play, ODDS: ODDS,
  PITY: PITY, PACK_SIZE: PACK_SIZE, STD_COST: STD_COST, PRM_COST: PRM_COST,
  setRewards: setRewards, SETDEFS: SETDEFS
};
})();
</script>
</body>
</html>
