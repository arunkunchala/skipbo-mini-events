<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Prize Drop — Skip-Bo Event</title>
<link rel="stylesheet" href="../shared/core.css">
<style>
  .pd-statusrow { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .pd-info-btn {
    margin-left:auto; width:30px; height:30px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,0.18); color:#fff; font-weight:900; font-size:15px;
    display:grid; place-items:center;
  }
  .pd-hud {
    display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;
  }
  .pd-balls {
    display:inline-flex; align-items:center; gap:7px;
    background:linear-gradient(180deg,#2a5cb0,#1D4FA1);
    border:2px solid rgba(255,199,44,0.7); border-radius:999px;
    padding:6px 16px; color:#fff; font-weight:900; font-size:19px;
    box-shadow:var(--sb-shadow);
  }
  .pd-balls .num { color:var(--sb-yellow); min-width:20px; text-align:center; }
  .pd-golden {
    display:none; align-items:center; gap:4px; font-size:11px; font-weight:800;
    color:var(--sb-ink); background:linear-gradient(180deg,#ffe28a,#FFC72C);
    border-radius:999px; padding:4px 10px; box-shadow:var(--sb-shadow);
    animation:sbPulse 1.4s infinite;
  }
  .pd-golden.on { display:inline-flex; }
  .pd-mults { display:flex; gap:6px; }
  .pd-mult {
    border:2px solid rgba(255,255,255,0.35); background:rgba(255,255,255,0.12);
    color:#fff; font-weight:900; font-size:14px; border-radius:11px;
    padding:7px 13px; cursor:pointer; transition:transform 0.08s;
  }
  .pd-mult.sel {
    background:linear-gradient(180deg,#ffd95e,#FFC72C); color:var(--sb-ink);
    border-color:#fff; transform:scale(1.08); box-shadow:0 0 12px rgba(255,199,44,0.6);
  }
  .pd-mult:disabled { opacity:0.35; filter:grayscale(0.7); pointer-events:none; }
  .pd-arrows { display:flex; gap:5px; margin-bottom:5px; }
  .pd-arrow {
    flex:1; border:none; cursor:pointer; border-radius:10px 10px 4px 4px;
    background:linear-gradient(180deg,#5ba0e8,#1D4FA1);
    color:var(--sb-yellow); font-size:19px; font-weight:900; padding:8px 0;
    box-shadow:0 3px 0 rgba(0,0,0,0.3);
  }
  .pd-arrow:active { transform:translateY(2px); box-shadow:none; }
  .pd-boardwrap { position:relative; border-radius:14px; overflow:hidden; box-shadow:var(--sb-shadow); }
  #pd-canvas { display:block; width:100%; touch-action:none; }
  .pd-track { margin-top:12px; }
  .pd-track-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:38px; }
  .pd-track-head .t { font-weight:900; color:#fff; font-size:14px; text-shadow:0 1px 0 rgba(0,0,0,0.3); }
  .pd-track-head .p { font-weight:800; color:var(--sb-yellow); font-size:13px; }
  .pd-bar { position:relative; height:12px; background:rgba(0,0,0,0.35); border-radius:999px; margin:0 18px 0 4px; }
  .pd-fill {
    position:absolute; left:0; top:0; bottom:0; border-radius:999px; width:0%;
    background:linear-gradient(90deg,#2E9E4F,#3fc167,#FFC72C);
    transition:width 0.6s cubic-bezier(0.22,1,0.36,1);
  }
  .pd-node {
    position:absolute; top:50%; transform:translate(-50%,-50%);
    width:34px; height:34px; border-radius:50%;
    background:#14396f; border:2.5px solid rgba(255,255,255,0.45);
    display:grid; place-items:center; font-size:15px;
    transition:all 0.3s;
  }
  .pd-node .pts {
    position:absolute; top:-19px; left:50%; transform:translateX(-50%);
    font-size:9px; font-weight:800; color:var(--sb-sky-light); white-space:nowrap;
  }
  .pd-node.done { background:linear-gradient(180deg,#3fc167,#2E9E4F); border-color:#fff; }
  .pd-node.next { border-color:var(--sb-yellow); box-shadow:0 0 10px rgba(255,199,44,0.7); animation:sbPulse 1.6s infinite; }
  .pd-earnrow { display:flex; gap:8px; margin-top:14px; }
  .pd-earnrow .sb-btn { flex:1; }
  .pd-offer-pack {
    display:flex; align-items:center; gap:10px; width:100%;
    background:#fff; border:2px solid rgba(27,42,74,0.15); border-radius:14px;
    padding:12px; margin-top:10px; cursor:pointer; text-align:left;
    font-family:var(--sb-font);
  }
  .pd-offer-pack.hot { border-color:var(--sb-yellow); background:linear-gradient(180deg,#fff8e0,#fff); position:relative; }
  .pd-offer-pack .big { font-size:28px; }
  .pd-offer-pack .nm { font-weight:900; font-size:15px; color:var(--sb-ink); }
  .pd-offer-pack .ds { font-size:11px; color:#5a6b8c; font-weight:700; }
  .pd-offer-pack .pr {
    margin-left:auto; background:linear-gradient(180deg,#3fc167,#2E9E4F);
    color:#fff; font-weight:900; border-radius:10px; padding:8px 12px; font-size:15px;
    box-shadow:0 2px 0 rgba(0,0,0,0.2);
  }
  .pd-best {
    position:absolute; top:-9px; right:10px; background:var(--sb-red); color:#fff;
    font-size:9px; font-weight:900; border-radius:999px; padding:2px 8px; letter-spacing:0.5px;
  }
  .pd-flash { animation:pdFlash 0.5s; }
  @keyframes pdFlash { 0%{transform:scale(1);} 35%{transform:scale(1.3);} 100%{transform:scale(1);} }
  @keyframes pdSpin { from{transform:rotate(0);} to{transform:rotate(360deg);} }
  .pd-spin { display:inline-block; animation:pdSpin 0.8s linear infinite; }
</style>
</head>
<body>
<div class="sb-app">
  <div class="sb-main">
    <div class="pd-statusrow">
      <span class="sb-timer-chip">⏱ <span id="pd-timer">--</span></span>
      <button class="pd-info-btn" id="pd-info">ⓘ</button>
    </div>

    <div class="pd-hud">
      <span class="pd-balls">🔮 <span class="num" id="pd-ballnum">0</span></span>
      <span class="pd-golden" id="pd-golden">⭐ Golden Ball ready!</span>
      <span class="pd-mults">
        <button class="pd-mult sel" data-m="1">×1</button>
        <button class="pd-mult" data-m="2">×2</button>
        <button class="pd-mult" data-m="3">×3</button>
      </span>
    </div>

    <div class="pd-arrows" id="pd-arrows">
      <button class="pd-arrow">▼</button><button class="pd-arrow">▼</button><button class="pd-arrow">▼</button><button class="pd-arrow">▼</button><button class="pd-arrow">▼</button>
    </div>
    <div class="pd-boardwrap"><canvas id="pd-canvas"></canvas></div>

    <div class="pd-track">
      <div class="pd-track-head">
        <span class="t">🏆 Milestone Track</span>
        <span class="p"><span id="pd-pts">0</span> pts</span>
      </div>
      <div class="pd-bar" id="pd-bar"><div class="pd-fill" id="pd-fill"></div></div>
    </div>

    <div class="pd-earnrow">
      <button class="sb-btn sb-btn-green sb-btn-sm" id="pd-play">▶ Play a level <b>(+2 🔮)</b></button>
      <button class="sb-btn sb-btn-yellow sb-btn-sm" id="pd-shop">🛒 Get Balls</button>
    </div>
  </div>
</div>
<script src="../shared/core.js"></script>
<script>
(function(){
  "use strict";
  SB.init({ title:"Prize Drop", subtitle:"Drop balls · Win the Jackpot!", resetKey:"prize-drop" });

  var TIERS = [
    { pts:50,  rewards:[{type:"coins",amount:300}] },
    { pts:120, rewards:[{type:"wild",amount:1},{type:"undo",amount:1}] },
    { pts:250, rewards:[{type:"coins",amount:500},{type:"gem",amount:3}] },
    { pts:450, rewards:[{type:"gem",amount:5},{type:"draw",amount:2}] },
    { pts:700, rewards:[{type:"coins",amount:1500},{type:"wild",amount:2}] }
  ];
  var MAX_PTS = TIERS[TIERS.length-1].pts;

  var st = SB.store("prize-drop", {
    balls:6, golden:0, jackpot:2000, points:0, tiers:0, endTs:0
  });
  if (!st.data.endTs) { st.data.endTs = Date.now() + 72*3600*1000; st.save(); }

  SB.countdown(document.getElementById("pd-timer"), st.data.endTs, function(){
    SB.toast("⏱ Event ended — reset demo to replay");
  });

  // ============ HUD ============
  var mult = 1, offerOpen = false;
  var ballNumEl = document.getElementById("pd-ballnum");
  var goldenEl = document.getElementById("pd-golden");
  var multBtns = [].slice.call(document.querySelectorAll(".pd-mult"));

  function updateHud(){
    ballNumEl.textContent = st.data.balls;
    goldenEl.classList.toggle("on", st.data.golden > 0);
    multBtns.forEach(function(b){
      var m = +b.dataset.m;
      b.disabled = st.data.balls < m;
      b.classList.toggle("sel", m === mult);
    });
    if (st.data.balls < mult) {
      mult = st.data.balls >= 1 ? st.data.balls : 1;
      multBtns.forEach(function(b){ b.classList.toggle("sel", +b.dataset.m === mult); });
    }
    updateTrack();
  }
  multBtns.forEach(function(b){
    b.addEventListener("click", function(){
      mult = +b.dataset.m; SB.haptic();
      multBtns.forEach(function(x){ x.classList.toggle("sel", x===b); });
    });
  });

  // ============ Milestone track ============
  var barEl = document.getElementById("pd-bar"), fillEl = document.getElementById("pd-fill");
  var ptsEl = document.getElementById("pd-pts");
  var nodeEls = TIERS.map(function(t,i){
    var n = document.createElement("div");
    n.className = "pd-node";
    n.style.left = (t.pts/MAX_PTS*100) + "%";
    n.innerHTML = '<span class="pts">'+t.pts+'</span><span class="ic">'+SB.icon(t.rewards[0].type)+'</span>';
    barEl.appendChild(n);
    return n;
  });
  function updateTrack(){
    ptsEl.textContent = st.data.points;
    fillEl.style.width = Math.min(100, st.data.points/MAX_PTS*100) + "%";
    nodeEls.forEach(function(n,i){
      n.classList.toggle("done", i < st.data.tiers);
      if (i < st.data.tiers) n.querySelector(".ic").textContent = "✓";
      n.classList.toggle("next", i === st.data.tiers);
    });
  }
  function checkTiers(){
    while (st.data.tiers < TIERS.length && st.data.points >= TIERS[st.data.tiers].pts) {
      var t = TIERS[st.data.tiers];
      st.data.tiers++; st.save();
      var node = nodeEls[st.data.tiers-1];
      node.classList.add("pd-flash");
      SB.confetti(node.getBoundingClientRect().left, node.getBoundingClientRect().top);
      SB.grantRewards(t.rewards, node);
    }
    updateTrack();
  }

  // ============ Board / physics ============
  var canvas = document.getElementById("pd-canvas"), ctx = canvas.getContext("2d");
  var W=0, H=0, DPR=1, BR=0, pegs=[], balls=[], effects=[];
  var POCKETS = 5, divTop=0, multY=0, multX=0, gapW=0, multDir=1;
  var PAYOUT_LABEL = ["🪙100","🎟️2","JACKPOT","🃏?","🪙100"];

  function layout(){
    var w = canvas.parentElement.clientWidth;
    DPR = Math.min(2, window.devicePixelRatio||1);
    W = w; H = Math.round(w*1.25);
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.height = H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    BR = W*0.030;
    divTop = H*0.78; multY = H*0.695; gapW = W*0.21;
    pegs = [];
    var rows = 7, y0 = H*0.14, dy = H*0.066, pr = W*0.014;
    for (var r=0; r<rows; r++){
      var y = y0 + r*dy;
      if (r%2===0) for (var i=0;i<6;i++) pegs.push({x:(i+0.5)*W/6, y:y, r:pr, f:0});
      else for (var j=0;j<7;j++) pegs.push({x:j*W/6, y:y, r:pr, f:0});
    }
    for (var d=1; d<POCKETS; d++) pegs.push({x:d*W/5, y:divTop, r:pr*1.25, f:0, div:true});
  }
  layout();
  window.addEventListener("resize", layout);

  function colX(i){ return (i+0.5)*W/POCKETS; }

  function spawnBall(x){
    var golden = st.data.golden > 0;
    if (golden) { st.data.golden--; st.save(); }
    var bias = null;
    if (!golden && Math.random() < 0.30) bias = colX(Math.random()<0.5 ? 1 : 3);
    balls.push({
      x: Math.max(BR+2, Math.min(W-BR-2, x)), y: BR+2,
      vx:(Math.random()-0.5)*W*0.12, vy:0,
      mult: mult, golden: golden, multHit:false, bias: bias, spin:0
    });
    SB.haptic();
  }

  function tryDrop(x){
    if (balls.length >= 3) { SB.toast("Max 3 balls at once!"); return; }
    if (st.data.balls < mult) {
      document.querySelector(".pd-balls").classList.remove("sb-shake");
      void document.querySelector(".pd-balls").offsetWidth;
      document.querySelector(".pd-balls").classList.add("sb-shake");
      SB.toast("Not enough balls!"); SB.haptic(30);
      openOffer();
      return;
    }
    st.data.balls -= mult; st.save();
    spawnBall(x);
    updateHud();
  }

  [].slice.call(document.querySelectorAll(".pd-arrow")).forEach(function(a,i){
    a.addEventListener("click", function(){ tryDrop(colX(i)); });
  });
  canvas.addEventListener("pointerdown", function(e){
    var r = canvas.getBoundingClientRect();
    var y = e.clientY - r.top;
    if (y < H*0.35) tryDrop(e.clientX - r.left);
  });

  function originAt(x,y){
    var r = canvas.getBoundingClientRect();
    var px = r.left+x, py = r.top+y;
    return { getBoundingClientRect: function(){ return {left:px, top:py, width:0, height:0}; } };
  }

  // ============ Resolve landing ============
  function resolve(b, pocket){
    var org = originAt(colX(pocket), H-30);
    var x2 = b.multHit ? 2 : 1;
    if (pocket === 2) {
      var amt = st.data.jackpot * b.mult * x2;
      st.data.jackpot = 2000; st.save();
      SB.confetti(); SB.confetti(window.innerWidth*0.25, window.innerHeight*0.5);
      SB.confetti(window.innerWidth*0.75, window.innerHeight*0.5);
      SB.grantRewards([{type:"coins",amount:amt}], org);
      var m = SB.modal(
        '<div style="font-size:48px">🎰</div><h2 style="margin:6px 0;color:var(--sb-red)">JACKPOT!!</h2>'+
        '<p style="font-weight:800;font-size:20px;margin:4px 0">🪙 '+SB.fmt(amt)+' coins!</p>'+
        (x2>1?'<p class="sb-gold-text" style="font-weight:900">×2 multiplier pocket bonus!</p>':'')+
        '<button class="sb-btn sb-btn-yellow sb-btn-block" id="pd-jp-ok">Collect!</button>');
      m.el.querySelector("#pd-jp-ok").addEventListener("click", m.close);
    } else {
      st.data.jackpot += 50; st.save();
      if (pocket === 1) SB.grantRewards([{type:"token",amount:2*b.mult*x2}], org);
      else if (pocket === 3) {
        var boosters = ["wild","undo","draw"];
        SB.grantRewards([{type:boosters[(Math.random()*3)|0], amount:1*b.mult*x2}], org);
      } else SB.grantRewards([{type:"coins",amount:100*b.mult*x2}], org);
      if (b.multHit) SB.confetti(canvas.getBoundingClientRect().left+colX(pocket), canvas.getBoundingClientRect().top+H-40, 40);
    }
    st.data.points += 10*b.mult + (b.multHit?25:0);
    st.save();
    checkTiers();
    updateHud();
    if (st.data.balls === 0 && balls.length === 0) setTimeout(openOffer, 700);
  }

  // ============ Physics loop ============
  var last = performance.now(), t0 = last;
  function step(now){
    var dt = Math.min(0.032, (now-last)/1000); last = now;
    var t = (now-t0)/1000;
    multX = W/2 + Math.sin(t*1.15)*W*0.30;
    var g = H*3.2, e = 0.52;

    for (var bi=balls.length-1; bi>=0; bi--){
      var b = balls[bi];
      b.vy += g*dt;
      // steering: golden ball glides into the moving multiplier pocket
      if (b.golden && !b.multHit && b.y > multY-H*0.26 && b.y < multY){
        b.x += (multX - b.x)*Math.min(1, dt*9);
        b.vx *= 0.8;
      }
      // subtle near-miss bias toward jackpot-adjacent pockets
      if (b.bias !== null && b.y > H*0.55 && b.y < H*0.76)
        b.vx += (b.bias - b.x)*5*dt;
      b.vx *= Math.pow(0.35, dt); // air drag
      b.x += b.vx*dt; b.y += b.vy*dt;
      b.spin += b.vx*dt*0.05;

      // walls
      if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx)*e; }
      if (b.x > W-BR) { b.x = W-BR; b.vx = -Math.abs(b.vx)*e; }

      // pegs
      for (var pi=0; pi<pegs.length; pi++){
        var p = pegs[pi];
        var dx = b.x-p.x, dy2 = b.y-p.y, dist = Math.sqrt(dx*dx+dy2*dy2), min = BR+p.r;
        if (dist < min && dist > 0.001){
          var nx = dx/dist, ny = dy2/dist;
          b.x = p.x + nx*min; b.y = p.y + ny*min;
          var vn = b.vx*nx + b.vy*ny;
          if (vn < 0){
            b.vx -= (1+e)*vn*nx; b.vy -= (1+e)*vn*ny;
            b.vx += (Math.random()-0.5)*W*0.10;
            p.f = 1; SB.haptic(4);
          }
        }
      }

      // multiplier pocket pass
      if (!b.multHit && b.y > multY-BR && b.y < multY+BR && Math.abs(b.x-multX) < gapW/2){
        b.multHit = true;
        effects.push({x:b.x, y:multY, t:0, kind:"x2"});
        SB.haptic(25);
      }

      // pocket dividers (vertical walls)
      if (b.y+BR > divTop){
        for (var d=1; d<POCKETS; d++){
          var wx = d*W/5;
          if (Math.abs(b.x-wx) < BR+2 && b.y-BR > divTop){
            b.x = b.x < wx ? wx-BR-2 : wx+BR+2;
            b.vx = -b.vx*e;
          }
        }
      }

      // landed
      if (b.y > H-BR-4){
        var pocket = Math.max(0, Math.min(4, Math.floor(b.x/(W/5))));
        effects.push({x:colX(pocket), y:H-BR*2, t:0, kind:"land"});
        balls.splice(bi,1);
        resolve(b, pocket);
      }
    }
    draw(t, dt);
    requestAnimationFrame(step);
  }

  // ============ Drawing ============
  function draw(t, dt){
    ctx.clearRect(0,0,W,H);
    var bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#0e2a54"); bg.addColorStop(1,"#1D4FA1");
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

    // pockets
    for (var i=0;i<POCKETS;i++){
      var x0 = i*W/5;
      ctx.fillStyle = i===2 ? "rgba(215,38,61,0.35)" : "rgba(0,0,0,0.28)";
      ctx.fillRect(x0+2, divTop, W/5-4, H-divTop);
      ctx.textAlign = "center";
      if (i===2){
        ctx.fillStyle = "#FFC72C";
        ctx.font = "900 "+(W*0.032)+"px Trebuchet MS";
        ctx.fillText("JACKPOT", colX(i), divTop+H*0.05);
        ctx.font = "900 "+(W*0.043)+"px Trebuchet MS";
        ctx.fillText("🪙"+SB.fmt(st.data.jackpot), colX(i), divTop+H*0.10);
        var gl = 0.5+0.5*Math.sin(t*4);
        ctx.strokeStyle = "rgba(255,199,44,"+(0.4+0.5*gl)+")";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x0+3, divTop+1, W/5-6, H-divTop-3);
      } else {
        ctx.fillStyle = "#fff";
        ctx.font = "800 "+(W*0.037)+"px Trebuchet MS";
        ctx.fillText(PAYOUT_LABEL[i], colX(i), divTop+H*0.075);
      }
    }
    // dividers
    ctx.fillStyle = "#3E8EDE";
    for (var d=1; d<POCKETS; d++) ctx.fillRect(d*W/5-2, divTop, 4, H-divTop);

    // pegs
    pegs.forEach(function(p){
      if (p.f>0) p.f = Math.max(0, p.f-dt*4);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + p.f*2, 0, 7);
      ctx.fillStyle = p.f>0 ? "#FFC72C" : "rgba(255,255,255,0.85)";
      ctx.fill();
      if (p.f>0){ ctx.strokeStyle="rgba(255,199,44,"+p.f+")"; ctx.lineWidth=2; ctx.stroke(); }
    });

    // moving ×2 multiplier pocket
    ctx.save();
    ctx.translate(multX, multY);
    ctx.strokeStyle = "#FFC72C"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-gapW/2, -BR*1.1); ctx.lineTo(-gapW/2, BR*1.1);
    ctx.moveTo(gapW/2, -BR*1.1); ctx.lineTo(gapW/2, BR*1.1);
    ctx.stroke();
    ctx.fillStyle = "#FFC72C"; ctx.textAlign = "center";
    ctx.font = "900 "+(W*0.045)+"px Trebuchet MS";
    ctx.fillText("×2", 0, W*0.016);
    ctx.restore();

    // balls (Skip-Bo card-back styled discs)
    balls.forEach(function(b){
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.spin);
      ctx.shadowColor = b.golden ? "rgba(255,199,44,0.9)" : "rgba(0,0,0,0.4)";
      ctx.shadowBlur = b.golden ? 14 : 5;
      ctx.beginPath(); ctx.arc(0,0,BR,0,7);
      var gr = ctx.createRadialGradient(-BR*0.3,-BR*0.3,BR*0.15, 0,0,BR);
      if (b.golden){ gr.addColorStop(0,"#ffe28a"); gr.addColorStop(1,"#e0a400"); }
      else { gr.addColorStop(0,"#5ba0e8"); gr.addColorStop(1,"#14396f"); }
      ctx.fillStyle = gr; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = b.golden ? "#fff" : "#FFC72C";
      ctx.stroke();
      ctx.fillStyle = b.golden ? "#14396f" : "#FFC72C";
      ctx.textAlign = "center";
      ctx.font = "900 "+(BR*0.9)+"px Trebuchet MS";
      ctx.fillText(b.golden ? "★" : "SB", 0, BR*0.33);
      ctx.restore();
      if (b.mult > 1){
        ctx.fillStyle = "#fff"; ctx.textAlign="center";
        ctx.font = "900 "+(BR*0.75)+"px Trebuchet MS";
        ctx.fillText("×"+b.mult, b.x, b.y-BR-4);
      }
    });

    // effects
    for (var ei=effects.length-1; ei>=0; ei--){
      var fx = effects[ei]; fx.t += dt;
      var a = 1 - fx.t/0.6;
      if (a <= 0){ effects.splice(ei,1); continue; }
      if (fx.kind === "x2"){
        ctx.strokeStyle = "rgba(255,199,44,"+a+")"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(fx.x, fx.y, BR + fx.t*90, 0, 7); ctx.stroke();
        ctx.fillStyle = "rgba(255,199,44,"+a+")"; ctx.textAlign="center";
        ctx.font = "900 "+(W*0.06)+"px Trebuchet MS";
        ctx.fillText("×2!", fx.x, fx.y - fx.t*60);
      } else {
        ctx.strokeStyle = "rgba(255,255,255,"+a+")"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.t*70, 0, 7); ctx.stroke();
      }
    }
  }
  requestAnimationFrame(step);

  // ============ Out-of-balls contextual offer ============
  function openOffer(force){
    if (offerOpen || (!force && st.data.balls > 0)) return;
    offerOpen = true;
    var m = SB.modal(
      '<div style="font-size:42px">🔮</div>'+
      '<h3 style="margin:4px 0">'+(st.data.balls>0 ? "Stock up on Drop Balls!" : "Out of Drop Balls!")+'</h3>'+
      '<p class="sb-muted" style="font-size:13px;margin:4px 0 6px">The Jackpot is at <b style="color:var(--sb-red)">🪙'+SB.fmt(st.data.jackpot)+'</b> and climbing…</p>'+
      '<button class="pd-offer-pack" id="pd-p1"><span class="big">🔮</span><span><span class="nm">5 Balls</span><br><span class="ds">Keep the streak going</span></span><span class="pr">$0.99</span></button>'+
      '<button class="pd-offer-pack hot" id="pd-p2"><span class="pd-best">BEST VALUE</span><span class="big">⭐</span><span><span class="nm">15 Balls + Golden Ball</span><br><span class="ds">Golden Ball = guaranteed ×2 pass!</span></span><span class="pr">$4.99</span></button>'+
      '<button class="sb-sheet-cancel" id="pd-free">▶ No thanks — play a level for +2 balls</button>');
    function done(){ offerOpen = false; m.close(); }
    m.el.addEventListener("click", function(e){ if (e.target === m.el) offerOpen = false; });
    m.el.querySelector("#pd-p1").addEventListener("click", function(){
      done();
      SB.buyIAP({ label:"5 Drop Balls", price:"$0.99", sub:"Prize Drop · instant delivery",
        contents:[{type:"ball",amount:5}], grant:false,
        onSuccess:function(){
          st.data.balls += 5; st.save(); updateHud();
          SB.toast("+5 Drop Balls! 🔮"); SB.confetti();
        }, onCancel:function(){ offerOpen=false; } });
    });
    m.el.querySelector("#pd-p2").addEventListener("click", function(){
      done();
      SB.buyIAP({ label:"15 Balls + Golden Ball", price:"$4.99", sub:"Golden Ball guarantees the ×2 pocket!",
        contents:[{type:"ball",amount:15},{type:"star",amount:1}], grant:false,
        onSuccess:function(){
          st.data.balls += 15; st.data.golden += 1; st.save(); updateHud();
          SB.toast("+15 Balls + ⭐ Golden Ball!"); SB.confetti();
        }, onCancel:function(){ offerOpen=false; } });
    });
    m.el.querySelector("#pd-free").addEventListener("click", function(){ done(); playLevel(); });
  }
  document.getElementById("pd-shop").addEventListener("click", function(){ openOffer(true); });

  // ============ Free earn path ============
  var playBtn = document.getElementById("pd-play");
  function playLevel(){
    if (playBtn.disabled) return;
    playBtn.disabled = true;
    playBtn.innerHTML = '<span class="pd-spin">🃏</span> Playing level…';
    setTimeout(function(){
      st.data.balls += 2; st.save(); updateHud();
      playBtn.disabled = false;
      playBtn.innerHTML = '▶ Play a level <b>(+2 🔮)</b>';
      SB.toast("Level complete! +2 Drop Balls 🔮");
      SB.confetti(window.innerWidth/2, window.innerHeight*0.75, 40);
      SB.haptic(25);
    }, 1100);
  }
  playBtn.addEventListener("click", playLevel);

  // ============ Info modal ============
  document.getElementById("pd-info").addEventListener("click", function(){
    var m = SB.modal(
      '<div style="font-size:40px">🎯</div><h3 style="margin:6px 0">How Prize Drop works</h3>'+
      '<p style="font-size:13px;text-align:left;line-height:1.5;color:#3a4a6b">'+
      'Spend Drop Balls to release Skip-Bo discs down the peg board — pick your column and a ×1/×2/×3 multiplier, then watch physics decide your prize. '+
      'The center JACKPOT grows with every miss, and the moving ×2 pocket doubles any drop that slips through it. '+
      'Every drop also earns points toward five escalating milestone rewards, so no ball is ever wasted. '+
      'Balls come free from playing Skip-Bo levels, while ball packs and the guaranteed-×2 Golden Ball create contextual purchase moments exactly when excitement peaks.</p>'+
      '<button class="sb-btn sb-btn-blue sb-btn-block" id="pd-info-ok">Got it!</button>');
    m.el.querySelector("#pd-info-ok").addEventListener("click", m.close);
  });

  updateHud();
})();
</script>
</body>
</html>
