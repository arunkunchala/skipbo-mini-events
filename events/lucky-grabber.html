<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lucky Grabber — Skip-Bo Mini Event</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/core.css">
<style>
  .hdr-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .info-btn { margin-left:auto; width:44px; height:44px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.2); color:#fff; font-weight:900; font-size:17px; cursor:pointer; }
  .strong-badge { display:inline-flex; align-items:center; gap:4px; background:linear-gradient(180deg,#ff6a3d,#D7263D);
    color:#fff; font-weight:800; font-size:12px; border-radius:999px; padding:3px 10px;
    box-shadow:0 0 12px rgba(255,80,40,0.8); animation:sbPulse 1.2s infinite; }

  /* ---------- cabinet ---------- */
  #cabinet { border-radius:22px; padding:10px 10px 12px; position:relative;
    background:linear-gradient(180deg,#e8404f 0%,#D7263D 30%,#a31527 100%);
    border:3px solid #7c0e1c;
    box-shadow:var(--sb-shadow), inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -3px 0 rgba(0,0,0,0.3); }
  #cabinet::before, #cabinet::after { /* side pillar highlights */
    content:""; position:absolute; top:14px; bottom:14px; width:4px; border-radius:3px; pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,0.35),rgba(255,255,255,0.05)); }
  #cabinet::before { left:3px; } #cabinet::after { right:3px; }
  body.premium #cabinet { background:linear-gradient(180deg,#4a4436 0%,#1c1c1c 55%,#000 100%);
    border-color:#FFC72C; box-shadow:0 0 26px rgba(255,199,44,0.5), var(--sb-shadow), inset 0 2px 0 rgba(255,220,120,0.35); }

  #marquee { text-align:center; font-weight:900; font-size:20px; letter-spacing:2px; padding:1px 0 2px;
    color:#fffbe8; text-shadow:0 0 8px #FFC72C,0 0 18px #FFC72C,0 2px 0 rgba(0,0,0,0.4);
    animation:neon 3s linear infinite; white-space:nowrap; overflow:hidden; }
  @keyframes neon {
    0%   { text-shadow:0 0 8px #FFC72C,0 0 20px #FFC72C,0 2px 0 rgba(0,0,0,.4); color:#fffbe8; }
    33%  { text-shadow:0 0 8px #3E8EDE,0 0 20px #3E8EDE,0 2px 0 rgba(0,0,0,.4); color:#eaf4ff; }
    66%  { text-shadow:0 0 8px #2E9E4F,0 0 20px #2E9E4F,0 2px 0 rgba(0,0,0,.4); color:#eaffee; }
    100% { text-shadow:0 0 8px #FFC72C,0 0 20px #FFC72C,0 2px 0 rgba(0,0,0,.4); color:#fffbe8; }
  }
  body.premium #marquee, #cabinet.megaState #marquee { animation:none;
    color:#ffe58a; text-shadow:0 0 10px #FFC72C,0 0 24px #FFC72C,0 2px 0 rgba(0,0,0,.5); }
  #cabinet.megaState #marquee { animation:sbPulse 0.8s infinite; }
  #bulbs { display:flex; justify-content:center; gap:9px; padding:2px 0 7px; }
  #bulbs span { width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fffdf2, #ffe58a 55%, #e0a400);
    box-shadow:0 0 7px 2px rgba(255,199,44,0.85); animation:bulb 1.1s infinite; }
  #bulbs span:nth-child(2n) { animation-delay:0.55s; }
  #cabinet.megaState #bulbs span { animation-duration:0.35s; }
  @keyframes bulb { 0%,100% { opacity:1; } 50% { opacity:0.25; box-shadow:none; } }

  /* ---------- glass ---------- */
  #glass { position:relative; height:300px; overflow:hidden; border-radius:12px; touch-action:none;
    background:linear-gradient(180deg,#cfe6ff 0%,#eaf4ff 30%,#dceeff 100%);
    border:3px solid rgba(255,255,255,0.75);
    box-shadow:inset 0 0 24px rgba(29,79,161,0.25), inset 0 14px 18px -12px rgba(20,57,111,0.5); }
  #glass::after { /* glass glare — sits in front of everything */
    content:""; position:absolute; inset:0; z-index:9; pointer-events:none;
    background:
      linear-gradient(105deg,transparent 6%,rgba(255,255,255,0.4) 13%,rgba(255,255,255,0.12) 22%,transparent 27%),
      linear-gradient(105deg,transparent 68%,rgba(255,255,255,0.22) 74%,transparent 79%),
      linear-gradient(180deg,rgba(255,255,255,0.28),transparent 12%); }
  body.premium #glass { background:linear-gradient(180deg,#26262e 0%,#3a3a46 35%,#2c2c37 100%);
    border-color:rgba(255,199,44,0.75); box-shadow:inset 0 0 26px rgba(0,0,0,0.6); }
  #cabinet.megaState #glass { box-shadow:inset 0 0 34px rgba(255,199,44,0.55); }
  #rail { position:absolute; top:4px; left:0; right:0; height:8px; z-index:5;
    background:linear-gradient(180deg,#5a6b8c,#33425f); border-radius:4px;
    box-shadow:0 2px 3px rgba(0,0,0,0.3); }
  #pitFloor { position:absolute; bottom:0; left:0; right:0; height:26px;
    background:linear-gradient(180deg,#9cc8f5,#6ba3dd); border-top:2px solid rgba(255,255,255,0.6); }
  #pitFloor::before { content:""; position:absolute; inset:4px 10px 8px;
    background:radial-gradient(ellipse at 50% 0%, rgba(20,57,111,0.28), transparent 70%); }
  body.premium #pitFloor { background:linear-gradient(180deg,#6b5a2a,#403618); border-top-color:rgba(255,220,120,0.55); }

  /* ---------- chute ---------- */
  #chute { position:absolute; left:6px; bottom:0; width:58px; height:44px; border-radius:10px 10px 0 0;
    background:linear-gradient(180deg,#14213c,#000); border:2px solid #33425f; border-bottom:none;
    color:#9cc8f5; font-size:9px; font-weight:800; text-align:center; padding-top:12px; z-index:4; }
  #chute::before { content:""; position:absolute; left:4px; right:4px; top:4px; height:6px; border-radius:3px;
    background:radial-gradient(ellipse at 50% 100%, #000 40%, #14213c); box-shadow:inset 0 2px 3px #000; }
  #flap { position:absolute; left:-2px; top:-9px; width:58px; height:10px; border-radius:4px 4px 1px 1px;
    background:linear-gradient(180deg,#8b9ab8,#42536f); border:1px solid #2b3852;
    transform-origin:0% 100%; transition:transform 0.3s cubic-bezier(0.34,1.4,0.64,1); z-index:5; }
  #chute.open #flap { transform:rotate(-62deg); }
  body.premium #chute { border-color:#8a6d1f; color:#ffd95e; }
  body.premium #flap { background:linear-gradient(180deg,#ffe58a,#a97e12); border-color:#6d5410; }

  /* ---------- claw ---------- */
  #claw { position:absolute; top:0; left:0; width:0; display:flex; flex-direction:column; align-items:center; z-index:6; }
  #trolley { position:relative; width:28px; height:13px; border-radius:4px; margin-top:1px;
    background:linear-gradient(180deg,#c3cede,#5a6b8c); box-shadow:0 2px 3px rgba(0,0,0,0.35); }
  #trolley::before, #trolley::after { content:""; position:absolute; top:-4px; width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d9e1ee, #5a6b8c 65%, #33425f); }
  #trolley::before { left:2px; } #trolley::after { right:2px; }
  #spool { position:absolute; left:50%; top:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%;
    background:repeating-conic-gradient(#33425f 0 30deg, #aab6cc 30deg 60deg); border:1px solid #14213c; }
  #spool.spin { animation:spoolSpin 0.5s linear infinite; }
  @keyframes spoolSpin { to { transform:rotate(360deg); } }
  #cable { width:3px; height:14px; background:linear-gradient(90deg,#7a89a8,#33425f 60%,#7a89a8);
    transition:height 0.5s ease-in-out; }
  #gripper { position:relative; width:44px; height:30px; margin-top:-2px; transition:filter 0.3s; }
  #gripper .hub { position:absolute; left:50%; top:0; width:18px; height:13px; margin-left:-9px; z-index:2;
    background:linear-gradient(180deg,#c3cede,#5a6b8c); border-radius:5px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.5), 0 1px 2px rgba(0,0,0,0.3); }
  #gripper .prong { position:absolute; top:9px; width:8px; height:24px; z-index:1;
    background:linear-gradient(90deg,#8d9cba,#c3cede 45%,#5a6b8c); transition:transform 0.22s ease;
    border-radius:4px 4px 2px 6px; box-shadow:0 1px 2px rgba(0,0,0,0.3); }
  #gripper .prong::after { content:""; position:absolute; bottom:-6px; left:0; width:8px; height:9px;
    background:inherit; border-radius:2px 2px 8px 3px; transform:rotate(18deg); transform-origin:top center; }
  #gripper .pl { left:5px; transform:rotate(27deg); transform-origin:top center; }
  #gripper .pr { right:5px; transform:rotate(-27deg) scaleX(-1); transform-origin:top center; }
  #gripper .pm { left:50%; margin-left:-3px; width:6px; height:20px; opacity:0.55; z-index:0;
    transform:scaleY(0.9); background:linear-gradient(90deg,#5a6b8c,#8d9cba); }
  #claw.closed .pl { transform:rotate(3deg); }
  #claw.closed .pr { transform:rotate(-3deg) scaleX(-1); }
  #claw.closed .pm { transform:scaleY(1); }
  #claw.mega #cable { background:linear-gradient(90deg,#ffe58a,#e0a400 60%,#ffe58a); }
  #claw.mega #trolley, #claw.mega .hub, #claw.mega .prong { background:linear-gradient(180deg,#fff3c4,#e0a400); }
  #claw.mega #spool { background:repeating-conic-gradient(#8a5c00 0 30deg, #ffe58a 30deg 60deg); }
  #claw.mega #gripper { animation:sparkle 0.7s infinite; }
  #claw.strong #gripper { filter:drop-shadow(0 0 8px #ff4530); }
  #claw.strong .prong, #claw.strong .hub, #claw.strong #trolley { background:linear-gradient(180deg,#ff8a75,#c22); }
  @keyframes sparkle { 0%,100% { filter:drop-shadow(0 0 6px #FFC72C); } 50% { filter:drop-shadow(0 0 16px #fff); } }

  /* ---------- capsules (two-tone gashapon: clear dome + colored base + seam + shine) ---------- */
  .cap { position:absolute; width:40px; height:40px; border-radius:50%;
    display:grid; place-items:center; font-size:18px; z-index:3;
    text-shadow:0 1px 1px rgba(0,0,0,0.25);
    border:2px solid rgba(0,0,0,0.22);
    box-shadow:0 4px 6px rgba(20,57,111,0.35), inset 0 -4px 6px rgba(0,0,0,0.18); }
  .cap::before { content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:
      radial-gradient(closest-side at 30% 22%, rgba(255,255,255,0.95), rgba(255,255,255,0) 52%),
      linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 42%,
        rgba(0,0,0,0.22) 46%, rgba(255,255,255,0.5) 49%, rgba(0,0,0,0.12) 52%, transparent 56%);
    animation:capShimmer 3.6s ease-in-out infinite; }
  .cap:nth-child(2n)::before { animation-delay:1.2s; }
  .cap:nth-child(3n)::before { animation-delay:2.4s; }
  @keyframes capShimmer { 0%,100% { opacity:1; } 50% { opacity:0.68; } }
  .cap.coin  { background:linear-gradient(180deg,#fffbe9 0%,#ffedb3 46%,#FFC72C 54%,#b97f00 100%); }
  .cap.boost { background:linear-gradient(180deg,#eef6ff 0%,#cfe4fb 46%,#3E8EDE 54%,#16407e 100%); }
  .cap.gem   { background:linear-gradient(180deg,#fbeffe 0%,#efd3f6 46%,#b452c9 54%,#6d2680 100%); }
  .cap.jack  { background:linear-gradient(180deg,#fffdf2 0%,#fff3c4 46%,#FFC72C 54%,#a06e00 100%);
    border-color:#8a5c00; animation:jackGlow 1.4s infinite; }
  .cap.gold  { background:linear-gradient(180deg,#ffe58a 0%,#ffd95e 46%,#c78900 54%,#1c1c1c 100%); border-color:#FFC72C; }
  @keyframes jackGlow { 0%,100% { box-shadow:0 0 6px 2px rgba(255,199,44,0.7), 0 4px 6px rgba(20,57,111,0.35); }
    50% { box-shadow:0 0 16px 5px rgba(255,199,44,0.95), 0 4px 6px rgba(20,57,111,0.35); } }
  .cap.targeted { outline:3px solid rgba(215,38,61,0.85); outline-offset:2px; }
  body.premium .cap.targeted { outline-color:rgba(255,199,44,0.9); }
  .cap .lock { position:absolute; top:-8px; right:-6px; font-size:13px; }
  .cap.wobble { animation:wob 0.28s ease-in-out 2; }
  @keyframes wob { 0%,100% { transform:rotate(0); } 25% { transform:rotate(-12deg); } 75% { transform:rotate(12deg); } }
  .cap.tumble { animation:tum 0.8s ease-in-out; }
  @keyframes tum { 0% { transform:translateY(-70px) rotate(0); } 60% { transform:translateY(6px) rotate(300deg); }
    100% { transform:translateY(0) rotate(360deg); } }
  .cap.settle { animation:settle 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes settle { 0% { transform:translateY(-14px); } 100% { transform:translateY(0); } }

  #oddsTag { position:absolute; left:0; top:0; z-index:7; background:rgba(27,42,74,0.92); color:#fff; font-size:11px;
    font-weight:800; padding:2px 8px; border-radius:999px; pointer-events:none;
    transition:transform 0.15s ease; white-space:nowrap; }
  #oddsTag.mega { background:linear-gradient(180deg,#FFC72C,#e0a400); color:#1B2A4A; }
  .pop-txt { position:absolute; z-index:8; font-weight:900; font-size:15px; color:#D7263D;
    text-shadow:0 1px 0 #fff; pointer-events:none; animation:popUp 0.9s ease-out forwards; }
  body.premium .pop-txt { color:#FFC72C; text-shadow:0 1px 0 #000; }
  @keyframes popUp { 0% { transform:translateY(0) scale(0.6); opacity:0; } 20% { opacity:1; transform:scale(1.15); }
    100% { transform:translateY(-38px) scale(1); opacity:0; } }
  #clearBanner { position:absolute; inset:0; z-index:10; display:none; flex-direction:column; gap:8px;
    align-items:center; justify-content:center; background:rgba(20,57,111,0.85); text-align:center; }
  #clearBanner.show { display:flex; }
  #clearBanner h2 { color:#FFC72C; font-size:24px; margin:0; text-shadow:0 0 14px #FFC72C; animation:sbPulse 1s infinite; }

  /* ---------- coin slot / grip meter ---------- */
  #slotRow { display:flex; align-items:center; gap:10px; margin-top:10px; }
  #coinSlot { flex:0 0 auto; background:linear-gradient(180deg,#33425f,#14213c); color:#FFC72C;
    border:2px solid #5a6b8c; border-radius:10px; padding:6px 12px; font-weight:900; font-size:15px;
    display:flex; align-items:center; gap:6px; }
  #coinSlot .slit { width:4px; height:18px; background:#000; border-radius:2px; box-shadow:inset 0 0 4px #FFC72C; }
  body.premium #coinSlot { border-color:#8a6d1f; }
  #meterWrap { flex:1 1 auto; }
  #meter { height:18px; border-radius:999px; background:rgba(0,0,0,0.4); border:2px solid rgba(255,255,255,0.5);
    overflow:hidden; position:relative; }
  #meterFill { height:100%; width:0%; border-radius:999px; transition:width 0.6s cubic-bezier(0.22,1,0.36,1);
    background:linear-gradient(90deg,#3E8EDE,#2E9E4F,#FFC72C); }
  #meter.full #meterFill { animation:sparkle 0.7s infinite; background:linear-gradient(90deg,#FFC72C,#fff3c4,#FFC72C); }
  #meterTxt { position:absolute; inset:0; display:grid; place-items:center; font-size:10px; font-weight:900;
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.6); }
  .meter-note { font-size:10px; font-weight:700; color:#fff; opacity:0.9; margin-top:3px; text-align:center; }

  /* ---------- controls ---------- */
  .controls { display:flex; gap:10px; margin-top:12px; align-items:stretch; }
  .move-btn { flex:0 0 76px; min-height:52px; border:none; border-radius:14px; font-size:26px; color:#fff; cursor:pointer;
    background:linear-gradient(180deg,#5ba0e8,#1D4FA1); box-shadow:0 4px 0 rgba(0,0,0,0.25); touch-action:none; }
  .move-btn:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.25); }
  body.premium .move-btn { background:linear-gradient(180deg,#ffd95e,#a97e12); color:#1B2A4A; }
  .grab-big { flex:1 1 auto; font-size:20px; }
  .earn-row { display:flex; gap:8px; margin-top:10px; }
  .earn-row .sb-btn { flex:1 1 0; min-height:46px; }

  /* ---------- prize pool panel ---------- */
  .pool { margin-top:14px; padding:12px; }
  body.premium .pool { background:linear-gradient(180deg,#2b2519,#1a1610); border:2px solid rgba(255,199,44,0.5); color:#f2e6c8; }
  .pool-title { font-weight:900; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .pool-note { font-size:10px; font-weight:700; color:#2E9E4F; }
  body.premium .pool-note { color:#ffd95e; }
  .pool-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed rgba(27,42,74,0.15);
    font-size:12px; font-weight:700; }
  body.premium .pool-row { border-bottom-color:rgba(255,199,44,0.25); }
  body.premium .pool-row .sb-muted { color:#bfae8a; }
  .pool-row:last-child { border-bottom:none; }
  .pool-row .pico { font-size:17px; }
  .pool-row .pname { flex:1 1 auto; }
  .pool-row .pods { color:#1D4FA1; }
  body.premium .pool-row .pods { color:#ffd95e; }
  .pool-row .pleft { background:#1B2A4A; color:#FFC72C; border-radius:999px; padding:1px 9px; font-weight:900; }
  .pool-row.gone { opacity:0.35; text-decoration:line-through; }

  /* ---------- shop modal ---------- */
  .shop-opt { display:flex; align-items:center; gap:10px; width:100%; margin-top:8px; cursor:pointer;
    background:#fff; border:2px solid rgba(27,42,74,0.15); border-radius:14px; padding:10px 12px; text-align:left;
    font-family:var(--sb-font); }
  .shop-opt:active { transform:scale(0.98); }
  .shop-opt .so-ico { font-size:24px; }
  .shop-opt .so-txt { flex:1 1 auto; }
  .shop-opt .so-name { font-weight:900; font-size:14px; color:var(--sb-ink); }
  .shop-opt .so-sub { font-size:11px; color:#5a6b8c; font-weight:700; }
  .shop-opt .so-price { font-weight:900; color:#fff; background:linear-gradient(180deg,#3fc167,#2E9E4F);
    border-radius:10px; padding:6px 10px; font-size:13px; white-space:nowrap; }
  .shop-opt .so-price.free { background:linear-gradient(180deg,#5ba0e8,#1D4FA1); }
  .shop-opt:disabled { opacity:0.5; pointer-events:none; }
  .shop-opt.best { border-color:#FFC72C; box-shadow:0 0 0 2px rgba(255,199,44,0.5); position:relative; }

  /* ---------- capsule open modal ---------- */
  .cap-big { font-size:64px; display:inline-block; animation:capCrack 0.9s ease; }
  @keyframes capCrack { 0% { transform:scale(0.4) rotate(0); } 30% { transform:scale(1.2) rotate(-14deg); }
    50% { transform:scale(1) rotate(12deg); } 70% { transform:scale(1.25) rotate(-6deg); } 100% { transform:scale(1) rotate(0); } }
  .open-chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:10px 0 14px; }
</style>
</head>
<body>
<div class="sb-app">
  <div class="sb-main">
    <div class="hdr-row">
      <span class="sb-timer-chip">⏳ <span id="cd">--</span></span>
      <span class="strong-badge" id="strongBadge" style="display:none">💪 <span id="strongT">5:00</span></span>
      <button class="info-btn" id="infoBtn" aria-label="Info">ⓘ</button>
    </div>

    <div id="cabinet">
      <div id="marquee">✦ LUCKY GRABBER ✦</div>
      <div id="bulbs"></div>
      <div id="glass">
        <div id="rail"></div>
        <div id="chute"><div id="flap"></div>PRIZE<br>⬇</div>
        <div id="pitFloor"></div>
        <div id="claw">
          <div id="trolley"><div id="spool"></div></div>
          <div id="cable"></div>
          <div id="gripper"><div class="hub"></div><div class="prong pm"></div><div class="prong pl"></div><div class="prong pr"></div></div>
        </div>
        <div id="oddsTag" style="display:none"></div>
        <div id="clearBanner">
          <h2>🏆 MACHINE CLEARED!</h2>
          <div style="color:#fff;font-weight:800;font-size:13px">Bonus +1000 coins collected!</div>
          <button class="sb-btn sb-btn-yellow sb-btn-sm" id="premiumBtn">👑 Premium Machine · $9.99</button>
          <button class="sb-btn sb-btn-blue sb-btn-sm" id="restartBtn">🔁 New standard machine (free)</button>
        </div>
      </div>
      <div id="slotRow">
        <div id="coinSlot"><span class="slit"></span>🕹️ <span id="grabCount">3</span></div>
        <div id="meterWrap">
          <div id="meter"><div id="meterFill"></div><div id="meterTxt">GRIP POWER 0%</div></div>
          <div class="meter-note">Every miss = <b>+34% grip</b> · Full bar = <b>MEGA GRAB</b> (guaranteed, any capsule)</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="move-btn" id="btnL" aria-label="Move left">◀</button>
      <button class="sb-btn sb-btn-red grab-big" id="grabBtn">🕹️ GRAB!</button>
      <button class="move-btn" id="btnR" aria-label="Move right">▶</button>
    </div>
    <div class="earn-row">
      <button class="sb-btn sb-btn-blue sb-btn-sm" id="earnBtn">🃏 Play a level (+1 grab)</button>
      <button class="sb-btn sb-btn-yellow sb-btn-sm" id="shopBtn">🛒 Get Grabs</button>
    </div>

    <div class="sb-panel pool">
      <div class="pool-title">PRIZE POOL <span class="pool-note">Finite pool — every capsule stays until won!</span></div>
      <div id="poolList"></div>
    </div>
  </div>
</div>
<script src="../shared/core.js"></script>
<script>
(function () {
  "use strict";
  SB.init({ title: "Lucky Grabber", subtitle: "Clear the machine — win every prize!", resetKey: "lucky-grabber" });

  // ---------- tiers ----------
  var TIERS = {
    coin:  { ico: "🪙", name: "Coin Capsule",    odds: 0.85 },
    boost: { ico: "🎴", name: "Booster Capsule", odds: 0.65 },
    gem:   { ico: "💎", name: "Gem Capsule",     odds: 0.55 },
    jack:  { ico: "⭐", name: "GOLD JACKPOT",    odds: 0.30 },
    gold:  { ico: "🔒", name: "Guaranteed Gold", odds: 1.00 }
  };
  function poolDef(premium) {
    var caps = [];
    var i;
    for (i = 0; i < 8; i++) caps.push({ t: "coin", won: false });
    for (i = 0; i < (premium ? 4 : 3); i++) caps.push({ t: "boost", won: false });
    for (i = 0; i < (premium ? 3 : 2); i++) caps.push({ t: "gem", won: false });
    for (i = 0; i < (premium ? 2 : 1); i++) caps.push({ t: "jack", won: false });
    // shuffle order so pile placement varies
    for (i = caps.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var tmp = caps[i]; caps[i] = caps[j]; caps[j] = tmp; }
    return caps;
  }

  // ---------- state ----------
  var st = SB.store("lucky-grabber", {
    endTs: 0, grabs: 3, pity: 0, premium: false, cleared: false,
    strongUntil: 0, shuffleDay: "", caps: null
  });
  var S = st.data;
  if (!S.endTs) { S.endTs = Date.now() + 48 * 3600 * 1000; }
  if (!S.caps) { S.caps = poolDef(false); }
  st.save();
  if (S.premium) document.body.classList.add("premium");

  // ---------- dom ----------
  var glass = document.getElementById("glass"), claw = document.getElementById("claw"),
      cable = document.getElementById("cable"), spool = document.getElementById("spool"),
      oddsTag = document.getElementById("oddsTag"), cabinet = document.getElementById("cabinet"),
      marquee = document.getElementById("marquee"), chute = document.getElementById("chute"),
      grabBtn = document.getElementById("grabBtn"), grabCount = document.getElementById("grabCount"),
      meter = document.getElementById("meter"), meterFill = document.getElementById("meterFill"),
      meterTxt = document.getElementById("meterTxt"), poolList = document.getElementById("poolList"),
      clearBanner = document.getElementById("clearBanner"), strongBadge = document.getElementById("strongBadge"),
      restartBtn = document.getElementById("restartBtn"), coinSlot = document.getElementById("coinSlot");

  // marquee bulbs
  (function () { var b = document.getElementById("bulbs"), i; for (i = 0; i < 12; i++) b.appendChild(document.createElement("span")); })();

  SB.countdown(document.getElementById("cd"), S.endTs, function () { SB.toast("Event ended! (demo keeps running)"); });

  var CHUTE_X = 35;   // drop point = chute center
  var HOLD_Y = 38;    // capsule top while held by raised claw
  var CW = 40, ROW_H = 30;

  // ---------- capsule layout ----------
  var capEls = [];
  var pendingLayout = false;
  function layoutCapsules() {
    if (busy) { pendingLayout = true; return; }
    capEls.forEach(function (e) { if (e) e.remove(); });
    capEls = [];
    var W = glass.clientWidth, H = glass.clientHeight;
    // pile re-packs: only unwon capsules take slots, so nothing floats over gaps
    var n = 0;
    S.caps.forEach(function (c) { if (!c.won) n++; });
    var sizes = [], rem = n, size = 7;
    while (rem > 0) { sizes.push(Math.min(size, rem)); rem -= size; size = Math.max(2, size - 1); }
    var idx = 0;
    S.caps.forEach(function (c, ci) {
      if (c.won) { capEls.push(null); return; }
      var row = 0, acc = 0;
      for (var r = 0; r < sizes.length; r++) { if (idx < acc + sizes[r]) { row = r; break; } acc += sizes[r]; }
      var posInRow = idx - acc, k = sizes[row];
      var usable = W - 78; // keep clear of chute on the left
      var x = 70 + (posInRow + 0.5) * usable / k - CW / 2 + (((ci * 37) % 13) - 6);
      var top = H - 30 - CW - row * ROW_H;
      idx++;
      var el = document.createElement("div");
      el.className = "cap " + c.t;
      el.dataset.row = row;
      el.textContent = c.t === "gold" ? "⭐" : TIERS[c.t].ico;
      if (c.t === "gold") el.innerHTML = "⭐<span class='lock'>🎯</span>";
      el.style.left = Math.max(66, Math.min(W - CW - 4, x)) + "px";
      el.style.top = top + "px";
      el.style.zIndex = 3 + (sizes.length - row); // front row on top = pile depth
      if (row > 0) el.style.filter = "brightness(" + (1 - row * 0.07) + ")"; // back rows in shadow
      glass.appendChild(el);
      capEls.push(el);
    });
  }

  // ---------- claw movement (transform-based, single rAF loop) ----------
  var clawX = 200, busy = false;
  function clampX(x) { return Math.max(70, Math.min(glass.clientWidth - 26, x)); }
  function setClaw(x, slow) {
    clawX = clampX(x);
    claw.style.transition = slow ? "transform 0.25s ease" : "none";
    claw.style.transform = "translateX(" + clawX + "px)";
    updateTarget();
  }
  function clawTo(x, ms) { // scripted move, no clamp (used to reach the chute)
    claw.style.transition = "transform " + ms + "ms ease-in-out";
    claw.style.transform = "translateX(" + x + "px)";
  }
  var moveDir = 0, rafId = null;
  function moveLoop() {
    if (moveDir && !busy) setClaw(clawX + moveDir * 3.4);
    rafId = moveDir ? requestAnimationFrame(moveLoop) : null;
  }
  function holdMove(btn, dir) {
    function start(e) { e.preventDefault(); if (busy) return; moveDir = dir; if (!rafId) rafId = requestAnimationFrame(moveLoop); }
    function stop() { if (moveDir === dir) moveDir = 0; }
    btn.addEventListener("pointerdown", start);
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { btn.addEventListener(ev, stop); });
  }
  holdMove(document.getElementById("btnL"), -1);
  holdMove(document.getElementById("btnR"), 1);
  var dragging = false;
  glass.addEventListener("pointerdown", function (e) { if (busy) return; dragging = true;
    setClaw(e.clientX - glass.getBoundingClientRect().left); });
  glass.addEventListener("pointermove", function (e) { if (dragging && !busy)
    setClaw(e.clientX - glass.getBoundingClientRect().left); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
    glass.addEventListener(ev, function () { dragging = false; }); });

  // ---------- targeting / odds ----------
  function nearestCap() {
    var best = -1, bd = 1e9;
    S.caps.forEach(function (c, i) {
      if (c.won || !capEls[i]) return;
      // prefer the front row when capsules overlap under the claw
      var cx = capEls[i].offsetLeft + CW / 2;
      var d = Math.abs(cx - clawX) + (+capEls[i].dataset.row || 0) * 7;
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }
  function effOdds(t) {
    if (S.pity >= 100) return 1;
    var o = TIERS[t].odds;
    if (t !== "gold" && Date.now() < S.strongUntil) o = Math.min(1, o + 0.25);
    return o;
  }
  var targetIdx = -1;
  function updateTarget() {
    if (targetIdx >= 0 && capEls[targetIdx]) capEls[targetIdx].classList.remove("targeted");
    if (busy || clearBanner.classList.contains("show")) { targetIdx = -1; oddsTag.style.display = "none"; return; }
    var ni = nearestCap();
    targetIdx = ni;
    if (ni < 0) { oddsTag.style.display = "none"; return; }
    var el = capEls[ni]; el.classList.add("targeted");
    var mega = S.pity >= 100;
    oddsTag.style.display = "block";
    oddsTag.className = mega ? "mega" : "";
    oddsTag.textContent = mega ? "MEGA 100%" : Math.round(effOdds(S.caps[ni].t) * 100) + "%";
    oddsTag.style.transform = "translate(" + (el.offsetLeft - 4) + "px," + (el.offsetTop - 24) + "px)";
  }

  // ---------- renders ----------
  function renderGrabs() {
    grabCount.textContent = S.grabs;
    grabBtn.textContent = S.pity >= 100 ? "⚡ MEGA GRAB!" : "🕹️ GRAB!";
  }
  function renderMeter() {
    var p = Math.min(100, S.pity);
    meterFill.style.width = p + "%";
    meterTxt.textContent = p >= 100 ? "MEGA GRAB READY!" : "GRIP POWER " + p + "%";
    meter.classList.toggle("full", p >= 100);
    claw.classList.toggle("mega", p >= 100);
    cabinet.classList.toggle("megaState", p >= 100);
    marquee.textContent = p >= 100 ? "⚡ MEGA GRAB READY ⚡" : (S.premium ? "✦ PREMIUM GRABBER ✦" : "✦ LUCKY GRABBER ✦");
    renderGrabs();
    updateTarget();
  }
  function contentsLabel(t) {
    if (S.premium) {
      if (t === "coin") return "300 coins"; if (t === "jack") return "3000 coins + 3 Wild + Avatar Frame";
    }
    return { coin: "200 coins", boost: "random Wild / Undo / Draw+", gem: S.premium ? "8 gems" : "5 gems",
      jack: "2000 coins + 2 Wild + Avatar Frame", gold: "800 coins + 3 gems (guaranteed!)" }[t];
  }
  function renderPool() {
    var order = ["coin", "boost", "gem", "jack", "gold"], html = "";
    var strongOn = Date.now() < S.strongUntil;
    order.forEach(function (t) {
      var tot = 0, left = 0;
      S.caps.forEach(function (c) { if (c.t === t) { tot++; if (!c.won) left++; } });
      if (!tot) return;
      var o = TIERS[t].odds, boosted = strongOn && t !== "gold" && o < 1;
      if (boosted) o = Math.min(1, o + 0.25);
      html += '<div class="pool-row' + (left ? "" : " gone") + '"><span class="pico">' + (t === "gold" ? "⭐🎯" : TIERS[t].ico) +
        '</span><span class="pname">' + TIERS[t].name + " <span class='sb-muted'>· " + contentsLabel(t) +
        '</span></span><span class="pods">' + (boosted ? "💪" : "") + Math.round(o * 100) + '%</span><span class="pleft">×' + left + "</span></div>";
    });
    poolList.innerHTML = html;
  }
  var strongWas = false;
  function renderStrong() {
    var left = S.strongUntil - Date.now();
    var on = left > 0;
    strongBadge.style.display = on ? "" : "none";
    claw.classList.toggle("strong", on && S.pity < 100);
    if (on) {
      var m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
      document.getElementById("strongT").textContent = m + ":" + String(s).padStart(2, "0");
    }
    if (on !== strongWas) { strongWas = on; updateTarget(); renderPool(); if (!on) SB.toast("Strong Claw expired"); }
  }
  setInterval(renderStrong, 1000);

  // ---------- grab sequence ----------
  function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
  function pop(x, y, txt) {
    var p = document.createElement("div");
    p.className = "pop-txt"; p.textContent = txt;
    p.style.left = x + "px"; p.style.top = y + "px";
    glass.appendChild(p);
    setTimeout(function () { p.remove(); }, 950);
  }
  function capRewards(t) {
    if (t === "coin") return [{ type: "coins", amount: S.premium ? 300 : 200 }];
    if (t === "boost") { var b = ["wild", "undo", "draw"][(Math.random() * 3) | 0]; return [{ type: b, amount: 1 }]; }
    if (t === "gem") return [{ type: "gem", amount: S.premium ? 8 : 5 }];
    if (t === "gold") return [{ type: "coins", amount: 800 }, { type: "gem", amount: 3 }];
    return [{ type: "coins", amount: S.premium ? 3000 : 2000 }, { type: "wild", amount: S.premium ? 3 : 2 }];
  }
  function openCapsule(t, onDone) {
    var rws = capRewards(t);
    var chips = rws.map(SB.rewardChip).join("");
    if (t === "jack") chips += '<span class="sb-reward"><span class="ico">🖼️</span>Exclusive Avatar Frame</span>';
    var m = SB.modal(
      '<div class="cap-big">' + (t === "gold" ? "⭐" : TIERS[t].ico) + "</div>" +
      "<h3 style='margin:6px 0'>" + (t === "jack" ? "JACKPOT!!!" : "Capsule opened!") + "</h3>" +
      '<div class="open-chips">' + chips + "</div>" +
      '<button class="sb-btn sb-btn-green sb-btn-block" id="collectBtn">Collect!</button>');
    setTimeout(function () {
      SB.grantRewards(rws, m.el.querySelector(".cap-big"));
      SB.confetti(window.innerWidth / 2, window.innerHeight / 2, t === "jack" ? 160 : 80);
    }, 500);
    m.el.querySelector("#collectBtn").addEventListener("click", function () { m.close(); if (onDone) onDone(); });
  }
  function endBusy(settle) {
    busy = false;
    if (pendingLayout) {
      pendingLayout = false; layoutCapsules(); renderPool();
      if (settle) capEls.forEach(function (e) { if (e) e.classList.add("settle"); });
    }
    updateTarget();
  }
  async function doGrab() {
    if (busy) return;
    if (S.grabs <= 0) {
      grabBtn.classList.remove("sb-shake"); void grabBtn.offsetWidth; grabBtn.classList.add("sb-shake");
      coinSlot.classList.add("sb-shake"); setTimeout(function () { coinSlot.classList.remove("sb-shake"); }, 450);
      SB.haptic(30); openShop("Out of grabs!"); return;
    }
    var ti = nearestCap();
    if (ti < 0) return;
    busy = true; dragging = false; moveDir = 0;
    S.grabs--; st.save(); renderGrabs();
    var mega = S.pity >= 100;
    var el = capEls[ti], c = S.caps[ti];
    el.classList.remove("targeted");
    var bx = el.offsetLeft, by = el.offsetTop;
    setClaw(bx + CW / 2, true); // busy → odds tag hidden by updateTarget
    await wait(300);
    // descend — spool pays out cable
    var targetH = by - 32;
    spool.classList.add("spin");
    cable.style.height = targetH + "px";
    await wait(540);
    spool.classList.remove("spin");
    claw.classList.add("closed"); SB.haptic(12);
    el.style.zIndex = 5;
    if (mega) { // gold claw sparks on the guaranteed catch
      var gr = glass.getBoundingClientRect();
      SB.confetti(gr.left + clawX, gr.top + targetH + 26, 45);
    }
    await wait(260);
    var win = mega || c.t === "gold" || Math.random() < effOdds(c.t);
    if (win) {
      // lift to the top, capsule held in the prongs
      var heldDy = HOLD_Y - by;
      spool.classList.add("spin");
      cable.style.height = "14px";
      el.style.transition = "transform 0.55s ease-in-out";
      el.style.transform = "translate(" + (clawX - CW / 2 - bx) + "px," + heldDy + "px)";
      await wait(580);
      spool.classList.remove("spin");
      // travel to the chute
      clawTo(CHUTE_X, 650);
      el.style.transition = "transform 0.65s ease-in-out";
      el.style.transform = "translate(" + (CHUTE_X - CW / 2 - bx) + "px," + heldDy + "px)";
      await wait(680);
      // release — flap swings open, capsule drops in
      chute.classList.add("open");
      claw.classList.remove("closed");
      el.style.transition = "transform 0.45s cubic-bezier(0.5,0,0.8,0.4), opacity 0.45s";
      el.style.transform = "translate(" + (CHUTE_X - CW / 2 - bx) + "px," + (glass.clientHeight - 40 - by) + "px) scale(0.72)";
      el.style.opacity = "0";
      SB.haptic(18);
      await wait(470);
      setTimeout(function () { chute.classList.remove("open"); }, 350);
      c.won = true;
      if (mega) { S.pity = 0; pop(70, glass.clientHeight - 90, "MEGA GRAB!"); }
      st.save();
      el.remove(); capEls[ti] = null;
      renderMeter(); renderPool();
      var outOfGrabs = S.grabs <= 0 && S.caps.some(function (cc) { return !cc.won; });
      openCapsule(c.t, function () { if (outOfGrabs) openShop("Out of grabs!"); });
      setClaw(glass.clientWidth * 0.55, true); // glide home
      await wait(280);
      pendingLayout = true; // pile settles into the gap left by the win
      endBusy(true);
      checkCleared();
    } else {
      // near-miss slip: wobble, lift halfway, drop back
      el.classList.add("wobble");
      await wait(320);
      el.classList.remove("wobble");
      var lift = 34;
      spool.classList.add("spin");
      el.style.transition = "transform 0.4s ease-in-out";
      cable.style.height = (targetH - lift) + "px";
      el.style.transform = "translateY(-" + lift + "px)";
      await wait(430);
      spool.classList.remove("spin");
      claw.classList.remove("closed"); SB.haptic(25);
      el.style.transition = "transform 0.5s cubic-bezier(0.34,1.8,0.64,1)";
      el.style.transform = "";
      pop(bx - 6, by - 34, "So close!");
      S.pity = Math.min(100, S.pity + 34);
      st.save();
      renderMeter();
      pop(74, glass.clientHeight - 60, "+34% GRIP");
      if (S.pity >= 100) SB.toast("MEGA GRAB ready — next grab is guaranteed!");
      spool.classList.add("spin");
      cable.style.height = "14px";
      await wait(550);
      spool.classList.remove("spin");
      el.style.transition = ""; el.style.zIndex = "";
      endBusy();
      if (S.grabs <= 0) setTimeout(function () { openShop("Out of grabs!"); }, 500);
    }
  }
  grabBtn.addEventListener("click", doGrab);

  // ---------- machine cleared ----------
  function checkCleared() {
    if (S.caps.some(function (c) { return !c.won; })) return;
    clearBanner.classList.add("show");
    updateTarget();
    if (!S.cleared) {
      S.cleared = true; st.save();
      setTimeout(function () {
        SB.grantRewards([{ type: "coins", amount: 1000 }], clearBanner);
        SB.confetti(window.innerWidth / 2, 220, 180);
      }, 400);
    }
    document.getElementById("premiumBtn").style.display = S.premium ? "none" : "";
    restartBtn.textContent = S.premium ? "🔁 New premium machine (free)" : "🔁 New standard machine (free)";
  }
  function newMachine(premium) {
    S.premium = premium; S.caps = poolDef(premium); S.cleared = false; S.pity = 0;
    st.save();
    document.body.classList.toggle("premium", premium);
    clearBanner.classList.remove("show");
    layoutCapsules(); renderPool(); renderMeter(); renderGrabs();
    capEls.forEach(function (e) { if (e) e.classList.add("tumble"); });
  }
  document.getElementById("premiumBtn").addEventListener("click", function () {
    SB.buyIAP({
      label: "👑 Premium Machine", price: "$9.99",
      sub: "Gold cabinet · richer capsules · TWO jackpots · +5 grabs included",
      contents: [{ type: "grab", amount: 5 }], grant: false,
      onSuccess: function () { S.grabs += 5; newMachine(true); SB.toast("Premium Machine unlocked! 👑"); }
    });
  });
  restartBtn.addEventListener("click", function () {
    newMachine(S.premium); SB.toast("Fresh machine loaded!");
  });

  // ---------- shop ----------
  function today() { return new Date().toDateString(); }
  function openShop(title) {
    var shuffleUsed = S.shuffleDay === today();
    var m = SB.modal(
      "<h3 style='margin:0 0 2px'>" + (title || "Grab Shop") + "</h3>" +
      "<div class='sb-muted' style='font-size:12px;font-weight:700;margin-bottom:4px'>All odds shown on machine · finite pool · misses always charge your grip meter</div>" +
      '<button class="shop-opt" id="op1"><span class="so-ico">🕹️</span><span class="so-txt"><span class="so-name">3 Grabs</span><br><span class="so-sub">Quick top-up</span></span><span class="so-price">$0.99</span></button>' +
      '<button class="shop-opt best" id="op2"><span class="so-ico">⭐</span><span class="so-txt"><span class="so-name">10 Grabs + Guaranteed Gold Capsule</span><br><span class="so-sub">Gold capsule added to the pool — 🎯 lock-on, 100% grab</span></span><span class="so-price">$4.99</span></button>' +
      '<button class="shop-opt" id="op3"><span class="so-ico">💪</span><span class="so-txt"><span class="so-name">Strong Claw (5 min)</span><br><span class="so-sub">ALL success chances +25% · claw glows red</span></span><span class="so-price">$1.99</span></button>' +
      '<button class="shop-opt" id="op4" ' + (shuffleUsed ? "disabled" : "") + '><span class="so-ico">🔀</span><span class="so-txt"><span class="so-name">Shuffle Machine</span><br><span class="so-sub">' + (shuffleUsed ? "Used today — back tomorrow!" : "Re-pile the capsules") + '</span></span><span class="so-price free">FREE 1/day</span></button>' +
      '<button class="sb-sheet-cancel" id="opX">No thanks</button>');
    m.el.querySelector("#opX").addEventListener("click", m.close);
    m.el.querySelector("#op1").addEventListener("click", function () {
      m.close();
      SB.buyIAP({ label: "3 Grabs", price: "$0.99", sub: "Lucky Grabber · instant delivery",
        contents: [{ type: "grab", amount: 3 }], grant: false,
        onSuccess: function () { S.grabs += 3; st.save(); renderGrabs(); SB.toast("+3 Grabs! Good luck! 🕹️"); } });
    });
    m.el.querySelector("#op2").addEventListener("click", function () {
      m.close();
      SB.buyIAP({ label: "10 Grabs + Guaranteed Gold Capsule", price: "$4.99",
        sub: "Gold capsule drops into the pool with a 🎯 lock-on — 100% grab chance",
        contents: [{ type: "grab", amount: 10 }], grant: false,
        onSuccess: function () {
          S.grabs += 10;
          S.caps.push({ t: "gold", won: false });
          clearBanner.classList.remove("show"); // machine has a prize again
          st.save(); renderGrabs(); layoutCapsules(); renderPool();
          capEls.forEach(function (e) { if (e) e.classList.add("tumble"); });
          SB.toast("Gold capsule added — it can't escape! 🎯");
        } });
    });
    m.el.querySelector("#op3").addEventListener("click", function () {
      m.close();
      SB.buyIAP({ label: "💪 Strong Claw", price: "$1.99", sub: "All success chances +25% for 5 minutes", grant: false,
        onSuccess: function () {
          S.strongUntil = Date.now() + 5 * 60 * 1000; st.save();
          renderStrong(); updateTarget(); SB.toast("Strong Claw active — odds +25%! 💪");
        } });
    });
    m.el.querySelector("#op4").addEventListener("click", function () {
      m.close();
      if (busy) { SB.toast("Wait for the claw to finish!"); return; }
      S.shuffleDay = today();
      // shuffle remaining capsule order
      for (var i = S.caps.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var t2 = S.caps[i]; S.caps[i] = S.caps[j]; S.caps[j] = t2; }
      st.save(); layoutCapsules(); renderPool();
      capEls.forEach(function (e) { if (e) e.classList.add("tumble"); });
      SB.haptic(20); SB.toast("Machine shuffled! 🔀");
    });
  }
  document.getElementById("shopBtn").addEventListener("click", function () { openShop("Grab Shop"); });

  // ---------- earn button ----------
  var earnBtn = document.getElementById("earnBtn");
  earnBtn.addEventListener("click", function () {
    earnBtn.disabled = true;
    earnBtn.textContent = "🃏 Playing level…";
    setTimeout(function () {
      S.grabs++; st.save(); renderGrabs();
      earnBtn.disabled = false;
      earnBtn.textContent = "🃏 Play a level (+1 grab)";
      SB.haptic(20);
      SB.toast("Level complete! +1 Grab 🕹️");
      SB.confetti(window.innerWidth / 2, window.innerHeight - 220, 40);
      coinSlot.classList.add("sb-bounce"); setTimeout(function () { coinSlot.classList.remove("sb-bounce"); }, 550);
    }, 1200);
  });

  // ---------- info ----------
  document.getElementById("infoBtn").addEventListener("click", function () {
    var m = SB.modal(
      "<h3>🕹️ Lucky Grabber</h3>" +
      "<p style='font-size:13px;text-align:left;line-height:1.5'>Move the claw with ◀ ▶ (or drag inside the glass) and hit <b>GRAB!</b><br><br>" +
      "• <b>Every prize is real and visible.</b> The pool is finite — capsules stay in the machine until YOU win them, jackpot included.<br>" +
      "• <b>Odds are shown up front</b> on each capsule and in the prize list below.<br>" +
      "• <b>Every miss adds +34% GRIP POWER.</b> A full meter turns your next grab into a golden MEGA GRAB — a 100% guaranteed catch. Nothing is ever wasted.<br>" +
      "• <b>Clear the machine</b> for a +1000 coin bonus, then keep going with a fresh machine — or the deluxe Premium Machine.<br>" +
      "• Out of grabs? Play a Skip-Bo level for a free one, or top up in the Grab Shop.</p>" +
      "<button class='sb-btn sb-btn-blue sb-btn-block' id='okI'>Got it!</button>");
    m.el.querySelector("#okI").addEventListener("click", m.close);
  });

  // ---------- boot ----------
  layoutCapsules();
  setClaw(glass.clientWidth * 0.55);
  renderGrabs(); renderMeter(); renderPool(); renderStrong();
  checkCleared();
  window.addEventListener("resize", function () { if (busy) { pendingLayout = true; return; } layoutCapsules(); setClaw(clawX); renderMeter(); });

  // demo/testing hook (not user-facing)
  window.__lg = { S: S, save: function () { st.save(); }, busy: function () { return busy; },
    refresh: function () { layoutCapsules(); renderPool(); renderMeter(); renderGrabs(); renderStrong(); checkCleared(); } };
})();
</script>
