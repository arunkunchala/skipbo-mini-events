<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Treasure Elevator · Skip-Bo Mini-Event</title>
<link rel="stylesheet" href="../shared/core.css">
<style>
  /* ---------- header strip ---------- */
  .hotel-hero {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 10px;
  }
  .hotel-name {
    color: #fff; font-weight: 900; font-size: 15px; line-height: 1.15;
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }
  .hotel-name small { display: block; font-size: 10.5px; color: var(--sb-sky-light); font-weight: 700; }
  .info-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.12); color: #fff; font-weight: 900; font-size: 15px;
    cursor: pointer; flex: 0 0 auto;
  }
  .value-strip {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 12px;
  }
  .value-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(0,0,0,0.3); border: 1.5px solid rgba(255,199,44,0.5);
    color: var(--sb-yellow); font-weight: 800; font-size: 12px;
    border-radius: 999px; padding: 3px 11px;
  }

  /* ---------- tower ---------- */
  .tower {
    position: relative;
    background: linear-gradient(180deg, #172f5c 0%, #1c3c78 100%);
    border: 3px solid #0f2246;
    border-radius: 18px;
    padding: 0 10px 0 84px;   /* left space = elevator shaft */
    overflow: hidden;
    box-shadow: var(--sb-shadow);
  }
  .roof-cap {
    margin: 0 -10px 0 -84px;
    text-align: center; font-size: 22px; letter-spacing: 6px;
    padding: 10px 0 6px;
    background: linear-gradient(180deg, #0f2246, #172f5c);
    color: var(--sb-yellow);
    border-bottom: 2px dashed rgba(255,199,44,0.35);
  }
  .lobby-base {
    margin: 0 -10px 0 -84px;
    height: 54px;
    background: linear-gradient(180deg, #7a1f2e, #5c1622);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #ffd9a0; font-weight: 900; font-size: 12px; letter-spacing: 2px;
    border-top: 3px solid #d7a24a;
  }

  /* ---------- shaft ---------- */
  .shaft {
    position: absolute; left: 10px; top: 0; bottom: 0; width: 64px;
    background: linear-gradient(90deg, rgba(0,0,0,0.45), rgba(0,0,0,0.25) 50%, rgba(0,0,0,0.45));
    border-left: 2px solid rgba(255,199,44,0.25);
    border-right: 2px solid rgba(255,199,44,0.25);
  }
  .shaft .rail { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.14); }
  .shaft .rail.l { left: 9px; } .shaft .rail.r { right: 9px; }
  .cable {
    position: absolute; left: 50%; top: 0; width: 3px; margin-left: -1.5px;
    background: repeating-linear-gradient(180deg, #b8934a 0 6px, #8a6a2e 6px 12px);
    transition: height 0.8s cubic-bezier(0.34, 1.2, 0.5, 1);
  }
  .car {
    position: absolute; left: 50%; width: 48px; height: 66px;
    margin-left: -24px; bottom: 0;
    transition: transform 0.8s cubic-bezier(0.34, 1.2, 0.5, 1);
    z-index: 5;
  }
  .car.no-anim, .cable.no-anim { transition: none; }
  .car .cage {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #ffe08a 0%, #f2b93b 45%, #c98d18 100%);
    border: 2.5px solid #8a6a2e;
    border-radius: 9px 9px 6px 6px;
    display: grid; place-items: center;
    font-size: 24px;
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.55);
    animation: carIdle 3s ease-in-out infinite;
  }
  @keyframes carIdle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .car .cage::before {   /* cage bars */
    content: ""; position: absolute; inset: 7px 6px 5px;
    background: repeating-linear-gradient(90deg, rgba(122,90,28,0.55) 0 2px, transparent 2px 9px);
    border-radius: 4px; pointer-events: none;
  }
  .car .lamp {
    position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
    width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6cc, #ffc72c 60%, #b8860b);
    box-shadow: 0 0 8px 2px rgba(255,199,44,0.8);
  }
  .ding {
    position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    color: var(--sb-yellow); font-weight: 900; font-size: 13px;
    text-shadow: 0 1px 0 rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; white-space: nowrap;
  }
  .ding.play { animation: dingPop 1s ease-out; }
  @keyframes dingPop {
    0% { opacity: 0; transform: translateX(-50%) translateY(6px) scale(0.5); }
    25% { opacity: 1; transform: translateX(-50%) translateY(-4px) scale(1.25); }
    70% { opacity: 1; transform: translateX(-50%) translateY(-10px) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-18px) scale(0.9); }
  }

  /* ---------- floors ---------- */
  .floor {
    height: 94px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 2px dashed rgba(255,255,255,0.12);
    position: relative;
    padding: 6px 0;
  }
  .floor:last-of-type { border-bottom: none; }
  .fl-num {
    flex: 0 0 34px; text-align: center;
    color: rgba(255,255,255,0.5); font-weight: 900; font-size: 15px;
    background: rgba(0,0,0,0.25); border-radius: 8px; padding: 5px 0;
  }
  .fl-room { flex: 1 1 auto; min-width: 0; }
  .fl-name { color: #fff; font-weight: 800; font-size: 12.5px; margin-bottom: 3px; }
  .fl-rewards { display: flex; flex-wrap: wrap; gap: 4px; }
  .fl-rewards .sb-reward { font-size: 11px; padding: 3px 7px; gap: 3px; }
  .fl-rewards .sb-reward .ico { font-size: 13px; }
  .fl-action { flex: 0 0 auto; display: grid; place-items: center; min-width: 64px; }

  .floor.locked { opacity: 0.55; }
  .floor.locked .sb-reward { filter: grayscale(1) brightness(0.75); background: rgba(255,255,255,0.55); }
  .floor.locked .fl-name { color: rgba(255,255,255,0.55); }
  .q-mark { font-size: 22px; color: rgba(255,255,255,0.4); font-weight: 900; }
  .lock-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.25);
    color: #fff; font-weight: 800; font-size: 12px;
    border-radius: 999px; padding: 4px 10px;
  }

  .floor.current {
    background: linear-gradient(90deg, rgba(255,199,44,0.16), rgba(255,199,44,0.04));
    animation: floorGlow 1.6s ease-in-out infinite;
    border-radius: 12px;
  }
  @keyframes floorGlow {
    0%,100% { box-shadow: inset 0 0 0 2px rgba(255,199,44,0.45); }
    50% { box-shadow: inset 0 0 0 2px rgba(255,199,44,0.95), 0 0 16px rgba(255,199,44,0.35); }
  }
  .floor.current .fl-num { color: var(--sb-yellow); background: rgba(255,199,44,0.15); }
  .claim-btn { min-height: 44px; min-width: 74px; }
  .paywall-btn { min-height: 44px; min-width: 74px; }

  .floor.claimed { filter: saturate(0.35); opacity: 0.7; }
  .check-tag {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--sb-green); color: #fff;
    display: grid; place-items: center; font-size: 17px; font-weight: 900;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25);
  }

  .floor.rooftop {
    height: 120px;
    background: linear-gradient(180deg, rgba(255,199,44,0.22), rgba(255,199,44,0.05));
    border-radius: 12px;
  }
  .floor.rooftop .fl-name { color: var(--sb-yellow); font-size: 13.5px; }
  .floor.paywall .fl-name { color: #ffd9a0; }

  /* ---------- docked CTA bar ---------- */
  .dock {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 100%; max-width: 480px; z-index: 90;
    background: rgba(15, 34, 70, 0.96);
    border-top: 2px solid rgba(255,199,44,0.4);
    padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
    backdrop-filter: blur(6px);
  }
  .dock .sb-btn { width: 100%; min-height: 50px; }
  .dock-hint { text-align: center; color: rgba(255,255,255,0.55); font-size: 10.5px; font-weight: 700; margin-top: 6px; }
  .sb-main { padding-bottom: 130px; }
  .sb-demo-reset { bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }

  /* ---------- recap ---------- */
  .recap-list { max-height: 44vh; overflow-y: auto; margin: 10px 0; text-align: left; }
  .recap-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 4px; border-bottom: 1px dashed rgba(27,42,74,0.15);
    font-size: 12.5px; font-weight: 700;
  }
  .recap-row .rf { flex: 0 0 52px; color: #5a6b8c; font-size: 11px; }
  .recap-row .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .recap-row .chips .sb-reward { font-size: 10.5px; padding: 2px 6px; }

  .rise-pop { animation: risePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes risePop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div class="sb-app">
  <div class="sb-main">
    <div class="hotel-hero">
      <div class="hotel-name">🏨 Grand Skip-Bo Hotel<small>Ride the Treasure Elevator to the rooftop!</small></div>
      <button class="info-btn" id="info-btn" aria-label="About this event">ⓘ</button>
    </div>
    <div class="value-strip">
      <span class="sb-timer-chip">⏳ <span id="evt-timer">--</span></span>
      <span class="value-chip">💰 Collected: <span id="total-val">0</span></span>
    </div>
    <div class="tower" id="tower">
      <div class="roof-cap">✦ ✦ ✦</div>
      <div id="floors"></div>
      <div class="lobby-base">🛎️ LOBBY · GRAND SKIP-BO HOTEL</div>
      <div class="shaft">
        <div class="rail l"></div><div class="rail r"></div>
        <div class="cable no-anim" id="cable"></div>
        <div class="car no-anim" id="car">
          <div class="ding" id="ding">🔔 DING!</div>
          <div class="cage"><span class="lamp"></span>🛎️</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="dock">
  <button class="sb-btn sb-btn-green" id="cta"></button>
  <div class="dock-hint" id="dock-hint"></div>
</div>
<script src="../shared/core.js"></script>
<script>
(function () {
  "use strict";
  SB.init({ title: "Treasure Elevator", subtitle: "Grand Skip-Bo Hotel · Limited event", resetKey: "treasure-elevator" });

  // ---------- floor config (1 = lobby level, 14 = rooftop) ----------
  var FLOORS = [
    { f: 1,  name: "Coat Check",      rewards: [{ type: "coins", amount: 300 }] },
    { f: 2,  name: "Mail Room",       rewards: [{ type: "undo", amount: 1 }] },
    { f: 3,  name: "Café Terrace",    rewards: [{ type: "energy", amount: 2 }] },
    { f: 4,  name: "Bellhop Pack",    paywall: { price: "$1.99", label: "Bellhop Pack" },
      rewards: [{ type: "coins", amount: 500 }, { type: "wild", amount: 1 }] },
    { f: 5,  name: "Guest Suite",     rewards: [{ type: "coins", amount: 600 }] },
    { f: 6,  name: "Card Lounge",     rewards: [{ type: "draw", amount: 1 }] },
    { f: 7,  name: "Mystery Suite",   chest: [400, 900], rewards: [{ type: "chest", amount: 1 }] },
    { f: 8,  name: "Casino Bar",      rewards: [{ type: "wild", amount: 1 }] },
    { f: 9,  name: "Concierge Pack",  paywall: { price: "$4.99", label: "Concierge Pack" },
      rewards: [{ type: "coins", amount: 1500 }, { type: "wild", amount: 2 }, { type: "energy", amount: 5 }] },
    { f: 10, name: "Royal Suite",     rewards: [{ type: "coins", amount: 1200 }] },
    { f: 11, name: "Butler Service",  rewards: [{ type: "undo", amount: 2 }, { type: "draw", amount: 2 }] },
    { f: 12, name: "Vault Suite",     chest: [1500, 2500], rewards: [{ type: "chest", amount: 1 }] },
    { f: 13, name: "Gem Gallery",     rewards: [{ type: "gem", amount: 3 }] },
    { f: 14, name: "Rooftop Grand Prize", rooftop: true,
      rewards: [{ type: "coins", amount: 5000 }, { type: "wild", amount: 3 }, { type: "gem", amount: 10 }] }
  ];
  var FH = 94, ROOF_FH = 120, LOBBY_H = 54, CAR_H = 66;
  var COIN_VALUE = { coins: 1, energy: 60, wild: 250, undo: 120, draw: 120, gem: 180, chest: 0 };

  // ---------- persistent state ----------
  var st = SB.store("treasure-elevator", {
    floor: 1,                 // next claimable floor
    endTs: Date.now() + 36 * 3600 * 1000,
    total: 0,
    claims: [],               // [{f, rewards:[{type,amount}]}]
    complete: false
  });
  var S = st.data;

  // ---------- countdown ----------
  var timerEl = document.getElementById("evt-timer");
  SB.countdown(timerEl, S.endTs, function () { timerEl.textContent = "Ended"; });

  // ---------- build floors (DOM top = floor 14) ----------
  var floorsEl = document.getElementById("floors");
  function rewardsHtml(fl, silhouette) {
    if (fl.chest && !silhouette) {
      return '<span class="sb-reward"><span class="ico">🎁</span>' +
        SB.fmt(fl.chest[0]) + "–" + SB.fmt(fl.chest[1]) + " Coins</span>";
    }
    return fl.rewards.map(SB.rewardChip).join("");
  }
  function render() {
    var html = "";
    for (var i = FLOORS.length - 1; i >= 0; i--) {
      var fl = FLOORS[i];
      var state = fl.f < S.floor ? "claimed" : (fl.f === S.floor && !S.complete ? "current" : "locked");
      if (S.complete) state = "claimed";
      var cls = "floor " + state + (fl.paywall ? " paywall" : "") + (fl.rooftop ? " rooftop" : "");
      var action = "";
      if (state === "claimed") {
        action = '<span class="check-tag">✓</span>';
      } else if (state === "current") {
        action = fl.paywall
          ? '<button class="sb-btn sb-btn-yellow sb-btn-sm paywall-btn" data-f="' + fl.f + '">🔓 ' + fl.paywall.price + "</button>"
          : '<button class="sb-btn sb-btn-green sb-btn-sm claim-btn" data-f="' + fl.f + '">CLAIM</button>';
      } else {
        action = fl.paywall
          ? '<span class="lock-tag">🔒 ' + fl.paywall.price + "</span>"
          : '<span class="q-mark">?</span>';
      }
      html += '<div class="' + cls + '" id="fl-' + fl.f + '" data-f="' + fl.f + '">' +
        '<div class="fl-num">' + (fl.rooftop ? "🏆" : fl.f) + "</div>" +
        '<div class="fl-room"><div class="fl-name">' + (fl.paywall ? "🛎️ " : "") + fl.name + "</div>" +
        '<div class="fl-rewards">' + rewardsHtml(fl, state === "locked") + "</div></div>" +
        '<div class="fl-action">' + action + "</div></div>";
    }
    floorsEl.innerHTML = html;
    document.getElementById("total-val").textContent = SB.fmt(S.total);
    renderCta();
  }

  // ---------- docked CTA ----------
  var ctaEl = document.getElementById("cta");
  var hintEl = document.getElementById("dock-hint");
  function renderCta() {
    if (S.complete) {
      ctaEl.className = "sb-btn sb-btn-blue";
      ctaEl.innerHTML = "🎉 Event Complete — View Recap";
      hintEl.textContent = "You reached the rooftop! Every reward is yours.";
      return;
    }
    var fl = FLOORS[S.floor - 1];
    if (fl.paywall) {
      ctaEl.className = "sb-btn sb-btn-yellow";
      ctaEl.innerHTML = "🔓 Unlock Floor " + fl.f + " · " + fl.paywall.price;
      hintEl.textContent = "Everything you've earned so far is yours to keep — no purchase required.";
    } else {
      ctaEl.className = "sb-btn sb-btn-green";
      ctaEl.innerHTML = "Claim Floor " + fl.f + (fl.rooftop ? " · 🏆 GRAND PRIZE" : "");
      hintEl.textContent = fl.rooftop ? "The rooftop party is waiting!" : "Free claim — the elevator rides up after.";
    }
  }

  // ---------- elevator car ----------
  var carEl = document.getElementById("car");
  var cableEl = document.getElementById("cable");
  function carOffset(floor) {
    // translateY (negative = up) from lobby resting position, car centered on floor
    var f = Math.min(floor, 14);
    return -(LOBBY_H + (f - 1) * FH + (FH - CAR_H) / 2);
  }
  function positionCar(animate) {
    var y = carOffset(S.complete ? 14 : S.floor);
    if (!animate) { carEl.classList.add("no-anim"); cableEl.classList.add("no-anim"); }
    carEl.style.transform = "translateY(" + y + "px)";
    var towerH = document.getElementById("tower").offsetHeight;
    cableEl.style.height = Math.max(0, towerH + y - CAR_H) + "px";
    if (!animate) {
      requestAnimationFrame(function () {
        carEl.classList.remove("no-anim"); cableEl.classList.remove("no-anim");
      });
    } else {
      setTimeout(function () {
        var d = document.getElementById("ding");
        d.classList.remove("play"); void d.offsetWidth; d.classList.add("play");
        SB.haptic(25);
      }, 650);
    }
  }
  function scrollToCurrent() {
    var el = document.getElementById("fl-" + Math.min(S.floor, 14));
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  // ---------- claim / purchase logic ----------
  function coinValue(rewards) {
    return rewards.reduce(function (t, r) { return t + (COIN_VALUE[r.type] || 100) * r.amount; }, 0);
  }
  function recordClaim(fl, rewards) {
    S.claims.push({ f: fl.f, name: fl.name, rewards: rewards });
    S.total += coinValue(rewards);
    if (fl.f >= 14) S.complete = true;
    else S.floor = fl.f + 1;
    st.save();
  }
  function claimFloor(fl, originEl) {
    var rewards = fl.rewards;
    if (fl.chest) {
      var amt = fl.chest[0] + Math.floor(Math.random() * (fl.chest[1] - fl.chest[0] + 1));
      rewards = [{ type: "coins", amount: amt }];
      SB.toast("🎁 Mystery chest: " + SB.fmt(amt) + " coins!");
    }
    SB.grantRewards(rewards, originEl);
    recordClaim(fl, rewards);
    render();
    positionCar(true);
    setTimeout(scrollToCurrent, 350);
    if (fl.rooftop) setTimeout(grandFinale, 900);
    else if (originEl) {
      var row = document.getElementById("fl-" + fl.f);
      if (row) { row.classList.add("rise-pop"); }
    }
  }
  function openPaywall(fl) {
    SB.buyIAP({
      label: "🛎️ " + fl.paywall.label + " — Floor " + fl.f,
      sub: "Unlocks floors " + (fl.f + 1) + "–" + Math.min(fl.f + 4, 14) + " of FREE claims above!",
      price: fl.paywall.price,
      contents: fl.rewards,
      onSuccess: function () {
        recordClaim(fl, fl.rewards);
        render();
        positionCar(true);
        setTimeout(scrollToCurrent, 350);
        SB.toast("Floors unlocked — ride up and claim them!");
      },
      onCancel: function () {
        var row = document.getElementById("fl-" + fl.f);
        if (row) { row.classList.remove("sb-shake"); void row.offsetWidth; row.classList.add("sb-shake"); }
        SB.toast("No rush — your progress is saved until the timer ends");
      }
    });
  }
  function act(f, originEl) {
    if (S.complete) { showRecap(); return; }
    if (f !== S.floor) {
      var row = document.getElementById("fl-" + f);
      if (row && f > S.floor) {
        row.classList.remove("sb-shake"); void row.offsetWidth; row.classList.add("sb-shake");
        SB.toast(f > S.floor ? "The elevator hasn't reached floor " + f + " yet!" : "");
      }
      return;
    }
    var fl = FLOORS[f - 1];
    if (fl.paywall) openPaywall(fl);
    else claimFloor(fl, originEl);
  }

  floorsEl.addEventListener("click", function (e) {
    var row = e.target.closest(".floor");
    if (!row) return;
    act(parseInt(row.dataset.f, 10), e.target.closest("button") || row);
  });
  ctaEl.addEventListener("click", function () {
    if (S.complete) { showRecap(); return; }
    scrollToCurrent();
    act(S.floor, document.getElementById("fl-" + S.floor));
  });

  // ---------- grand finale + recap ----------
  function grandFinale() {
    SB.confetti(window.innerWidth / 2, window.innerHeight / 3, 120);
    setTimeout(function () { SB.confetti(window.innerWidth * 0.25, window.innerHeight * 0.25, 80); }, 400);
    setTimeout(function () { SB.confetti(window.innerWidth * 0.75, window.innerHeight * 0.3, 80); }, 800);
    setTimeout(showRecap, 1100);
  }
  function showRecap() {
    var rows = S.claims.map(function (c) {
      return '<div class="recap-row"><span class="rf">Fl. ' + c.f + '</span><span class="chips">' +
        c.rewards.map(SB.rewardChip).join("") + "</span></div>";
    }).join("");
    var m = SB.modal(
      '<div style="font-size:44px">🎆🏆🎆</div>' +
      "<h3 style='margin:6px 0 2px'>Rooftop Reached!</h3>" +
      '<p class="sb-muted" style="margin:0 0 4px;font-size:13px;font-weight:700">Everything you collected on the way up:</p>' +
      '<div class="recap-list">' + rows + "</div>" +
      '<div style="font-weight:900;font-size:15px;margin-bottom:12px">💰 Total value: ' + SB.fmt(S.total) + " coins</div>" +
      '<button class="sb-btn sb-btn-green sb-btn-block" id="recap-close">Fantastic!</button>'
    );
    m.el.querySelector("#recap-close").addEventListener("click", function () {
      m.close();
      SB.confetti();
    });
  }

  // ---------- info modal ----------
  document.getElementById("info-btn").addEventListener("click", function () {
    var m = SB.modal(
      '<div style="font-size:36px">🏨🛗</div>' +
      "<h3 style='margin:6px 0 8px'>How Treasure Elevator works</h3>" +
      '<p style="font-size:13px;line-height:1.55;text-align:left;font-weight:600;color:#3a4a6b">' +
      "Players ride an elevator up 14 hotel floors, claiming a free reward on every floor. " +
      "Two paywall floors ($1.99 at floor 4, $4.99 at floor 9) gate access to the richer free floors above — the purchase buys continued free claiming, so the celebration always lands after checkout, not at it. " +
      "Upcoming rewards are visible as silhouettes, so the rooftop grand prize (5,000 coins + wilds + gems) pulls players through both price points. " +
      "This is a progressive offer-chain pattern (ref: Royal Match's Endless Treasure, +20% revenue in its first 30 days) with escalating price tiers and a hard event timer for urgency.</p>" +
      '<button class="sb-btn sb-btn-blue sb-btn-block" id="info-close">Got it</button>'
    );
    m.el.querySelector("#info-close").addEventListener("click", m.close);
  });

  // ---------- boot ----------
  render();
  positionCar(false);
  setTimeout(scrollToCurrent, 120);
})();
</script>
</body>
</html>
